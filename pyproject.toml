[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "p2p-engine"
version = "0.1.0"
description = "Proposal-to-Plan Engine CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.2",
  "rich>=13.9.0",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "pytest>=8.3.0",
]

[project.scripts]
p2p = "p2p_engine.cli:app"
p2p-mcp-server = "p2p_engine.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/p2p_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
