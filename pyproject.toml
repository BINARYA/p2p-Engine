[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "p2p-engine"
version = "0.3.1"
description = "Proposal-to-Plan Engine CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "packaging>=24.0",
  "pyyaml>=6.0.2",
  "rich>=13.9.0",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
]
pdf = [
  "markdown-it-py>=3.0.0",
  "weasyprint>=62.0",
]

[project.scripts]
p2p = "p2p_engine.cli:app"
p2p-mcp-server = "p2p_engine.mcp.server:main"

[tool.hatch.build]
exclude = [
  "/.agents",
  "/.codex",
  "/.p2p",
  "/.pytest_cache",
  "/.venv",
  "/dist",
  "/drafts",
  "/outputs",
  "/specs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/p2p_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: pure or near-pure behavior with no public CLI/MCP boundary.",
  "service: domain or application service behavior.",
  "adapter: filesystem, serialization, Git adapter, or integration adapter behavior.",
  "cli: observable CLI command behavior, output, exit behavior, or side effects.",
  "mcp: observable MCP tool schema, payload, error, or permission behavior.",
  "integration: workflow crossing multiple application boundaries.",
  "git: Git, sync, branch, remote, or repository-collaboration behavior.",
  "slow: materially broader or slower than normal focused feedback.",
  "smoke: minimal broad confidence checks.",
]
