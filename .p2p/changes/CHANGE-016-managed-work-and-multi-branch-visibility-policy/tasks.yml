tasks:
  - id: T001
    title: "Define managed Git levels"
    status: completed
    domain: governance
    acceptance:
      - "Policy levels cover advisory, handoff plan, managed branch, managed commit, managed review and owner-controlled merge."
      - "Only advisory and handoff plan are enabled in this MVP."

  - id: T002
    title: "Create Work manifest from validated export"
    status: completed
    domain: software
    acceptance:
      - "p2p work plan --change CHANGE-XXX --target TARGET requires a validated export bundle."
      - "The command writes .p2p/work/WORK-XXX/manifest.yml."

  - id: T003
    title: "Inspect Work manifests"
    status: completed
    domain: software
    acceptance:
      - "p2p work list lists Work manifests."
      - "p2p work show WORK-XXX prints Work details and manifest content."

  - id: T004
    title: "Preserve invisible Git boundary"
    status: completed
    domain: governance
    acceptance:
      - "The Work manifest includes an internal logical branch name."
      - "auto_branch, auto_commit and auto_merge remain disabled."
      - "No Git branch, commit, PR, tag or merge is created."

  - id: T005
    title: "Update P2P skill and tests"
    status: completed
    domain: quality
    acceptance:
      - "P2P skill documents Work routing and the incremental managed Git path."
      - "Automated tests cover work plan/list/show behavior."
