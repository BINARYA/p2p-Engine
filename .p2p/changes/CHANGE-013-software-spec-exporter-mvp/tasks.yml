tasks:
  - id: T001
    title: "Export generic software spec bundle"
    status: completed
    domain: software
    acceptance:
      - "p2p spec export --change CHANGE-XXX --target generic writes a generic bundle."
      - "The bundle includes index, requirements, design, commands, data model, acceptance, provenance and manifest artifacts."

  - id: T002
    title: "Export OpenSpec-oriented software spec bundle"
    status: completed
    domain: software
    acceptance:
      - "p2p spec export --change CHANGE-XXX --target openspec writes an OpenSpec-oriented bundle."
      - "The bundle includes index, spec, commands, data model, provenance and manifest artifacts."

  - id: T003
    title: "Inspect software spec export bundles"
    status: completed
    domain: software
    acceptance:
      - "p2p spec export-status lists export bundles."
      - "p2p spec export-show CHANGE-XXX --target TARGET prints the export index."

  - id: T004
    title: "Reject unsupported export targets"
    status: completed
    domain: quality
    acceptance:
      - "Unsupported targets fail with an explicit error."
      - "Spec Kit remains deferred until its mapping is defined."

  - id: T005
    title: "Update P2P skill and tests"
    status: completed
    domain: quality
    acceptance:
      - "P2P skill documents spec export commands."
      - "Automated tests cover export commands and target validation."
