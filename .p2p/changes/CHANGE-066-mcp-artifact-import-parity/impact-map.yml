impact:
  summary: "MCP clients need controlled proposal artifact content import parity so agents can complete artifact-aware readiness workflows without direct .p2p writes."
  scope_decision: "MVP is limited to existing impact and exploration import parity; generic artifact import is deferred."
  affected_areas:
    - area: "MCP tool catalog and handlers"
      impact: "Add explicit write-safe impact/exploration import tools and route them through existing services."
    - area: "Proposal artifact readiness"
      impact: "Imported artifact content should be visible to readiness assessment and compact context."
    - area: "Documentation"
      impact: "docs/MCP.md and tool matrix must describe supported imports, deferred generic import, and unsupported write paths."
    - area: "Agent workflow"
      impact: "Agents can close impact/exploration artifact gaps through MCP instead of stopping at missing primitive."
  related_proposals:
    - id: "PROP-086"
      relation: "Implements the artifact-aware missing-primitive boundary for MCP clients."
    - id: "PROP-044"
      relation: "Extends the MCP server surface."
    - id: "PROP-065"
      relation: "Improves agent-first MCP coverage."
  risks:
    - "Generic artifact import is deferred to avoid a broad write API before the narrow parity tools are proven."
    - "Filesystem path assumptions may differ across MCP clients."
    - "Malformed imported content must not corrupt proposal readiness state."

