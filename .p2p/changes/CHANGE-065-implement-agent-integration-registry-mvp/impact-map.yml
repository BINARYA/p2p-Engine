impact:
  proposal_id: PROP-006
  summary: >
    Evolves existing agent instruction profiles into governed, inspectable,
    updateable agent integrations.
  existing_capabilities:
    - p2p init --agent generic|codex|claude|all
    - p2p agent instructions refresh --profile generic|codex|claude|all
    - AGENTS.md generation
    - CLAUDE.md generation
    - .codex/skills/p2p-project/SKILL.md generation
    - .p2p/agent-policy.yml generation
    - MCP p2p_agent_instructions_refresh
  new_capabilities:
    - .p2p/agent-integrations.yml registry
    - installed agent listing and inspection
    - adapter-specific install/update/use/uninstall lifecycle
    - generated file manifest and hashes
    - drift detection
    - safe uninstall
    - Cursor adapter
    - Copilot adapter
    - Gemini adapter
    - OpenCode adapter
  affected_areas:
    - cli_agent_commands
    - agent_instruction_generation
    - mcp_agent_tools
    - project_bootstrap
    - validation
    - documentation
  overlaps:
    - PROP-045-agent-safe-project-bootstrap-mvp
    - PROP-046-mcp-write-safe-bootstrap-tools-mvp
    - PROP-067-agent-first-setup-documentation-split
    - PROP-068-document-agent-mcp-client-setup-commands
    - PROP-069-clarify-mcp-stdio-integration-model
  non_goals:
    - direct_ai_provider_invocation
    - user_global_agent_configuration_without_consent
    - external_adapter_package_registry
    - destructive_uninstall_of_modified_files
