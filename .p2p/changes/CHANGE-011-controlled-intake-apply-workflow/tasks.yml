tasks:
  - id: T001
    title: "Generate intake apply plan"
    status: completed
    domain: software
    acceptance:
      - "p2p intake apply plan INTAKE-XXX writes apply-plan.yml."
      - "Plan actions include support classification and command previews."

  - id: T002
    title: "Show intake apply plan"
    status: completed
    domain: software
    acceptance:
      - "p2p intake apply show INTAKE-XXX prints planned actions."

  - id: T003
    title: "Run supported apply actions"
    status: completed
    domain: software
    acceptance:
      - "add_contribution actions can be applied explicitly."
      - "open_choice actions require at least two --option values."
      - "Governance-only or unsupported actions are not applied."

  - id: T004
    title: "Record apply audit log"
    status: completed
    domain: software
    acceptance:
      - "applied-actions.yml records every successful application."
      - "apply-plan.yml action status is updated after successful runs."

  - id: T005
    title: "Update skill and tests"
    status: completed
    domain: quality
    acceptance:
      - "The P2P skill documents intake apply plan/show/run."
      - "Tests cover planning, showing, running add_contribution, open_choice validation, and audit logging."
