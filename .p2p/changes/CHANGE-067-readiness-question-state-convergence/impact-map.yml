impact:
  proposal: PROP-089
  summary: "Converge proposal readiness owner-question gates on structured questions.yml state so stale open-questions.md text cannot keep an individual proposal falsely blocked."
  impact_type: "governance_workflow_semantics"
  execution_domains:
    - "software"
    - "p2p_governance"
  features:
    - feature: "proposal-readiness-review-and-questions"
      impact: "Clarifies that structured question lifecycle state is the source of truth for owner-question readiness when present."
    - feature: "artifact-aware-proposal-readiness-and-agent-interview-orchestration"
      impact: "Uses artifact-aware readiness evidence without allowing markdown question text to override structured question state."
    - feature: "mcp-artifact-import-parity"
      impact: "Does not replace artifact import parity; it explains why imported/refined artifacts should not be blocked by stale question markdown."
  commands:
    - command: "p2p proposal readiness refresh PROP-XXX"
      impact: "Must compute owner_questions_resolution from questions.yml when structured question state exists."
    - command: "p2p proposal readiness explain PROP-XXX"
      impact: "Must distinguish blocking_owner_questions, answered_not_applied, residual_follow_up, confidence_notes, and markdown fallback usage."
    - command: "p2p proposal readiness show PROP-XXX"
      impact: "Shows the recomputed readiness result; computed truth remains separate from owner override."
    - command: "p2p proposal questions list PROP-XXX"
      impact: "Remains the structured source for question lifecycle state used by readiness."
    - command: "p2p proposal questions answer|apply|set-state PROP-XXX QXXX"
      impact: "State transitions become materially visible in readiness instead of being shadowed by markdown parsing."
  files:
    - path: "src/p2p_engine/services/readiness.py"
      impact: "Primary implementation area for owner-question readiness, pending high-priority question detection, markdown fallback, confidence reasons, and explain/review output."
    - path: "src/p2p_engine/services/proposal_questions.py"
      impact: "Question lifecycle states are consumed as readiness evidence; next-question behavior remains one-at-a-time."
    - path: "src/p2p_engine/core/proposal_questions.py"
      impact: "Structured question states and priorities define blocking, residual, deferred, muted, applied, retired, and superseded behavior."
    - path: "tests/test_readiness_service.py"
      impact: "Needs regression coverage for questions.yml authority, high-priority blockers, answered_not_applied, applied closure, deferred/muted non-blocking, and markdown fallback."
    - path: "tests/test_proposal_questions_service.py"
      impact: "Needs coverage that question state transitions remain coherent for readiness consumption."
    - path: ".codex/skills/p2p-project/SKILL.md"
      impact: "May need guidance updates only if readiness explanation wording changes agent behavior; no governance authority change."
  project_artifacts:
    - artifact: "questions.yml"
      impact: "Authoritative lifecycle record for owner-question readiness when present."
    - artifact: "open-questions.md"
      impact: "Human-readable evidence and legacy fallback only; cannot reopen or re-block structured questions when questions.yml exists."
    - artifact: "readiness.yml"
      impact: "Stores computed readiness truth and any owner override separately."
    - artifact: "artifact-state.yml"
      impact: "Continues to describe artifact coverage; it does not decide question lifecycle truth."
    - artifact: "impact-map.yml"
      impact: "Should record command, file, artifact, overlap, dependency, compatibility, and regression-test impacts for this proposal."
  governance:
    - area: "owner authority"
      impact: "Owner may still accept or proceed with unresolved questions via explicit override; computed readiness remains truthful."
    - area: "proposal decision readiness"
      impact: "Readiness is proposal-level, not whole-project readiness."
    - area: "agent interview behavior"
      impact: "Agents keep asking the next eligible structured question one at a time; this proposal does not introduce batch questionnaires."
    - area: "legacy compatibility"
      impact: "Proposals without questions.yml keep the existing markdown fallback behavior."
    - area: "source of truth"
      impact: "questions.yml becomes authoritative for question state when present; markdown is narrative evidence."
  dependencies:
    - proposal: "PROP-082"
      relationship: "builds_on"
      reason: "PROP-082 introduced the readiness review/question workflow that this proposal tightens."
    - proposal: "PROP-086"
      relationship: "builds_on"
      reason: "PROP-086 made artifact-aware readiness and question lifecycle state important to proposal maturity."
    - proposal: "PROP-088"
      relationship: "observed_from"
      reason: "PROP-088 exposed the sticky owner-question blocker after structured question answers were applied."
    - proposal: "PROP-012"
      relationship: "compatible_with"
      reason: "PROP-012 established impact/conflict memory; PROP-089 should preserve impact analysis as evidence, not decision authority."
  overlaps:
    - proposal: "PROP-082"
      overlap: "Both concern proposal readiness review and owner-question handling."
      boundary: "PROP-089 narrows the source-of-truth rule for owner-question state; it does not redesign the whole readiness workflow."
    - proposal: "PROP-086"
      overlap: "Both concern artifact-aware readiness and artifact coverage."
      boundary: "PROP-089 does not change artifact applicability policy; it changes how question state is interpreted."
    - proposal: "PROP-088"
      overlap: "Both emerged around artifact import/readiness refinement."
      boundary: "PROP-088 is MCP import parity; PROP-089 is readiness semantics for question state."
  non_impacts:
    - "Does not change whole-project readiness or project maturity scoring."
    - "Does not remove open-questions.md."
    - "Does not force migration of historical proposals."
    - "Does not require owners to answer every question before accepting a proposal."
    - "Does not change proposal acceptance authority or make agents decide governance outcomes."
    - "Does not convert the one-question-at-a-time interview flow into a batch questionnaire."
  compatibility:
    legacy_without_questions_yml: "Use existing open-questions.md markdown fallback."
    structured_questions_present: "Use questions.yml for blocking state; treat open-questions.md as evidence only."
    owner_override: "Preserve computed score/readiness truth and record override separately."
  regression_tests:
    - "questions.yml exists and high-priority to_answer question blocks owner_questions_resolution."
    - "questions.yml exists and high-priority reopened question blocks owner_questions_resolution."
    - "questions.yml exists and high-priority answered question reports answered_not_applied but not missing owner input."
    - "questions.yml exists and applied, retired, or superseded questions are closed."
    - "questions.yml exists and muted or deferred questions do not block; deferred may reduce confidence."
    - "questions.yml exists and open-questions.md contains stale question bullets; markdown does not re-block readiness."
    - "questions.yml absent and open-questions.md fallback still detects open markdown questions."
    - "readiness explain identifies exact structured blocking questions and fallback source."
    - "owner override preserves computed readiness instead of rewriting unresolved questions as solved."
  risks:
    - risk: "Priority-based gating may be too permissive if agents classify important questions too low."
      mitigation: "Keep high-priority defaults explicit, show residual medium/low follow-up, and allow policy to mark lower priorities blocking."
    - risk: "Legacy markdown fallback could regress for older proposals."
      mitigation: "Add fallback tests for proposals without questions.yml."
    - risk: "Readiness confidence reasons may remain misleading if old pending-question counters include answered/applied states."
      mitigation: "Base confidence notes on structured blocking/residual categories, not raw markdown or stale counters."
    - risk: "Agents may confuse owner override with improved computed readiness."
      mitigation: "Explain override separately from computed score and failed/missing gates."
  validation:
    - "p2p proposal readiness refresh PROP-089"
    - "p2p proposal readiness explain PROP-089"
    - "p2p validate"
