project_definition:
  schema_version: 1
  vertical_id: software_project
  vertical_version: 1.0.0
  profile: default
  modules: []
  lock:
    checksum: aa9fd9691890053c2abf390853b920c43b1b29160169f39539ac9f0fc7ad6d67
  sections:
  - id: vision
    status: complete
    fields:
      summary:
        value: Preserve project intent as versioned and auditable project memory so
          humans can supervise decisions and AI agents can reason from bounded, traceable
          context.
        source: README.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: objective
    status: complete
    fields:
      summary:
        value: Provide a local Git-native CLI, core and MCP workflow that turns rough
          intent into proposals, owner decisions, Change Sets, work and specification
          artifacts, and relevant agent context without replacing owner authority.
        source: README.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: stakeholders
    status: complete
    fields:
      summary:
        value: The project owner mrjungle controls governance decisions. Primary stakeholders
          are humans supervising agent-driven workflows, AI coding and planning agents,
          solo developers, small technical teams, and maintainers who need project
          intent and tradeoffs to remain auditable.
        source: README.md+.p2p/project/permissions.yml
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: scope
    status: complete
    fields:
      summary:
        value: In scope are the local Git-native P2P Engine, canonical project memory
          under .p2p, CLI/core/MCP interfaces, governed proposal-to-decision and implementation
          lifecycles, validation, bounded context retrieval, project definition, specifications,
          migration, and agent integration. Hosted multi-tenant operation, autonomous
          owner decisions, arbitrary direct state editing, and unrestricted external-provider
          actions are outside this repository.
        source: README.md+docs/MCP.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: assumptions
    status: assumed
    fields:
      summary:
        value: The operating model assumes that projects retain a writable local filesystem
          and Git history, collaborators can run a compatible project-local Python
          runtime, and an accountable owner remains available for governance and semantic
          curation. Canonical Markdown and YAML are retained because the demonstrated
          problem is retrieval and derived-memory loss rather than inability to persist
          source information. Derived registries, indexes, progress views, specifications
          and publications are expected to remain rebuildable from governed sources.
        source: README.md+PROP-100+docs/WORKSPACE-MIGRATION.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions:
    - id: A001
      field_id: summary
      status: to_validate
      text: Projects continue to provide a writable local filesystem and Git history
        as the durable audit substrate.
    - id: A002
      field_id: summary
      status: to_validate
      text: An accountable owner remains available for governance decisions and semantic
        curation that cannot be inferred safely.
    - id: A003
      field_id: summary
      status: validated
      text: Deterministic generated registries and indexes can be rebuilt from governed
        canonical sources.
    open_questions: []
    blockers: []
  - id: risks
    status: complete
    fields:
      summary:
        value: Principal risks are stale schema or derived markers, partial multi-file
          writes, concurrent source drift, automatic semantic migration that changes
          intent, heuristic coverage being mistaken for owner authority, cleanup deleting
          unknown material, runtime or documentation drift, and agent or publication
          outputs implying approval without evidence. Mitigations are independent
          runtime/schema validation, fresh preview and preimage checks, atomic transactions
          with rollback/recovery, owner-reviewed semantic batches, separate suggested
          versus declared coverage, preserve-by-default reconciliation, bounded provenance-rich
          context, explicit freshness, and separate curator/owner gates. Residual
          risks remain visible through diagnostics and migration evidence rather than
          being forced to green.
        source: specs/features/workspace-schema-versioning-and-legacy-migration/design.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: decisions
    status: partial
    fields:
      summary:
        value: Accepted project direction keeps canonical intent in Git-backed Markdown
          and YAML, preserves owner authority, exposes core behavior through CLI and
          bounded MCP surfaces, uses the software_project vertical for this repository,
          versions runtime and workspace schema independently, permits only explicit
          forward migration, and treats registries, decision context, progress, specifications
          and publications as derived views with provenance and freshness. Repository
          migration decisions select owner mrjungle, the default software profile
          and active delivery metadata, and approve canonical relation corrections
          with no residual relation diagnostic. The first declared vertical-coverage
          batch contains 12 owner-confirmed proposals covering 13 of 19 sections;
          the remaining 88 proposals are intentionally legacy and unmapped, and six
          definition-complete sections intentionally have no proposal evidence. The
          remaining owner choice is the later publication review.
        source: M4_owner_decisions+specs/features/workspace-schema-versioning-and-legacy-migration/implementation.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: milestones
    status: complete
    fields:
      summary:
        value: F1-F9 delivered reusable schema, migration, correction, coverage, progress
          and freshness primitives. M1 captured the repository baseline, aligned the
          runtime contract and applied workspace schema v1. M2 established a truthful
          software-project definition. M3 completed owner-reviewed historical relation
          curation with no residual relation diagnostic. M4 imported a selective 12-proposal
          owner-confirmed vertical-coverage batch covering 13 of 19 sections while
          leaving 88 proposals intentionally legacy and unmapped. M5 rebuilds every
          derived layer, runs focused and full verification, compares against the
          baseline and records residual legacy or owner-controlled work.
        source: specs/features/workspace-schema-versioning-and-legacy-migration/implementation.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: definition_of_done
    status: complete
    fields:
      summary:
        value: The repository migration is done when runtime and workspace contracts
          are compatible, schema v1 and the software vertical lock validate, every
          required definition section has a truthful explicit status, no active migration
          lock or transaction scratch remains, avoidable relation diagnostics are
          corrected and residuals documented, every materialized vertical mapping
          is owner-approved and traceable, derived nodes are rebuilt or explicitly
          awaiting an owner/curator stage, focused and full tests pass, the final
          diff is explained, and normal operation requires no manual .p2p edits. Publication
          review or approval is complete only when separately recorded by the owner.
        source: specs/features/workspace-schema-versioning-and-legacy-migration/tasks.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: artifacts
    status: complete
    fields:
      summary:
        value: Required canonical artifacts are runtime and workspace-schema contracts,
          project manifest, software vertical selection and lock, project definition,
          domain, permissions and governed proposal/decision/change/work state. Required
          migration artifacts are reviewed definition patches, complete impact/conflict
          correction sets, approved vertical-coverage records with artifact-state
          provenance, and implementation evidence. Derived deliverables are registries,
          rationalized project projections, decision-context index, progress/assessment/maturity
          views, operational brief and next actions, software specifications and exports,
          and the staged project publication packet, curated document, validation,
          render and owner-review record where applicable.
        source: README.md+docs/WORKSPACE-MIGRATION.md+specs/features/workspace-schema-versioning-and-legacy-migration/tasks.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: system_objective
    status: complete
    fields:
      objective:
        value: Deliver a reliable local engine and public interfaces that manage canonical
          .p2p state through governed primitives and derive fresh, bounded context
          and specifications for agents.
        source: README.md
        updated_at: '2026-07-15'
      success_signal:
        value: A target repository can initialize P2P, move owner-reviewed intent
          through proposal, decision, Change Set and specification workflows, validate
          its state, and retrieve relevant context through CLI or MCP without manual
          .p2p edits; compatibility checks and the repository test suites pass.
        source: README.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: users_and_actors
    status: complete
    fields:
      primary_users:
        value: Humans supervising software-project decisions and AI coding or planning
          agents that consume P2P through the CLI or MCP are the primary users; solo
          developers, small teams, and maintainers use the same workflows.
        source: README.md
        updated_at: '2026-07-15'
      operator_roles:
        value: The owner decides governance actions; maintainers and contributors
          operate repositories and releases; agents and MCP clients perform bounded
          reads and authorized writes; CI, Git providers, and downstream specification
          tools are external actors.
        source: README.md+.p2p/project/permissions.yml
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: mvp_scope
    status: complete
    fields:
      in_scope:
        value: A project-local Python runtime with CLI and local MCP access; workspace
          initialization and migration; proposals, readiness, questions, decisions,
          choices, conflicts, Change Sets and Work metadata; managed Git collaboration;
          validation, compact context, assessments, project projections, software
          specifications and downstream exports.
        source: README.md+docs/CLI-GUIDE.md
        updated_at: '2026-07-15'
      out_of_scope:
        value: A hosted or multi-tenant product, autonomous governance decisions,
          unrestricted cloud or Git-provider mutations, arbitrary manual edits to
          governed .p2p state, provider PR or MR creation through MCP, a standalone
          packaged binary, and guaranteed public-registry distribution.
        source: README.md+docs/MCP.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: workflows_use_cases
    status: complete
    fields:
      core_workflows:
        value: Bootstrap a project-local runtime and agent integration; capture rough
          intent through intake and proposal refinement; record owner decisions and
          derive Change Sets, Work, implementation specifications, and exports; retrieve
          bounded decision context and next actions; validate, migrate, refresh, and
          publish project state through supported lifecycle commands.
        source: README.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: data_model
    status: complete
    fields:
      domain_entities:
        value: Core entities are the project workspace and its runtime, schema, vertical,
          definition and permission contracts; proposals with contributions, questions,
          readiness, artifact state, decisions, impact and vertical coverage; choices,
          conflicts and precedents; Change Sets, Work and tasks; registries, project
          projections, decision-context packets and next actions; software specifications,
          exports and publication stages. Canonical Markdown and YAML remain authoritative
          while registries, context indexes and publications are derived views.
        source: src/p2p_engine+README.md
        updated_at: '2026-07-15'
      state_lifecycle:
        value: Proposal decisions distinguish accepted, accepted_with_changes, rejected,
          deferred, split, merged_into_other and superseded. Change Sets move from
          proposed through planned, implementation_ready, in_progress and in_review
          to completed or terminal cancelled or superseded states, with explicit blocked
          transitions. Work moves through planned, submitted, accepted and finalized
          or retired. Runtime and workspace contracts separately report compatibility,
          migration, stale-plan, rollback and recovery states; derived outputs expose
          freshness independently.
        source: src/p2p_engine/core+src/p2p_engine/services
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: integrations_dependencies
    status: complete
    fields:
      external_integrations:
        value: P2P integrates with local Git repositories and configured remotes,
          agent clients through a local stdio MCP JSON-RPC server, project-local Python
          virtual environments and versioned GitHub Release wheels, and downstream
          specification or publication targets. The runtime requires Python 3.11 or
          newer with Typer, Rich, PyYAML and packaging; build and test tooling is
          optional-development scope, while Markdown rendering and WeasyPrint are
          optional PDF dependencies. External provider mutations remain permission-gated
          and capability-limited.
        source: pyproject.toml+docs/INSTALL.md+docs/MCP.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: constraints_nfrs
    status: complete
    fields:
      constraints:
        value: P2P Engine remains a local, Git-native, file-backed Python application.
          Canonical project memory uses structured Markdown and YAML under .p2p and
          governed mutations must use supported CLI or explicit write-safe MCP primitives;
          owner authority, role policy and consent gates cannot be bypassed. Runtime
          compatibility and workspace-schema compatibility remain independent versioned
          contracts. Schema migrations are forward-only, preserve unknown and legacy
          artifacts by default, and must not install, upgrade or downgrade the runtime.
          The supported runtime is Python 3.11 or newer, and repository migration
          must not depend on network access.
        source: AGENTS.md+docs/WORKSPACE-MIGRATION.md+pyproject.toml
        updated_at: '2026-07-15'
      non_functional_requirements:
        value: Read-only status, context, suggestion and planning operations must
          be deterministic, bounded and free of persistent writes. Multi-file mutations
          must validate complete candidates, enforce actor authority and fresh preview/source
          hashes, commit atomically with durable file and directory handling, and
          expose rollback or recovery instead of hiding partial failure. Context retrieval
          and workspace inventory must avoid unbounded repeated scans. Canonical and
          derived state must retain provenance, lifecycle authority, freshness and
          diagnostic visibility. CLI and MCP representations must remain compatible
          where both surfaces exist, while privileged or unsupported writes remain
          unavailable rather than silently emulated.
        source: AGENTS.md+specs/features/workspace-schema-versioning-and-legacy-migration/design.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: acceptance_validation
    status: complete
    fields:
      acceptance_criteria:
        value: A supported project can be initialized, inspected, migrated and operated
          through public CLI/core interfaces without manual .p2p edits; owner-controlled
          decisions remain explicit; runtime, schema, vertical, definition, domain
          and permissions contracts are distinguishable and valid; legacy and unknown
          artifacts are preserved unless an owning service explicitly reconciles them;
          bounded decision context and project progress report their evidence basis;
          stale previews, source drift and interrupted writes cannot produce partial
          canonical state; derived outputs expose freshness and never imply owner
          review or completion without evidence.
        source: README.md+AGENTS.md+docs/WORKSPACE-MIGRATION.md
        updated_at: '2026-07-15'
      validation_strategy:
        value: Validate changes with focused unit, service, adapter, CLI and MCP contract
          tests, including malformed input, compatibility, stale-token, preimage,
          concurrency, failure-injection, rollback, recovery and no-write cases. Run
          the public and full pytest suites at release and migration gates. On real
          repositories, compare pre/post hashes and counts, then run runtime status,
          workspace schema status, vertical and definition context, project progress
          and freshness, doctor, compact context and global validation; inspect Git
          diff and confirm that no migration lock, transaction scratch or unexplained
          generated drift remains.
        source: scripts/test-public.sh+scripts/test-full.sh+specs/features/workspace-schema-versioning-and-legacy-migration/tasks.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  - id: risks_alternatives_decisions
    status: partial
    fields:
      risks:
        value: Historical relation corrections produce no invalid, ambiguous or unsupported
          relation diagnostic. Two draft proposals intentionally retain draft/pending
          authority divergence and keep the decision index partial without changing
          accepted authority. The reviewed M4 batch limits declared vertical authority
          to 12 owner-confirmed proposals covering 13 of 19 sections. Remaining repository
          risks are stale derived layers after canonical changes, the 88 legacy and
          unmapped proposals being mistaken for current evidence, six definition-complete
          sections without proposal evidence being mistaken for incomplete definition,
          and optional legacy artifacts being treated as current. Curator and owner
          publication stages remain separate.
        source: specs/features/workspace-schema-versioning-and-legacy-migration/implementation.md
        updated_at: '2026-07-15'
      alternatives:
        value: Rejected alternatives are manual .p2p repair, automatic normalization
          of ambiguous relations, bulk mapping all proposals from heuristics, treating
          generated projections as authority, and changing persistence technology
          before eliminating information loss. Deferred alternatives include a persistent
          decision-context cache, database-backed storage, MCP migration apply, remote
          fleet migration and automatic curator/owner stages.
        source: PROP-100+specs/features/workspace-schema-versioning-and-legacy-migration/design.md
        updated_at: '2026-07-15'
      owner_decisions:
        value: The owner selected software_project, profile default, no optional modules,
          owner identity mrjungle, active delivery metadata and the reviewed schema
          and definition batches. The owner approved removal of PROP-095 free-text
          proposal targets and canonical relation mappings for PROP-060, PROP-082,
          PROP-084, PROP-089, PROP-091 and PROP-092. The owner also approved the first
          declared vertical-coverage batch for PROP-001, PROP-006, PROP-044, PROP-055,
          PROP-084, PROP-085, PROP-090, PROP-091, PROP-094, PROP-095, PROP-099 and
          PROP-100, covering 13 of 19 sections; the other 88 proposals remain intentionally
          legacy and unmapped, without empty placeholder artifacts. Final publication
          review remains a separate owner decision, and intentional draft/pending
          authority state remains unchanged.
        source: M4_owner_decisions+specs/features/workspace-schema-versioning-and-legacy-migration/implementation.md
        updated_at: '2026-07-15'
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  next_suggested_action:
    kind: run_command
    work_id: M5
    command: p2p project freshness
    reason: Rebuild and compare every derived node after the completed M2-M4 canonical
      migration changes.
