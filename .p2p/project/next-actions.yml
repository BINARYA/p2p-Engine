next_actions:
  - id: NEXT-001
    priority: high
    kind: verify_integration
    target: mcp-client-configuration
    reason: The read-only local MCP server is implemented and tested through JSON-RPC; next it should be verified from an actual MCP-capable client configuration.
    command: p2p-mcp-server --root /path/to/project
  - id: NEXT-002
    priority: medium
    kind: define_scope
    target: mcp-write-safe-tools
    reason: The MCP MVP is intentionally read-only; the next product decision is which low-risk mutations can be exposed safely.
    command: .venv/bin/p2p proposal create "P2P MCP Write-Safe Tools"
  - id: NEXT-003
    priority: medium
    kind: review_policy
    target: ai-provider-boundary
    reason: Direct AI/provider invocation should remain outside Core/MCP and belong to future mediator or adapter layers.
    command: .venv/bin/p2p project show p2p-core-cli-mcp-mediator-web-boundary
