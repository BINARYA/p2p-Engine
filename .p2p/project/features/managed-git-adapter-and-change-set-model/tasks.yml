tasks:
  - id: T001
    title: Define managed Git domain model
    workstream: WS1
    type: architecture
    status: todo
    priority: high
    dependencies: []
    deliverable: Domain definitions for proposal, choice, decision, change set, git adapter, branch, commit, merge, tag
    evidence_required: Foundation and proposal include explicit definitions
    actions:
      - Define Proposal != Branch
      - Define Change Set as operational package
      - Define Git Adapter as internal implementation detail
      - Define merge/tag as internal audit mechanisms
  - id: T002
    title: Define managed Git policy
    workstream: WS2
    type: governance
    status: todo
    priority: high
    dependencies:
      - T001
    deliverable: git_policy.yml model and criteria
    evidence_required: Git policy can explain when internal branches, commits, and tags are used
    actions:
      - Define managed mode
      - Define default hidden Git details
      - Define branch criteria
      - Define commit criteria
      - Define tag criteria
      - Define verbose/debug visibility
  - id: T003
    title: Define change set artifact structure
    workstream: WS3
    type: design
    status: todo
    priority: high
    dependencies:
      - T001
    deliverable: .p2p/changes structure
    evidence_required: Proposed files are documented
    actions:
      - Define change.md
      - Define included-proposals.yml
      - Define referenced-proposals.yml
      - Define excluded-alternatives.yml
      - Define included-decisions.yml
      - Define git-policy.yml
      - Define plan/tasks relationship
      - Define multi-domain execution fields
      - Define minimum change.md frontmatter
      - Define Change Set lifecycle statuses and transitions
  - id: T004
    title: Specify future change and diagnostics CLI commands
    workstream: WS4
    type: software
    status: todo
    priority: medium
    dependencies:
      - T002
      - T003
    deliverable: CLI command design for change sets and Git diagnostics
    evidence_required: Commands are listed with non-goals for actual Git automation
    actions:
      - Specify p2p change create
      - Specify p2p change status
      - Specify p2p change policy
      - Specify p2p status --verbose
      - Specify p2p doctor
      - Defer direct Git automation implementation
