    evidence:
    - id: VME-432042b763efb79ca58bc262
      source_path: .p2p/proposals/PROP-090-project-vertical-pack-runtime-hardening-and-definition-state/proposal.md
      source_sha256: 46fa39047d64947152c2d94c2d2e57854a603381be87a0263f2b6d6879788e36
      fragment: 'PROP-085 introduced pluggable project verticals and the first local
        implementation delivered an MVP: packaged vertical data, project-local override,
        active vertical state, CLI/MCP operations, readiness review, proposal-to-vertical
        coverage, and agent guidance. That MVP proves the direction, but it is not
        yet a production-grade vertical runtime.


        The current implementation still relies on a compact single-file vertical
        model, does not persist an exact resolved vertical lockfile, does not persist
        durable project definition state, does not expose a complete JSON contract
        for agent-guided project construction, and does not yet formalize compatibility
        between selected verticals, generated rubrics, enabled rubric criteria, section
        completion, assumptions, and agent updates.


        Without a stronger contract, verticals may remain useful templates rather
        than a reliable operating layer for project definition. Agents can inspect
        available vertical data, but they cannot durably record what the owner has
        answered, what remains missing, what is assumed, which section is blocked,
        or which question should be asked next. Pack updates or local overrides may
        also change behavior unexpectedly if the project does not pin the resolved
        pack version and checksum.


        This proposal completes and hardens PROP-085 by defining the production-grade
        contracts for project vertical pack shape, source resolution, lockfiles, project
        definition state, CLI JSON access, agent-guided progressive interview behavior,
        validation, security, rubric regeneration, and future Wavekit-compatible installation.'
      fragment_kind: problem
      truncated: false
    - id: VME-61872580c197199b86b71508
      source_path: .p2p/proposals/PROP-090-project-vertical-pack-runtime-hardening-and-definition-state/proposal.md
      source_sha256: 46fa39047d64947152c2d94c2d2e57854a603381be87a0263f2b6d6879788e36
      fragment: '- Define a production-grade multi-file project vertical pack contract
        while preserving compatibility with existing single-file vertical.yml packs.

        - Persist the exact resolved vertical package in .p2p/project/vertical.lock.yml
        with version, source, schema, checksum, and compatibility metadata.

        - Introduce .p2p/project/definition.yml as the durable project definition
        state used by agents to record section data, assumptions, missing fields,
        open questions, decisions, and next suggested work.

        - Keep p2p project vertical ... as the stable CLI namespace and extend it
        with JSON-ready project context operations instead of replacing it with a
        new top-level namespace in the first slice.

        - Integrate selected vertical defaults with .p2p/project/rubrics.yml while
        preserving PROP-057 enabled/disabled rubric selection semantics.

        - Define deterministic resolver behavior across explicit path/reference, project-local
        packs, installed local packs, packaged seed packs, future Wavekit packs, and
        base_project fallback.

        - Define strict post-init lockfile behavior: after a vertical is locked, missing
        or mismatched packs must not silently fall back to another vertical without
        explicit repair, migration, or fallback command.

        - Expose enough structured JSON context for a generic agent to guide project
        definition without hardcoded domain knowledge.

        - Define the generic vertical-aware agent guidance runtime: progressive interview,
        one primary question per turn, examples, assisted answers, explicit assumptions,
        section completion checks, and structured state updates.

        - Keep vertical pack content as declarative domain data, never executable
        code and never higher-priority agent instruction.

        - Prepare local pack formats and lock metadata for future Wavekit remote installation
        without requiring remote registry support in the first implementation.

        - Define validation, upgrade, migration, orphaned rubric, and orphaned project-definition-field
        behavior before broad catalog expansion.'
      fragment_kind: goals
      truncated: false
    - id: VME-34bda5b6c0feb6d59e1a879f
      source_path: .p2p/proposals/PROP-090-project-vertical-pack-runtime-hardening-and-definition-state/proposal.md
      source_sha256: 46fa39047d64947152c2d94c2d2e57854a603381be87a0263f2b6d6879788e36
      fragment: '- Do not replace PROP-085. This proposal hardens and completes the
        accepted direction.

        - Do not replace p2p project vertical ... with a new required p2p vertical
        ... namespace in the first production slice.

        - Do not move existing project-local packs out of .p2p/project/verticals/
        as part of this proposal.

        - Do not rename base_project as a breaking change. Any generic_project naming
        can be handled as aliasing or a future compatibility decision.

        - Do not implement Wavekit remote search, install, update, or publish in the
        first implementation.

        - Do not execute code from vertical packs or support executable plugin hooks.

        - Do not allow vertical pack content to override system, developer, safety,
        governance, repository, or tool-permission instructions.

        - Do not make p2p init ask all vertical interview questions. Init configures
        the project; agent guidance develops the project later.

        - Do not replace .p2p/project/rubrics.yml or change the meaning of enabled:
        false from PROP-057.

        - Do not silently upgrade vertical packs or project definition state during
        assessment, export, readiness review, or ordinary agent interaction.

        - Do not require a domain-specific agent skill for every vertical.'
      fragment_kind: non-goals
      truncated: false
    - id: VME-9d921dd5adae0f89d25dd420
      source_path: .p2p/proposals/PROP-090-project-vertical-pack-runtime-hardening-and-definition-state/proposal.md
      source_sha256: 46fa39047d64947152c2d94c2d2e57854a603381be87a0263f2b6d6879788e36
      fragment: 'Introduce a production-grade project vertical runtime layer as a
        follow-up to PROP-085.


        This proposal is organized around four production contracts plus explicit
        scope, alternative, risk, owner-question, acceptance, and overlap analysis.
        The owner-review questions Q001-Q006 have been resolved and are incorporated
        in the direction below.


        Contract 1: Project Vertical Pack Contract

        A project vertical pack is a declarative data package that describes a project
        skeleton for a class of projects. The canonical production pack is multi-file
        for maintainability:

        - manifest.yml

        - vertical.yml

        - sections/

        - profiles/

        - modules/

        - rubrics.yml

        - artifacts/

        - examples/


        Minimum valid production pack:

        - manifest.yml

        - vertical.yml

        - sections/

        - rubrics.yml


        The loader must continue accepting the current MVP single-file vertical.yml
        shape as a compatibility input and normalize it into the same typed model.
        The canonical pack can split section specs, rubrics, artifact metadata, examples,
        and profiles into separate files. A section spec should define purpose, required
        fields, interview questions, assisted answer behavior, examples or answer
        templates, completion criteria, dependencies, common mistakes, suggested artifacts,
        and maturity gates where available.


        manifest.yml should contain stable identity and package metadata: id, name,
        version, publisher/source, schema_version, description, categories/tags, compatibility
        p2p_min_version, entrypoints, declared profiles, declared sections, artifact
        ids, license/trust metadata, and optional checksum/signature fields for future
        remote packs.


        vertical.yml should define the project skeleton: id, name, version, goal,
        extends/base, default_profile, maturity levels, section list with stable ids
        and spec paths, interview policy, completion policy, enabled status defaults,
        and supported statuses.


        profiles allow one vertical to support different project intentions without
        separate vertical ids. modules are optional vertical-local extensions. rubrics.yml
        provides default criteria for .p2p/project/rubrics.yml. Artifact templates
        are optional and partial artifact generation must mark missing or assumed
        content.


        Contract 2: Project Configuration And Resolution Contract

        The selected project vertical remains project state. Keep .p2p/project/vertical.yml,
        but evolve its schema from a minimal active-id record into richer selected-vertical
        configuration while remaining backward-compatible with MVP files.


        Keep the project-local pack path .p2p/project/verticals/<vertical-id>/ for
        compatibility. Installed local packs are resolved from both P2P_HOME/verticals
        and ~/.p2p/verticals. If P2P_HOME is configured, P2P_HOME/verticals has precedence
        over ~/.p2p/verticals; otherwise ~/.p2p/verticals is the default installed-local
        directory. If both installed-local locations contain the same pack id/version,
        the P2P_HOME source wins. Packaged seed resources remain inside package resources.
        Future Wavekit packs should be installed into an installed-local source and
        resolved by the same resolver.


        Resolution order is deterministic:

        - explicit path or vertical reference passed by the owner;

        - project-local packs under .p2p/project/verticals/;

        - installed local packs under P2P_HOME/verticals, when configured;

        - installed local packs under ~/.p2p/verticals;

        - packaged seed vertical resources;

        - future configured Wavekit/registry source;

        - base_project fallback only during initial selection or explicitly allowed
        repair.


        base_project remains the canonical fallback vertical for this implementation.
        Do not introduce generic_project in the first implementation. generic_project
        was terminology from the revision source and may be reconsidered later as
        a non-breaking alias only if there is a clear usability need after resolver,
        lockfile, and pack identity rules are stable.


        After initialization or explicit project vertical selection, resolve through
        .p2p/project/vertical.lock.yml. The lockfile records id, name, version, source,
        resolved_'
      fragment_kind: proposal
      truncated: true
    - id: VME-b3e1b98414046f665648aa02
      source_path: .p2p/proposals/PROP-090-project-vertical-pack-runtime-hardening-and-definition-state/proposal.md
      source_sha256: 46fa39047d64947152c2d94c2d2e57854a603381be87a0263f2b6d6879788e36
      fragment: '- A new local development feature can be derived from PROP-090 without
        changing the accepted meaning of PROP-085.

        - The existing p2p project vertical command namespace remains the primary
        public CLI surface for this hardening work; a top-level p2p vertical namespace
        is not required in the first implementation.

        - Existing single-file vertical.yml packs remain loadable and are normalized
        into the same typed model as canonical multi-file packs.

        - A canonical multi-file pack shape is defined and validated, including manifest.yml,
        vertical.yml, sections, rubrics.yml, and optional profiles, modules, artifacts,
        and examples.

        - The project-local vertical path .p2p/project/verticals/ remains supported
        and documented.

        - base_project remains the canonical fallback vertical id; generic_project
        is not introduced in the first implementation.

        - Installed local packs are resolved from both P2P_HOME/verticals and ~/.p2p/verticals,
        with P2P_HOME/verticals taking precedence when P2P_HOME is configured.

        - The resolver and vertical.lock.yml record the effective source type and
        resolved source path or package coordinate.

        - .p2p/project/vertical.lock.yml is generated deterministically for new init/select
        flows.

        - Existing projects with active vertical state but no lockfile are not modified
        implicitly by validation, readiness, export, or ordinary reads.

        - Existing active vertical state without a lockfile produces an actionable
        validation diagnostic and a dedicated explicit repair/migration command can
        generate the lockfile.

        - If the active or locked vertical cannot be resolved, repair/select/review
        commands fail without writing and do not silently fall back to base_project
        after lock creation.

        - .p2p/project/definition.yml is generated deterministically and validated
        against the active vertical.

        - Project definition state records section status, field data, missing fields,
        assumptions, open questions, blockers, next_suggested_action when available,
        and history/provenance.

        - Definition-state writes are implemented in the first production slice through
        a narrow structured patch/update contract; arbitrary YAML editing is not exposed.

        - Definition-state update validation rejects unknown section ids, field ids,
        invalid statuses, invalid assumption statuses, and inconsistent completion
        states.

        - Definition-state writes are atomic and go through supported service/CLI/MCP
        paths, not manual .p2p edits.

        - The first production slice exposes project context, sections, section detail,
        rubrics, and definition state through JSON-ready CLI or MCP surfaces.

        - The full p2p project next-action --json engine is not implemented in the
        first slice; agents use exposed JSON and optional next_suggested_action for
        best-effort guidance.

        - p2p init remains lightweight and does not ask full section interview questions.

        - Interactive init can select vertical, profile, optional sections/modules,
        generate rubrics from vertical defaults, and then invoke PROP-057 guided rubric
        selection.

        - Rubric regeneration preserves existing enabled flags by stable criterion
        id and handles removed criteria as orphaned or confirmation-required removals.

        - Maturity output distinguishes selected project rubric maturity from full
        default vertical baseline coverage.

        - Vertical pack content is validated with severity-dependent rules: explicit
        attempts to override higher-priority instructions, execute code, force tools,
        change permissions, or escape paths are hard errors; ambiguous instruction-like
        wording in examples/templates can be warnings.

        - Internal seed packs validate cleanly; project-local packs may be allowed
        with warnings; future remote/Wavekit packs can use stricter trust validation.

        - Generated agent guidance treats vertical pack content as domain data, not
        authoritative agent instruction.

        - Tests cover loader normalization, resolver precedence, lockfile behavior,
        explicit lock repair/migration, definition-state validation and updates, pack
        safety validation, rubric regeneration preservation,'
      fragment_kind: acceptance_criteria
      truncated: true
  - id: VMC-284708a8b6fb93cc95d7e6f6
    proposal_id: PROP-091
    title: Governance Policy Convergence
    section_id: risks_alternatives_decisions
    authority: resolved
    activation: active
    effective_state: accepted
    head_event_id: PDE-c4807cff1d66a97d62e3c451
    head_event_type: accepted
    rationale: Accepted by owner after guided refinement. The proposal is decision-ready
      with readiness score 100, high confidence, no failed gates, no missing artifacts,
      no suggested next actions, and clean validation. It defines Governance Policy
      Convergence with owner_decides as default, deterministic preflight, explicit
      precedent lookup, warning/blocking semantics, actor-role migration, and read-only/low-risk
      MCP phase 1.
    constraints: []
    applicability: risks_alternatives_decisions
    coverage_rationale: Resolves governance-policy alternatives and tradeoffs between
      agent autonomy, durable writes, owner authority, and external effects.
    source_path: .p2p/proposals/PROP-091-governance-policy-convergence/proposal.md
    proposal_semantic_sha256: 88d3140970165380c1c76f18de584755528db6fe5e8e73e79a7a2833ce26161e
    decision_semantic_sha256: b3573ac5b0e0be944dad52afc25b36a59b6259305c1997273d166f3f2f9b46e2
    lineage:
      kind: null
      targets: []
    evidence:
    - id: VME-a595849db855e7d18119a70b
      source_path: .p2p/proposals/PROP-091-governance-policy-convergence/proposal.md
      source_sha256: ca516c3c2348bcb5a066133b0c68a9fbeb0b4db6bcd6769034defd3754844c93
      fragment: "P2P Engine already has governance-aware artifacts and helper utilities,\
        \ but they\ndo not yet form a coherent operational governance policy. The\
        \ project can store\n`governance.yml`, `roles.yml`, `permissions.yml`, choices,\
        \ votes, decision\nprecedents, explicit blockers, and owner-controlled decisions,\
        \ but there is no\nsingle structured evaluation that answers these questions\
        \ before a decision:\n\n- who is attempting to decide;\n- whether that actor\
        \ is allowed to decide;\n- what target is being decided;\n- which governance\
        \ mode applies;\n- whether the governance state is valid and readable;\n-\
        \ how the proposed decision relates to votes, blockers, and precedents;\n\
        - whether the decision can proceed normally, requires rationale, requires\
        \ owner\n  override, or must be blocked.\n\nWithout this layer, governance\
        \ artifacts remain useful as audit records but weak\nas decision support.\
        \ Agents and external clients can see fragments of governance\nstate, yet\
        \ they cannot consume a stable preflight contract that explains the\ndecision\
        \ context in a deterministic way."
      fragment_kind: problem
      truncated: false
    - id: VME-8d10157f85d22bc6b8681a6e
      source_path: .p2p/proposals/PROP-091-governance-policy-convergence/proposal.md
      source_sha256: ca516c3c2348bcb5a066133b0c68a9fbeb0b4db6bcd6769034defd3754844c93
      fragment: "- Keep `owner_decides` as the current operational default.\n- Preserve\
        \ owner authority as the final decision source for now.\n- Make votes, blockers,\
        \ and precedents transparent decision context rather than\n  automatic decision\
        \ makers.\n- Introduce a deterministic governance preflight contract for proposed\n\
        \  selections and decision attempts.\n- Use `permissions.yml` as the primary\
        \ actor and role source when available.\n- Keep `governance/roles.yml` as\
        \ a legacy, display, or fallback artifact during\n  migration.\n- Make vote\
        \ disagreement, ties, related precedents, reopened decisions, weak\n  consensus,\
        \ and non-blocking concerns visible as warnings.\n- Treat structural invalidity,\
        \ unauthorized actors, unknown targets, unsupported\n  governance modes, and\
        \ corrupt governance artifacts as blocking errors.\n- Treat explicit unresolved\
        \ blockers as normal-flow blockers that can be\n  overridden only by an authorized\
        \ owner with recorded rationale.\n- Expose first-phase MCP parity through\
        \ read-only or low-risk governance status,\n  validation, vote status, precedent\
        \ lookup, and preflight tools."
      fragment_kind: goals
      truncated: false
    - id: VME-56689f1b4972aec05787e5e9
      source_path: .p2p/proposals/PROP-091-governance-policy-convergence/proposal.md
      source_sha256: ca516c3c2348bcb5a066133b0c68a9fbeb0b4db6bcd6769034defd3754844c93
      fragment: "- Do not implement a full democratic governance system.\n- Do not\
        \ introduce quorum, weighted voting, delegation, complex voting\n  deadlines,\
        \ or automatic vote enforcement.\n- Do not make votes automatically accept,\
        \ reject, or decide proposals or\n  choices.\n- Do not allow agents or MCP\
        \ tools to bypass owner-controlled governance.\n- Do not use fuzzy matching,\
        \ semantic similarity, embeddings, title inference,\n  keyword guessing, or\
        \ AI search in the core precedent lookup.\n- Do not expose MCP tools that\
        \ mutate governance state or finalize decisions in\n  phase 1.\n- Do not remove\
        \ compatibility for existing governance artifacts without a\n  migration path."
      fragment_kind: non-goals
      truncated: false
    - id: VME-7ed165a1085d4c03698ed178
      source_path: .p2p/proposals/PROP-091-governance-policy-convergence/proposal.md
      source_sha256: ca516c3c2348bcb5a066133b0c68a9fbeb0b4db6bcd6769034defd3754844c93
      fragment: "Introduce a Governance Policy Convergence layer.\n\nThe layer should\
        \ evaluate governance state before finalization and return a\nstable, versioned,\
        \ deterministic, machine-readable preflight structure. The\npreflight output\
        \ is not a decision record. It represents a proposed selection\nand the governance\
        \ evaluation before the final owner decision.\n\nThe initial preflight contract\
        \ should include:\n\n- `schema_version`;\n- `target`;\n- `governance`;\n-\
        \ `actor`;\n- `selection`;\n- `result`;\n- `blocking_errors`;\n- `warnings`;\n\
        - `vote_summary`;\n- `blockers`;\n- `precedents`.\n\nThe `result.status` field\
        \ should summarize one of:\n\n- `ready`;\n- `requires_rationale`;\n- `requires_owner_override`;\n\
        - `blocked`.\n\nBlocking errors and warnings should be structured objects\
        \ with stable\nmachine-readable codes, human-readable messages, override or\
        \ rationale metadata\nwhen relevant, and optional references.\n\n### Authority\
        \ And Votes\n\n`owner_decides` remains the operational default. The owner\
        \ remains the final\ndecision maker. Votes are transparency and decision evidence.\
        \ A proposed owner\ndecision that conflicts with the recorded vote winner\
        \ should produce a strong\nwarning and make the contrast explicit, but it\
        \ should not block finalization and\nshould not require a mandatory override\
        \ reason in the current model.\n\n### Actor And Role Resolution\n\nUse a soft\
        \ migration path:\n\n- `permissions.yml` is the primary actor and role source\
        \ whenever present;\n- `governance/roles.yml` remains legacy/display/fallback;\n\
        - vote and preflight flows move toward actor-based input;\n- when an actor\
        \ exists in `permissions.yml`, the effective role is inferred from\n  that\
        \ file;\n- legacy role fields may be tolerated during transition;\n- mismatches\
        \ between a supplied legacy role and the inferred role produce\n  warnings.\n\
        \n### Precedents\n\nCore precedent lookup is explicit and deterministic. The\
        \ core considers\nprecedents related only when links are declared in versioned\
        \ artifacts through\nstable identifiers or explicit tags, such as `related_precedents`,\n\
        `applies_to.proposal_ids`, `applies_to.choice_ids`, or `governance_tags`.\n\
        \nThe core must not infer precedent relationships from titles, keywords, fuzzy\n\
        matching, semantic similarity, embeddings, or AI-based search. Intermediary\n\
        tools may suggest links, but the core only considers those links after they\
        \ are\nwritten back as explicit artifact relations.\n\n### Blocking And Warning\
        \ Semantics\n\nWarnings are valid governance signals that may influence the\
        \ owner decision but\ndo not prevent finalization by themselves.\n\nBlocking\
        \ errors are conditions where the core cannot reliably establish the\ndecision\
        \ actor, decision target, governance mode, or integrity of governance\nstate.\n\
        \nInitial non-overrideable blocking errors include:\n\n- missing, unknown,\
        \ or unauthorized decision actor;\n- invalid required permissions or governance\
        \ context;\n- missing target proposal or choice;\n- structurally invalid target\
        \ artifacts;\n- unsupported governance mode;\n- structurally invalid governance\
        \ artifacts;\n- structurally invalid vote or precedent artifacts when present.\n\
        \nAn explicit unresolved blocker attached to the target proposal or choice\
        \ blocks\nnormal finalization. It may be overridden only by an authorized\
        \ owner with\nexplicit rationale recorded in the final decision record.\n\n\
        Vote disagreement, ties, related precedents, reopened decisions, open concerns\n\
        not marked as blockers, weak consensus, no votes, and no related precedents\
        \ are\nwarnings or neutral signals, not automatic blockers.\n\n### MCP Phase\
        \ 1\n\nMCP phase 1 exposes governance visibility, validation, vote summaries,\n\
        deterministic precedent lookup, and governance preflight evaluation. It does\
        \ not\nexpose governance mutation or final decision execution.\n\nIncluded\
        \ phase-1 tools:\n\n- `p2p_governance_status`;\n- `p2p_governance_validate`;\n\
        - `p2p_choice_governance_preflight`;\n- `p2p_vote_status`;\n- `p2p_precedent_search`.\n\
        \nDeferred tools:\n\n- `p2p_vote_record`;\n- `p2p_precedent_record`;\n- `p2p_choice_decide`.\n\
        \n`p2p_choice_governance_pre"
      fragment_kind: proposal
      truncated: true
    - id: VME-24c707312194e0cc548f5bb3
      source_path: .p2p/proposals/PROP-091-governance-policy-convergence/proposal.md
      source_sha256: ca516c3c2348bcb5a066133b0c68a9fbeb0b4db6bcd6769034defd3754844c93
      fragment: "- Governance status reports configured mode, effective owner identities,\n\
        \  artifact presence, warnings, and validation problems.\n- Governance preflight\
        \ emits a stable `schema_version`.\n- Governance preflight output is deterministic\
        \ for the same repository state\n  and command input.\n- Governance preflight\
        \ distinguishes proposed `selection` from final decision\n  records.\n- Governance\
        \ preflight includes actor resolution, resolved roles, capabilities,\n  and\
        \ `can_decide`.\n- Governance preflight includes `result.status` with one\
        \ of `ready`,\n  `requires_rationale`, `requires_owner_override`, or `blocked`.\n\
        - Blocking errors and warnings use stable machine-readable codes.\n- Vote\
        \ summaries are included when vote data exists or is relevant.\n- Vote disagreement\
        \ with the selected option produces a warning, not a blocking\n  error.\n\
        - Active explicit blockers are listed and block normal finalization.\n- Owner\
        \ override of explicit blockers requires rationale recorded in the final\n\
        \  decision record.\n- Explicit precedents and deterministic tag-declared\
        \ matches are listed\n  separately.\n- Precedent lookup uses only explicit\
        \ artifact relationships or declared tags.\n- Project validation includes\
        \ structural checks for `governance.yml`,\n  `roles.yml`, `decision-precedents.yml`,\
        \ and `votes.yml`.\n- MCP phase 1 tools do not modify project artifacts, votes,\
        \ precedents, choices,\n  proposals, or decision records.\n- MCP phase 1 exposes\
        \ governance status, validation, choice preflight, vote\n  status, and deterministic\
        \ precedent lookup."
      fragment_kind: acceptance_criteria
      truncated: false
  - id: VMC-be41c271fcefc212ac38e2ca
    proposal_id: PROP-094
    title: P2P-Governed Software Specification Lifecycle
    section_id: risks_alternatives_decisions
    authority: resolved
    activation: active
    effective_state: accepted
    head_event_id: PDE-b948a4d0fffef8cca8d60c06
    head_event_type: accepted
    rationale: Owner accepted after review; readiness is decision_ready with no missing
      gates or blocking questions.
    constraints: []
    applicability: risks_alternatives_decisions
    coverage_rationale: Records owner decisions and rejected alternatives for canonical
      specs, derived exports, lifecycle scope, and vertical ownership boundaries.
    source_path: .p2p/proposals/PROP-094-p2p-governed-software-specification-lifecycle/proposal.md
    proposal_semantic_sha256: e2c4fd7e1f9f6d8efd9cd5ae8333c14c2972cc604d31e9fa72404f79343e6b73
    decision_semantic_sha256: 79da00bcc5c503fc5cd4227084bc9b9aafd1428627284cbd7ee91ed027d7eaa5
    lineage:
      kind: null
      targets: []
    evidence:
    - id: VME-2cb54e5ebdc1161ce91a6a03
      source_path: .p2p/proposals/PROP-094-p2p-governed-software-specification-lifecycle/proposal.md
      source_sha256: b941019a2bc0c682a31c8d03ff53f289f878bf6e19ac043f1cd26d6d259627e6
      fragment: 'In software projects, an owner may legitimately ask an agent to produce
        system specifications before the project is fully defined. If the agent responds
        by creating a standalone spec file immediately, that file can become the effective
        source of truth while the P2P project definition remains incomplete or bypassed.


        This is a methodological failure, not a file-placement issue alone. The problem
        is not that specs are unnecessary or always premature. The problem is that
        the software vertical should guide the definition of the parts that make a
        useful specification, and those parts should be captured through P2P proposals,
        decisions, choices, readiness, and Change Sets before a durable spec file
        is treated as authoritative.


        Without that lifecycle, the owner receives a useful-looking document, but
        future agents, readiness checks, Change Sets, exports, and project status
        may not be able to explain which governed decisions the spec reflects, which
        assumptions remain unresolved, or whether the file is only an exploratory
        draft.'
      fragment_kind: problem
      truncated: false
    - id: VME-9393a021a0bcda9c593f1498
      source_path: .p2p/proposals/PROP-094-p2p-governed-software-specification-lifecycle/proposal.md
      source_sha256: b941019a2bc0c682a31c8d03ff53f289f878bf6e19ac043f1cd26d6d259627e6
      fragment: '- Treat the need for specs as a first-class part of the software
        vertical.

        - Make specification content emerge from P2P-governed project definition,
        one or more proposals, decisions, and Change Sets.

        - Teach generated agent instructions to route "make specs" requests through
        the software vertical and P2P state instead of creating an independent durable
        file by default.

        - Clarify when a spec request should produce chat discussion, project-definition
        questions, proposal work, choices, a Change Set, a P2P-native spec, a generated
        export, or stable documentation.

        - Allow early exploratory spec outlines, but prevent them from becoming primary
        project memory unless they are captured or exported through P2P.

        - Keep user intent respected: if the owner explicitly requests a concrete
        file outside the P2P flow, the agent may create it after previewing the write
        and explaining its relationship to P2P state.

        - Reuse existing P2P primitives instead of inventing a parallel specification
        workflow.'
      fragment_kind: goals
      truncated: false
    - id: VME-3184616defad3869d5509e39
      source_path: .p2p/proposals/PROP-094-p2p-governed-software-specification-lifecycle/proposal.md
      source_sha256: b941019a2bc0c682a31c8d03ff53f289f878bf6e19ac043f1cd26d6d259627e6
      fragment: '- Do not prohibit users from explicitly requesting a concrete spec
        file.

        - Do not replace existing P2P proposal, Change Set, spec refresh, or export
        primitives.

        - Do not implement external artifact registration unless explicitly accepted
        in a separate proposal.

        - Do not require all non-software projects to follow a software-spec lifecycle.

        - Do not require agents to complete every possible project-definition question
        before drafting any useful provisional outline.

        - Do not make generated specs authoritative when they contain unresolved questions,
        inferred details, or unaccepted alternatives.'
      fragment_kind: non-goals
      truncated: false
    - id: VME-4db9c418f207a9419b562382
      source_path: .p2p/proposals/PROP-094-p2p-governed-software-specification-lifecycle/proposal.md
      source_sha256: b941019a2bc0c682a31c8d03ff53f289f878bf6e19ac043f1cd26d6d259627e6
      fragment: 'Define a software-specific specification lifecycle policy and supporting
        guidance.


        ### Core rule


        In software projects, a request for "specs" should normally activate the software
        vertical and P2P proposal flow. The final spec file is a downstream artifact.
        It is not the primary project definition and should not be created as independent
        durable memory by default.


        The software vertical should make specification readiness visible by tracking
        the parts that a useful spec needs, including:


        - product or system objective;

        - intended users and actors;

        - scope and MVP boundaries;

        - core use cases and workflows;

        - domain concepts and data model;

        - integrations and external dependencies;

        - constraints, non-functional requirements, and operating assumptions;

        - acceptance criteria and validation strategy;

        - unresolved risks, alternatives, and owner decisions.


        These parts may be defined through one proposal or through multiple proposals.
        For example, one proposal may define the MVP boundary, another may define
        the data model, another may settle an integration strategy, and another may
        define agent/MCP behavior. A software spec should be able to derive from that
        set of accepted or explicitly provisional P2P artifacts.


        ### Lifecycle


        When the owner asks for specs, the agent should classify the request and route
        it:


        | Owner request | Agent routing | Persistent artifact |

        | --- | --- | --- |

        | "Let''s think through the specs" | Discuss in chat and identify missing
        vertical fields | None, unless owner asks to persist |

        | "Help me define the system" | Capture project-definition gaps and create/update
        proposals | P2P proposal/exploration/question artifacts |

        | "Compare possible architectures" | Create alternatives, choices, or competing
        proposals | P2P proposal/choice artifacts |

        | "Prepare implementation specs" | Identify accepted direction and create/update
        a Change Set | Change Set, then P2P-native spec |

        | "Export specs for a tool" | Generate/export from P2P-native spec | Generated
        export |

        | "Create this exact file" | Preview write and explain governance status |
        Stable documentation or explicit external file |


        For exploratory or requirements-level work, readiness is advisory. The agent
        may draft a provisional outline in chat or P2P exploration material while
        clearly marking unresolved decisions.


        For implementation-oriented specs or downstream exports, readiness should
        be stricter: there should be a sufficiently accepted direction, resolved blocking
        choices, and a relevant Change Set before generating a P2P-native spec or
        export bundle. If that state is missing, the agent should guide the owner
        to define or accept the missing proposals first.


        ### Agent behavior


        Generated agent instructions should include a concrete routing rule:


        - If the owner asks for "specs" but the software vertical is incomplete, use
        the vertical to identify missing spec ingredients and ask focused questions
        or create/update P2P proposals.

        - If the required spec content spans multiple concerns, split it into multiple
        proposals or choices instead of forcing everything into one monolithic file.

        - If the owner asks for implementation specs, identify the accepted proposal
        set and relevant Change Set before generating a P2P-native software spec.

        - If the owner asks for a file export, explain whether the file is a generated
        export, stable documentation, or temporary scratch.

        - If the owner explicitly asks to operate outside P2P, respect that boundary
        while making clear that the resulting file will not be P2P-governed unless
        later registered or imported.


        Persistent writes must follow PROP-093: preview the operation, target, artifact
        kind, write class, and reason unless the owner explicitly requested the exact
        artifact.'
      fragment_kind: proposal
      truncated: false
    - id: VME-62dc6b26e00f744f29b49075
      source_path: .p2p/proposals/PROP-094-p2p-governed-software-specification-lifecycle/proposal.md
      source_sha256: b941019a2bc0c682a31c8d03ff53f289f878bf6e19ac043f1cd26d6d259627e6
      fragment: '- WHEN a project is initialized or refreshed with the software domain,
        THE SYSTEM SHALL generate agent guidance that treats specs as a downstream
        capability of the software vertical, not as an immediate standalone file-writing
        shortcut.

        - WHEN an owner asks an agent for specs in a software project, THE GENERATED
        GUIDANCE SHALL instruct the agent to classify the request as exploration,
        project definition, proposal/choice work, Change Set preparation, P2P-native
        spec generation, export, or explicit stable documentation.

        - WHEN the software vertical is incomplete and the owner asks for specs, THE
        GENERATED GUIDANCE SHALL instruct the agent to identify missing spec ingredients
        and route them into P2P project-definition questions, proposal updates, new
        proposals, or choices before creating durable implementation spec files.

        - WHEN spec content spans multiple concerns, THE GENERATED GUIDANCE SHALL
        allow and recommend multiple P2P proposals or choices rather than forcing
        all specification content into one monolithic document.

        - WHEN the owner asks for exploratory or requirements-level spec thinking,
        THE GENERATED GUIDANCE SHALL allow chat or P2P exploration/proposal material
        without requiring full readiness, while requiring unresolved assumptions and
        decisions to be marked clearly.

        - WHEN the owner asks for implementation-oriented specs or downstream exports,
        THE GENERATED GUIDANCE SHALL require a sufficiently accepted direction, resolved
        blocking choices, and a relevant Change Set before generating P2P-native specs
        or export bundles.

        - WHEN the owner explicitly asks for a concrete external spec file, THE GENERATED
        GUIDANCE SHALL allow the write only with PROP-093 action preview and with
        a clear statement whether the file is stable documentation, generated export,
        temporary scratch, or outside P2P governance.

        - Documentation SHALL explain the software-project flow from vertical definition
        to one or more proposals, choices, accepted direction, Change Set, P2P-native
        spec, and downstream export.

        - Tests SHALL verify generated guidance and documentation for spec requests,
        including the routing table, multi-proposal source model, readiness split,
        and the rule that standalone spec files are not primary untracked project
        memory.

        - The first implementation slice SHALL reuse existing proposal, readiness,
        choice, change, spec, and spec export primitives unless a later accepted proposal
        adds external artifact registration or new spec lifecycle commands.'
      fragment_kind: acceptance_criteria
      truncated: false
