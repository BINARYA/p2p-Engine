    - id: VME-9f420787b6b3fe00db392821
      source_path: .p2p/proposals/PROP-095-project-runtime-contract-upgrade-lifecycle/proposal.md
      source_sha256: 7b9ba4c9cadd61561bfea91843818cde0e44bf6ac99b77c2ea1ec8debd1f6fc5
      fragment: 'PROP-084 allows a P2P-managed project to declare the P2P Engine runtime
        range it trusts, recommend a runtime version to collaborators, expose compatibility
        diagnostics, and block governed writes when the declared runtime contract
        cannot be trusted.


        The project still lacks an explicit lifecycle for changing that contract after
        initialization.


        An owner may intentionally move a project to another P2P Engine version or
        runtime line. Editing `.p2p/project/runtime.yml` manually is unsafe because
        it bypasses validation, can leave generated setup guidance stale, provides
        no deterministic preview of collaborator impact, and does not define how the
        PROP-084 governed-write gate may be crossed when the active runtime is outside
        the old compatible range.


        The project-level decision to change the required runtime must remain distinct
        from installing, upgrading, downgrading, or reconciling the runtime installed
        on a collaborator''s machine.'
      fragment_kind: problem
      truncated: false
    - id: VME-4fb25428255fdc76d8904c04
      source_path: .p2p/proposals/PROP-095-project-runtime-contract-upgrade-lifecycle/proposal.md
      source_sha256: 7b9ba4c9cadd61561bfea91843818cde0e44bf6ac99b77c2ea1ec8debd1f6fc5
      fragment: '- Give the owner an explicit, preview-first operation for changing
        the project runtime contract.

        - Expose separate read-only and mutating command surfaces.

        - Update `.p2p/project/runtime.yml` and managed `P2P-SETUP.md` as one coordinated
        policy change.

        - Classify upgrade, downgrade, range widening, range tightening, runtime-line
        change, recommended-only change, no-op, and active-runtime exclusion.

        - Preserve PROP-084 write-gate safety while allowing a narrow runtime-contract
        update exception for valid incompatible old contracts.

        - Allow agents and non-owner collaborators to produce read-only previews for
        owner review.

        - Require owner authority, explicit confirmation, stale-preview protection,
        and structured reasons where the impact is material.

        - Provide deterministic human-readable and JSON output for humans, agents,
        CI, and scripts.

        - Keep runtime installation, upgrade, downgrade, package resolution, remote
        lookup, and release availability enforcement out of scope.'
      fragment_kind: goals
      truncated: false
    - id: VME-063c6c0a732774a2e120d847
      source_path: .p2p/proposals/PROP-095-project-runtime-contract-upgrade-lifecycle/proposal.md
      source_sha256: 7b9ba4c9cadd61561bfea91843818cde0e44bf6ac99b77c2ea1ec8debd1f6fc5
      fragment: '- Do not install, upgrade, downgrade, select, or reconcile a local
        P2P Engine runtime.

        - Do not query GitHub, download release metadata, resolve wheels, or verify
        installability through the network.

        - Do not make release metadata from PROP-080 a blocking dependency for runtime
        contract updates.

        - Do not overwrite, adopt, merge, rename, back up, or replace unmanaged `P2P-SETUP.md`
        files.

        - Do not implement contract repair, schema migration, contract recovery, or
        legacy adoption workflows.

        - Do not add MCP mutation in the first implementation.

        - Do not create Git commits, branches, pushes, pull requests, merges, or provider
        handoffs.

        - Do not perform unrelated governed mutations after a new contract makes the
        active runtime incompatible.'
      fragment_kind: non-goals
      truncated: false
    - id: VME-ad9a8ceea8e0bf509ec82585
      source_path: .p2p/proposals/PROP-095-project-runtime-contract-upgrade-lifecycle/proposal.md
      source_sha256: 7b9ba4c9cadd61561bfea91843818cde0e44bf6ac99b77c2ea1ec8debd1f6fc5
      fragment: 'Define an explicit runtime contract update lifecycle with two CLI
        subcommands:


        ```text

        p2p runtime contract preview

        p2p runtime contract apply

        ```


        `preview` is strictly read-only. It validates the proposed contract, evaluates
        current contract state, evaluates authority for diagnostic purposes, classifies
        impact when the current state can be trusted, reports planned file changes,
        reports release availability diagnostics, and returns a deterministic `expected_state_token`
        only when an applicable update can later be applied.


        `apply` is the only mutating command. It requires the same proposed `requires`
        and `recommended` values used during preview, the same structured reason and
        optional linked decision, a valid `expected_state_token`, current owner or
        permission authority, and explicit `--confirm`.


        The first implementation shall not provide a single-command mode that previews
        and applies in one invocation. A future interactive convenience wrapper may
        be added only if it delegates to the same preview and apply services and preserves
        the same security semantics.


        ### Runtime Contract Values


        The update operation supports changes to:


        - `requires`, the compatible runtime range that may operate the project

        - `recommended`, the runtime version recommended for setup guidance


        Every proposed contract must satisfy:


        ```text

        recommended in requires

        ```


        The owner may update `recommended` without changing `requires`, provided the
        proposed recommended version still satisfies the unchanged compatible range.


        If `requires` and `recommended` are both unchanged, the operation returns
        `no_change`, produces no applicable token, requires no apply operation, consumes
        no consent, and modifies no file.


        ### Supported Range Grammar


        The first implementation of the update lifecycle supports this restricted
        grammar:


        ```text

        ==VERSION

        >=LOWER,<UPPER

        ```


        Versions and ranges use the PEP 440-compatible semantics selected for the
        runtime contract.


        Arbitrary compound expressions, exclusions, wildcards, environment markers,
        and package-resolution expressions are outside the first implementation of
        this update lifecycle. This restriction keeps impact classification deterministic.
        It does not globally constrain all future runtime-contract parsing or schema
        evolution.


        ### Impact Classification


        The stable initial labels are:


        - `recommended_only`

        - `range_widening`

        - `range_tightening`

        - `runtime_line_change`

        - `current_runtime_excluded`


        Multiple labels may apply.


        `recommended_only` applies only when the compatible range is unchanged and
        only the recommended version changes.


        Range changes are classified by the set of accepted versions, not by textual
        string differences:


        - add `range_widening` when the proposed range accepts at least one version
        not accepted by the current range

        - add `range_tightening` when the current range accepts at least one version
        not accepted by the proposed range


        Partially overlapping ranges and disjoint ranges therefore receive both `range_widening`
        and `range_tightening`. Preview output should separately report whether the
        ranges overlap. No stable `range_shift` label is required in the first implementation.


        `runtime_line_change` is based on the normalized `major.minor` line of the
        recommended version.


        `current_runtime_excluded` means the runtime executing the command will be
        incompatible after the proposed update. It is independent from range labels
        and may combine with `recommended_only`, `runtime_line_change`, `range_widening`,
        or `range_tightening`.


        Comparative labels require a valid and supported current contract. They are
        omitted when the current contract state is untrusted.


        ### Current State Behavior


        The lifecycle distinguishes current runtime contract states:


        | Current state | Preview behavior | Token | Apply |

        | --- | --- | --- | --- |

        | `compatible` | applicable preview | yes, unless no-op or structural blocker
        | allowed with authority, token, confirm |

        | `incompatible` caused only by active runtime outside '
      fragment_kind: proposal
      truncated: true
    - id: VME-50e65bcd2aa205d0c5ad206a
      source_path: .p2p/proposals/PROP-095-project-runtime-contract-upgrade-lifecycle/proposal.md
      source_sha256: 7b9ba4c9cadd61561bfea91843818cde0e44bf6ac99b77c2ea1ec8debd1f6fc5
      fragment: '### Command Surface


        - WHEN a user runs `p2p runtime contract preview`, THE SYSTEM SHALL perform
        a read-only preview and SHALL NOT modify project, governance, audit, consent,
        token, or environment state.

        - WHEN a user runs `p2p runtime contract apply`, THE SYSTEM SHALL treat it
        as the only mutating runtime contract update command.

        - THE FIRST IMPLEMENTATION SHALL NOT provide a single-command preview-and-apply
        mode.

        - WHEN preview output is requested as JSON, THE SYSTEM SHALL include the stable
        machine-readable fields required by agents.

        - WHEN apply output is requested as JSON, THE SYSTEM SHALL include status,
        files changed, final compatibility, release availability, audit mode, and
        blocker fields when applicable.


        ### Proposed Contract Validation


        - WHEN proposed `requires` is outside the supported grammar, THE SYSTEM SHALL
        fail closed without producing an applicable token.

        - WHEN proposed `recommended` does not satisfy proposed `requires`, THE SYSTEM
        SHALL fail closed without producing an applicable token.

        - WHEN proposed `requires` and `recommended` are unchanged, THE SYSTEM SHALL
        return `no_change`, no applicable token, no apply operation, no reason requirement,
        no consent consumption, and no file changes.

        - WHEN only `recommended` changes and it satisfies unchanged `requires`, THE
        SYSTEM SHALL classify the update as `recommended_only` unless other independent
        labels also apply.


        ### Impact Classification


        - WHEN proposed range accepts versions not accepted by the current range,
        THE SYSTEM SHALL add `range_widening`.

        - WHEN current range accepts versions not accepted by the proposed range,
        THE SYSTEM SHALL add `range_tightening`.

        - WHEN ranges partially overlap but neither is a subset of the other, THE
        SYSTEM SHALL add both `range_widening` and `range_tightening`.

        - WHEN ranges are disjoint, THE SYSTEM SHALL add both `range_widening` and
        `range_tightening` and report that ranges do not overlap.

        - WHEN the normalized recommended `major.minor` line changes, THE SYSTEM SHALL
        add `runtime_line_change`.

        - WHEN the active runtime does not satisfy the proposed range during an applicable
        transition, THE SYSTEM SHALL add `current_runtime_excluded`.

        - WHEN `range_tightening`, `runtime_line_change`, or `current_runtime_excluded`
        is present, THE SYSTEM SHALL require a structured reason for apply.


        ### Current State Handling


        - WHEN current runtime status is `compatible`, THE SYSTEM SHALL allow applicable
        preview and apply subject to validation, structural blockers, token, authority,
        reason, and confirmation.

        - WHEN current runtime status is `incompatible` only because the active runtime
        is outside a valid, supported old range, THE SYSTEM SHALL allow the limited
        update exception subject to the same checks.

        - WHEN current runtime status is `invalid_contract`, `unsupported_contract`,
        `missing_contract`, or `legacy_undeclared`, THE SYSTEM SHALL return diagnostic-only
        preview, no applicable token, no apply plan, and blocked apply.

        - WHEN current state is untrusted, THE SYSTEM MAY validate proposed values
        and MAY report whether the active runtime would satisfy the proposed range
        as hypothetical diagnostics, but SHALL NOT emit transition impact labels.


        ### Authority And Governance


        - WHEN preview is run by a non-owner or unresolved actor, THE SYSTEM SHALL
        still produce read-only diagnostics and report whether apply appears blocked
        for authority reasons.

        - WHEN apply is run, THE SYSTEM SHALL perform a fresh binding authority check
        and SHALL NOT rely on preview''s authority assessment.

        - WHEN apply lacks owner or permission authority, THE SYSTEM SHALL fail without
        modifying files.

        - WHEN apply lacks explicit `--confirm`, THE SYSTEM SHALL fail without modifying
        files.

        - WHEN a linked decision is omitted, THE SYSTEM SHALL NOT block solely for
        that reason.

        - WHEN a linked decision is provided, THE SYSTEM SHALL bind it into the expected-state
        token and report it in output.


        ### Expected-State Token


        - WHEN preview is applicable, THE SYSTEM SHALL r'
      fragment_kind: acceptance_criteria
      truncated: true
  - id: VMC-ba4af4d1a84807ae945131a6
    proposal_id: PROP-099
    title: Project Output Lifecycle and Retention Policy
    section_id: risks_alternatives_decisions
    authority: resolved
    activation: active
    effective_state: accepted
    head_event_id: PDE-5ef0ae2e007f0b6e55b94013
    head_event_type: accepted
    rationale: Owner accepts the decision-ready human project publication pipeline
      as the direction for readable, vertical-aware project outputs.
    constraints: []
    applicability: risks_alternatives_decisions
    coverage_rationale: Preserves the tradeoff between deterministic pipeline stages,
      semantic curation, and separate owner approval without collapsing their authority.
    source_path: .p2p/proposals/PROP-099-project-output-lifecycle-and-retention-policy/proposal.md
    proposal_semantic_sha256: 3aa087de6987ac5c32fb7d5b02fbb029285939caa588e67a70ac2bab33523541
    decision_semantic_sha256: a7eef08e06ed144e46cadc58b7e14050adef348f31a97e99dacbc1d5c3a1616e
    lineage:
      kind: null
      targets: []
    evidence:
    - id: VME-e59661e429785a0227a72c3a
      source_path: .p2p/proposals/PROP-099-project-output-lifecycle-and-retention-policy/proposal.md
      source_sha256: 8581dbc712f8378cb6f8b35c129a8a31c505eff83be25acea6d4ef0a22ebbdbc
      fragment: 'P2P Engine can already transform governed project memory, including
        ideas, contributions, proposals, decisions, readiness, verticals, Change Sets,
        Work items, risks, assumptions, and requirements, into a visible project export.
        That export is complete, traceable, useful as consolidated memory, and derived
        from the managed .p2p state. The problem is that completeness and editorial
        readability are different goals. The current export still reflects the internal
        P2P memory structure: proposal-oriented organization, repeated sections, detailed
        governance blocks, empty placeholders, long lists of requirements and risks,
        and historical information mixed with current project state. An owner, stakeholder,
        contributor, or implementer should not need to reconstruct the project by
        reading many proposals and internal artifacts. The project needs a human publication
        pipeline that transforms complete governed memory into a readable, project-first,
        publishable document.'
      fragment_kind: problem
      truncated: false
    - id: VME-7cd53531e3428369bf9c8bf5
      source_path: .p2p/proposals/PROP-099-project-output-lifecycle-and-retention-policy/proposal.md
      source_sha256: 8581dbc712f8378cb6f8b35c129a8a31c505eff83be25acea6d4ef0a22ebbdbc
      fragment: '- Define a Human Project Publication Pipeline from governed P2P state
        to complete export, curated Markdown, publication validation, and neutral
        PDF.

        - Keep deterministic export, semantic curation, owner review, publication
        validation, and PDF rendering as independent and inspectable stages.

        - Make the curated document project-first, vertical-aware, traceable, and
        readable by humans who do not know P2P internals.

        - Define an incremental implementation path with a minimal end-to-end slice
        first and richer CLI orchestration, publication packages, profiles, and themes
        later.'
      fragment_kind: goals
      truncated: false
    - id: VME-555ec2cebc9475e511f15446
      source_path: .p2p/proposals/PROP-099-project-output-lifecycle-and-retention-policy/proposal.md
      source_sha256: 8581dbc712f8378cb6f8b35c129a8a31c505eff83be25acea6d4ef0a22ebbdbc
      fragment: '- Do not make generated outputs a new source of truth; .p2p remains
        governed project memory.

        - Do not make the curator decide governance outcomes, readiness, implementation
        status, or owner choices.

        - Do not replace the P2P-native software specification lifecycle, OpenSpec,
        Spec Kit, or downstream implementation exports.

        - Do not require a fully deterministic curator in the first slice; semantic
        curation may be agentic but must be bounded by contracts and validation.

        - Do not introduce multiple themes, branding, visual editors, template marketplaces,
        sophisticated appendices, automatic permanent replacement of project.md, or
        full MCP parity in the first slice.'
      fragment_kind: non-goals
      truncated: false
    - id: VME-970c56539363ae097e9f4302
      source_path: .p2p/proposals/PROP-099-project-output-lifecycle-and-retention-policy/proposal.md
      source_sha256: 8581dbc712f8378cb6f8b35c129a8a31c505eff83be25acea6d4ef0a22ebbdbc
      fragment: 'Define PROP-099 as the Human Project Publication Pipeline. The target
        pipeline is: .p2p managed state to p2p project export to complete project.md,
        then p2p-project-curator skill to project.curated.md, then publication validation,
        then owner review, then neutral PDF renderer to project.pdf. The pipeline
        must remain explicitly separated into independently reviewable stages. The
        complete export, curated Markdown, validation result, owner review outcome,
        and rendered PDF should each have clear boundaries so a single stage can be
        inspected, revised, replaced, or improved without collapsing the whole flow.
        The existing deterministic export continues to be complete, traceable, regenerable,
        and close to P2P state. The curator is an agentic semantic editor and is expected
        to be the primary quality driver for a comprehensible project document: it
        identifies the central project thesis, reads the active vertical and project
        definition, adapts structure to the domain, builds a robust narrative thread
        around the selected vertical and its peculiarities, groups proposals by capability,
        separates current state from history, distinguishes accepted, implemented,
        planned, partial, pending, missing, and legacy evidence, removes placeholders
        and repetition, moves excessive detail to appendices where appropriate, preserves
        risks and open questions, and maintains traceability. The first slice should
        use a minimal publication profile to bound variability: audience mixed, depth
        standard, language project_default, vertical_structure adaptive, include_appendix
        false by default, and theme neutral-v1. Deterministic stages provide input
        discipline, contracts, validation, archival behavior, and rendering; they
        bound and review the curator output, but they must not replace the semantic
        editorial work. The publication validator is mostly deterministic and checks
        the document contract: one H1, coherent headings, executive summary, no known
        placeholders in the main body, no wholesale proposal dumps in the main text,
        explicit separation of project state and implementation state, accepted/planned/pending/missing
        distinctions, source-of-truth warning, traceability, vertical-compatible structure,
        and Markdown suitable for PDF rendering. The neutral PDF renderer consumes
        only validated curated Markdown and handles presentation, not content. The
        first implementation should be an end-to-end minimal slice: valid installable
        p2p-project-curator skill, compact-surfaces-first input discipline, vertical-aware
        structure, output project.curated.md, minimal publication validation, neutral
        project.pdf, manual owner review, traceability, and no direct .p2p mutation.
        Later slices may add CLI orchestration such as project publish prepare, validate,
        render, and status; publication packages such as project.full.md, project.md,
        project.appendix.md, project.pdf, publication-manifest.yml, and render-report.yml;
        and richer publication profiles for audience, depth, language, vertical structure,
        appendix inclusion, and theme.'
      fragment_kind: proposal
      truncated: false
    - id: VME-7182ca48a5ce0a3957fcc8e2
      source_path: .p2p/proposals/PROP-099-project-output-lifecycle-and-retention-policy/proposal.md
      source_sha256: 8581dbc712f8378cb6f8b35c129a8a31c505eff83be25acea6d4ef0a22ebbdbc
      fragment: '- The proposal defines the Human Project Publication Pipeline and
        clearly separates governed content, deterministic complete export, agentic
        editorial curation, publication validation, owner review, and PDF rendering.

        - Each pipeline stage is independently reviewable: complete export, curated
        Markdown, validation result, owner review outcome, and rendered PDF have explicit
        boundaries and artifacts or reports.

        - The proposal defines the first implementation slice: installable p2p-project-curator
        skill, compact-surfaces-first input discipline, vertical-aware curation, project.curated.md,
        minimal deterministic publication validation, neutral project.pdf, manual
        owner review, traceability, and no direct .p2p mutation.

        - The proposal defines the agentic curator as the primary quality driver for
        human comprehensibility, vertical-specific narrative, capability grouping,
        repetition removal, and robust project-first flow.

        - The proposal defines deterministic stages as boundaries and controls around
        curation: input discipline, contracts, validation, archival behavior, and
        presentation-only rendering.

        - The proposal defines a minimal publication profile for the first slice:
        audience mixed, depth standard, language project_default, adaptive vertical
        structure, appendix disabled by default, and neutral-v1 theme.

        - The proposal defines status vocabulary for accepted, implemented, planned,
        partial, pending owner decision, missing evidence, legacy or not assessed,
        advisory, and blocked material.

        - The proposal defines that project.md remains the complete export in the
        first slice, while project.curated.md is the owner-review candidate and project.pdf
        is rendered from the curated validated Markdown.

        - The proposal defines a later migration path where project.full.md preserves
        the complete export, project.md may become the curated human document, and
        publication metadata or appendices may be added.

        - The proposal defines publication validation quality gates for headings,
        placeholders, executive summary, proposal dump avoidance, project versus implementation
        status separation, traceability, source-of-truth warning, vertical fit, and
        PDF-ready Markdown.

        - The proposal defines that the PDF renderer is neutral and presentation-only:
        it must not rewrite content, remove sections, alter evidence status, modify
        decisions, or reinterpret readiness.

        - The proposal defines alternatives, tradeoffs, risks, assumptions, impact
        with PROP-083, and out-of-scope boundaries for software-spec and downstream
        export workflows.'
      fragment_kind: acceptance_criteria
      truncated: false
  - id: VMC-bac1b6552cf098b3c491f8cb
    proposal_id: PROP-100
    title: Project Decision Context Index and Proposal Neighborhood
    section_id: risks_alternatives_decisions
    authority: resolved
    activation: active
    effective_state: accepted
    head_event_id: PDE-dca2e0af8d9225336efbbf35
    head_event_type: accepted
    rationale: Accepted as the umbrella architecture direction for a derived, read-only
      and source-linked decision context index delivered through independently gated
      slices. Governed artifacts remain authoritative; public integration requires
      the defined performance and compatibility gates, and any persistent cache remains
      a separate measured feature.
    constraints: []
    applicability: risks_alternatives_decisions
    coverage_rationale: Records rejected early storage replacement, separation of
      similarity from authority and topology, and the measured deferral of persistent
      caching.
    source_path: .p2p/proposals/PROP-100-project-decision-memory-and-proposal-topology/proposal.md
    proposal_semantic_sha256: b8220a8d282b5a1d00db38264c2544c852cf938ae98f99524fa1739c7d8125c0
    decision_semantic_sha256: a6030e7b98871a0da42af9f9cca9533e260adf0eefe951c28c7db33944c71a8a
    lineage:
      kind: null
      targets: []
    evidence:
    - id: VME-6090667593464748c2106a3b
      source_path: .p2p/proposals/PROP-100-project-decision-memory-and-proposal-topology/proposal.md
      source_sha256: 557c708739e4d5aea998c336ac00f98fe67744baa73811131b68d3af53bc823e
      fragment: 'P2P conserva gia molte informazioni necessarie a ricostruire il ragionamento
        del progetto: decisioni e motivazioni nei Markdown, stati e readiness negli
        YAML, impact map, related proposals, conflict analysis, choice, Change Set,
        registri, artifact state, vertical coverage, decision precedents e artifact
        di pubblicazione. Il problema osservato non e prima di tutto il formato di
        persistenza. Il problema e che i servizi che generano registri, contesti e
        prompt ne usano solo una parte, perdendo motivazioni, vincoli, relazioni,
        autorita, provenienza e stato di attivazione.


        La revisione della codebase e della feature implementativa ha chiarito ulteriori
        cause:


        - `decisions-map.yml` e `relations.yml` sono projection lossy e non possono
        essere usati come memoria semantica autorevole;

        - intake e context rendering usano ancora selezioni first-N o letture globali
        non ordinate per rilevanza;

        - alcuni path ricostruiscono Change Set o summary ripetutamente e possono
        moltiplicare scansioni e tempi di risposta;

        - il parser Markdown corrente e stretto e non preserva span, sezioni duplicate
        o diagnostica affidabile per frontmatter malformato;

        - `P2PWorkspace` memoizza i service object, quindi un indice conservato nel
        service potrebbe diventare stale dopo una scrittura nella stessa sessione;

        - proposal status e decision outcome possono divergere e il lifecycle include
        stati come `accepted_with_changes`, `split`, `merged_into_other` e `superseded`
        che non possono essere ridotti a accepted/rejected;

        - decision precedents, project definition, governance constraints e Work execution
        state devono avere scope e authority espliciti;

        - Change Set frontmatter e file di relazione companion possono duplicare o
        contraddirsi;

        - similarity, topologia e authority sono dimensioni differenti e non devono
        essere fuse in uno score opaco;

        - `generated_at` non puo far cambiare l''identita semantica di un output deterministico;

        - CLI e MCP possono divergere se payload, serializer e target compatibility
        non vengono aggiornati nella stessa slice.


        L''effetto pratico resta invariato: P2P possiede memoria, ma non recupera
        in modo affidabile cio che e gia stato deciso o analizzato quando deve supportare
        una nuova proposta, un intake, una sintesi o il prossimo passo.'
      fragment_kind: problem
      truncated: false
    - id: VME-05e43da4ac2c2c1ef5814c79
      source_path: .p2p/proposals/PROP-100-project-decision-memory-and-proposal-topology/proposal.md
      source_sha256: 557c708739e4d5aea998c336ac00f98fe67744baa73811131b68d3af53bc823e
      fragment: '- Approvare un decision context index derivato, non canonico, rebuildable,
        read-only e spiegabile.

        - Introdurre un Source Catalog versionato che classifichi fonti semantiche,
        metadata di qualita, execution state, projection derivate e fonti escluse.

        - Richiedere uno snapshot immutabile per richiesta che scopra le fonti una
        volta e legga, hashi e parsifichi ogni fonte al massimo una volta usando gli
        stessi byte.

        - Mantenere `ProjectDecisionContextService` come facade stateless dietro `P2PWorkspace`,
        senza snapshot stale tra richieste.

        - Definire record, node, relation, evidence, diagnostic, retrieval hit, index
        e manifest tipizzati e serializzabili con schema versionato.

        - Separare canonicality, authority, activation, confidence e completeness.

        - Coprire l''intero proposal decision lifecycle, inclusi acceptance qualificata,
        split, merge, supersession, pending e legacy divergence.

        - Indicizzare decision precedents e un sottoinsieme esplicitamente catalogato
        di governance/project-definition constraints senza interpretazione libera
        di ogni testo.

        - Normalizzare progressivamente relazioni da proposal artifacts, Change Set,
        choices, blockers, conflict memory, vertical coverage e Work lineage.

        - Usare node namespace tipizzati, relation vocabulary versionata, evidence
        merge deterministico e traversal cycle-safe.

        - Distinguere edge di topologia da retrieval reasons quali lexical overlap,
        same surface e heuristic vertical match.

        - Fornire retrieval deterministico e spiegabile per proposal ID e idea text,
        con policy versionata, applicabilita esplicita, score ricostruibile e protezione
        dai falsi positivi.

        - Rendere `small` e `medium` budget semantici misurabili applicati dopo ranking
        e grouping.

        - Bloccare l''integrazione pubblica finche profiling, scan/read count e fixture
        di scala non dimostrano che il nuovo percorso non replica i timeout correnti.

        - Introdurre freshness basata su presenza/hash reali delle fonti e versioni
        delle policy, separando `generated_at` dall''identita semantica.

        - Migrare context packet, intake, prompt, next actions, projection e MCP per
        slice compatibili, mantenendo owner authority e controlled apply.'
      fragment_kind: goals
      truncated: false
    - id: VME-5eebb52013173bf13cade72b
      source_path: .p2p/proposals/PROP-100-project-decision-memory-and-proposal-topology/proposal.md
      source_sha256: 557c708739e4d5aea998c336ac00f98fe67744baa73811131b68d3af53bc823e
      fragment: '- Non sostituire proposal, decision, choice, Change Set, Work, YAML
        o Markdown canonici come source of truth.

        - Non creare una memoria canonica parallela aggiornata da sintesi LLM libera.

        - Non usare registri, decisions map, pubblicazioni, prompt o altri output
        derivati come input semantico dell''indice.

        - Non implementare PROP-100 come un unico Change Set senza gate intermedi.

        - Non scegliere o implementare una cache persistente nella prima realizzazione;
        una cache giustificata dalle misure richiede una feature separata.

        - Non introdurre embeddings o ricerca non spiegabile nel primo retrieval.

        - Non ridefinire proposal lifecycle, governance, owner authority, Git flow
        o controlled apply.

        - Non interpretare genericamente ogni documento di governance o project definition.

        - Non applicare automaticamente relazioni, tag, supersessioni, decisioni o
        vincoli.

        - Non pubblicare una nuova registry topology stabile senza un consumer e uno
        schema separatamente approvati.

        - Non estendere nella prima integrazione il retrieval pubblico a Change Set,
        Choice o Work target.

        - Non incorporare nel dominio semantico la correzione funzionale del timeout
        preesistente; profiling e remediation delle scansioni necessarie all''integrazione
        restano tuttavia un gate obbligatorio di PROP-100.

        - Non fissare nella proposta ombrello pesi numerici e layout dei moduli: tali
        dettagli appartengono alla feature versionata.'
      fragment_kind: non-goals
      truncated: false
    - id: VME-ff63a5a229a31a48317a2406
      source_path: .p2p/proposals/PROP-100-project-decision-memory-and-proposal-topology/proposal.md
      source_sha256: 557c708739e4d5aea998c336ac00f98fe67744baa73811131b68d3af53bc823e
      fragment: 'Introdurre un livello di accesso decisionale derivato sopra gli artifact
        canonici P2P esistenti. Il livello estrae, normalizza, collega e recupera
        decisioni, vincoli, relazioni e contesto rilevante con provenance, authority,
        activation, confidence, completeness e freshness verificabili. Non sostituisce
        gli artifact originali e non introduce una nuova fonte di verita.


        Il programma e organizzato in slice dipendenti:


        1. Domain, Source Catalog, request-scoped snapshot e proposal/decision extraction.

        2. Authority policy e typed topology normalization.

        3. Explainable retrieval e semantic budgets.

        4. Performance profiling/remediation gate.

        5. Context packet, CLI e MCP integration.

        6. Intake e proposal prompt neighborhood.

        7. Next actions e legacy projection migration.

        8. Freshness e materialized manifest.

        9. Cache decision basata su misure, senza cache implementation in PROP-100.


        Una singola specifica repository puo coordinare queste slice, ma non elimina
        i gate: ogni slice deve avere dipendenze, exit criteria, focused tests e compatibility
        evidence. La prima slice non cambia CLI, MCP, intake, prompt, registri o storage.


        Il Source Catalog dichiara cosa e semantic source e cosa e escluso. Proposal/decision,
        project choices, conflict memory, Change Set relation sources, declared vertical
        coverage e decision precedents possono produrre evidenza secondo policy. Readiness,
        artifact state, questions, contributions e Work status descrivono qualita,
        evento o execution state e non attivano decisioni. Registri e narrative generate
        restano projection escluse.


        L''extraction session cattura path root-relative, presence, bytes, hash, parsed
        fragments e diagnostics. Hash e parse usano gli stessi byte. Stable identity
        dipende da source path normalizzato, owner, record kind e semantic fragment
        anchor; content hash e line span restano metadata separati.


        La authority policy distingue canonicality, authority, activation, confidence
        e completeness. `accepted_with_changes` attiva una decisione qualificata dal
        reason; rejected/deferred/split/merged/superseded restano storia o lineage.
        Una divergenza tra proposal status e decision outcome produce diagnostics
        e non ripara automaticamente le fonti. Acceptance status da solo non rende
        una decisione applicabile a ogni query.


        La topologia usa node type distinti per proposal, decision, choice, Change
        Set, Work, vertical section, capability, surface, feature, command e file.
        Una relation canonica memorizza source, type e target; incoming/outgoing e
        calcolato rispetto alla query e non crea edge inversi duplicati. Assertion
        equivalenti fondono le evidence senza moltiplicare score. Change Set source
        duplicati vengono riconciliati con precedence e divergence diagnostics. Traversal
        e depth/fan-out bounded.


        Il retrieval usa un indice in memoria e non legge file dopo il build. Candidate
        selection, lexical normalization, applicability, score contributions, cap,
        status penalties, historical threshold, tie-breaking, grouping, empty result
        e budget sono policy versionate. Ogni score deve essere ricostruibile dalle
        contribution esposte. `small` e `medium` sono assemblati dopo ranking; non
        esiste fallback first-N.


        Il percorso pubblico puo partire da `PROP-*`. Target `CHANGE-*`, `CHOICE-*`,
        `WORK-*` e no-target mantengono il comportamento corrente finche non ricevono
        slice dedicate. CLI text, structured output e MCP espongono semantica equivalente;
        renderer e handler non devono rerankare.


        Il source fingerprint include catalog version, path, presence e source hash.
        Il semantic fingerprint include le versioni di extractor, authority e relation
        policy; i packet includono retrieval e budget policy. `generated_at` e metadata
        osservazionale con clock iniettabile e non cambia semantic equality.


        Il bug corrente di `p2p context` puo essere corretto come lavoro tecnico separato,
        ma PROP-100 non puo integrare altro lavoro nel path finche non sono rispettati:
        un discovery pass, una read/hash/parse per fonte, zero source read dura'
      fragment_kind: proposal
      truncated: true
    - id: VME-62dfb1ddf364f19748d2f498
      source_path: .p2p/proposals/PROP-100-project-decision-memory-and-proposal-topology/proposal.md
      source_sha256: 557c708739e4d5aea998c336ac00f98fe67744baa73811131b68d3af53bc823e
      fragment: '- L''owner puo approvare o respingere consapevolmente la direzione
        di un decision context index derivato, non canonico e source-linked.

        - La proposta distingue umbrella decision, specifica multi-slice e Change
        Set indipendenti.

        - Il Source Catalog classifica fonti incluse, metadata e fonti derivate escluse;
        l''indice non legge registri o publication come semantic truth.

        - Una extraction session scopre le fonti una volta e legge/hasha/parsa ogni
        fonte al massimo una volta dagli stessi byte.

        - Un service memoizzato non conserva snapshot stale tra richieste; una modifica
        nella stessa workspace e visibile alla richiesta successiva.

        - Stable IDs, content hashes, evidence span e completeness sono contratti
        distinti e deterministici.

        - Il lifecycle copre accepted, accepted-with-changes, rejected, deferred,
        split, merged, superseded, pending e legacy divergence.

        - Accepted-with-changes conserva il reason come qualifier; acceptance status
        non trasmette automaticamente applicabilita globale.

        - Decision precedents, project choices, readiness, artifact state, questions,
        contributions, vertical signals e Work state ricevono authority/activation
        coerenti con il loro ruolo.

        - Node e relation type sono validati; query direction non duplica edge; evidence
        duplicate non moltiplicano lo score; traversal termina su cicli e fan-out.

        - Change Set relation sources discordanti producono divergence diagnostics
        e precedence deterministica.

        - Retrieval per proposal ID e idea text e deterministico, source-free dopo
        il build, versionato e spiegabile tramite contribution che ricostruiscono
        lo score.

        - `small` e `medium` hanno limiti misurabili definiti nella feature e applicati
        dopo ranking/grouping, senza fallback first-N.

        - Empty, partial e unavailable context sono distinguibili e mantengono evidence
        minima per i claim inclusi.

        - Profiling e performance remediation soddisfano structural read/scan gates
        prima della context integration.

        - `generated_at` non modifica semantic fingerprint; source presence/hash e
        policy version changes rendono stale le projection pertinenti.

        - La prima implementazione non persiste cache; una cache eventualmente necessaria
        richiede una feature separata.

        - `PROP-*` puo ricevere `nearby_context` mantenendo i legacy fields; non-proposal
        target restano compatibili nella prima integrazione.

        - CLI text, structured output e MCP mantengono semantica e schema allineati
        e read-only.

        - Intake e prompt usano context rilevante ma non estendono controlled apply
        o owner authority.

        - Golden, adversarial, malformed-source, determinism, same-workspace, cycle,
        scale e public-contract tests proteggono le slice.

        - Nessuna build/query del decision context modifica fonti canoniche o crea
        cache/projection implicite.'
      fragment_kind: acceptance_criteria
      truncated: false
  - id: VMC-9e55d1d5fdcab77641428378
