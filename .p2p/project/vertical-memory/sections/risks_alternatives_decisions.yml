vertical_memory_section:
  schema_version: 1
  section:
    id: risks_alternatives_decisions
    title: Risks Alternatives And Owner Decisions
    purpose: Unresolved risks, alternatives, tradeoffs, and owner-controlled decisions.
    required: true
    priority: 190
  definition:
    status: partial
    fields:
      alternatives:
        value: Rejected alternatives are manual .p2p repair, automatic normalization
          of ambiguous relations, bulk mapping all proposals from heuristics, treating
          generated projections as authority, and changing persistence technology
          before eliminating information loss. Deferred alternatives include a persistent
          decision-context cache, database-backed storage, MCP migration apply, remote
          fleet migration and automatic curator/owner stages.
        source: PROP-100+specs/features/workspace-schema-versioning-and-legacy-migration/design.md
      owner_decisions:
        value: The owner selected software_project, profile default, no optional modules,
          owner identity mrjungle, active delivery metadata and the reviewed schema
          and definition batches. The owner approved removal of PROP-095 free-text
          proposal targets and canonical relation mappings for PROP-060, PROP-082,
          PROP-084, PROP-089, PROP-091 and PROP-092. The owner also approved the first
          declared vertical-coverage batch for PROP-001, PROP-006, PROP-044, PROP-055,
          PROP-084, PROP-085, PROP-090, PROP-091, PROP-094, PROP-095, PROP-099 and
          PROP-100, covering 13 of 19 sections; the other 88 proposals remain intentionally
          legacy and unmapped, without empty placeholder artifacts. Final publication
          review remains a separate owner decision, and intentional draft/pending
          authority state remains unchanged.
        source: M4_owner_decisions+specs/features/workspace-schema-versioning-and-legacy-migration/implementation.md
      risks:
        value: Historical relation corrections produce no invalid, ambiguous or unsupported
          relation diagnostic. Two draft proposals intentionally retain draft/pending
          authority divergence and keep the decision index partial without changing
          accepted authority. The reviewed M4 batch limits declared vertical authority
          to 12 owner-confirmed proposals covering 13 of 19 sections. Remaining repository
          risks are stale derived layers after canonical changes, the 88 legacy and
          unmapped proposals being mistaken for current evidence, six definition-complete
          sections without proposal evidence being mistaken for incomplete definition,
          and optional legacy artifacts being treated as current. Curator and owner
          publication stages remain separate.
        source: specs/features/workspace-schema-versioning-and-legacy-migration/implementation.md
    required_field_ids:
    - risks
    - owner_decisions
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
