vertical_memory_section:
  schema_version: 1
  section:
    id: risks
    title: Risks
    purpose: Failure modes, mitigations, and tradeoffs.
    required: true
    priority: 60
  definition:
    status: complete
    fields:
      summary:
        value: Principal risks are stale schema or derived markers, partial multi-file
          writes, concurrent source drift, automatic semantic migration that changes
          intent, heuristic coverage being mistaken for owner authority, cleanup deleting
          unknown material, runtime or documentation drift, and agent or publication
          outputs implying approval without evidence. Mitigations are independent
          runtime/schema validation, fresh preview and preimage checks, atomic transactions
          with rollback/recovery, owner-reviewed semantic batches, separate suggested
          versus declared coverage, preserve-by-default reconciliation, bounded provenance-rich
          context, explicit freshness, and separate curator/owner gates. Residual
          risks remain visible through diagnostics and migration evidence rather than
          being forced to green.
        source: specs/features/workspace-schema-versioning-and-legacy-migration/design.md
    required_field_ids:
    - summary
