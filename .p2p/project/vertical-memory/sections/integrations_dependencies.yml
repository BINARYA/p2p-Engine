vertical_memory_section:
  schema_version: 1
  section:
    id: integrations_dependencies
    title: Integrations And Dependencies
    purpose: External systems, APIs, services, tools, and runtime dependencies.
    required: true
    priority: 160
  definition:
    status: complete
    fields:
      external_integrations:
        value: P2P integrates with local Git repositories and configured remotes,
          agent clients through a local stdio MCP JSON-RPC server, project-local Python
          virtual environments and versioned GitHub Release wheels, and downstream
          specification or publication targets. The runtime requires Python 3.11 or
          newer with Typer, Rich, PyYAML and packaging; build and test tooling is
          optional-development scope, while Markdown rendering and WeasyPrint are
          optional PDF dependencies. External provider mutations remain permission-gated
          and capability-limited.
        source: pyproject.toml+docs/INSTALL.md+docs/MCP.md
    required_field_ids:
    - external_integrations
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
