    source_path: .p2p/proposals/PROP-044-p2p-mcp-server-mvp/proposal.md
    proposal_semantic_sha256: 222c73d5b7ac271d1d121df84f6a766e7f20948ab570b43f5500fba9cbe3757f
    decision_semantic_sha256: ff01db1cd65d6613e860143644900b1c0955c10bd2844a9684fbc0cd9c6209fb
    lineage:
      kind: null
      targets: []
    evidence:
    - id: VME-9b2fbda413f210f58998d716
      source_path: .p2p/proposals/PROP-044-p2p-mcp-server-mvp/proposal.md
      source_sha256: bd42cdcdcda2477c3f4b5ba242d0238dc240b8fbb3be8fbb2ba0cfbbff9f5ab5
      fragment: Agents should access P2P project state through structured tools instead
        of parsing CLI text or reading .p2p files directly.
      fragment_kind: problem
      truncated: false
    - id: VME-9724e629de86a04e4c5d9e75
      source_path: .p2p/proposals/PROP-044-p2p-mcp-server-mvp/proposal.md
      source_sha256: bd42cdcdcda2477c3f4b5ba242d0238dc240b8fbb3be8fbb2ba0cfbbff9f5ab5
      fragment: '- Add a local stdio MCP server inside this repository.

        - Expose a minimal read-only tool surface over P2PWorkspace.

        - Keep governance and Work mutation commands out of the MCP MVP.

        - Avoid web server, cloud deployment, auth, container, direct AI invocation,
        and mediator logic.'
      fragment_kind: goals
      truncated: false
    - id: VME-cabf27fd1a8d149af423f1c8
      source_path: .p2p/proposals/PROP-044-p2p-mcp-server-mvp/proposal.md
      source_sha256: bd42cdcdcda2477c3f4b5ba242d0238dc240b8fbb3be8fbb2ba0cfbbff9f5ab5
      fragment: '- Implement MCP over HTTP.

        - Expose proposal accept, choice decide, work accept, Git branch, commit,
        merge, cleanup, or provider actions.

        - Implement P2P Mediator or Web.'
      fragment_kind: non-goals
      truncated: false
    - id: VME-4f16808aa4910fa44c43c902
      source_path: .p2p/proposals/PROP-044-p2p-mcp-server-mvp/proposal.md
      source_sha256: bd42cdcdcda2477c3f4b5ba242d0238dc240b8fbb3be8fbb2ba0cfbbff9f5ab5
      fragment: Add src/p2p_engine/mcp with a small JSON-RPC stdio MCP server and
        a p2p-mcp-server entrypoint. The server exposes read-only tools for project
        status, next actions, proposal list/show, choice list/show, change status,
        work status, and registry show. Each tool returns structured JSON derived
