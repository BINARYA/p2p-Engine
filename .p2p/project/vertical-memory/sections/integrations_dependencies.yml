  active_contributions:
  - id: VMC-086daddad18f5d5e44ed0ab8
    proposal_id: PROP-006
    title: Multi-Agent Integration Model
    section_id: integrations_dependencies
    authority: resolved
    activation: active
    effective_state: accepted
    head_event_id: PDE-cf71cf96ba2288769305e65d
    head_event_type: accepted
    rationale: Owner accepts PROP-006 after refinement. The proposal is considered
      ready as-is because remaining low readiness score reflects the current conservative
      readiness CLI, not unresolved product direction. A separate follow-up proposal
      will address readiness assessment refresh and review workflow.
    constraints: []
    applicability: integrations_dependencies
    coverage_rationale: Defines project-local integration surfaces for supported agents
      and structured CLI and MCP parity over the same core behavior.
    source_path: .p2p/proposals/PROP-006-multi-agent-integration-model/proposal.md
    proposal_semantic_sha256: 9b78fae0b86536e2ac908dec9120ad451ab1415af52065ca326a5575df03125f
    decision_semantic_sha256: 5f88a0ce4a1fae2eef77a3150da61b0bf1c0860bc5179222b678631c0968752e
    lineage:
      kind: null
      targets: []
    evidence:
    - id: VME-c1954dabe48c3eac3790d9f3
      source_path: .p2p/proposals/PROP-006-multi-agent-integration-model/proposal.md
      source_sha256: 314c7dec83d79cfdf633eb832ec12259733863a2c21243760f39f67b413978d1
      fragment: 'P2P Engine can already generate basic agent-facing instructions for
        generic, Codex, and Claude profiles, but it does not yet manage agent integrations
        as governed, inspectable, updateable project state. Project initialization
        should create the supported project-local agent file structures by default,
        but today there is no explicit registry of installed integrations, generated-file
        manifests, hashes, drift detection, safe update, safe uninstall, conflict
        detection, or precise adapter matrix for Cursor, Copilot, Gemini, OpenCode,
        Codex, Claude, and the generic baseline. A second gap is methodological: generated
        instructions do not yet force agents to turn weak proposal readiness, failed
        gates, and owner questions into concrete refinement actions, alternatives,
        recommendations, candidate edits, and readiness re-checks.'
      fragment_kind: problem
      truncated: false
    - id: VME-f979294a7ad323e9bc0ed276
      source_path: .p2p/proposals/PROP-006-multi-agent-integration-model/proposal.md
      source_sha256: 314c7dec83d79cfdf633eb832ec12259733863a2c21243760f39f67b413978d1
      fragment: '- Create all supported project-local agent integrations by default
        during project init, unless the owner explicitly narrows the install set.

        - Keep generic as the mandatory, unremovable common baseline from which agent-specific
        files are derived.

        - Introduce a versioned project-local .p2p/agent-integrations.yml registry
        with generated-file manifests, ownership metadata, shared-file flags, template
        versions, SHA-256 hashes, and drift state.

        - Use built-in package templates for the MVP and defer project-local template
        overrides.

        - Support safe install, install all, list, show, update, doctor, and uninstall
        flows without active/default/preferred agent state.

        - Define the initial adapter matrix for generic, Codex, Claude, Cursor, Copilot,
        Gemini, and OpenCode, including shared files and excluded legacy/conflicting
        targets.

        - Define common method behavior for generated instructions so agents transform
        readiness gaps into alternatives, recommendations, owner questions, candidate
        edits, and readiness re-checks.

        - Keep P2P CLI, MCP tools, .p2p state, validation, readiness, and owner decisions
        aligned over the same core behavior.'
      fragment_kind: goals
      truncated: false
    - id: VME-79606489855bd9fd44eec508
      source_path: .p2p/proposals/PROP-006-multi-agent-integration-model/proposal.md
      source_sha256: 314c7dec83d79cfdf633eb832ec12259733863a2c21243760f39f67b413978d1
      fragment: '- Project-level preferred, default, current, switched, or active
        agent selection.

        - Direct invocation of AI providers or hosted agent runtimes.

        - Destructive uninstall of files that have been manually modified or are shared
        with other installed integrations.

        - Automatic edits to user/global agent configuration outside the project without
        explicit consent.

        - Generation of deprecated .cursorrules files or default opencode.json configuration
        in the MVP.

        - Full implementation of dedicated readiness refinement commands unless covered
        by this proposal''s implementation scope or a follow-up readiness proposal.'
      fragment_kind: non-goals
      truncated: false
    - id: VME-574fc17224dd99acf9a6cf7b
      source_path: .p2p/proposals/PROP-006-multi-agent-integration-model/proposal.md
      source_sha256: 314c7dec83d79cfdf633eb832ec12259733863a2c21243760f39f67b413978d1
      fragment: 'Introduce an Agent Integration Registry MVP. By default, p2p init
        creates the generic baseline and all supported project-local adapter files
        for generic, codex, claude, cursor, copilot, gemini, and opencode. The owner
        may request a narrower init set with repeated --agent options, but generic
        is always included and cannot be removed. P2P records installed integrations
        in .p2p/agent-integrations.yml using schema_version 1, baseline_profile: generic,
        adapter status, maturity, capabilities, template_version, generated file records,
        shared ownership, managed flag, template_id, SHA-256 hash over exact file
        bytes, and drift state. The registry must not contain active_agent, default_agent,
        preferred_agent, current_agent, use, or switch state. Built-in adapter templates
        live in package data under src/p2p_engine/templates/agents/<adapter>/ for
        the MVP; project-local template overrides are deferred. Generated Markdown
        files should include a short managed header as a human hint, while the registry
        remains authoritative. The CLI exposes p2p agent list, show, install, update,
        doctor, and uninstall; excluded commands are use, switch, current, and install
        --no-use. doctor validates registry shape, file existence, hashes, shared
        references, generic baseline, ownership conflicts, uninstall safety, and presence
        of the generic method behavior block. install all may install every supported
        project-local integration only when non-shared file targets do not conflict.
        Migration is conservative: known generated files become managed, unknown or
        changed files become unmanaged or drifted, and P2P never overwrites them silently.
        Generated files derive from minimal generic P2P governance content and may
        be adapted for host tools without weakening the rules. That generic content
        must include readiness-driven refinement behavior: when a proposal is weak,
        low-confidence, below target, or blocked by failed gates, the agent must explain
        each gap, propose concrete alternatives, recommend one when justified, identify
        owner decisions, draft candidate updates, and re-check readiness after refinement.
        Initial files are AGENTS.md and .p2p/agent-policy.yml for generic; AGENTS.md
        plus a shared agent-neutral .agents/skills/p2p-project/SKILL.md for Codex
        when safe, with .codex/skills preserved as compatibility/migration; CLAUDE.md
        for Claude; .cursor/rules/p2p.mdc for Cursor; .github/copilot-instructions.md
        for Copilot; GEMINI.md for Gemini; and AGENTS.md only for OpenCode in the
        MVP. opencode.json is not generated by default. CLI and MCP tools are implemented
        over the same core behavior, with MCP exposing structured equivalents for
        compatible agents. Future readiness refinement commands should live under
        p2p proposal readiness, but they are not required for accepting this proposal.'
      fragment_kind: proposal
      truncated: false
    - id: VME-b3393fcad5a08ff21454c7aa
      source_path: .p2p/proposals/PROP-006-multi-agent-integration-model/proposal.md
      source_sha256: 314c7dec83d79cfdf633eb832ec12259733863a2c21243760f39f67b413978d1
      fragment: '- Default project init installs generic plus all supported project-local
        adapters: codex, claude, cursor, copilot, gemini, and opencode.

        - A narrowed init can install only requested specific adapters, but generic
        is still created and remains unremovable.

        - .p2p/agent-integrations.yml uses schema_version 1 with baseline_profile,
        adapters, capabilities, template_version, generated file records, shared ownership,
        managed flag, template_id, SHA-256 hash, and drift state.

        - The registry records installed integrations and generated files without
        active_agent, default_agent, preferred_agent, current, use, or switch state.

        - Built-in adapter templates live in package data for the MVP; project-local
        template overrides are deferred.

        - The generic baseline defines the minimum P2P governance rules and all generated
        agent-specific files preserve those rules.

        - Generated instructions include a readiness gap handling block that requires
        agents to explain failed gates, propose alternatives, recommend one option
        when justified, identify owner decisions, draft candidate updates, and re-check
        readiness.

        - The adapter matrix documents exact generated files for each built-in adapter
        and excludes deprecated .cursorrules and default opencode.json generation.

        - install all detects non-shared file target conflicts and refuses conflicting
        adapters instead of overwriting.

        - Generated files are recorded with template version, ownership metadata,
        shared-file flag, and SHA-256 hash over exact file bytes.

        - Updating an adapter refreshes unchanged generated files and refuses to silently
        overwrite drifted files.

        - Uninstall removes only the target adapter''s managed, unchanged, non-shared
        files and preserves generic, shared, modified, and unmanaged files.

        - p2p agent doctor validates registry shape, file existence, hashes, shared
        references, generic baseline, ownership conflicts, uninstall safety, and method
        behavior presence.

        - Existing projects migrate conservatively by marking known generated files
        as managed and unknown or changed files as unmanaged or drifted without overwriting
        them.

        - The .agents/skills path is used only for agent-neutral P2P skill content
        or otherwise deferred to avoid Codex/OpenCode interpretation conflicts.

        - CLI and MCP expose equivalent agent integration lifecycle operations through
        the same core behavior.

        - Existing p2p agent instructions refresh behavior remains backward compatible.'
      fragment_kind: acceptance_criteria
      truncated: false
  - id: VMC-e9fc0570edd3c9a4ca70692e
    proposal_id: PROP-044
    title: P2P MCP Server MVP
