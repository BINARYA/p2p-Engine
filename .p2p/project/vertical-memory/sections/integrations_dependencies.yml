    source_path: .p2p/proposals/PROP-095-project-runtime-contract-upgrade-lifecycle/proposal.md
    proposal_semantic_sha256: 17928b2e221350991f55e4b127a473627a45dc9da3b0f406dd09b3d762b98186
    decision_semantic_sha256: d17f5f4ade0dd04f0fd3e15570e68332029d78029fbc6958a251dbc651f889fa
    lineage:
