  - id: VMC-ad4429209bccc333c7dac666
    proposal_id: PROP-085
    title: Pluggable Project Verticals And Readiness Orchestration
    section_id: artifacts
    authority: resolved
    activation: active
    effective_state: accepted
    head_event_id: PDE-bfc14622b8e2748a30b2db0a
    head_event_type: accepted
    rationale: Accepted by owner after readiness reached decision_ready. The proposal
      defines pluggable pure-data project verticals, base_project, custom vertical
      candidate flow, project readiness review, and proposal-to-vertical traceability
      while preserving backward compatibility.
    constraints: []
    applicability: artifacts
    coverage_rationale: Makes expected and suggested project artifacts a first-class
      declarative part of each vertical package and project skeleton.
    source_path: .p2p/proposals/PROP-085-pluggable-project-verticals-and-readiness-orchestration/proposal.md
    proposal_semantic_sha256: b23b620d31b5e44535406ed884a38fcdce807cdbc8330f81e86277a692b336f2
    decision_semantic_sha256: 78b95a7dae26ba6445d034fabc2e1a951ba1a11ddcc75259011edead14d4dae3
    lineage:
      kind: null
      targets: []
    evidence:
    - id: VME-d88bb02fdcfb6db4dec516f2
      source_path: .p2p/proposals/PROP-085-pluggable-project-verticals-and-readiness-orchestration/proposal.md
      source_sha256: 36ab25a6d9c1a8f48b314d1ca65ac2ab4fafe3ffea72c0ec22b674fd5dc52036
      fragment: 'Project initialization and project readiness currently rely on domain/rubric
        defaults that are useful but too static: P2P can suggest rubric criteria,
        but it does not yet model verticals as extensible project-specific packages
        with sections, maturity rules, questions, artifacts, examples, and agent guidance.
        This risks hardcoding a finite catalog of domains inside the engine, or leaving
        agents without enough structure to proactively define what a project should
        achieve in its chosen vertical.'
      fragment_kind: problem
      truncated: false
    - id: VME-0890d33457c731f900fa1980
      source_path: .p2p/proposals/PROP-085-pluggable-project-verticals-and-readiness-orchestration/proposal.md
      source_sha256: 36ab25a6d9c1a8f48b314d1ca65ac2ab4fafe3ffea72c0ec22b674fd5dc52036
      fragment: '- Define a generic vertical package model for project init and project
        review, including sections, detail packs, rubric criteria, maturity levels,
        questions, artifacts, examples, profiles, and optional modules.

        - Teach agents, through generated/local skills, to propose project capisaldi
        and focused refinement questions when the current project vertical or readiness
        information is weak, missing, or too generic.

        - Support core defaults, external/plugin registries, and project-local custom
        verticals without requiring P2P Engine to hardcode every possible domain.

        - Allow the same flow to run during interactive project init and later through
        an explicit project readiness review command.'
      fragment_kind: goals
      truncated: false
    - id: VME-b2faeb973b6bc606387ebda1
      source_path: .p2p/proposals/PROP-085-pluggable-project-verticals-and-readiness-orchestration/proposal.md
      source_sha256: 36ab25a6d9c1a8f48b314d1ca65ac2ab4fafe3ffea72c0ec22b674fd5dc52036
      fragment: '- Do not ship a large catalog of superficial verticals in the engine.

        - Do not require all verticals to be known at build time.

        - Do not replace owner governance: the agent proposes verticals, capisaldi,
        rubric extensions, and questions, but the owner decides.

        - Do not make regulated verticals such as medical or legal authoritative without
        explicit caution, provenance, and owner responsibility.'
      fragment_kind: non-goals
      truncated: false
    - id: VME-4f2a7b73aa73f4e595a03602
      source_path: .p2p/proposals/PROP-085-pluggable-project-verticals-and-readiness-orchestration/proposal.md
      source_sha256: 36ab25a6d9c1a8f48b314d1ca65ac2ab4fafe3ffea72c0ec22b674fd5dc52036
      fragment: 'Introduce pluggable project verticals. A vertical package defines
        its id, name, version, base extension, sections, section detail packs, maturity
        levels, rubric criteria, blocking/refinement questions, artifact templates,
        examples, profiles, and optional compatible modules. P2P Engine provides a
        generic loader/validator and a project orchestrator skill that reads these
        definitions, evaluates project readiness, proposes capisaldi, creates initial
        refinement questions, and guides a one-question-at-a-time interview. Vertical
        packages are pure data packages made of text files, primarily .md and/or .yaml,
        not executable code in the MVP. They contain the project skeleton for the
        vertical: chapters, sections, topics to address, vertical-specific peculiarities,
        rubrics, questions, and useful artifacts. The minimum MVP vertical pack requires
        vertical.yml with id, name, version, description, and base/extends; project
        sections/chapters; minimal completeness/readiness rubrics; initial blocking
        questions; and expected or suggested artifacts. Examples, profiles, compatible
        modules, and rich output templates are optional in the MVP. Default vertical
        packs are distributed internally with the project/package as versioned, testable
        data resources for the MVP. The design should stay registry-ready, but an
        external registry is not part of the first slice; a later registry can expose
        REST endpoints to list available packs and fetch pack details/versions. The
        CLI remains deterministic: p2p init may ask deterministic setup questions
        and persist project/init state, but it does not launch or embody the agent.
        The proactive behavior belongs to the agent instructions. When the agent detects
        an uninitialized project, an initialization state, or missing project capisaldi
        and initial questions, it must treat that as priority context work because
        it determines project readiness. The agent should know how to initialize the
        project with the CLI, use owner answers to populate init/project objects,
        propose the vertical-derived capisaldi, save initial questions when possible,
        interview one question at a time, and return to deferred core-definition work
        unless the owner explicitly silences it. When a requested vertical is missing,
        resolution order is project-local vertical packs, core/default packs, configured
        data registry/plugin packs, then base_project fallback. The fallback is not
        passive: the agent proposes a default/base vertical, enters customization
        mode, extracts the missing vertical information from the owner, creates or
        updates a project-local custom vertical with sections/capisaldi, minimal rubrics,
        blocking questions, and expected artifacts, and uses it only after owner confirmation.
        This proposal extends and reuses the existing project rubrics and project
        maturity/readiness artifacts rather than replacing them. Vertical packs provide
        structured inputs that specialize the current system; they must not create
        a parallel maturity engine. The explicit command for later review is p2p project
        readiness review: the command goal is project readiness/context strengthening,
        while verticals are the data source used by the review. It should reuse existing
        project rubrics/maturity, read packaged and project-local verticals, identify
        missing capisaldi, produce initial or follow-up project questions, and guide
        the agent on readiness priorities. Core should start with base_project and
        a small MVP set of high-quality verticals, while additional verticals live
        in an external registry or project-local custom directory. Initial implementation
        scope is base_project plus the vertical pack loader/validator, the project
        orchestrator skill, one complete demonstration vertical, and project readiness
        review integration. The five-vertical MVP set remains a follow-up target,
        not part of the first implementation slice.'
      fragment_kind: proposal
      truncated: false
    - id: VME-d33dd345cf00e9a7d5007e91
      source_path: .p2p/proposals/PROP-085-pluggable-project-verticals-and-readiness-orchestration/proposal.md
      source_sha256: 36ab25a6d9c1a8f48b314d1ca65ac2ab4fafe3ffea72c0ec22b674fd5dc52036
      fragment: '- A pure-data vertical pack schema is defined and validated, with
        required fields for vertical metadata, sections/capisaldi, minimal readiness
        rubrics, blocking questions, and expected artifacts.

        - base_project is available as the universal fallback and existing projects
        without vertical packs continue to work with current project rubrics and maturity/readiness
        behavior.

        - Default MVP vertical packs are loaded from internal package/project resources,
        while project-local custom packs can override or extend them.

        - A project readiness review command, p2p project readiness review, reads
        vertical packs, project-local custom packs, existing rubrics/maturity state,
        and project context to identify missing capisaldi and generate prioritized
        project questions.

        - Project readiness review produces a vertical skeleton summary that maps
        vertical sections/capisaldi to relevant proposals, accepted decisions, gaps,
        risks, and unmapped proposals.

        - Generated agent/project instructions explain that missing initialization,
        capisaldi, or initial project questions are priority context work and guide
        the agent to propose, confirm, and refine project-local custom verticals.

        - The first implementation slice includes one complete demonstration vertical
        and does not require the later five-vertical set, remote registry, or executable
        plugin verticals.

        - The design remains registry-ready by keeping pack identity/version metadata
        and a loader boundary that can later support REST list/detail endpoints without
        changing project-local pack semantics.'
      fragment_kind: acceptance_criteria
      truncated: false
  - id: VMC-be41c271fcefc212ac38e2ca
    proposal_id: PROP-094
    title: P2P-Governed Software Specification Lifecycle
    section_id: artifacts
    authority: resolved
    activation: active
    effective_state: accepted
    head_event_id: PDE-b948a4d0fffef8cca8d60c06
    head_event_type: accepted
    rationale: Owner accepted after review; readiness is decision_ready with no missing
      gates or blocking questions.
    constraints: []
    applicability: artifacts
    coverage_rationale: Defines implementation specifications and downstream handoff
      files as explicit canonical or derived software-project artifacts.
    source_path: .p2p/proposals/PROP-094-p2p-governed-software-specification-lifecycle/proposal.md
    proposal_semantic_sha256: e2c4fd7e1f9f6d8efd9cd5ae8333c14c2972cc604d31e9fa72404f79343e6b73
    decision_semantic_sha256: 79da00bcc5c503fc5cd4227084bc9b9aafd1428627284cbd7ee91ed027d7eaa5
    lineage:
      kind: null
      targets: []
    evidence:
    - id: VME-2cb54e5ebdc1161ce91a6a03
      source_path: .p2p/proposals/PROP-094-p2p-governed-software-specification-lifecycle/proposal.md
      source_sha256: b941019a2bc0c682a31c8d03ff53f289f878bf6e19ac043f1cd26d6d259627e6
      fragment: 'In software projects, an owner may legitimately ask an agent to produce
        system specifications before the project is fully defined. If the agent responds
        by creating a standalone spec file immediately, that file can become the effective
        source of truth while the P2P project definition remains incomplete or bypassed.


        This is a methodological failure, not a file-placement issue alone. The problem
        is not that specs are unnecessary or always premature. The problem is that
        the software vertical should guide the definition of the parts that make a
        useful specification, and those parts should be captured through P2P proposals,
        decisions, choices, readiness, and Change Sets before a durable spec file
        is treated as authoritative.


        Without that lifecycle, the owner receives a useful-looking document, but
        future agents, readiness checks, Change Sets, exports, and project status
        may not be able to explain which governed decisions the spec reflects, which
        assumptions remain unresolved, or whether the file is only an exploratory
        draft.'
      fragment_kind: problem
      truncated: false
    - id: VME-9393a021a0bcda9c593f1498
      source_path: .p2p/proposals/PROP-094-p2p-governed-software-specification-lifecycle/proposal.md
      source_sha256: b941019a2bc0c682a31c8d03ff53f289f878bf6e19ac043f1cd26d6d259627e6
      fragment: '- Treat the need for specs as a first-class part of the software
        vertical.

        - Make specification content emerge from P2P-governed project definition,
        one or more proposals, decisions, and Change Sets.

        - Teach generated agent instructions to route "make specs" requests through
        the software vertical and P2P state instead of creating an independent durable
        file by default.

        - Clarify when a spec request should produce chat discussion, project-definition
        questions, proposal work, choices, a Change Set, a P2P-native spec, a generated
        export, or stable documentation.

        - Allow early exploratory spec outlines, but prevent them from becoming primary
        project memory unless they are captured or exported through P2P.

        - Keep user intent respected: if the owner explicitly requests a concrete
        file outside the P2P flow, the agent may create it after previewing the write
        and explaining its relationship to P2P state.

        - Reuse existing P2P primitives instead of inventing a parallel specification
        workflow.'
      fragment_kind: goals
      truncated: false
    - id: VME-3184616defad3869d5509e39
      source_path: .p2p/proposals/PROP-094-p2p-governed-software-specification-lifecycle/proposal.md
      source_sha256: b941019a2bc0c682a31c8d03ff53f289f878bf6e19ac043f1cd26d6d259627e6
      fragment: '- Do not prohibit users from explicitly requesting a concrete spec
        file.

        - Do not replace existing P2P proposal, Change Set, spec refresh, or export
        primitives.

        - Do not implement external artifact registration unless explicitly accepted
        in a separate proposal.

        - Do not require all non-software projects to follow a software-spec lifecycle.

        - Do not require agents to complete every possible project-definition question
        before drafting any useful provisional outline.

        - Do not make generated specs authoritative when they contain unresolved questions,
        inferred details, or unaccepted alternatives.'
      fragment_kind: non-goals
      truncated: false
    - id: VME-4db9c418f207a9419b562382
      source_path: .p2p/proposals/PROP-094-p2p-governed-software-specification-lifecycle/proposal.md
      source_sha256: b941019a2bc0c682a31c8d03ff53f289f878bf6e19ac043f1cd26d6d259627e6
      fragment: 'Define a software-specific specification lifecycle policy and supporting
        guidance.


        ### Core rule


        In software projects, a request for "specs" should normally activate the software
        vertical and P2P proposal flow. The final spec file is a downstream artifact.
        It is not the primary project definition and should not be created as independent
        durable memory by default.


        The software vertical should make specification readiness visible by tracking
        the parts that a useful spec needs, including:


        - product or system objective;

        - intended users and actors;

        - scope and MVP boundaries;

        - core use cases and workflows;

        - domain concepts and data model;

        - integrations and external dependencies;

        - constraints, non-functional requirements, and operating assumptions;

        - acceptance criteria and validation strategy;

        - unresolved risks, alternatives, and owner decisions.


        These parts may be defined through one proposal or through multiple proposals.
        For example, one proposal may define the MVP boundary, another may define
        the data model, another may settle an integration strategy, and another may
        define agent/MCP behavior. A software spec should be able to derive from that
        set of accepted or explicitly provisional P2P artifacts.


        ### Lifecycle


        When the owner asks for specs, the agent should classify the request and route
        it:


        | Owner request | Agent routing | Persistent artifact |

        | --- | --- | --- |

        | "Let''s think through the specs" | Discuss in chat and identify missing
        vertical fields | None, unless owner asks to persist |

        | "Help me define the system" | Capture project-definition gaps and create/update
        proposals | P2P proposal/exploration/question artifacts |

        | "Compare possible architectures" | Create alternatives, choices, or competing
        proposals | P2P proposal/choice artifacts |

        | "Prepare implementation specs" | Identify accepted direction and create/update
        a Change Set | Change Set, then P2P-native spec |

        | "Export specs for a tool" | Generate/export from P2P-native spec | Generated
        export |

        | "Create this exact file" | Preview write and explain governance status |
        Stable documentation or explicit external file |


        For exploratory or requirements-level work, readiness is advisory. The agent
        may draft a provisional outline in chat or P2P exploration material while
        clearly marking unresolved decisions.


        For implementation-oriented specs or downstream exports, readiness should
        be stricter: there should be a sufficiently accepted direction, resolved blocking
        choices, and a relevant Change Set before generating a P2P-native spec or
        export bundle. If that state is missing, the agent should guide the owner
        to define or accept the missing proposals first.


        ### Agent behavior


        Generated agent instructions should include a concrete routing rule:


        - If the owner asks for "specs" but the software vertical is incomplete, use
        the vertical to identify missing spec ingredients and ask focused questions
        or create/update P2P proposals.

        - If the required spec content spans multiple concerns, split it into multiple
        proposals or choices instead of forcing everything into one monolithic file.

        - If the owner asks for implementation specs, identify the accepted proposal
        set and relevant Change Set before generating a P2P-native software spec.

        - If the owner asks for a file export, explain whether the file is a generated
        export, stable documentation, or temporary scratch.

        - If the owner explicitly asks to operate outside P2P, respect that boundary
        while making clear that the resulting file will not be P2P-governed unless
        later registered or imported.


        Persistent writes must follow PROP-093: preview the operation, target, artifact
        kind, write class, and reason unless the owner explicitly requested the exact
        artifact.'
      fragment_kind: proposal
      truncated: false
    - id: VME-62dc6b26e00f744f29b49075
      source_path: .p2p/proposals/PROP-094-p2p-governed-software-specification-lifecycle/proposal.md
      source_sha256: b941019a2bc0c682a31c8d03ff53f289f878bf6e19ac043f1cd26d6d259627e6
      fragment: '- WHEN a project is initialized or refreshed with the software domain,
        THE SYSTEM SHALL generate agent guidance that treats specs as a downstream
        capability of the software vertical, not as an immediate standalone file-writing
        shortcut.

        - WHEN an owner asks an agent for specs in a software project, THE GENERATED
        GUIDANCE SHALL instruct the agent to classify the request as exploration,
        project definition, proposal/choice work, Change Set preparation, P2P-native
        spec generation, export, or explicit stable documentation.

        - WHEN the software vertical is incomplete and the owner asks for specs, THE
        GENERATED GUIDANCE SHALL instruct the agent to identify missing spec ingredients
        and route them into P2P project-definition questions, proposal updates, new
        proposals, or choices before creating durable implementation spec files.

        - WHEN spec content spans multiple concerns, THE GENERATED GUIDANCE SHALL
        allow and recommend multiple P2P proposals or choices rather than forcing
        all specification content into one monolithic document.

        - WHEN the owner asks for exploratory or requirements-level spec thinking,
        THE GENERATED GUIDANCE SHALL allow chat or P2P exploration/proposal material
        without requiring full readiness, while requiring unresolved assumptions and
        decisions to be marked clearly.

        - WHEN the owner asks for implementation-oriented specs or downstream exports,
        THE GENERATED GUIDANCE SHALL require a sufficiently accepted direction, resolved
        blocking choices, and a relevant Change Set before generating P2P-native specs
        or export bundles.

        - WHEN the owner explicitly asks for a concrete external spec file, THE GENERATED
        GUIDANCE SHALL allow the write only with PROP-093 action preview and with
        a clear statement whether the file is stable documentation, generated export,
        temporary scratch, or outside P2P governance.

        - Documentation SHALL explain the software-project flow from vertical definition
        to one or more proposals, choices, accepted direction, Change Set, P2P-native
        spec, and downstream export.

        - Tests SHALL verify generated guidance and documentation for spec requests,
        including the routing table, multi-proposal source model, readiness split,
        and the rule that standalone spec files are not primary untracked project
        memory.

        - The first implementation slice SHALL reuse existing proposal, readiness,
        choice, change, spec, and spec export primitives unless a later accepted proposal
        adds external artifact registration or new spec lifecycle commands.'
      fragment_kind: acceptance_criteria
      truncated: false
  - id: VMC-ba4af4d1a84807ae945131a6
    proposal_id: PROP-099
    title: Project Output Lifecycle and Retention Policy
    section_id: artifacts
    authority: resolved
    activation: active
    effective_state: accepted
    head_event_id: PDE-5ef0ae2e007f0b6e55b94013
    head_event_type: accepted
    rationale: Owner accepts the decision-ready human project publication pipeline
      as the direction for readable, vertical-aware project outputs.
    constraints: []
    applicability: artifacts
    coverage_rationale: Defines complete export, curated Markdown, validation result,
      owner-review outcome, PDF, and later publication manifests as explicit deliverables.
    source_path: .p2p/proposals/PROP-099-project-output-lifecycle-and-retention-policy/proposal.md
    proposal_semantic_sha256: 3aa087de6987ac5c32fb7d5b02fbb029285939caa588e67a70ac2bab33523541
    decision_semantic_sha256: a7eef08e06ed144e46cadc58b7e14050adef348f31a97e99dacbc1d5c3a1616e
    lineage:
      kind: null
      targets: []
    evidence:
    - id: VME-e59661e429785a0227a72c3a
      source_path: .p2p/proposals/PROP-099-project-output-lifecycle-and-retention-policy/proposal.md
      source_sha256: 8581dbc712f8378cb6f8b35c129a8a31c505eff83be25acea6d4ef0a22ebbdbc
      fragment: 'P2P Engine can already transform governed project memory, including
        ideas, contributions, proposals, decisions, readiness, verticals, Change Sets,
        Work items, risks, assumptions, and requirements, into a visible project export.
        That export is complete, traceable, useful as consolidated memory, and derived
        from the managed .p2p state. The problem is that completeness and editorial
        readability are different goals. The current export still reflects the internal
        P2P memory structure: proposal-oriented organization, repeated sections, detailed
        governance blocks, empty placeholders, long lists of requirements and risks,
        and historical information mixed with current project state. An owner, stakeholder,
        contributor, or implementer should not need to reconstruct the project by
        reading many proposals and internal artifacts. The project needs a human publication
        pipeline that transforms complete governed memory into a readable, project-first,
        publishable document.'
      fragment_kind: problem
      truncated: false
    - id: VME-7cd53531e3428369bf9c8bf5
      source_path: .p2p/proposals/PROP-099-project-output-lifecycle-and-retention-policy/proposal.md
      source_sha256: 8581dbc712f8378cb6f8b35c129a8a31c505eff83be25acea6d4ef0a22ebbdbc
      fragment: '- Define a Human Project Publication Pipeline from governed P2P state
        to complete export, curated Markdown, publication validation, and neutral
        PDF.

        - Keep deterministic export, semantic curation, owner review, publication
        validation, and PDF rendering as independent and inspectable stages.

        - Make the curated document project-first, vertical-aware, traceable, and
        readable by humans who do not know P2P internals.

        - Define an incremental implementation path with a minimal end-to-end slice
        first and richer CLI orchestration, publication packages, profiles, and themes
        later.'
      fragment_kind: goals
      truncated: false
    - id: VME-555ec2cebc9475e511f15446
      source_path: .p2p/proposals/PROP-099-project-output-lifecycle-and-retention-policy/proposal.md
      source_sha256: 8581dbc712f8378cb6f8b35c129a8a31c505eff83be25acea6d4ef0a22ebbdbc
      fragment: '- Do not make generated outputs a new source of truth; .p2p remains
        governed project memory.

        - Do not make the curator decide governance outcomes, readiness, implementation
        status, or owner choices.

        - Do not replace the P2P-native software specification lifecycle, OpenSpec,
        Spec Kit, or downstream implementation exports.

        - Do not require a fully deterministic curator in the first slice; semantic
        curation may be agentic but must be bounded by contracts and validation.

        - Do not introduce multiple themes, branding, visual editors, template marketplaces,
        sophisticated appendices, automatic permanent replacement of project.md, or
        full MCP parity in the first slice.'
      fragment_kind: non-goals
      truncated: false
    - id: VME-970c56539363ae097e9f4302
      source_path: .p2p/proposals/PROP-099-project-output-lifecycle-and-retention-policy/proposal.md
      source_sha256: 8581dbc712f8378cb6f8b35c129a8a31c505eff83be25acea6d4ef0a22ebbdbc
      fragment: 'Define PROP-099 as the Human Project Publication Pipeline. The target
        pipeline is: .p2p managed state to p2p project export to complete project.md,
        then p2p-project-curator skill to project.curated.md, then publication validation,
        then owner review, then neutral PDF renderer to project.pdf. The pipeline
        must remain explicitly separated into independently reviewable stages. The
        complete export, curated Markdown, validation result, owner review outcome,
        and rendered PDF should each have clear boundaries so a single stage can be
        inspected, revised, replaced, or improved without collapsing the whole flow.
        The existing deterministic export continues to be complete, traceable, regenerable,
        and close to P2P state. The curator is an agentic semantic editor and is expected
        to be the primary quality driver for a comprehensible project document: it
        identifies the central project thesis, reads the active vertical and project
        definition, adapts structure to the domain, builds a robust narrative thread
        around the selected vertical and its peculiarities, groups proposals by capability,
        separates current state from history, distinguishes accepted, implemented,
        planned, partial, pending, missing, and legacy evidence, removes placeholders
        and repetition, moves excessive detail to appendices where appropriate, preserves
        risks and open questions, and maintains traceability. The first slice should
        use a minimal publication profile to bound variability: audience mixed, depth
        standard, language project_default, vertical_structure adaptive, include_appendix
        false by default, and theme neutral-v1. Deterministic stages provide input
        discipline, contracts, validation, archival behavior, and rendering; they
        bound and review the curator output, but they must not replace the semantic
        editorial work. The publication validator is mostly deterministic and checks
        the document contract: one H1, coherent headings, executive summary, no known
        placeholders in the main body, no wholesale proposal dumps in the main text,
        explicit separation of project state and implementation state, accepted/planned/pending/missing
        distinctions, source-of-truth warning, traceability, vertical-compatible structure,
        and Markdown suitable for PDF rendering. The neutral PDF renderer consumes
        only validated curated Markdown and handles presentation, not content. The
        first implementation should be an end-to-end minimal slice: valid installable
        p2p-project-curator skill, compact-surfaces-first input discipline, vertical-aware
        structure, output project.curated.md, minimal publication validation, neutral
        project.pdf, manual owner review, traceability, and no direct .p2p mutation.
        Later slices may add CLI orchestration such as project publish prepare, validate,
        render, and status; publication packages such as project.full.md, project.md,
        project.appendix.md, project.pdf, publication-manifest.yml, and render-report.yml;
        and richer publication profiles for audience, depth, language, vertical structure,
        appendix inclusion, and theme.'
      fragment_kind: proposal
      truncated: false
    - id: VME-7182ca48a5ce0a3957fcc8e2
      source_path: .p2p/proposals/PROP-099-project-output-lifecycle-and-retention-policy/proposal.md
      source_sha256: 8581dbc712f8378cb6f8b35c129a8a31c505eff83be25acea6d4ef0a22ebbdbc
      fragment: '- The proposal defines the Human Project Publication Pipeline and
        clearly separates governed content, deterministic complete export, agentic
        editorial curation, publication validation, owner review, and PDF rendering.

        - Each pipeline stage is independently reviewable: complete export, curated
        Markdown, validation result, owner review outcome, and rendered PDF have explicit
        boundaries and artifacts or reports.

        - The proposal defines the first implementation slice: installable p2p-project-curator
        skill, compact-surfaces-first input discipline, vertical-aware curation, project.curated.md,
        minimal deterministic publication validation, neutral project.pdf, manual
        owner review, traceability, and no direct .p2p mutation.

        - The proposal defines the agentic curator as the primary quality driver for
        human comprehensibility, vertical-specific narrative, capability grouping,
        repetition removal, and robust project-first flow.

        - The proposal defines deterministic stages as boundaries and controls around
        curation: input discipline, contracts, validation, archival behavior, and
        presentation-only rendering.

        - The proposal defines a minimal publication profile for the first slice:
        audience mixed, depth standard, language project_default, adaptive vertical
        structure, appendix disabled by default, and neutral-v1 theme.

        - The proposal defines status vocabulary for accepted, implemented, planned,
        partial, pending owner decision, missing evidence, legacy or not assessed,
        advisory, and blocked material.

        - The proposal defines that project.md remains the complete export in the
        first slice, while project.curated.md is the owner-review candidate and project.pdf
        is rendered from the curated validated Markdown.

        - The proposal defines a later migration path where project.full.md preserves
        the complete export, project.md may become the curated human document, and
        publication metadata or appendices may be added.

        - The proposal defines publication validation quality gates for headings,
        placeholders, executive summary, proposal dump avoidance, project versus implementation
        status separation, traceability, source-of-truth warning, vertical fit, and
        PDF-ready Markdown.

        - The proposal defines that the PDF renderer is neutral and presentation-only:
        it must not rewrite content, remove sections, alter evidence status, modify
        decisions, or reinterpret readiness.

        - The proposal defines alternatives, tradeoffs, risks, assumptions, impact
        with PROP-083, and out-of-scope boundaries for software-spec and downstream
        export workflows.'
      fragment_kind: acceptance_criteria
      truncated: false
  - id: VMC-9e55d1d5fdcab77641428378
    proposal_id: PROP-101
