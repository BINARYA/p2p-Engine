  definition:
    status: complete
    fields:
      summary:
        value: Required canonical artifacts are runtime and workspace-schema contracts,
          project manifest, software vertical selection and lock, project definition,
          domain, permissions and governed proposal/decision/change/work state. Required
          migration artifacts are reviewed definition patches, complete impact/conflict
          correction sets, approved vertical-coverage records with artifact-state
          provenance, and implementation evidence. Derived deliverables are registries,
          rationalized project projections, decision-context index, progress/assessment/maturity
          views, operational brief and next actions, software specifications and exports,
          and the staged project publication packet, curated document, validation,
          render and owner-review record where applicable.
        source: README.md+docs/WORKSPACE-MIGRATION.md+specs/features/workspace-schema-versioning-and-legacy-migration/tasks.md
