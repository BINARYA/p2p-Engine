    constraints: []
    applicability: artifacts
    coverage_rationale: Introduces a versioned canonical decision-event ledger and
      compatible current-status and human-readable decision projections.
    source_path: .p2p/proposals/PROP-102-proposal-decision-revision-and-revocation-lifecycle/proposal.md
    proposal_semantic_sha256: 87c69d8a92dd62ac2ea47b6d020cee70dc8c2efaf159d68fc884322e9448131c
    decision_semantic_sha256: 9515a8ba8394a52c529447f48a92829513ccce7127ce2a5378dc8f551374fc13
    lineage:
      kind: null
      targets: []
    evidence:
    - id: VME-43062e3e83542d81e50ad6bf
      source_path: .p2p/proposals/PROP-102-proposal-decision-revision-and-revocation-lifecycle/proposal.md
      source_sha256: 438da30da1aaf991adc2c4873260c253862f5c7292bdb64807e43030267eb16d
      fragment: 'P2P currently represents a proposal decision primarily as one current
        outcome.

        The decision write path replaces `decision.md` and then replaces the status
        in

        `proposal.md`, without validating the previous lifecycle state or preserving
        a

        queryable sequence of owner decisions.


        As a result, an accepted proposal can be rewritten as rejected. The current

        workspace then appears to say that the proposal was never adopted, even though

        it may already have influenced project definition, Change Sets, Work,

        specifications, implementation, publication and later decisions. Git can

        recover earlier bytes, but normal validation, retrieval and derived-state

        consumers do not use Git history as the proposal decision model.


        The model also lacks a precise distinction between rejection before adoption,

        withdrawal before decision, revocation after acceptance, replacement,

        reinstatement and downstream deprecation. Without that distinction, future

        decision-memory consolidation cannot reliably determine which decisions are

        active, historical, previously active, replaced or merely deferred.'
      fragment_kind: problem
      truncated: false
    - id: VME-ea9c54a4d313f4621a7a4cfd
      source_path: .p2p/proposals/PROP-102-proposal-decision-revision-and-revocation-lifecycle/proposal.md
      source_sha256: 438da30da1aaf991adc2c4873260c253862f5c7292bdb64807e43030267eb16d
      fragment: "- Preserve an append-only, queryable history of proposal decision\
        \ events,\n  including rationale, owner authority, date, predecessor and lineage.\n\
        - Derive current proposal status and authority deterministically from the\
        \ valid\n  event sequence.\n- Define an exhaustive transition matrix with\
        \ exact retry, invalid transition\n  and reconsideration behavior.\n- Distinguish\
        \ initial rejection from withdrawal, revocation, supersession,\n  reinstatement\
        \ and downstream deprecation.\n- Make decision mutations owner-controlled,\
        \ previewed, source-bound,\n  stale-safe, atomic, idempotent where appropriate\
        \ and recoverable.\n- Keep current CLI and human-readable status views available\
        \ as projections\n  during a forward compatibility transition.\n- Migrate\
        \ current single-decision artifacts without inventing missing owner\n  evidence\
        \ or erasing legacy values.\n- Propagate lifecycle authority consistently\
        \ to validation, registries,\n  project projections, decision context, relations,\
        \ vertical evidence, Change\n  Sets, Work, software specifications, next actions\
        \ and publication.\n- Produce explicit impact and remediation guidance without\
        \ automatically\n  changing dependent owner-controlled lifecycles.\n- Establish\
        \ the stable authority and lineage contract required by future\n  thematic\
        \ decision-memory consolidation."
      fragment_kind: goals
      truncated: false
    - id: VME-689bd9fd5d8f1065457d75d1
      source_path: .p2p/proposals/PROP-102-proposal-decision-revision-and-revocation-lifecycle/proposal.md
      source_sha256: 438da30da1aaf991adc2c4873260c253862f5c7292bdb64807e43030267eb16d
      fragment: "- Physically delete accepted, rejected, revoked or superseded proposals.\n\
        - Rewrite history so that a previously accepted decision appears never to\
        \ have\n  been active.\n- Automatically roll back source code, deployments,\
        \ completed Change Sets,\n  Work or external effects.\n- Automatically cancel,\
        \ supersede, complete or reopen dependent lifecycle\n  objects.\n- Implement\
        \ thematic proposal compaction, persistent decision-context caching\n  or\
        \ publication curator refinement.\n- Treat `deprecated` as another proposal\
        \ decision outcome.\n- Allow an agent-supplied actor string to establish owner\
        \ authority.\n- Conflate proposal-decision rejection with managed proposal-branch\
        \ rejection."
      fragment_kind: non-goals
      truncated: false
    - id: VME-b129ff83eb9d0f84c5bc6e45
      source_path: .p2p/proposals/PROP-102-proposal-decision-revision-and-revocation-lifecycle/proposal.md
      source_sha256: 438da30da1aaf991adc2c4873260c253862f5c7292bdb64807e43030267eb16d
      fragment: '### Decision Event Model


        Introduce one versioned canonical decision-event ledger per proposal. The

        ledger is the semantic source for proposal decision history. `proposal.md`

        status and the human-readable current decision remain compatible projections

        of the ledger rather than independent authority sources.


        Every event must include enough structured data to validate and reconstruct
        the

        lifecycle:


        - schema and event identity;

        - proposal identity;

        - event type and resulting effective state;

        - rationale;

        - owner/approver identity and validated authority provenance;

        - canonical decision date;

        - predecessor event identity and integrity evidence;

        - semantic fingerprint of the decision being affected;

        - optional replacement, split or merge lineage;

        - optional impact-preview binding;

        - migration provenance when derived from a legacy artifact.


        Audit timestamps, file mtimes and Git author metadata must not determine event

        identity or manufacture owner evidence. The design will define the exact file

        name, serialization, predecessor/hash protection and recovery format. Replacing

        the single-ledger direction requires explicit technical evidence.


        ### Effective State Projection


        Current status, decision authority and active/historical classification are

        derived from the validated event head and lineage. A stored projection that

        does not match the ledger is stale or invalid; it cannot silently override
        the

        ledger.


        The public vocabulary has distinct meanings:


        | Event or state | Preconditions | Effective result |

        | --- | --- | --- |

        | `accepted` | Proposal has never been active, or exact retry | Active |

        | `accepted_with_changes` | Proposal has never been active, or exact retry
        | Active and qualified |

        | `deferred` | Proposal is undecided, or exact retry | Unresolved |

        | `withdrawn` | Proposal has never been active | Historical, never active
        |

        | `rejected` | Proposal has never been active | Historical, never active |

        | `revoked` | Current authority is accepted or conditionally accepted | Historical,
        previously active |

        | `superseded` | Current authority is active and replacement lineage is valid
        | Historical with explicit replacement |

        | `split` | Valid explicit split targets exist | Historical with split lineage
        |

        | `merged_into_other` | Valid explicit merge target exists | Historical with
        merge lineage |

        | `reinstated` | Exact previously revoked decision is restored | Returns to
        the referenced prior active authority |


        `deprecated` belongs to downstream operational policy and cannot be used to

        replace a proposal decision event.


        Rejected or withdrawn proposals are reconsidered through a new linked proposal.

        A revoked decision may be reinstated only when:


        - its semantic fingerprint is identical to the referenced prior decision;

        - the revocation event is referenced explicitly;

        - a current impact preview is bound to the operation;

        - owner authority is validated again;

        - no dependent technical effect is assumed to be restored.


        Any changed content, condition or constraint requires a new linked proposal.


        ### Transition And Retry Rules


        The implementation specification must provide a complete matrix for every

        current state and requested event. Invalid transitions fail before writes.


        Repeating the exact same operation with the same source head, semantic payload,

        owner authority and idempotency identity returns the already-applied result.

        Reusing an operation identity with different inputs, applying against a changed

        head or attempting to reorder history fails with a stable diagnostic.


        The model must also specify:


        - whether an event is terminal or may have a later valid successor;

        - required lineage fields;

        - no-op and exact-retry behavior;

        - stale preview behavior;

        - concurrent-head conflict behavior;

        - recovery after interruption;

        - explicit repair behavior for corrupted or divergent projections.


        ### Governed Mutation


        All decision writes use one domain service shared by CLI and permission-gated

        MCP. A write requires:


        1. validated owner'
      fragment_kind: proposal
      truncated: true
    - id: VME-dd21ed9fafc64cab882a65da
      source_path: .p2p/proposals/PROP-102-proposal-decision-revision-and-revocation-lifecycle/proposal.md
      source_sha256: 438da30da1aaf991adc2c4873260c253862f5c7292bdb64807e43030267eb16d
      fragment: "- The public model defines mutually exclusive semantics for withdrawal,\n\
        \  rejection, revocation, supersession, reinstatement and downstream\n  deprecation.\n\
        - A versioned canonical ledger preserves every valid decision event; supported\n\
        \  operations cannot overwrite, delete or reorder prior history.\n- Current\
        \ proposal status and current-decision views are deterministic\n  projections\
        \ and validation detects divergence.\n- The specification contains an exhaustive\
        \ state/event transition matrix,\n  including prerequisites, lineage, exact\
        \ retry, no-op and prohibited cases.\n- Initial rejection is allowed only\
        \ before adoption; reversing an accepted\n  decision records revocation or\
        \ supersession and preserves the acceptance.\n- Reinstatement is accepted\
        \ only for an identical semantic fingerprint, a\n  referenced revocation,\
        \ current impact preview and new owner authorization.\n- Changed content,\
        \ conditions or constraints require a new linked proposal.\n- Authority-changing\
        \ operations require owner authority, source-bound preview,\n  confirmation,\
        \ unchanged preconditions, locking and atomic replacement.\n- Exact retries\
        \ are idempotent; divergent token reuse, concurrent heads and\n  stale sources\
        \ fail without partial writes.\n- CLI and permission-gated MCP call the same\
        \ lifecycle service and expose\n  equivalent results and diagnostics.\n- Proposal-decision\
        \ rejection and managed-branch rejection remain separate and\n  cannot trigger\
        \ each other implicitly.\n- Revocation impact preview identifies active and\
        \ completed dependencies,\n  affected authority, stale artifacts and explicit\
        \ remediation options.\n- Revocation does not automatically mutate Change\
        \ Set, Work, specification,\n  implementation, deployment or external lifecycle\
        \ state.\n- Revoked, rejected, withdrawn, split, merged and superseded decisions\
        \ remain\n  available as correctly labelled historical context.\n- Inactive\
        \ decisions are excluded from active project projections and cannot be\n \
        \ rendered as current constraints.\n- Existing single-decision workspaces\
        \ remain readable and have a deterministic,\n  registered, forward-only migration\
        \ to the next workspace schema.\n- Migration preserves valid legacy values,\
        \ represents missing or malformed data\n  as `unknown_legacy`, retains provenance\
        \ and never infers owner evidence from\n  Git metadata.\n- Ambiguous legacy\
