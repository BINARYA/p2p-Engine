  section:
    id: users_and_actors
    title: Users And Actors
    purpose: Intended users, actors, operators, and stakeholders.
    required: true
    priority: 120
  definition:
    status: complete
    fields:
      operator_roles:
        value: The owner decides governance actions; maintainers and contributors
          operate repositories and releases; agents and MCP clients perform bounded
          reads and authorized writes; CI, Git providers, and downstream specification
          tools are external actors.
        source: README.md+.p2p/project/permissions.yml
      primary_users:
        value: Humans supervising software-project decisions and AI coding or planning
          agents that consume P2P through the CLI or MCP are the primary users; solo
          developers, small teams, and maintainers use the same workflows.
        source: README.md
    required_field_ids:
    - primary_users
