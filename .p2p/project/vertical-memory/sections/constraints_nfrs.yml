    evidence:
    - id: VME-8e1cd9c06d57e32d85fbe768
      source_path: .p2p/proposals/PROP-101-project-readiness-convergence-workflow/proposal.md
      source_sha256: 571e497d3cd674f63f015addcf90aa66bf0356e310f666d3bdc218bf5759da0e
      fragment: 'P2P Engine can diagnose project readiness but cannot yet drive a
        project from a diagnosed vertical gap to an auditable owner-reviewed update.
        The current review identifies incomplete capisaldi, declared evidence and
        unmapped proposals, but its convergence behavior is incomplete:


        - it returns generic advice to complete the definition and rerun the review;

        - some required incomplete sections have no applicable generated question;

        - there is no persistent project-level question lifecycle equivalent to the
        proposal-question workflow;

        - owner answers are not connected to a governed candidate project-definition
        patch;

        - project-definition gaps are not coherently prioritized in managed next actions;

        - large legacy proposal lists are emitted without bounded detail or prioritization;

        - progress, readiness and freshness expose useful but separate states without
        an orchestration contract that closes the loop.


        The result is a system that knows what is incomplete but still depends on
        an agent or owner to reconstruct the next workflow manually across multiple
        commands and sessions.


        The implementation risk is broader than question generation. A naive implementation
        could create competing authority between project-question state, project definition,
        decision context, managed next actions and workspace migration state. It could
        also reuse the existing single-file definition apply in a way that leaves
        question and definition state partially committed, or register a v1-to-v2
        migration while still executing the current legacy-to-v1 bootstrap planner.'
      fragment_kind: problem
      truncated: false
    - id: VME-4144a719c351590589d22d8d
      source_path: .p2p/proposals/PROP-101-project-readiness-convergence-workflow/proposal.md
      source_sha256: 571e497d3cd674f63f015addcf90aa66bf0356e310f666d3bdc218bf5759da0e
      fragment: '- Model project-readiness gaps as typed, prioritized and explainable
        records.

        - Give each actionable required-section gap a declared question, a safe deterministic
        fallback or an explicit no-question diagnostic.

        - Persist project-question lifecycle state, revisions, authority and provenance
        across sessions.

        - Keep question answers distinct from applied project definition and owner
        decisions.

        - Render owner-reviewable candidate definition patches and commit definition
        plus question state through one transaction.

        - Integrate the highest-priority project gap into managed next actions.

        - Preserve independent definition completeness and declared evidence coverage.

        - Keep CLI and MCP contracts deterministic, bounded and semantically aligned.

        - Preserve schema-v1 valid operations and provide a real transition-specific
        v1-to-v2 migration.

        - Reconcile project questions safely across vertical revisions without re-opening
        or losing owner evidence.

        - Preserve `PROP-100` authority by keeping unapplied question state non-semantic.

        - Validate generic behavior against this repository without embedding repository-specific
        policy.'
      fragment_kind: goals
      truncated: false
    - id: VME-06bc3330b93fc264be61867c
      source_path: .p2p/proposals/PROP-101-project-readiness-convergence-workflow/proposal.md
      source_sha256: 571e497d3cd674f63f015addcf90aa66bf0356e310f666d3bdc218bf5759da0e
      fragment: '- Agents do not make owner decisions, fabricate owner answers, validate
        assumptions, complete sections, accept proposals or approve publication.

        - This proposal does not replace proposal readiness or proposal questions.

        - It does not create a second project definition, maturity, progress, next-action,
        decision-context or freshness engine.

        - It does not automatically declare vertical coverage for legacy proposals.

        - Heuristic matches never become owner-declared evidence automatically.

        - It does not introduce database-backed persistence, a remote registry or
        hosted orchestration.

        - It does not perform automatic agent curation, publication review or vertical
        upgrades.

        - It does not remove schema-v1 compatibility, migrate implicitly or bypass
        the workspace migration lifecycle.

        - It does not use clock-based preview expiry without an explicit durable preview-receipt
        contract.

        - It does not treat migration absence of a legacy question as evidence that
        a question was answered or applied.'
      fragment_kind: non-goals
      truncated: false
    - id: VME-07c4d9c35555fb592d73de1e
      source_path: .p2p/proposals/PROP-101-project-readiness-convergence-workflow/proposal.md
      source_sha256: 571e497d3cd674f63f015addcf90aa66bf0356e310f666d3bdc218bf5759da0e
      fragment: 'Introduce a `Project Readiness Convergence` application service above
        the project vertical, definition, question-state, permission, migration, next-action,
        progress, freshness and decision-context services. It owns orchestration and
        result composition, while existing services retain authority over their canonical
        data.


        The convergence service must be request-scoped or explicitly invalidated.
        It must load one immutable source snapshot and must not retain stale definition,
        lock, question, evidence or schema state through the memoized workspace service
        facade.


        ### Contract 1 - Typed Gap Inventory


        A gap record must include at least:


        - stable gap id and policy version;

        - snapshot fingerprint;

        - vertical id, version, lock checksum and section id;

        - gap kind, severity, applicability and lifecycle condition;

        - definition status and missing fields;

        - declared evidence references and separately labelled heuristic suggestions;

        - assumption, blocker or owner-decision state when applicable;

        - required authority and whether owner input is needed;

        - current question reference and revision, if any;

        - deterministic next operation and explanation;

        - source hashes needed for stale detection.


        Initial gap classes must distinguish:


        - blocked required section;

        - unresolved owner decision;

        - incomplete required project definition;

        - assumption requiring validation;

        - answered question not yet applied;

        - stale or incompatible question/definition state;

        - optional declared-evidence curation;

        - informational legacy or heuristic state.


        Priority is versioned, deterministic and explainable. The order confirmed
        in Q004 is:


        1. integrity, compatibility and authority blockers plus explicit owner-decision
        blockers;

        2. owner answers already received but not yet applied;

        3. incomplete required definition sections;

        4. assumptions to validate ordered by declared dependency impact;

        5. optional declared-evidence curation;

        6. informational legacy state.


        Within one class, vertical section priority and stable gap or question id
        provide tie-breaking. Results expose class, rationale and tie-break inputs
        instead of an opaque aggregate score. Missing dependency metadata must use
        a documented neutral fallback and must not be inferred from free text.


        ### Contract 2 - Project-Question Persistence And Identity


        Project questions are distinct from proposal questions. They are linked to
        active vertical sections and project-definition gaps, not to proposal readiness
        criteria.


        Workspace schema v2 owns one registered project-question artifact contract
        at a deterministic engine-managed location. The exact path, root key and artifact
        schema version must be declared in feature specifications and owned by one
        `ProjectQuestionStateService`; callers and adapters may not derive alternate
        paths.


        Each record preserves:


        - stable question id and stable identity key;

        - question revision and presentation-text hash;

        - group and gap id;

        - vertical section and target field, assumption, blocker or owner-decision
        reference;

        - priority and rationale;

        - declared, deterministic-fallback or migrated-legacy source type;

        - source vertical id/version/checksum and fallback policy version;

        - current lifecycle state and applicability;

        - answer revisions, provided-by authority, recorded-by actor and provenance;

        - created, updated, answered, applied and terminal timestamps;

        - apply operation, preview and definition references;

        - transition history and supersession links.


        Stable identity is based on semantic target, not wording or audit timestamps.
        It includes vertical id, section id, gap kind, target field or domain object,
        and declared question id or deterministic fallback key. Vertical checksum,
        wording hash and policy version identify a revision but do not by themselves
        create a new identity.


        Wording-only changes preserve identity, answer and lifecycle state while appending
        a revision. A changed semantic target creates a replacement and supersedes
        the old question. Reassessment cannot reopen cl'
      fragment_kind: proposal
      truncated: true
    - id: VME-f1697d3e0d10afbe5607fa81
      source_path: .p2p/proposals/PROP-101-project-readiness-convergence-workflow/proposal.md
      source_sha256: 571e497d3cd674f63f015addcf90aa66bf0356e310f666d3bdc218bf5759da0e
      fragment: '1. Readiness returns deterministic typed gaps with explicit kind,
        severity, authority, evidence basis, snapshot fingerprint and next operation.

        2. Blockers, definition gaps, assumptions, answered-not-applied work, optional
        evidence and informational legacy state remain distinguishable.

        3. Every required incomplete section produces an applicable declared/fallback
        question or `no_safe_question` diagnostic.

        4. Project-question state persists lifecycle, revision, provenance, authority
        and history without conflation with proposal questions.

        5. Stable identity excludes wording and audit timestamps; wording-only reassessment
        cannot reopen or duplicate work.

        6. A documented transition matrix rejects invalid states before writes and
        defines authority for every mutation.

        7. Caller-controlled `source=owner` or actor strings cannot create owner-confirmed
        answer authority by themselves.

        8. Answers do not change definition, validate assumptions or resolve owner
        decisions by themselves.

        9. Candidate preview includes semantic diff, affected gaps, both candidate
        hashes and all canonical source preconditions without writing state.

        10. Apply requires owner authority and a token bound to actor, definition,
        question state, vertical lock, both candidates and policy versions.

        11. Definition and question state commit through one multi-target transaction;
        sequential canonical commits are not used.

        12. Failure injection proves no committed definition can reference an unapplied
        question and no applied question can lack its definition commit.

        13. Exact retry after a successful commit returns `already_applied`; divergent
        token reuse, changed locks and changed sources are rejected.

        14. Audit timestamps and generated observation times do not destabilize semantic
        hashes or retries.

        15. Vertical reconciliation preserves wording-only revisions, supersedes semantic
        changes, retires removed targets and never copies answers automatically.

        16. Managed next actions surface the highest-priority actionable project gap
        with stable deduplication and no self-loop when a concrete operation exists.

        17. Deferred and muted questions suppress re-ask according to policy without
        hiding residual project gaps.

        18. Definition completeness and declared evidence coverage remain independent;
        question counts do not become an aggregate readiness percentage.

        19. Freshness reports downstream impact and never auto-runs refresh, curation,
        publication or owner review.

        20. Project-question sources are cataloged as inactive metadata/evidence until
        definition apply and cannot create active decisions or duplicate applied content.

        21. Default CLI/MCP output is bounded; full legacy/history detail requires
        explicit limit and snapshot-bound pagination.

        22. A cursor used against a changed snapshot returns `stale_cursor` rather
        than inconsistent continuation.

        23. A v2 runtime distinguishes undeclared v0, upgradeable v1, current v2,
        ahead, invalid and recovery-required workspaces.

        24. Migration planning dispatches transition-specific handlers; v1-to-v2 never
        executes legacy-to-v1 bootstrap ownership.

        25. The v1-to-v2 transition is registered, forward-only, dry-run plannable,
        transactional, idempotent and recoverable.

        26. Every valid legacy open question is preserved once with section-scoped
        identity; absence never fabricates an answered/applied state.

        27. Ambiguous legacy ids, sections, fields, statuses or texts produce typed
        blocking diagnostics without partial migration.

        28. The v1-to-v2 transaction copies legacy questions and normalizes definition
        `open_questions` to empty atomically; v2 validation rejects their reintroduction
        and only the dedicated artifact remains authoritative.

        29. Every v1-valid read/write remains available and each v2-dependent operation
        is blocked centrally before writes with actionable migration diagnostics.

        30. Fresh v2 workspace initialization and later vertical selection create/reconcile
        valid question state without implicit owner content.

        31. CLI and MCP read payloads a'
      fragment_kind: acceptance_criteria
      truncated: true
