vertical_memory_section:
  schema_version: 1
  section:
    id: constraints_nfrs
    title: Constraints And Non-Functional Requirements
    purpose: Constraints, performance, reliability, privacy, security, and operating
      assumptions.
    required: true
    priority: 170
  definition:
    status: complete
    fields:
      constraints:
        value: P2P Engine remains a local, Git-native, file-backed Python application.
          Canonical project memory uses structured Markdown and YAML under .p2p and
          governed mutations must use supported CLI or explicit write-safe MCP primitives;
          owner authority, role policy and consent gates cannot be bypassed. Runtime
          compatibility and workspace-schema compatibility remain independent versioned
          contracts. Schema migrations are forward-only, preserve unknown and legacy
          artifacts by default, and must not install, upgrade or downgrade the runtime.
          The supported runtime is Python 3.11 or newer, and repository migration
          must not depend on network access.
        source: AGENTS.md+docs/WORKSPACE-MIGRATION.md+pyproject.toml
      non_functional_requirements:
        value: Read-only status, context, suggestion and planning operations must
          be deterministic, bounded and free of persistent writes. Multi-file mutations
          must validate complete candidates, enforce actor authority and fresh preview/source
          hashes, commit atomically with durable file and directory handling, and
          expose rollback or recovery instead of hiding partial failure. Context retrieval
          and workspace inventory must avoid unbounded repeated scans. Canonical and
          derived state must retain provenance, lifecycle authority, freshness and
          diagnostic visibility. CLI and MCP representations must remain compatible
          where both surfaces exist, while privileged or unsupported writes remain
          unavailable rather than silently emulated.
        source: AGENTS.md+specs/features/workspace-schema-versioning-and-legacy-migration/design.md
    required_field_ids:
    - constraints
    - non_functional_requirements
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
