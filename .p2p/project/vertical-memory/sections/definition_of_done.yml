      while preserving backward compatibility.
    constraints: []
    applicability: definition_of_done
    coverage_rationale: Makes vertical completeness and readiness criteria the basis
      for determining missing capisaldi and actionable project state.
    source_path: .p2p/proposals/PROP-085-pluggable-project-verticals-and-readiness-orchestration/proposal.md
    proposal_semantic_sha256: b23b620d31b5e44535406ed884a38fcdce807cdbc8330f81e86277a692b336f2
    decision_semantic_sha256: 78b95a7dae26ba6445d034fabc2e1a951ba1a11ddcc75259011edead14d4dae3
    lineage:
      kind: null
      targets: []
    evidence:
    - id: VME-d88bb02fdcfb6db4dec516f2
      source_path: .p2p/proposals/PROP-085-pluggable-project-verticals-and-readiness-orchestration/proposal.md
      source_sha256: 36ab25a6d9c1a8f48b314d1ca65ac2ab4fafe3ffea72c0ec22b674fd5dc52036
      fragment: 'Project initialization and project readiness currently rely on domain/rubric
        defaults that are useful but too static: P2P can suggest rubric criteria,
        but it does not yet model verticals as extensible project-specific packages
        with sections, maturity rules, questions, artifacts, examples, and agent guidance.
        This risks hardcoding a finite catalog of domains inside the engine, or leaving
        agents without enough structure to proactively define what a project should
        achieve in its chosen vertical.'
      fragment_kind: problem
      truncated: false
    - id: VME-0890d33457c731f900fa1980
      source_path: .p2p/proposals/PROP-085-pluggable-project-verticals-and-readiness-orchestration/proposal.md
      source_sha256: 36ab25a6d9c1a8f48b314d1ca65ac2ab4fafe3ffea72c0ec22b674fd5dc52036
      fragment: '- Define a generic vertical package model for project init and project
        review, including sections, detail packs, rubric criteria, maturity levels,
        questions, artifacts, examples, profiles, and optional modules.

        - Teach agents, through generated/local skills, to propose project capisaldi
        and focused refinement questions when the current project vertical or readiness
        information is weak, missing, or too generic.

        - Support core defaults, external/plugin registries, and project-local custom
        verticals without requiring P2P Engine to hardcode every possible domain.

        - Allow the same flow to run during interactive project init and later through
        an explicit project readiness review command.'
      fragment_kind: goals
      truncated: false
    - id: VME-b2faeb973b6bc606387ebda1
      source_path: .p2p/proposals/PROP-085-pluggable-project-verticals-and-readiness-orchestration/proposal.md
      source_sha256: 36ab25a6d9c1a8f48b314d1ca65ac2ab4fafe3ffea72c0ec22b674fd5dc52036
      fragment: '- Do not ship a large catalog of superficial verticals in the engine.

        - Do not require all verticals to be known at build time.

        - Do not replace owner governance: the agent proposes verticals, capisaldi,
        rubric extensions, and questions, but the owner decides.

        - Do not make regulated verticals such as medical or legal authoritative without
        explicit caution, provenance, and owner responsibility.'
      fragment_kind: non-goals
      truncated: false
    - id: VME-4f2a7b73aa73f4e595a03602
      source_path: .p2p/proposals/PROP-085-pluggable-project-verticals-and-readiness-orchestration/proposal.md
      source_sha256: 36ab25a6d9c1a8f48b314d1ca65ac2ab4fafe3ffea72c0ec22b674fd5dc52036
      fragment: 'Introduce pluggable project verticals. A vertical package defines
        its id, name, version, base extension, sections, section detail packs, maturity
        levels, rubric criteria, blocking/refinement questions, artifact templates,
        examples, profiles, and optional compatible modules. P2P Engine provides a
        generic loader/validator and a project orchestrator skill that reads these
        definitions, evaluates project readiness, proposes capisaldi, creates initial
        refinement questions, and guides a one-question-at-a-time interview. Vertical
        packages are pure data packages made of text files, primarily .md and/or .yaml,
        not executable code in the MVP. They contain the project skeleton for the
        vertical: chapters, sections, topics to address, vertical-specific peculiarities,
        rubrics, questions, and useful artifacts. The minimum MVP vertical pack requires
        vertical.yml with id, name, version, description, and base/extends; project
        sections/chapters; minimal completeness/readiness rubrics; initial blocking
        questions; and expected or suggested artifacts. Examples, profiles, compatible
        modules, and rich output templates are optional in the MVP. Default vertical
        packs are distributed internally with the project/package as versioned, testable
        data resources for the MVP. The design should stay registry-ready, but an
        external registry is not part of the first slice; a later registry can expose
        REST endpoints to list available packs and fetch pack details/versions. The
        CLI remains deterministic: p2p init may ask deterministic setup questions
        and persist project/init state, but it does not launch or embody the agent.
        The proactive behavior belongs to the agent instructions. When the agent detects
        an uninitialized project, an initialization state, or missing project capisaldi
        and initial questions, it must treat that as priority context work because
        it determines project readiness. The agent should know how to initialize the
        project with the CLI, use owner answers to populate init/project objects,
        propose the vertical-derived capisaldi, save initial questions when possible,
        interview one question at a time, and return to deferred core-definition work
        unless the owner explicitly silences it. When a requested vertical is missing,
        resolution order is project-local vertical packs, core/default packs, configured
        data registry/plugin packs, then base_project fallback. The fallback is not
        passive: the agent proposes a default/base vertical, enters customization
        mode, extracts the missing vertical information from the owner, creates or
        updates a project-local custom vertical with sections/capisaldi, minimal rubrics,
        blocking questions, and expected artifacts, and uses it only after owner confirmation.
        This proposal extends and reuses the existing project rubrics and project
        maturity/readiness artifacts rather than replacing them. Vertical packs provide
        structured inputs that specialize the current system; they must not create
        a parallel maturity engine. The explicit command for later review is p2p project
        readiness review: the command goal is project readiness/context strengthening,
        while verticals are the data source used by the review. It should reuse existing
        project rubrics/maturity, read packaged and project-local verticals, identify
        missing capisaldi, produce initial or follow-up project questions, and guide
        the agent on readiness priorities. Core should start with base_project and
        a small MVP set of high-quality verticals, while additional verticals live
        in an external registry or project-local custom directory. Initial implementation
        scope is base_project plus the vertical pack loader/validator, the project
        orchestrator skill, one complete demonstration vertical, and project readiness
        review integration. The five-vertical MVP set remains a follow-up target,
        not part of the first implementation slice.'
      fragment_kind: proposal
      truncated: false
    - id: VME-d33dd345cf00e9a7d5007e91
      source_path: .p2p/proposals/PROP-085-pluggable-project-verticals-and-readiness-orchestration/proposal.md
      source_sha256: 36ab25a6d9c1a8f48b314d1ca65ac2ab4fafe3ffea72c0ec22b674fd5dc52036
      fragment: '- A pure-data vertical pack schema is defined and validated, with
        required fields for vertical metadata, sections/capisaldi, minimal readiness
        rubrics, blocking questions, and expected artifacts.

        - base_project is available as the universal fallback and existing projects
        without vertical packs continue to work with current project rubrics and maturity/readiness
        behavior.

        - Default MVP vertical packs are loaded from internal package/project resources,
        while project-local custom packs can override or extend them.

        - A project readiness review command, p2p project readiness review, reads
        vertical packs, project-local custom packs, existing rubrics/maturity state,
        and project context to identify missing capisaldi and generate prioritized
        project questions.

        - Project readiness review produces a vertical skeleton summary that maps
        vertical sections/capisaldi to relevant proposals, accepted decisions, gaps,
        risks, and unmapped proposals.

        - Generated agent/project instructions explain that missing initialization,
        capisaldi, or initial project questions are priority context work and guide
        the agent to propose, confirm, and refine project-local custom verticals.

        - The first implementation slice includes one complete demonstration vertical
        and does not require the later five-vertical set, remote registry, or executable
        plugin verticals.

        - The design remains registry-ready by keeping pack identity/version metadata
        and a loader boundary that can later support REST list/detail endpoints without
        changing project-local pack semantics.'
      fragment_kind: acceptance_criteria
      truncated: false
  - id: VMC-32074e31a2591a37f561340a
    proposal_id: PROP-090
    title: Project Vertical Pack Runtime Hardening And Definition State
    section_id: definition_of_done
    authority: resolved
    activation: active
    effective_state: accepted
    head_event_id: PDE-677c1d9bff19a26b755298d7
    head_event_type: accepted
    rationale: Owner reviewed the refined production hardening proposal, confirmed
      no further changes are needed, and accepts it as the follow-up to PROP-085 for
      project vertical pack runtime hardening and definition-state production readiness.
    constraints: []
    applicability: definition_of_done
    coverage_rationale: Defines explicit section completion, required-field, assumption,
      blocker, maturity, and next-question semantics for actionable project readiness.
    source_path: .p2p/proposals/PROP-090-project-vertical-pack-runtime-hardening-and-definition-state/proposal.md
    proposal_semantic_sha256: 16730f0964406e5f35ca175b6683b882e471a359d2b0f2fcaf99438426d52456
    decision_semantic_sha256: 48632dd4c6beebbe284ffd2c8b3106a8c03b022b6e2e74b268a5d8517018007d
    lineage:
      kind: null
      targets: []
    evidence:
    - id: VME-432042b763efb79ca58bc262
      source_path: .p2p/proposals/PROP-090-project-vertical-pack-runtime-hardening-and-definition-state/proposal.md
      source_sha256: 46fa39047d64947152c2d94c2d2e57854a603381be87a0263f2b6d6879788e36
      fragment: 'PROP-085 introduced pluggable project verticals and the first local
        implementation delivered an MVP: packaged vertical data, project-local override,
        active vertical state, CLI/MCP operations, readiness review, proposal-to-vertical
        coverage, and agent guidance. That MVP proves the direction, but it is not
        yet a production-grade vertical runtime.


        The current implementation still relies on a compact single-file vertical
        model, does not persist an exact resolved vertical lockfile, does not persist
        durable project definition state, does not expose a complete JSON contract
        for agent-guided project construction, and does not yet formalize compatibility
        between selected verticals, generated rubrics, enabled rubric criteria, section
        completion, assumptions, and agent updates.


        Without a stronger contract, verticals may remain useful templates rather
        than a reliable operating layer for project definition. Agents can inspect
        available vertical data, but they cannot durably record what the owner has
        answered, what remains missing, what is assumed, which section is blocked,
        or which question should be asked next. Pack updates or local overrides may
        also change behavior unexpectedly if the project does not pin the resolved
        pack version and checksum.


        This proposal completes and hardens PROP-085 by defining the production-grade
        contracts for project vertical pack shape, source resolution, lockfiles, project
        definition state, CLI JSON access, agent-guided progressive interview behavior,
        validation, security, rubric regeneration, and future Wavekit-compatible installation.'
      fragment_kind: problem
      truncated: false
    - id: VME-61872580c197199b86b71508
      source_path: .p2p/proposals/PROP-090-project-vertical-pack-runtime-hardening-and-definition-state/proposal.md
      source_sha256: 46fa39047d64947152c2d94c2d2e57854a603381be87a0263f2b6d6879788e36
      fragment: '- Define a production-grade multi-file project vertical pack contract
        while preserving compatibility with existing single-file vertical.yml packs.

        - Persist the exact resolved vertical package in .p2p/project/vertical.lock.yml
        with version, source, schema, checksum, and compatibility metadata.

        - Introduce .p2p/project/definition.yml as the durable project definition
        state used by agents to record section data, assumptions, missing fields,
        open questions, decisions, and next suggested work.

        - Keep p2p project vertical ... as the stable CLI namespace and extend it
        with JSON-ready project context operations instead of replacing it with a
        new top-level namespace in the first slice.

        - Integrate selected vertical defaults with .p2p/project/rubrics.yml while
        preserving PROP-057 enabled/disabled rubric selection semantics.

        - Define deterministic resolver behavior across explicit path/reference, project-local
        packs, installed local packs, packaged seed packs, future Wavekit packs, and
        base_project fallback.

        - Define strict post-init lockfile behavior: after a vertical is locked, missing
        or mismatched packs must not silently fall back to another vertical without
        explicit repair, migration, or fallback command.

        - Expose enough structured JSON context for a generic agent to guide project
        definition without hardcoded domain knowledge.

        - Define the generic vertical-aware agent guidance runtime: progressive interview,
        one primary question per turn, examples, assisted answers, explicit assumptions,
        section completion checks, and structured state updates.

        - Keep vertical pack content as declarative domain data, never executable
        code and never higher-priority agent instruction.

        - Prepare local pack formats and lock metadata for future Wavekit remote installation
        without requiring remote registry support in the first implementation.

        - Define validation, upgrade, migration, orphaned rubric, and orphaned project-definition-field
        behavior before broad catalog expansion.'
      fragment_kind: goals
      truncated: false
    - id: VME-34bda5b6c0feb6d59e1a879f
      source_path: .p2p/proposals/PROP-090-project-vertical-pack-runtime-hardening-and-definition-state/proposal.md
      source_sha256: 46fa39047d64947152c2d94c2d2e57854a603381be87a0263f2b6d6879788e36
      fragment: '- Do not replace PROP-085. This proposal hardens and completes the
        accepted direction.

        - Do not replace p2p project vertical ... with a new required p2p vertical
        ... namespace in the first production slice.

        - Do not move existing project-local packs out of .p2p/project/verticals/
        as part of this proposal.

        - Do not rename base_project as a breaking change. Any generic_project naming
        can be handled as aliasing or a future compatibility decision.

        - Do not implement Wavekit remote search, install, update, or publish in the
        first implementation.

        - Do not execute code from vertical packs or support executable plugin hooks.

        - Do not allow vertical pack content to override system, developer, safety,
        governance, repository, or tool-permission instructions.

        - Do not make p2p init ask all vertical interview questions. Init configures
        the project; agent guidance develops the project later.

        - Do not replace .p2p/project/rubrics.yml or change the meaning of enabled:
        false from PROP-057.

        - Do not silently upgrade vertical packs or project definition state during
        assessment, export, readiness review, or ordinary agent interaction.

        - Do not require a domain-specific agent skill for every vertical.'
      fragment_kind: non-goals
      truncated: false
    - id: VME-9d921dd5adae0f89d25dd420
      source_path: .p2p/proposals/PROP-090-project-vertical-pack-runtime-hardening-and-definition-state/proposal.md
      source_sha256: 46fa39047d64947152c2d94c2d2e57854a603381be87a0263f2b6d6879788e36
      fragment: 'Introduce a production-grade project vertical runtime layer as a
        follow-up to PROP-085.


        This proposal is organized around four production contracts plus explicit
        scope, alternative, risk, owner-question, acceptance, and overlap analysis.
        The owner-review questions Q001-Q006 have been resolved and are incorporated
        in the direction below.


        Contract 1: Project Vertical Pack Contract

        A project vertical pack is a declarative data package that describes a project
        skeleton for a class of projects. The canonical production pack is multi-file
        for maintainability:

        - manifest.yml

        - vertical.yml

        - sections/

        - profiles/

        - modules/

        - rubrics.yml

        - artifacts/

        - examples/


        Minimum valid production pack:

        - manifest.yml

        - vertical.yml

        - sections/

        - rubrics.yml


        The loader must continue accepting the current MVP single-file vertical.yml
        shape as a compatibility input and normalize it into the same typed model.
        The canonical pack can split section specs, rubrics, artifact metadata, examples,
        and profiles into separate files. A section spec should define purpose, required
        fields, interview questions, assisted answer behavior, examples or answer
        templates, completion criteria, dependencies, common mistakes, suggested artifacts,
        and maturity gates where available.


        manifest.yml should contain stable identity and package metadata: id, name,
        version, publisher/source, schema_version, description, categories/tags, compatibility
        p2p_min_version, entrypoints, declared profiles, declared sections, artifact
        ids, license/trust metadata, and optional checksum/signature fields for future
        remote packs.


        vertical.yml should define the project skeleton: id, name, version, goal,
        extends/base, default_profile, maturity levels, section list with stable ids
        and spec paths, interview policy, completion policy, enabled status defaults,
        and supported statuses.


        profiles allow one vertical to support different project intentions without
        separate vertical ids. modules are optional vertical-local extensions. rubrics.yml
        provides default criteria for .p2p/project/rubrics.yml. Artifact templates
        are optional and partial artifact generation must mark missing or assumed
        content.


        Contract 2: Project Configuration And Resolution Contract

        The selected project vertical remains project state. Keep .p2p/project/vertical.yml,
        but evolve its schema from a minimal active-id record into richer selected-vertical
        configuration while remaining backward-compatible with MVP files.


        Keep the project-local pack path .p2p/project/verticals/<vertical-id>/ for
        compatibility. Installed local packs are resolved from both P2P_HOME/verticals
        and ~/.p2p/verticals. If P2P_HOME is configured, P2P_HOME/verticals has precedence
        over ~/.p2p/verticals; otherwise ~/.p2p/verticals is the default installed-local
        directory. If both installed-local locations contain the same pack id/version,
        the P2P_HOME source wins. Packaged seed resources remain inside package resources.
        Future Wavekit packs should be installed into an installed-local source and
        resolved by the same resolver.


        Resolution order is deterministic:

        - explicit path or vertical reference passed by the owner;

        - project-local packs under .p2p/project/verticals/;

        - installed local packs under P2P_HOME/verticals, when configured;

        - installed local packs under ~/.p2p/verticals;

        - packaged seed vertical resources;

        - future configured Wavekit/registry source;

        - base_project fallback only during initial selection or explicitly allowed
        repair.


        base_project remains the canonical fallback vertical for this implementation.
        Do not introduce generic_project in the first implementation. generic_project
        was terminology from the revision source and may be reconsidered later as
        a non-breaking alias only if there is a clear usability need after resolver,
        lockfile, and pack identity rules are stable.


        After initialization or explicit project vertical selection, resolve through
        .p2p/project/vertical.lock.yml. The lockfile records id, name, version, source,
        resolved_'
      fragment_kind: proposal
      truncated: true
    - id: VME-b3e1b98414046f665648aa02
      source_path: .p2p/proposals/PROP-090-project-vertical-pack-runtime-hardening-and-definition-state/proposal.md
      source_sha256: 46fa39047d64947152c2d94c2d2e57854a603381be87a0263f2b6d6879788e36
      fragment: '- A new local development feature can be derived from PROP-090 without
        changing the accepted meaning of PROP-085.

        - The existing p2p project vertical command namespace remains the primary
        public CLI surface for this hardening work; a top-level p2p vertical namespace
        is not required in the first implementation.

        - Existing single-file vertical.yml packs remain loadable and are normalized
        into the same typed model as canonical multi-file packs.

        - A canonical multi-file pack shape is defined and validated, including manifest.yml,
        vertical.yml, sections, rubrics.yml, and optional profiles, modules, artifacts,
        and examples.

        - The project-local vertical path .p2p/project/verticals/ remains supported
        and documented.

        - base_project remains the canonical fallback vertical id; generic_project
        is not introduced in the first implementation.

        - Installed local packs are resolved from both P2P_HOME/verticals and ~/.p2p/verticals,
        with P2P_HOME/verticals taking precedence when P2P_HOME is configured.

        - The resolver and vertical.lock.yml record the effective source type and
        resolved source path or package coordinate.

        - .p2p/project/vertical.lock.yml is generated deterministically for new init/select
        flows.

        - Existing projects with active vertical state but no lockfile are not modified
        implicitly by validation, readiness, export, or ordinary reads.

        - Existing active vertical state without a lockfile produces an actionable
        validation diagnostic and a dedicated explicit repair/migration command can
        generate the lockfile.

        - If the active or locked vertical cannot be resolved, repair/select/review
        commands fail without writing and do not silently fall back to base_project
        after lock creation.

        - .p2p/project/definition.yml is generated deterministically and validated
        against the active vertical.

        - Project definition state records section status, field data, missing fields,
        assumptions, open questions, blockers, next_suggested_action when available,
        and history/provenance.

        - Definition-state writes are implemented in the first production slice through
        a narrow structured patch/update contract; arbitrary YAML editing is not exposed.

        - Definition-state update validation rejects unknown section ids, field ids,
        invalid statuses, invalid assumption statuses, and inconsistent completion
        states.

        - Definition-state writes are atomic and go through supported service/CLI/MCP
        paths, not manual .p2p edits.

        - The first production slice exposes project context, sections, section detail,
        rubrics, and definition state through JSON-ready CLI or MCP surfaces.

        - The full p2p project next-action --json engine is not implemented in the
        first slice; agents use exposed JSON and optional next_suggested_action for
        best-effort guidance.

        - p2p init remains lightweight and does not ask full section interview questions.

        - Interactive init can select vertical, profile, optional sections/modules,
        generate rubrics from vertical defaults, and then invoke PROP-057 guided rubric
        selection.

        - Rubric regeneration preserves existing enabled flags by stable criterion
        id and handles removed criteria as orphaned or confirmation-required removals.

        - Maturity output distinguishes selected project rubric maturity from full
        default vertical baseline coverage.

        - Vertical pack content is validated with severity-dependent rules: explicit
        attempts to override higher-priority instructions, execute code, force tools,
        change permissions, or escape paths are hard errors; ambiguous instruction-like
        wording in examples/templates can be warnings.

        - Internal seed packs validate cleanly; project-local packs may be allowed
        with warnings; future remote/Wavekit packs can use stricter trust validation.

        - Generated agent guidance treats vertical pack content as domain data, not
        authoritative agent instruction.

        - Tests cover loader normalization, resolver precedence, lockfile behavior,
        explicit lock repair/migration, definition-state validation and updates, pack
        safety validation, rubric regeneration preservation,'
      fragment_kind: acceptance_criteria
      truncated: true
  - id: VMC-9e55d1d5fdcab77641428378
    proposal_id: PROP-101
    title: Project Readiness Convergence Workflow
    section_id: definition_of_done
    authority: resolved
    activation: active
    effective_state: accepted
    head_event_id: PDE-543016c164d3c4566c853c74
    head_event_type: accepted
    rationale: The refined proposal addresses the identified readiness-convergence,
      schema migration, atomicity, authority, retry, vertical reconciliation, decision-context
      and bounded-retrieval risks with explicit delivery gates and acceptance criteria.
    constraints: []
    applicability: definition_of_done
    coverage_rationale: Defines convergence exit gates and auditable readiness outcomes
      rather than a diagnostic-only review.
    source_path: .p2p/proposals/PROP-101-project-readiness-convergence-workflow/proposal.md
    proposal_semantic_sha256: 47d92c16246ec2f341d456d5507ef39ff1152f815f2653f1899d04e152eea932
    decision_semantic_sha256: 393fddc0e3d2ad7b0ecfbc6bc10051aa99ba14ebcda3164221b4241e6f60641e
    lineage:
      kind: null
      targets: []
    evidence:
    - id: VME-8e1cd9c06d57e32d85fbe768
      source_path: .p2p/proposals/PROP-101-project-readiness-convergence-workflow/proposal.md
      source_sha256: 571e497d3cd674f63f015addcf90aa66bf0356e310f666d3bdc218bf5759da0e
      fragment: 'P2P Engine can diagnose project readiness but cannot yet drive a
        project from a diagnosed vertical gap to an auditable owner-reviewed update.
        The current review identifies incomplete capisaldi, declared evidence and
        unmapped proposals, but its convergence behavior is incomplete:


        - it returns generic advice to complete the definition and rerun the review;

        - some required incomplete sections have no applicable generated question;

        - there is no persistent project-level question lifecycle equivalent to the
        proposal-question workflow;

        - owner answers are not connected to a governed candidate project-definition
        patch;

        - project-definition gaps are not coherently prioritized in managed next actions;

        - large legacy proposal lists are emitted without bounded detail or prioritization;

        - progress, readiness and freshness expose useful but separate states without
        an orchestration contract that closes the loop.


        The result is a system that knows what is incomplete but still depends on
        an agent or owner to reconstruct the next workflow manually across multiple
        commands and sessions.


        The implementation risk is broader than question generation. A naive implementation
        could create competing authority between project-question state, project definition,
        decision context, managed next actions and workspace migration state. It could
        also reuse the existing single-file definition apply in a way that leaves
        question and definition state partially committed, or register a v1-to-v2
        migration while still executing the current legacy-to-v1 bootstrap planner.'
      fragment_kind: problem
      truncated: false
    - id: VME-4144a719c351590589d22d8d
      source_path: .p2p/proposals/PROP-101-project-readiness-convergence-workflow/proposal.md
      source_sha256: 571e497d3cd674f63f015addcf90aa66bf0356e310f666d3bdc218bf5759da0e
      fragment: '- Model project-readiness gaps as typed, prioritized and explainable
        records.

        - Give each actionable required-section gap a declared question, a safe deterministic
        fallback or an explicit no-question diagnostic.

        - Persist project-question lifecycle state, revisions, authority and provenance
        across sessions.

        - Keep question answers distinct from applied project definition and owner
        decisions.

        - Render owner-reviewable candidate definition patches and commit definition
        plus question state through one transaction.

        - Integrate the highest-priority project gap into managed next actions.

        - Preserve independent definition completeness and declared evidence coverage.

        - Keep CLI and MCP contracts deterministic, bounded and semantically aligned.

        - Preserve schema-v1 valid operations and provide a real transition-specific
        v1-to-v2 migration.

        - Reconcile project questions safely across vertical revisions without re-opening
        or losing owner evidence.

        - Preserve `PROP-100` authority by keeping unapplied question state non-semantic.

        - Validate generic behavior against this repository without embedding repository-specific
        policy.'
      fragment_kind: goals
      truncated: false
    - id: VME-06bc3330b93fc264be61867c
