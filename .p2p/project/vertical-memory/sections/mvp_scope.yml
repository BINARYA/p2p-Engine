  - id: VMC-c01fcc755130ca1928a72443
    proposal_id: PROP-001
    title: "\u2014 CLI Foundation"
    section_id: mvp_scope
    authority: resolved
    activation: active
    effective_state: accepted
    head_event_id: PDE-61f7c7e703420d7d5c4ad807
    head_event_type: accepted
    rationale: Current owner confirms the historical acceptance of PROP-001 for the
      first local, Git-native, file-based Python and Typer CLI. The initial MVP excluded
      a web application and direct AI provider integration; the legacy source wording
      divergence remains preserved in migration provenance.
    constraints: []
    applicability: mvp_scope
    coverage_rationale: Defines the bounded first CLI command set and explicitly defers
      direct AI integration.
    source_path: .p2p/proposals/PROP-001-cli-foundation/proposal.md
    proposal_semantic_sha256: dfd6146075bac52b44ae94880459f5367b972f9c2d214f515f6cf21f82edddbd
    decision_semantic_sha256: 427d1a2189435caf2866b199690a27eddf525734b39316189799d95a0ed2c280
    lineage:
      kind: null
      targets: []
    evidence:
    - id: VME-2239c0460a206cca11c132a3
      source_path: .p2p/proposals/PROP-001-cli-foundation/proposal.md
      source_sha256: a391bd9b0e46e25f2fac4609c122e8c693448859b13d9f9912c3280f6b388b87
      fragment: 'P2P Engine does not exist yet as an executable tool. The project
        has a solid foundation document, but no CLI, no generated `.p2p/` structure,
        no automated proposal workflow, and no prompt generation.


        Without a first working CLI, every proposal must be created manually. That
        is acceptable for the bootstrap phase, but it must become automated quickly
        so the project can start using its own method.'
      fragment_kind: problem
      truncated: false
    - id: VME-c91b155ed7198944ce7ada0a
      source_path: .p2p/proposals/PROP-001-cli-foundation/proposal.md
      source_sha256: a391bd9b0e46e25f2fac4609c122e8c693448859b13d9f9912c3280f6b388b87
      fragment: '- Implement a minimal `p2p` CLI.

        - Generate the `.p2p/` project structure with `p2p init`.

        - Create proposal folders and baseline artifacts with `p2p proposal create`.

        - Add structured contributions with `p2p contribution add`.

        - Record decisions with `p2p decision record`.

        - Generate prompt files for digest, clarify, plan, and tasks.

        - Keep AI invocation optional and out of scope for the first implementation.

        - Preserve compatibility with future OpenSpec and Spec Kit exports.'
      fragment_kind: goals
      truncated: false
    - id: VME-1709dd7c5dbc80efc1aead8e
      source_path: .p2p/proposals/PROP-001-cli-foundation/proposal.md
      source_sha256: a391bd9b0e46e25f2fac4609c122e8c693448859b13d9f9912c3280f6b388b87
      fragment: '- No web app.

        - No users, accounts, permissions, billing, or dashboard.

        - No managed AI provider.

        - No MCP server.

        - No full OpenSpec or Spec Kit exporter in the first slice.

        - No automatic code implementation.

        - No advanced governance engine.'
      fragment_kind: non-goals
      truncated: false
    - id: VME-020924722fda0ac501c864b5
      source_path: .p2p/proposals/PROP-001-cli-foundation/proposal.md
      source_sha256: a391bd9b0e46e25f2fac4609c122e8c693448859b13d9f9912c3280f6b388b87
      fragment: 'Build the first P2P Engine CLI using Python and Typer.


        The CLI should focus on local file generation and workflow guidance:


        ```text

        p2p init

        p2p proposal create

        p2p contribution add

        p2p digest prompt

        p2p clarify prompt

        p2p decision record

        p2p plan prompt

        p2p tasks prompt

        p2p status

        ```


        The first version should implement prompt generation instead of direct AI
        integration. A command such as:


        ```bash

        p2p digest prompt PROP-001

        ```


        should generate:


        ```text

        .p2p/prompts/PROP-001/digest.prompt.md

        ```


        The user can then provide that prompt to Codex, ChatGPT, Claude, Llama, or
        another model manually and paste the output into the correct artifact.'
      fragment_kind: proposal
      truncated: false
    - id: VME-f3dcbb1629f10c7bf422fb11
      source_path: .p2p/proposals/PROP-001-cli-foundation/proposal.md
      source_sha256: a391bd9b0e46e25f2fac4609c122e8c693448859b13d9f9912c3280f6b388b87
      fragment: '- A user can install or run the CLI locally.

        - `p2p init` creates the baseline `.p2p/` structure.

        - `p2p proposal create "CLI Foundation"` creates a proposal folder and baseline
        artifacts.

        - `p2p contribution add PROP-001` appends a valid YAML contribution.

        - `p2p decision record PROP-001 --outcome accepted` records a decision artifact.

        - Prompt commands generate prompt files under `.p2p/prompts/<proposal-id>/`.

        - `p2p status` shows project and proposal state.

        - No direct AI provider is required.'
      fragment_kind: acceptance_criteria
      truncated: false
  - id: VMC-e9fc0570edd3c9a4ca70692e
    proposal_id: PROP-044
    title: P2P MCP Server MVP
