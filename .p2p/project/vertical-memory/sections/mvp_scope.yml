vertical_memory_section:
  schema_version: 1
  section:
    id: mvp_scope
    title: Scope And MVP Boundaries
    purpose: MVP scope, non-goals, and release boundaries.
    required: true
    priority: 130
  definition:
    status: complete
    fields:
      in_scope:
        value: A project-local Python runtime with CLI and local MCP access; workspace
          initialization and migration; proposals, readiness, questions, decisions,
          choices, conflicts, Change Sets and Work metadata; managed Git collaboration;
          validation, compact context, assessments, project projections, software
          specifications and downstream exports.
        source: README.md+docs/CLI-GUIDE.md
      out_of_scope:
        value: A hosted or multi-tenant product, autonomous governance decisions,
          unrestricted cloud or Git-provider mutations, arbitrary manual edits to
          governed .p2p state, provider PR or MR creation through MCP, a standalone
          packaged binary, and guaranteed public-registry distribution.
        source: README.md+docs/MCP.md
    required_field_ids:
    - in_scope
    - out_of_scope
    missing_required_fields: []
    assumptions: []
    open_questions: []
    blockers: []
  questions: []
  declared_questions:
  - What is in the MVP and what is out of scope?
