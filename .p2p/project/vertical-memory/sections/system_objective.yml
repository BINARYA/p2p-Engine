    title: System Objective
    purpose: Product or system objective and measurable outcome.
    required: true
    priority: 110
  definition:
    status: complete
    fields:
      objective:
        value: Deliver a reliable local engine and public interfaces that manage canonical
          .p2p state through governed primitives and derive fresh, bounded context
          and specifications for agents.
        source: README.md
      success_signal:
        value: A target repository can initialize P2P, move owner-reviewed intent
          through proposal, decision, Change Set and specification workflows, validate
          its state, and retrieve relevant context through CLI or MCP without manual
          .p2p edits; compatibility checks and the repository test suites pass.
        source: README.md
