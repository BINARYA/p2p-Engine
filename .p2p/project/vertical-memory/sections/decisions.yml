    - id: VME-43062e3e83542d81e50ad6bf
      source_path: .p2p/proposals/PROP-102-proposal-decision-revision-and-revocation-lifecycle/proposal.md
      source_sha256: 438da30da1aaf991adc2c4873260c253862f5c7292bdb64807e43030267eb16d
      fragment: 'P2P currently represents a proposal decision primarily as one current
        outcome.

        The decision write path replaces `decision.md` and then replaces the status
        in

        `proposal.md`, without validating the previous lifecycle state or preserving
        a

        queryable sequence of owner decisions.


        As a result, an accepted proposal can be rewritten as rejected. The current

        workspace then appears to say that the proposal was never adopted, even though

        it may already have influenced project definition, Change Sets, Work,

        specifications, implementation, publication and later decisions. Git can

        recover earlier bytes, but normal validation, retrieval and derived-state

        consumers do not use Git history as the proposal decision model.


        The model also lacks a precise distinction between rejection before adoption,

        withdrawal before decision, revocation after acceptance, replacement,

        reinstatement and downstream deprecation. Without that distinction, future

        decision-memory consolidation cannot reliably determine which decisions are

        active, historical, previously active, replaced or merely deferred.'
      fragment_kind: problem
      truncated: false
    - id: VME-ea9c54a4d313f4621a7a4cfd
      source_path: .p2p/proposals/PROP-102-proposal-decision-revision-and-revocation-lifecycle/proposal.md
      source_sha256: 438da30da1aaf991adc2c4873260c253862f5c7292bdb64807e43030267eb16d
      fragment: "- Preserve an append-only, queryable history of proposal decision\
        \ events,\n  including rationale, owner authority, date, predecessor and lineage.\n\
        - Derive current proposal status and authority deterministically from the\
        \ valid\n  event sequence.\n- Define an exhaustive transition matrix with\
        \ exact retry, invalid transition\n  and reconsideration behavior.\n- Distinguish\
        \ initial rejection from withdrawal, revocation, supersession,\n  reinstatement\
        \ and downstream deprecation.\n- Make decision mutations owner-controlled,\
        \ previewed, source-bound,\n  stale-safe, atomic, idempotent where appropriate\
        \ and recoverable.\n- Keep current CLI and human-readable status views available\
        \ as projections\n  during a forward compatibility transition.\n- Migrate\
        \ current single-decision artifacts without inventing missing owner\n  evidence\
        \ or erasing legacy values.\n- Propagate lifecycle authority consistently\
        \ to validation, registries,\n  project projections, decision context, relations,\
        \ vertical evidence, Change\n  Sets, Work, software specifications, next actions\
        \ and publication.\n- Produce explicit impact and remediation guidance without\
        \ automatically\n  changing dependent owner-controlled lifecycles.\n- Establish\
        \ the stable authority and lineage contract required by future\n  thematic\
        \ decision-memory consolidation."
      fragment_kind: goals
      truncated: false
    - id: VME-689bd9fd5d8f1065457d75d1
