  - id: VMC-284708a8b6fb93cc95d7e6f6
    proposal_id: PROP-091
    title: Governance Policy Convergence
    section_id: decisions
    authority: resolved
    activation: active
    effective_state: accepted
    head_event_id: PDE-c4807cff1d66a97d62e3c451
    head_event_type: accepted
    rationale: Accepted by owner after guided refinement. The proposal is decision-ready
      with readiness score 100, high confidence, no failed gates, no missing artifacts,
      no suggested next actions, and clean validation. It defines Governance Policy
      Convergence with owner_decides as default, deterministic preflight, explicit
      precedent lookup, warning/blocking semantics, actor-role migration, and read-only/low-risk
      MCP phase 1.
    constraints: []
    applicability: decisions
    coverage_rationale: Defines which governance choices remain owner-controlled and
      how agents may prepare but not take those decisions.
    source_path: .p2p/proposals/PROP-091-governance-policy-convergence/proposal.md
    proposal_semantic_sha256: 88d3140970165380c1c76f18de584755528db6fe5e8e73e79a7a2833ce26161e
    decision_semantic_sha256: b3573ac5b0e0be944dad52afc25b36a59b6259305c1997273d166f3f2f9b46e2
    lineage:
      kind: null
      targets: []
    evidence:
    - id: VME-a595849db855e7d18119a70b
      source_path: .p2p/proposals/PROP-091-governance-policy-convergence/proposal.md
      source_sha256: ca516c3c2348bcb5a066133b0c68a9fbeb0b4db6bcd6769034defd3754844c93
      fragment: "P2P Engine already has governance-aware artifacts and helper utilities,\
        \ but they\ndo not yet form a coherent operational governance policy. The\
        \ project can store\n`governance.yml`, `roles.yml`, `permissions.yml`, choices,\
        \ votes, decision\nprecedents, explicit blockers, and owner-controlled decisions,\
        \ but there is no\nsingle structured evaluation that answers these questions\
        \ before a decision:\n\n- who is attempting to decide;\n- whether that actor\
        \ is allowed to decide;\n- what target is being decided;\n- which governance\
        \ mode applies;\n- whether the governance state is valid and readable;\n-\
        \ how the proposed decision relates to votes, blockers, and precedents;\n\
        - whether the decision can proceed normally, requires rationale, requires\
        \ owner\n  override, or must be blocked.\n\nWithout this layer, governance\
        \ artifacts remain useful as audit records but weak\nas decision support.\
        \ Agents and external clients can see fragments of governance\nstate, yet\
        \ they cannot consume a stable preflight contract that explains the\ndecision\
        \ context in a deterministic way."
      fragment_kind: problem
      truncated: false
    - id: VME-8d10157f85d22bc6b8681a6e
      source_path: .p2p/proposals/PROP-091-governance-policy-convergence/proposal.md
      source_sha256: ca516c3c2348bcb5a066133b0c68a9fbeb0b4db6bcd6769034defd3754844c93
      fragment: "- Keep `owner_decides` as the current operational default.\n- Preserve\
        \ owner authority as the final decision source for now.\n- Make votes, blockers,\
        \ and precedents transparent decision context rather than\n  automatic decision\
        \ makers.\n- Introduce a deterministic governance preflight contract for proposed\n\
        \  selections and decision attempts.\n- Use `permissions.yml` as the primary\
        \ actor and role source when available.\n- Keep `governance/roles.yml` as\
        \ a legacy, display, or fallback artifact during\n  migration.\n- Make vote\
        \ disagreement, ties, related precedents, reopened decisions, weak\n  consensus,\
        \ and non-blocking concerns visible as warnings.\n- Treat structural invalidity,\
        \ unauthorized actors, unknown targets, unsupported\n  governance modes, and\
        \ corrupt governance artifacts as blocking errors.\n- Treat explicit unresolved\
        \ blockers as normal-flow blockers that can be\n  overridden only by an authorized\
        \ owner with recorded rationale.\n- Expose first-phase MCP parity through\
        \ read-only or low-risk governance status,\n  validation, vote status, precedent\
        \ lookup, and preflight tools."
      fragment_kind: goals
      truncated: false
    - id: VME-56689f1b4972aec05787e5e9
      source_path: .p2p/proposals/PROP-091-governance-policy-convergence/proposal.md
      source_sha256: ca516c3c2348bcb5a066133b0c68a9fbeb0b4db6bcd6769034defd3754844c93
      fragment: "- Do not implement a full democratic governance system.\n- Do not\
        \ introduce quorum, weighted voting, delegation, complex voting\n  deadlines,\
        \ or automatic vote enforcement.\n- Do not make votes automatically accept,\
        \ reject, or decide proposals or\n  choices.\n- Do not allow agents or MCP\
        \ tools to bypass owner-controlled governance.\n- Do not use fuzzy matching,\
        \ semantic similarity, embeddings, title inference,\n  keyword guessing, or\
        \ AI search in the core precedent lookup.\n- Do not expose MCP tools that\
        \ mutate governance state or finalize decisions in\n  phase 1.\n- Do not remove\
        \ compatibility for existing governance artifacts without a\n  migration path."
      fragment_kind: non-goals
      truncated: false
    - id: VME-7ed165a1085d4c03698ed178
      source_path: .p2p/proposals/PROP-091-governance-policy-convergence/proposal.md
      source_sha256: ca516c3c2348bcb5a066133b0c68a9fbeb0b4db6bcd6769034defd3754844c93
      fragment: "Introduce a Governance Policy Convergence layer.\n\nThe layer should\
        \ evaluate governance state before finalization and return a\nstable, versioned,\
        \ deterministic, machine-readable preflight structure. The\npreflight output\
        \ is not a decision record. It represents a proposed selection\nand the governance\
        \ evaluation before the final owner decision.\n\nThe initial preflight contract\
        \ should include:\n\n- `schema_version`;\n- `target`;\n- `governance`;\n-\
        \ `actor`;\n- `selection`;\n- `result`;\n- `blocking_errors`;\n- `warnings`;\n\
        - `vote_summary`;\n- `blockers`;\n- `precedents`.\n\nThe `result.status` field\
        \ should summarize one of:\n\n- `ready`;\n- `requires_rationale`;\n- `requires_owner_override`;\n\
        - `blocked`.\n\nBlocking errors and warnings should be structured objects\
        \ with stable\nmachine-readable codes, human-readable messages, override or\
        \ rationale metadata\nwhen relevant, and optional references.\n\n### Authority\
        \ And Votes\n\n`owner_decides` remains the operational default. The owner\
        \ remains the final\ndecision maker. Votes are transparency and decision evidence.\
        \ A proposed owner\ndecision that conflicts with the recorded vote winner\
        \ should produce a strong\nwarning and make the contrast explicit, but it\
        \ should not block finalization and\nshould not require a mandatory override\
        \ reason in the current model.\n\n### Actor And Role Resolution\n\nUse a soft\
        \ migration path:\n\n- `permissions.yml` is the primary actor and role source\
        \ whenever present;\n- `governance/roles.yml` remains legacy/display/fallback;\n\
        - vote and preflight flows move toward actor-based input;\n- when an actor\
        \ exists in `permissions.yml`, the effective role is inferred from\n  that\
        \ file;\n- legacy role fields may be tolerated during transition;\n- mismatches\
        \ between a supplied legacy role and the inferred role produce\n  warnings.\n\
        \n### Precedents\n\nCore precedent lookup is explicit and deterministic. The\
        \ core considers\nprecedents related only when links are declared in versioned\
        \ artifacts through\nstable identifiers or explicit tags, such as `related_precedents`,\n\
        `applies_to.proposal_ids`, `applies_to.choice_ids`, or `governance_tags`.\n\
        \nThe core must not infer precedent relationships from titles, keywords, fuzzy\n\
        matching, semantic similarity, embeddings, or AI-based search. Intermediary\n\
        tools may suggest links, but the core only considers those links after they\
        \ are\nwritten back as explicit artifact relations.\n\n### Blocking And Warning\
        \ Semantics\n\nWarnings are valid governance signals that may influence the\
        \ owner decision but\ndo not prevent finalization by themselves.\n\nBlocking\
        \ errors are conditions where the core cannot reliably establish the\ndecision\
        \ actor, decision target, governance mode, or integrity of governance\nstate.\n\
        \nInitial non-overrideable blocking errors include:\n\n- missing, unknown,\
        \ or unauthorized decision actor;\n- invalid required permissions or governance\
        \ context;\n- missing target proposal or choice;\n- structurally invalid target\
        \ artifacts;\n- unsupported governance mode;\n- structurally invalid governance\
        \ artifacts;\n- structurally invalid vote or precedent artifacts when present.\n\
        \nAn explicit unresolved blocker attached to the target proposal or choice\
        \ blocks\nnormal finalization. It may be overridden only by an authorized\
        \ owner with\nexplicit rationale recorded in the final decision record.\n\n\
        Vote disagreement, ties, related precedents, reopened decisions, open concerns\n\
        not marked as blockers, weak consensus, no votes, and no related precedents\
        \ are\nwarnings or neutral signals, not automatic blockers.\n\n### MCP Phase\
        \ 1\n\nMCP phase 1 exposes governance visibility, validation, vote summaries,\n\
        deterministic precedent lookup, and governance preflight evaluation. It does\
        \ not\nexpose governance mutation or final decision execution.\n\nIncluded\
        \ phase-1 tools:\n\n- `p2p_governance_status`;\n- `p2p_governance_validate`;\n\
        - `p2p_choice_governance_preflight`;\n- `p2p_vote_status`;\n- `p2p_precedent_search`.\n\
        \nDeferred tools:\n\n- `p2p_vote_record`;\n- `p2p_precedent_record`;\n- `p2p_choice_decide`.\n\
        \n`p2p_choice_governance_pre"
      fragment_kind: proposal
      truncated: true
    - id: VME-24c707312194e0cc548f5bb3
      source_path: .p2p/proposals/PROP-091-governance-policy-convergence/proposal.md
      source_sha256: ca516c3c2348bcb5a066133b0c68a9fbeb0b4db6bcd6769034defd3754844c93
      fragment: "- Governance status reports configured mode, effective owner identities,\n\
        \  artifact presence, warnings, and validation problems.\n- Governance preflight\
        \ emits a stable `schema_version`.\n- Governance preflight output is deterministic\
        \ for the same repository state\n  and command input.\n- Governance preflight\
        \ distinguishes proposed `selection` from final decision\n  records.\n- Governance\
        \ preflight includes actor resolution, resolved roles, capabilities,\n  and\
        \ `can_decide`.\n- Governance preflight includes `result.status` with one\
        \ of `ready`,\n  `requires_rationale`, `requires_owner_override`, or `blocked`.\n\
        - Blocking errors and warnings use stable machine-readable codes.\n- Vote\
        \ summaries are included when vote data exists or is relevant.\n- Vote disagreement\
        \ with the selected option produces a warning, not a blocking\n  error.\n\
        - Active explicit blockers are listed and block normal finalization.\n- Owner\
        \ override of explicit blockers requires rationale recorded in the final\n\
        \  decision record.\n- Explicit precedents and deterministic tag-declared\
        \ matches are listed\n  separately.\n- Precedent lookup uses only explicit\
        \ artifact relationships or declared tags.\n- Project validation includes\
        \ structural checks for `governance.yml`,\n  `roles.yml`, `decision-precedents.yml`,\
        \ and `votes.yml`.\n- MCP phase 1 tools do not modify project artifacts, votes,\
        \ precedents, choices,\n  proposals, or decision records.\n- MCP phase 1 exposes\
        \ governance status, validation, choice preflight, vote\n  status, and deterministic\
        \ precedent lookup."
      fragment_kind: acceptance_criteria
      truncated: false
  - id: VMC-9e55d1d5fdcab77641428378
    proposal_id: PROP-101
    title: Project Readiness Convergence Workflow
