related_proposals:
  - proposal: PROP-010
    relationship: related_to
    rationale: "Defines rationalized project state artifacts; a future persistence boundary must preserve this distinction between raw governance history and derived project state."
  - proposal: PROP-013
    relationship: extends
    rationale: "Uses Git as the current internal persistence, audit, synchronization, and collaboration layer; the new idea would define how a structured memory backend can coexist with Git auditability."
  - proposal: PROP-030
    relationship: related_to
    rationale: "Introduces P2P Work as the user-facing abstraction over managed Git branches; concurrency-safe memory would support this abstraction under multi-user conditions."
  - proposal: PROP-059
    relationship: supports
    rationale: "The modular refactoring direction favors services and adapters, which is the right shape for separating memory semantics from filesystem storage."
  - proposal: PROP-072
    relationship: extends
    rationale: "Defines concurrent managed collaboration and acknowledges that the MVP fetch/scan/recheck strategy is not a perfect distributed lock."
  - proposal: PROP-076
    relationship: boundary
    rationale: "Keeps P2P Engine local and assigns cloud database, queues, permissions, and jobs to P2P Cloud; a persistence proposal must respect this product boundary."
