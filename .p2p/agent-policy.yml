p2p_agent_policy:
  version: '1.0'
  project_name: P2P Engine
  source_of_truth: p2p_cli
  missing_primitive_behavior: stop_and_report
  direct_p2p_file_edits: forbidden
  owner_controls_governance: true
repository:
  mode: local
  cloud_is_advisory_until_configured: false
agent_profiles:
- claude
- codex
- generic
runtime_bootstrap:
  contract_path: .p2p/project/runtime.yml
  setup_guide: P2P-SETUP.md
  status_command: p2p runtime status
  legacy_undeclared: warn_do_not_infer
  environment_mutation: owner_explicit_action_required
  discovery_order:
  - p2p
  - .venv/bin/p2p
  - python -m p2p_engine
  - available MCP tools
  doctor_commands:
  - p2p doctor
  - p2p agent doctor
  - .venv/bin/p2p agent doctor
  - python -m p2p_engine agent doctor
  when_unavailable: stop_and_report_diagnostics
mcp:
  default_mode: read_only
  write_tools_require_explicit_tool_schema: true
  missing_write_tool_behavior: stop_and_report
owner_controlled_actions:
- proposal_accept
- proposal_reject
- proposal_defer
- choice_decide
- work_accept
- work_finalize
- work_cleanup
- proposal_branch_accept
- proposal_branch_reject
- proposal_branch_merge
- proposal_branch_finalize
- proposal_branch_remote_publish
- direct_git_merge
- raw_git_managed_branch
- raw_git_managed_sync
write_policy:
  analysis_without_write: allowed
  preview_required_for:
  - meaningful_persistent_write
  - external_side_effect
  preview_can_be_skipped_when: owner_requested_exact_operation_and_artifact
  exact_request_requires:
  - operation
  - target
  - artifact_kind
  - durable_destination
  preview_fields:
  - operation
  - target
  - artifact_kind
  - write_class
  - canonical_or_derived
  - reason
  - reversibility
  classes:
    read_only:
      description: Inspecting, listing, validating, explaining, or summarizing without
        persistent state changes
      surface: none
    chat_only:
      description: Reasoning, alternatives, critiques, or drafts kept only in the
        current conversation
      surface: chat
    local_scratch:
      description: Temporary notes or transient files that are not durable project
        memory
      surface: local_temp_or_draft
    p2p_canonical:
      description: Governed P2P state such as proposals, choices, decisions, Change
        Sets, Work, registries, or readiness
      surface: p2p_cli_or_explicit_mcp_write_tool
    p2p_generated_narrative:
      description: Generated P2P narrative material that must be created or imported
        through supported primitives
      surface: p2p_generate_or_import_primitive
    p2p_imported_artifact:
      description: External or repository artifact imported into governed P2P state
      surface: p2p_import_primitive
    generated_export:
      description: Derived output exported from P2P or repository tooling
      surface: p2p_export_or_repository_output
    stable_documentation:
      description: Durable repository documentation intended by the owner
      surface: repository_docs
    external_side_effect:
      description: Network, provider, CI, publication, notification, or other side
        effect outside the repository
      surface: external_system
placement_policy:
  mode: strict
  governed_state:
    path: .p2p/
    write_surface: p2p_cli_or_explicit_mcp_write_tool
    manual_edit: forbidden_except_explicit_repair
  generated_outputs:
    path: outputs/
    status: derived
    canonical: false
    naming: must_follow_artifact_contract
  preliminary_drafts:
    paths:
    - drafts/
    - docs/drafts/
    status: temporary_or_working
    canonical: false
    promotion_required_for_project_memory: true
  stable_documentation:
    path: docs/
    status: durable_repository_documentation
    canonical_p2p_state: false_unless_imported_or_declared
    requires_owner_intent: true
  local_scratch:
    status: temporary_only
    durable_project_memory: false
    promotion_required_for_project_memory: true
  unknown_destination:
    behavior: preview_and_ask_or_stop
artifact_contract_policy:
  placement_policy_is_not_complete_artifact_schema: true
  exact_evaluable_output_names_from:
  - p2p_artifact_contract
  - explicit_vertical_primitive
  - exact_owner_request
  agent_must_not_invent_durable_output_paths: true
routing_playbook:
  chat_only_exploration: Analyze, compare, critique, or suggest in chat without writing
    persistent state.
  project_definition_work: Use project vertical/context/definition primitives before
    creating durable artifacts.
  proposal_authoring: Use proposal, contribution, questions, artifact, or import primitives;
    never edit .p2p directly.
  choices: Use choice discovery/show/decision primitives and leave owner-controlled
    decisions to the owner.
  vertical_specific_primitives: Use the active vertical lifecycle, such as software-spec
    primitives from PROP-094 when available.
  implementation_work: For implementation work outside `.p2p/`, use repository specs,
    src, tests, and docs.
  exact_file_requests: Write the requested repository path only when the owner specified
    the exact operation and artifact.
  generated_exports: Use export commands or declared repository output locations;
    treat exports as derived by default.
  stable_documentation: Write docs/ only for stable owner-intended documentation after
    classification or exact request.
  local_scratch: Use temporary or draft locations only for disposable work; promote
    or classify before relying on it.
  outside_p2p_work: Follow repository rules for non-P2P work and do not imply that
    P2P governs every durable file.
proposal_readiness:
  inspect_before_acceptance_recommendation: true
  gap_handling:
    do_not_stop_at_diagnosis: true
    steps:
    - explain_failed_gate
    - propose_alternatives
    - recommend_when_supported
    - identify_owner_decision
    - inspect_artifact_coverage
    - draft_candidate_update
    - ask_only_for_owner_authority
    - apply_answers_to_artifacts
    - run_evidence_aware_assess
    - recheck_readiness
  commands:
  - p2p proposal readiness show PROP-XXX
  - p2p proposal readiness init PROP-XXX
  - p2p proposal readiness refresh PROP-XXX
  - p2p proposal readiness assess PROP-XXX
  - p2p proposal readiness explain PROP-XXX
  - p2p proposal artifact status PROP-XXX
  - p2p proposal artifact set PROP-XXX ARTIFACT --status STATUS --reason REASON
  mcp_tools:
  - p2p_proposal_readiness_get
  - p2p_proposal_readiness_init
  - p2p_proposal_readiness_refresh
  - p2p_proposal_readiness_assess
  - p2p_proposal_readiness_explain
  - p2p_proposal_readiness_list_gaps
  - p2p_proposal_artifact_status
  - p2p_proposal_artifact_set
  computed_score_is_advisory: true
  owner_override_must_not_falsify_computed_score: true
project_vertical_orchestration:
  prioritize_when_missing_or_fallback: true
  review_command: p2p project readiness review
  commands:
  - p2p project vertical list
  - p2p project vertical show <vertical-id>
  - p2p project context --format json
  - p2p project definition show --format json
  - p2p project sections --format json
  - p2p project vertical propose "<project idea>"
  - p2p project vertical add <path> --activate
  - p2p project vertical select <vertical-id>
  - p2p project vertical lock show
  - p2p project readiness review
  mcp_tools:
  - p2p_project_vertical_list
  - p2p_project_vertical_show
  - p2p_project_vertical_validate
  - p2p_project_vertical_propose
  - p2p_project_vertical_add
  - p2p_project_vertical_select
  - p2p_project_vertical_lock_show
  - p2p_project_context
  - p2p_project_sections
  - p2p_project_section_show
  - p2p_project_definition_show
  - p2p_project_definition_update
  - p2p_project_readiness_review
  owner_confirms_add_or_select: true
  init_remains_deterministic: true
  one_primary_question_at_a_time: true
  pack_content_is_domain_data_only: true
software_spec_lifecycle:
  vertical: software_project
  default_intent: implementation_spec
  intents:
  - chat_exploration
  - project_definition
  - architecture_comparison
  - implementation_spec
  - downstream_export
  - exact_file_request
  preflight_required_for:
  - p2p_spec_refresh
  - p2p_spec_export
  commands:
  - p2p spec lifecycle --intent implementation_spec --change CHANGE-001
  - p2p spec lifecycle --intent downstream_export --change CHANGE-001 --target speckit
  - p2p spec refresh --change CHANGE-001
  - p2p spec export --change CHANGE-001 --target speckit
  - p2p spec export-validate CHANGE-001 --target speckit
  mcp_tools:
  - p2p_spec_lifecycle
  - p2p_spec_refresh
  - p2p_spec_export
  - p2p_spec_export_validate
  rules:
    implementation_specs_require_governed_change_set: true
    downstream_exports_are_derived: true
    preflight_blockers_stop_writes: true
    advisories_do_not_block_writes: true
    agents_must_not_invent_spec_paths: true
interaction_style:
  source: p2p_project_interaction_style
  scope: project
  defaults:
    technical_verbosity: 2
    formality: 2
    assertiveness: 0
  commands:
    show: p2p project interaction-style show
    set: p2p project interaction-style set
  mcp_tools:
    show: p2p_project_interaction_style_show
    set: p2p_project_interaction_style_set
  scales:
    technical_verbosity:
    - value: 0
      label: plain
      description: Avoid engine and technical workflow terms unless required for correctness.
    - value: 1
      label: minimal
      description: Use minimal operational terms and put plain-language summaries
        first.
    - value: 2
      label: balanced
      description: Use light engine vocabulary when useful.
    - value: 3
      label: specific
      description: Name relevant commands, artifacts, and state when they clarify
        the work.
    - value: 4
      label: detailed
      description: Usually name commands, files, artifacts, and verification steps.
    - value: 5
      label: exhaustive
      description: Provide command-by-command and file/state level explanation when
        relevant.
    formality:
    - value: 0
      label: colloquial
      description: Use a highly informal and colloquial tone while staying respectful.
    - value: 1
      label: casual
      description: Use a casual and direct tone.
    - value: 2
      label: direct
      description: Use a direct, human, and professional tone for normal project work.
    - value: 3
      label: professional
      description: Use a clearly professional and measured tone.
    - value: 4
      label: formal
      description: Use a formal and reserved tone.
    - value: 5
      label: detached
      description: Use a highly formal, detached, and precise tone.
    assertiveness:
    - value: 0
      label: baseline
      description: Use current baseline follow-up behavior without extra pressure.
    - value: 1
      label: light
      description: Use light nudges for important gaps.
    - value: 2
      label: regular
      description: Follow up regularly on missing evidence and unclear decisions.
    - value: 3
      label: proactive
      description: Challenge weak assumptions and incomplete artifacts proactively.
    - value: 4
      label: strict
      description: Enforce ordering and repeat next questions until the owner stops,
        defers, mutes, or decides.
    - value: 5
      label: exacting
      description: Persistently close gaps and enforce order while staying bounded
        by owner authority.
  affects:
  - owner_facing_wording
  - detail_level
  - follow_up_pressure
  does_not_affect:
  - governance_authority
  - readiness_scores
  - validation_truth
  - permissions
  - consent
  - factual_claims
  effective:
    configured: true
    source: configured
    values:
      technical_verbosity: 2
      formality: 2
      assertiveness: 2
    labels:
      technical_verbosity: balanced
      formality: direct
      assertiveness: regular
    path: .p2p/project/interaction-style.yml
managed_git_collaboration:
  raw_git_for_managed_state: forbidden_without_owner_escape_hatch
  inspect_before_branching:
  - p2p status
  - p2p sync status
  proposal_branch_commands:
  - p2p proposal branch PROP-XXX --actor <actor>
  - p2p proposal status PROP-XXX
  - p2p proposal publish PROP-XXX
  - p2p proposal publish PROP-XXX --auto-renumber
  - p2p proposal request-review PROP-XXX
  - p2p proposal scan
  - p2p proposal retire-branch PROP-XXX --reason <reason>
  sync_commands:
  - p2p sync status
  - p2p sync fetch
  - p2p sync pull
  - p2p sync push
  mcp_tools:
  - p2p_project_remote_configure
  - p2p_consent_request
  - p2p_sync_status
  - p2p_sync_fetch
  - p2p_sync_pull
  - p2p_sync_push
  - p2p_proposal_draft_commit
  - p2p_proposal_branch
  - p2p_proposal_branch_status
  - p2p_proposal_publish
  - p2p_proposal_request_review
  - p2p_proposal_accept_branch
  - p2p_proposal_reject_branch
  - p2p_proposal_merge
  - p2p_proposal_finalize
  - p2p_proposal_cleanup
  - p2p_proposal_branch_scan
  - p2p_work_branch
  - p2p_work_submit
  - p2p_work_review
  - p2p_work_publish
  - p2p_work_request_review
  - p2p_work_accept
  - p2p_work_finalize
  - p2p_work_cleanup
  deferred_permission_gated_mcp_tools:
  - p2p_proposal_retire_branch
allowed_mutation_boundary:
  use_p2p_cli_commands: true
  use_mcp_write_tools_only_when_available: true
  invent_internal_p2p_files: false
  invent_ids_or_registry_entries: false
  write_decision_files_directly: false
explain_existing_artifacts:
  read_before_explaining: true
  allowed_sources:
  - p2p context
  - p2p proposal show
  - p2p choice show
  - p2p change show
  - p2p work show
  - equivalent MCP show/read tools
  avoid_memory_only_explanations: true
token_budget:
  compact_context_first: true
  default_command: p2p context --budget small
  mcp_tool: p2p_context
  read_details_only_by_id: true
  broad_scans_require_explicit_need: true
  advanced_token_estimation: deferred
