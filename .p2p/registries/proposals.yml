- id: PROP-056
  title: Project Definition Maturity Rubrics
  status: accepted
  path: .p2p/proposals/PROP-056-project-definition-maturity-rubrics
  summary: 'Add Project Definition Maturity Rubrics. A project may define a domain
    and an enabled list of criteria under .p2p/project/rubrics.yml. The first MVP
    ships deterministic built-in rubrics for at least generic and software domains,
    with an architecture that can add grant_document, board_game, hardware, service,
    and other domains later. The init flow should be able to create an initial rubric
    profile, and a dedicated command should refresh/show maturity assessment. The
    assessment should scan P2P project artifacts conservatively and report each criterion
    as covered, partial, or missing, with evidence IDs when available. Scores represent
    definition maturity: whether the planned project has treated relevant topics enough
    for export, not whether implementation has been completed.'
