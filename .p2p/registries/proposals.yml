- id: PROP-092
  title: Local MCP Work Lifecycle Parity And Remote Gateway Boundary
  status: accepted
  path: .p2p/proposals/PROP-092-local-mcp-work-lifecycle-parity-and-remote-gateway-boundary
  summary: 'Introduce local MCP Work lifecycle parity for P2P Engine. The local MCP
    adapter distributed with P2P Engine should expose the managed Work lifecycle through
    domain-specific tools that map to the same core services used by the CLI. The
    intended tool set includes read/status tools that already exist and new mutating
    tools for Work branch, submit, review, publish, request-review, accept, finalize,
    and cleanup where the CLI transition exists. Privileged or externally visible
    transitions must require a valid consent receipt matching operation, target Work
    ID, actor, and relevant execution context. Tools must fail closed when the Work
    state, current branch, base branch, worktree cleanliness, remote profile, receipt
    status, or expected execution context is invalid. Accept must preserve merge-conflict
    behavior and return structured conflict output instead of pretending that a merge
    succeeded. Finalize and cleanup must remain separate owner-controlled steps. Cleanup
    must distinguish local branch deletion from remote branch deletion. All mutating
    tools must return structured governance/effect metadata and record consent consumption/audit
    consistently with the proposal-branch MCP pattern. The local MCP adapter may assume
    a self-managed local trust boundary, but it must not bypass P2P policy or raw
    Git protections. The remote Wavekit MCP gateway is intentionally out of scope:
    it should later call the same command layer while adding authenticated principals,
    client identity, grants, scoped receipts, rate limits, audit retention, and commercial
    collaboration controls outside the P2P core.'
  decision_file: .p2p/proposals/PROP-092-local-mcp-work-lifecycle-parity-and-remote-gateway-boundary/decision.md
