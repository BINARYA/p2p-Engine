    in .p2p/project/next-actions.yml. Completed and retired curated actions are moved
    to .p2p/project/next-actions-log.yml with status, reason, and date. Generated
    actions are computed at runtime from project state using the existing fallback/blocker
    logic and shown alongside curated actions with clear source labels. Add CLI commands
    p2p next list, p2p next add, p2p next complete, p2p next retire, and p2p next
    refresh. The default p2p next view should list curated plus generated actions
    with deduplication by kind/target. p2p next complete NEXT-003 --reason ... should
    remove the obsolete curated item from active next actions and record an audit
