- id: PROP-088
  title: MCP Artifact Import Parity
  status: accepted
  path: .p2p/proposals/PROP-088-mcp-artifact-import-parity
  summary: 'Add explicit write-safe MCP tools that call existing P2P Engine import
    services for proposal artifact content. The MVP scope covers total MCP parity
    with the existing controlled CLI import primitives that have fixed targets and
    validation: exploration imports, impact imports, clarification imports, synthesis/proposal
    imports, plan imports, and tasks imports. Generic arbitrary artifact import/update
    remains deferred until a stricter allowlist, validation model, and audit boundary
    are designed. MCP import tools should support both source paths and direct content
    payloads: source paths preserve parity with current CLI services and directory-based
    imports, while direct payloads support real MCP client workflows where generated
    content is already available in the tool call. All tools must use explicit artifact
    kinds, preserve existing validation behavior, return structured metadata about
    imported files, and keep unsupported artifact-content mutations as explicit missing-primitive
    errors. Documentation should describe the new MCP surface, supported artifact
    kinds, unsupported cases, path-vs-payload behavior, validation/audit boundaries,
    and the relationship between artifact content imports and artifact coverage state.'
