- id: PROP-066
  title: Permission-Gated MCP Governance And Git Operations
  status: accepted
  path: .p2p/proposals/PROP-066-permission-gated-mcp-governance-and-git-operations
  summary: "Adopt a hybrid Role + Consent Receipt model for permission-gated MCP governance\
    \ and Git operations.\n\nP2P distinguishes three concepts:\n\n- actor_id: the\
    \ declared person, agent, or client performing work; useful for audit and collaboration\
    \ but not strong authentication in local/Git-only mode.\n- authorizer: the project\
    \ role or owner identity that approves a privileged operation.\n- enforcer: the\
    \ mechanism that actually prevents unauthorized state changes. In local projects\
    \ this is mostly P2P policy and audit. In cloud-backed projects this must be Git\
    \ provider permissions, branch protection, required approvals, and token scopes.\n\
    \nProject-declared roles are stored in versioned P2P project policy, such as `.p2p/project/permissions.yml`\
    \ or an equivalent generated policy file. On project init, P2P should ask for\
    \ or accept an owner display name. If no owner is provided, it creates a generic\
    \ `owner` identity. Contributor identities may be added later; if no contributor\
    \ name is known, P2P may use generic `contributor` or agent IDs for branch metadata.\n\
    \nExample policy:\n\n```yaml\npermissions:\n  version: 1\n  identities:\n    owner:\n\
    \      role: owner\n      kind: person\n      display_name: owner\n    contributor:\n\
    \      role: contributor\n      kind: person\n      display_name: contributor\n\
    \  roles:\n    owner:\n      can_grant_consent: true\n      can_manage_permissions:\
    \ true\n    maintainer:\n      can_request_privileged_operations: true\n    contributor:\n\
    \      can_create_local_branches: true\n      can_request_review: true\n    agent:\n\
    \      can_use_safe_tools: true\n    readonly:\n      can_read: true\n```\n\n\
    Tool classes:\n\n- safe_read: read/status/context/scan tools; no consent required.\n\
    - write_safe_preparatory: deterministic or local preparatory operations such as\
    \ fetch and proposal branch creation; no owner consent required by default, but\
    \ must be audited when they touch Git state.\n- privileged_publish: publish, push,\
    \ request-review, provider PR/MR handoff; requires a valid consent receipt unless\
    \ project policy explicitly allows the actor role.\n- owner_controlled_governance:\
    \ accept, reject, defer, choice decide, select candidate, merge, finalize, cleanup;\
    \ requires owner consent receipt.\n- destructive_or_external: cleanup, branch\
    \ deletion, provider side effects, irreversible remote changes; requires owner\
    \ consent receipt, single-use, and explicit audit.\n\nConsent receipts are versioned\
    \ audit records granting one bounded privileged operation. They include consent_id,\
    \ operation, target, actor_id, requested_by, approved_by, role, scope, expiry,\
    \ single_use flag, created_at, and optional provider metadata. Sensitive MCP tools\
    \ must refuse execution without a valid unexpired receipt. After single-use execution,\
    \ the receipt is marked consumed with result metadata.\n\nThe MVP does not require\
    \ external IAM. Project init should support an owner name but must fall back to\
    \ generic `owner`. The model is declarative and auditable locally. In cloud-backed\
    \ projects, robust enforcement depends on Git provider controls protecting main\
    \ and privileged remote actions. A future P2P API server may replace or augment\
    \ declarative identities with authenticated users, OAuth, organization membership,\
    \ signed consent, or IAM-backed policy checks.\n\nSafe MCP surface may remain\
    \ available before privileged consent implementation: sync status/fetch and proposal\
    \ branch/status/scan. MCP pull, push, publish, request-review, retire, accept,\
    \ reject, merge, finalize, cleanup, provider PR/MR handoff, and protected-branch\
    \ updates remain deferred until role policy, consent receipts, and audit records\
    \ are implemented."
  decision_file: .p2p/proposals/PROP-066-permission-gated-mcp-governance-and-git-operations/decision.md
  related_changes:
