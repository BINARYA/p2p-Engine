- id: PROP-084
  title: Project-Local Runtime Bootstrap And Upgrade Flow
  status: accepted_with_changes
  path: .p2p/proposals/PROP-084-project-local-runtime-bootstrap-and-upgrade-flow
  summary: Refocus PROP-084 on a minimal Project Runtime Contract and Runtime Version
    Alignment. Each P2P-managed project may declare .p2p/project/runtime.yml with
    a schema version, a compatible P2P Engine range, and a recommended P2P Engine
    runtime version. The contract tells a collaborator which runtime is expected and
    gives an installed runtime enough information to verify compatibility. New projects
    should receive both runtime.yml and a project-local P2P-SETUP.md that renders
    the same facts for humans and agents. When P2P Engine is available, runtime status
    reports compatible, incompatible, invalid_contract, unsupported_contract, missing_contract,
    or legacy_undeclared states with actionable guidance. Projects without any marker
    requiring runtime.yml are legacy_undeclared and warning-only. Projects that declare
    or require a runtime contract but are incompatible, invalid, unsupported, or missing
    the required contract must block governed writes before mutation. The proposal
    does not require a bootstrap script, does not add an install manager, does not
    perform runtime mutation, and does not depend on release wheel metadata.
