- id: PROP-082
  title: Readiness Assessment Refresh And Review Workflow
  status: accepted
  path: .p2p/proposals/PROP-082-readiness-assessment-refresh-and-review-workflow
  summary: Extend the readiness review and proposal-question workflow so generated
    questions are artifact-aware, not only score-gap-aware. When readiness is weak,
    low-confidence, blocked by gates, or missing evidence, the agent must inspect
    the full proposal artifact set and generate or update questions that seek coverage
    across proposal.md, exploration.md, findings.md, alternatives.md, risks.md, assumptions.md,
    open-questions.md, suggested-scope.md, impact-map.yml, related/conflict artifacts,
    readiness.yml, questions.yml, and duplicate or aggregation evidence. The question
    list should represent the missing information needed to make the proposal robust
    and approvable, not just the labels currently listed in readiness.missing. When
    answers are recorded, the workflow must help the agent apply them to every useful
    affected artifact through available CLI or MCP write primitives. A question answer
    may update the proposal text, acceptance criteria, alternatives, tradeoffs, risks,
    assumptions, open questions, impact analysis, duplicate/aggregation notes, or
    readiness evidence. Applied question state should mean the answer has been propagated
    into proposal artifacts or an explicit reason exists for why no artifact update
    was needed. Agent assertiveness should be driven by a stepped readiness policy
    rather than a separate pedantry score. Very low or weak readiness requires proactive
    challenge, next-question selection, and refusal to recommend acceptance without
    owner override. Partial readiness requires focused follow-up on missing artifacts
    and high-risk ambiguity. Near-target readiness requires only residual high-value
    questions or confirmation. Deferred and muted question/group states reduce re-asking
    unless the owner explicitly asks to increase readiness or revisit unanswered material.
    After applying answers or importing refined artifacts, readiness must be recalculated
    through the evidence-aware assessment path; low readiness should cause the skill
    to direct the agent to continue interviewing the owner instead of passively reporting
    gaps.
  decision_file: .p2p/proposals/PROP-082-readiness-assessment-refresh-and-review-workflow/decision.md
