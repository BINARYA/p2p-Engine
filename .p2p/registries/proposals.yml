  title: MCP End-To-End Proposal Collaboration Workflow
  status: accepted
  path: .p2p/proposals/PROP-075-mcp-end-to-end-proposal-collaboration-workflow
  summary: 'Define an MCP end-to-end proposal collaboration workflow: create or update
    draft proposal, persist/commit draft state through an explicit P2P primitive or
    documented auto-commit policy, create a managed proposal branch from an explicit
    base branch such as main, request or reference owner consent, publish the branch,
    and request review. Add MCP tools or behavior such as p2p_project_remote_configure,
    p2p_consent_request, p2p_proposal_draft_commit, and p2p_proposal_branch with base_branch.
    Keep p2p_consent_grant owner-controlled; MCP may request consent, but granting
    consent should remain CLI/UI/server owner action until strong authentication exists.'
