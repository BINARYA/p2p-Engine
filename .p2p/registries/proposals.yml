- id: PROP-006
  title: Multi-Agent Integration Model
  status: accepted
  path: .p2p/proposals/PROP-006-multi-agent-integration-model
  summary: 'Introduce an Agent Integration Registry MVP. By default, p2p init creates
    the generic baseline and all supported project-local adapter files for generic,
    codex, claude, cursor, copilot, gemini, and opencode. The owner may request a
    narrower init set with repeated --agent options, but generic is always included
    and cannot be removed. P2P records installed integrations in .p2p/agent-integrations.yml
    using schema_version 1, baseline_profile: generic, adapter status, maturity, capabilities,
    template_version, generated file records, shared ownership, managed flag, template_id,
    SHA-256 hash over exact file bytes, and drift state. The registry must not contain
    active_agent, default_agent, preferred_agent, current_agent, use, or switch state.
    Built-in adapter templates live in package data under src/p2p_engine/templates/agents/<adapter>/
    for the MVP; project-local template overrides are deferred. Generated Markdown
    files should include a short managed header as a human hint, while the registry
    remains authoritative. The CLI exposes p2p agent list, show, install, update,
    doctor, and uninstall; excluded commands are use, switch, current, and install
    --no-use. doctor validates registry shape, file existence, hashes, shared references,
    generic baseline, ownership conflicts, uninstall safety, and presence of the generic
    method behavior block. install all may install every supported project-local integration
    only when non-shared file targets do not conflict. Migration is conservative:
    known generated files become managed, unknown or changed files become unmanaged
    or drifted, and P2P never overwrites them silently. Generated files derive from
    minimal generic P2P governance content and may be adapted for host tools without
    weakening the rules. That generic content must include readiness-driven refinement
    behavior: when a proposal is weak, low-confidence, below target, or blocked by
    failed gates, the agent must explain each gap, propose concrete alternatives,
    recommend one when justified, identify owner decisions, draft candidate updates,
    and re-check readiness after refinement. Initial files are AGENTS.md and .p2p/agent-policy.yml
    for generic; AGENTS.md plus a shared agent-neutral .agents/skills/p2p-project/SKILL.md
    for Codex when safe, with .codex/skills preserved as compatibility/migration;
    CLAUDE.md for Claude; .cursor/rules/p2p.mdc for Cursor; .github/copilot-instructions.md
    for Copilot; GEMINI.md for Gemini; and AGENTS.md only for OpenCode in the MVP.
    opencode.json is not generated by default. CLI and MCP tools are implemented over
    the same core behavior, with MCP exposing structured equivalents for compatible
    agents. Future readiness refinement commands should live under p2p proposal readiness,
    but they are not required for accepting this proposal.'
