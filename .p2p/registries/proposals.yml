- id: PROP-057
  title: Guided Rubric Selection During Init
  status: accepted
  path: .p2p/proposals/PROP-057-guided-rubric-selection-during-init
  summary: Add Guided Rubric Selection During Init. When p2p init runs interactively,
    after project domain selection it should ask whether to customize rubric criteria.
    If the owner says no, P2P keeps all domain criteria enabled. If the owner says
    yes, P2P asks an enable/disable confirmation for each suggested criterion and
    saves the selected enabled flags into .p2p/project/rubrics.yml. Scripted init
    with a project name remains non-interactive and uses the full default rubric for
    the selected domain.
  decision_file: .p2p/proposals/PROP-057-guided-rubric-selection-during-init/decision.md
