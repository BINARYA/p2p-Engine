- id: PROP-001
  title: CLI Foundation
  status: accepted
  path: .p2p/proposals/PROP-001-cli-foundation
  summary: 'Build the first P2P Engine CLI using Python and Typer.


    The CLI should focus on local file generation and workflow guidance:


    ```text

    p2p init

    p2p proposal create

    p2p contribution add

    p2p digest prompt

    p2p clarify prompt

    p2p decision record

    p2p plan prompt

    p2p tasks prompt

    p2p status

    ```


    The first version should implement prompt generation instead of direct AI integration.
    A command such as:


    ```bash

    p2p digest prompt PROP-001

    ```


    should generate:


    ```text

    .p2p/prompts/PROP-001/digest.prompt.md

    ```


    The user can then provide that prompt to Codex, ChatGPT, Claude, Llama, or another
    model manually and paste the output into the correct artifact.'
  decision_file: .p2p/proposals/PROP-001-cli-foundation/decision.md
  related_changes: []
