- id: PROP-076
  title: P2P Cloud Runner Boundary and Containerized Execution Model
  status: accepted
  path: .p2p/proposals/PROP-076-p2p-cloud-runner-boundary-and-containerized-execution-model
  summary: 'Adopt a strict boundary: P2P Engine exposes stable local automation primitives
    through CLI, local project files, Git, and local MCP. P2P Cloud is a separate
    web/API product that uses P2P Engine by launching isolated runner jobs. The cloud
    stack may use Caddy, a web/API framework such as Django/DRF or NestJS, PostgreSQL
    for users/projects/jobs/permissions, Redis or equivalent queues, Prefect or equivalent
    workflow orchestration, and ephemeral p2p-runner containers. Each runner gets
    a temporary workspace, checks out or initializes the target Git repository, executes
    p2p CLI commands, records .p2p state, commits/pushes through Git, emits logs/artifacts,
    and exits. P2P Engine must not become a public multi-tenant API server, IAM system,
    web UI, workflow scheduler, provider PR automation service, or hosted database-backed
    application.'
  decision_file: .p2p/proposals/PROP-076-p2p-cloud-runner-boundary-and-containerized-execution-model/decision.md
