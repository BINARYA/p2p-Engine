- id: PROP-083
  title: Domain-Aware Visible Project Definition Export
  status: accepted
  path: .p2p/proposals/PROP-083-domain-aware-visible-project-definition-export
  summary: 'Introduce a domain-aware visible project definition export. The default
    export for every P2P project should be a human-facing, comprehensive Markdown
    document written to outputs/latest/project.md. The document should be organized
    in chapters and synthesize accepted P2P memory: project purpose, domain, problem
    framing, accepted proposals, decisions, requirements, scope boundaries, alternatives,
    tradeoffs, risks, assumptions, open questions, readiness notes, and relevant implementation
    or delivery context. The output should be generic across verticals and should
    not assume that the project is software. The visible root-level outputs/ directory
    is intentional and not configurable in the MVP because human accessibility is
    more important than keeping the repository root minimal; outputs/ is preferred
    over project/ because it clearly describes generated visible outputs and avoids
    confusion with .p2p/project. Each export run should preserve review history by
    writing or archiving prior versions under outputs/review-001, outputs/review-002,
    and later review directories. Domain-specific exports are additional nested profiles,
    not the default. For software-compatible projects, software-spec, OpenSpec, Spec
    Kit, or similar outputs may be generated under outputs/latest/exports/software-spec/,
    outputs/latest/exports/openspec/, outputs/latest/exports/speckit/, or equivalent
    profile folders. Other verticals may define their own export profiles under outputs/latest/exports/<profile-or-vertical>/.
    Existing .p2p/outputs behavior must be treated as a compatibility surface: the
    implementation should verify whether current generated artifacts are still needed,
    preserve public CLI/API expectations, and only remove, deprecate, or relocate
    legacy outputs through an explicit compatibility path.'
