- id: PROP-002
  title: Exploration Phase
  status: draft
  path: .p2p/proposals/PROP-002-exploration-phase
  summary: 'Introdurre una fase autonoma e ripetibile chiamata `explore`.


    `explore` non riassume e non decide. Serve a interrogare la proposta e generare
    materiale che alimenta clarify, synthesize, decision, plan e tasks.


    Gli output validi devono essere salvati negli artefatti P2P versionati:


    ```text

    exploration.md

    findings.md

    alternatives.md

    open-questions.md

    risks.md

    assumptions.md

    suggested-scope.md

    ```


    La CLI deve supportare:


    ```bash

    p2p explore prompt PROP-002

    p2p explore import PROP-002 exploration-output.md

    p2p explore status PROP-002

    ```'
  decision_file: .p2p/proposals/PROP-002-exploration-phase/decision.md
