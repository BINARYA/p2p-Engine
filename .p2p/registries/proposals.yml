  path: .p2p/proposals/PROP-055-agent-token-budget-and-context-discipline
  summary: Introduce an Agent Token Budget and Context Discipline with a narrow MVP
    based on compact deterministic context packets. The first implementation combines
    skill policy, CLI context view, and MCP context tool. Agents must read compact
    summaries first, then details only by explicit ID, and stop once the next bounded
    action is clear. Add p2p context, p2p context --budget small, p2p context --target
    ID, and an equivalent p2p_context MCP tool. The context output should include
    current state, next actions, relevant artifacts, allowed commands, explicit do-not-read
    guidance, and the smallest sufficient next step. Full repository scans, broad
    .p2p traversal, full registry reads, source-code exploration, and Git history
    reads are disallowed unless the user task explicitly requires them or the compact
    context is insufficient. Advanced token estimation, numeric budgets, read tracking,
    and model-specific optimization are deferred until after the MVP works in practice.
  decision_file: .p2p/proposals/PROP-055-agent-token-budget-and-context-discipline/decision.md
  related_changes:
  - CHANGE-040
