- id: PROP-074
  title: Agent Runtime Bootstrap Robustness
  status: accepted
  path: .p2p/proposals/PROP-074-agent-runtime-bootstrap-robustness
  summary: 'Introduce an Agent Runtime Bootstrap Robustness model. Generated AGENTS.md,
    agent policy, and docs should include a runtime discovery sequence: try p2p, try
    repository-local virtualenv paths when present, try python -m p2p_engine if the
    package is importable, then check MCP availability. Add a diagnostic command or
    script such as p2p doctor, p2p agent doctor, or a lightweight repo-local bootstrap
    hint that reports whether p2p CLI, MCP server, Git, and project root are usable.
    For cloud environments, provide a documented install/bootstrap path that agents
    can request from the owner rather than stopping with only p2p command not found.
    The Missing Primitive Rule remains valid, but the error should include actionable
    recovery steps.'
