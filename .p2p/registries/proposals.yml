- id: PROP-098
  title: Test Impact and Validation Routing
  status: draft
  path: .p2p/proposals/PROP-098-test-impact-and-validation-routing
  summary: 'Introduce a Test Impact and Validation Routing model for P2P Engine. The
    model should map repository areas such as services, CLI command modules, MCP catalogs
    and handlers, storage/facade code, Git adapters, generated artifact flows, docs,
    and tests to required validation tiers and representative test targets. The routing
    should include escalation rules for public CLI/MCP behavior, persisted file schemas,
    registry or validation behavior, Git/sync/branch side effects, permission or governance
    semantics, and broad refactors. When impact is uncertain, the route must fall
    back conservatively to public-contract or full validation. The system should surface
    a readable rationale, for example: changed files, inferred areas, required commands,
    skipped broader tiers, and the reason a full suite is or is not needed.'
