- id: PROP-089
  title: Readiness Question-State Convergence
  status: accepted
  path: .p2p/proposals/PROP-089-readiness-question-state-convergence
  summary: 'Revise evidence-aware proposal readiness so questions.yml is the authoritative
    source for owner_questions_resolution whenever it exists. Blocking owner questions
    are unresolved structured questions with status to_answer or reopened and high
    priority by default. A question with status answered must not count as missing
    owner input; it represents received owner input that still needs application into
    proposal artifacts or readiness evidence, and should appear as answered_not_applied
    or residual follow-up until applied. Medium and low unresolved questions are residual
    follow-up, cautions, or confidence reductions unless a readiness policy explicitly
    marks them blocking. Applied, retired, and superseded questions are closed for
    owner-question readiness. Muted and deferred questions are non-blocking; deferred
    items may reduce confidence or appear as cautions. When questions.yml exists,
    open-questions.md is narrative evidence only and cannot reopen structured questions.
    For legacy proposals without questions.yml, keep the current markdown fallback.
    Readiness explain/review should show blocking_owner_questions, answered_not_applied,
    residual_follow_up, confidence_notes, and whether markdown fallback was used.
    Owner override remains valid: the owner may accept or proceed despite unresolved
    questions, but readiness records the override separately from the computed state;
    override changes the governance/effective decision status, not the computed readiness
    truth.'
