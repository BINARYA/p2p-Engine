conflicts:
  - type: semantic_model_gap
    proposals:
      - PROP-019
      - PROP-102
    reason: The existing decision shortcut model writes one current outcome, while PROP-102 requires a sequence of immutable decision events and a derived current projection.
    suggested_resolution: extend_without_erasing_existing_history
  - type: compatibility_transition
    proposals:
      - PROP-010
      - PROP-053
      - PROP-102
    reason: Existing consumers treat proposal status and decision status as directly stored values; migration must prevent mixed authority semantics.
    suggested_resolution: versioned_read_compatibility_then_forward_migration
  - type: authority_boundary
    proposals:
      - PROP-066
      - PROP-077
      - PROP-093
      - PROP-102
    reason: New revision operations could bypass owner authority if actor text or MCP input is treated as proof of permission.
    suggested_resolution: one_permission_gated_domain_service
  - type: downstream_state_mismatch
    proposals:
      - PROP-079
      - PROP-094
      - PROP-100
      - PROP-102
    reason: Revoking normative authority does not automatically cancel active delivery work or remove implemented behavior.
    suggested_resolution: impact_preview_and_explicit_remediation_without_automatic_lifecycle_mutation
