  - id: Q002
    group_id: QG001
    gap: owner_questions_resolution
    criterion: owner_questions_resolution
    priority: medium
    state: applied
    question: "Una decisione revoked pu\xF2 essere riattivata con un evento owner-controlled\
      \ reinstated quando il contenuto torna identico, oppure ogni riattivazione deve\
      \ passare da una nuova proposta collegata?"
    rationale: Serve evitare sia la riscrittura della revoca sia la proliferazione
      inutile di proposte quando viene ripristinata esattamente la stessa decisione.
    answer: "Confermo: un evento owner-controlled reinstated \xE8 consentito soltanto\
      \ per ripristinare la stessa decisione con fingerprint semantico identico, riferimento\
      \ esplicito alla revoca precedente e nuovo impact preview. Non ripristina automaticamente\
      \ effetti tecnici o lifecycle dipendenti. Qualsiasi modifica a contenuto, condizioni\
      \ o vincoli richiede una nuova proposta collegata."
    answer_source: owner
