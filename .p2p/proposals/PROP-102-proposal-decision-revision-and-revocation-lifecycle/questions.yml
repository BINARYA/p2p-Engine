  - id: Q005
    group_id: QG004
    gap: assumptions_clarity
    criterion: assumptions_clarity
    priority: medium
    state: applied
    question: Confermi che la migrazione dei decision artifact legacy debba preservare
      valori mancanti o malformati come unknown_legacy con provenienza esplicita,
      senza inferire owner, data o motivazione dai timestamp Git?
    rationale: "La migrazione deve essere loss-aware e non pu\xF2 trasformare metadati\
      \ tecnici in falsa evidenza decisionale dell'owner."
    answer: "Confermo la gestione loss-aware: preservare i valori validi; rappresentare\
      \ campi mancanti o malformati come unknown_legacy con provenienza e valore originale\
      \ quando leggibile; non inferire owner, data o motivazione da Git; emettere\
      \ diagnostiche per autorit\xE0 ambigua; bloccare nuove revisioni sul record\
      \ finch\xE9 l'owner non cura l'ambiguit\xE0; consentire comunque alla migrazione\
      \ di preservare il record storico."
    answer_source: owner
