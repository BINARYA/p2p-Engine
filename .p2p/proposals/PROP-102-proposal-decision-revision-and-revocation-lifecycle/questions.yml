    gap: tradeoff_analysis
    criterion: tradeoff_analysis
    priority: high
    state: applied
    question: Confermi che la revoca debba restare consentita anche in presenza di
      Change Set, Work o implementazioni dipendenti, dopo un impact preview, generando
      remediation actions senza mutare automaticamente i loro lifecycle?
    rationale: "Bloccare la revoca impedirebbe all'owner di correggere una decisione;\
      \ automatizzare il rollback confonderebbe autorit\xE0 normativa e realt\xE0\
      \ implementata."
    answer: "Confermo: la revoca resta consentita all'owner anche in presenza di Change\
      \ Set, Work o implementazioni dipendenti, ma richiede prima un impact preview.\
      \ La revoca disattiva l'autorit\xE0 della decisione e genera remediation actions\
      \ esplicite, senza modificare automaticamente i lifecycle dipendenti e senza\
      \ dichiarare completati rollback o correzioni."
