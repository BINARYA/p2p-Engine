  - id: Q004
    group_id: QG003
    gap: alternatives_quality
    criterion: alternatives_quality
    priority: medium
    state: applied
    question: "Per la persistenza preferisci fissare gi\xE0 nella proposta un ledger\
      \ versionato per proposta, oppure lasciare al design il confronto tra ledger\
      \ unico e file evento immutabili purch\xE9 il contratto pubblico resti event-based?"
    rationale: "La scelta influenza atomicit\xE0, qualit\xE0 dei diff Git, isolamento\
      \ della corruzione e costo della migrazione, ma pu\xF2 essere rinviata senza\
      \ indebolire il modello di dominio."
    answer: "Confermo un ledger versionato per proposta come sorgente canonica degli\
      \ eventi decisionali, con stato corrente mantenuto come proiezione separata\
      \ e compatibile. Il design definir\xE0 nome, formato fisico, ordinamento, predecessor\
      \ e protezioni d'integrit\xE0, ma potr\xE0 cambiare il modello soltanto sulla\
      \ base di evidenze tecniche esplicite."
    answer_source: owner
