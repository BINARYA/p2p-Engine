  - id: Q001
    group_id: QG001
    gap: owner_questions_resolution
    criterion: owner_questions_resolution
    priority: high
    state: applied
    question: "Confermi questa terminologia canonica: withdrawn per una proposta abbandonata\
      \ prima dell'adozione, revoked per una decisione accettata poi annullata senza\
      \ sostituzione, superseded per una decisione sostituita con lineage esplicita,\
      \ e deprecated come stato operativo downstream anzich\xE9 esito terminale della\
      \ proposta?"
    rationale: Le transizioni, la migrazione e la futura memoria consolidata dipendono
      da significati mutuamente esclusivi.
    answer: 'Confermo la terminologia canonica proposta: withdrawn per una proposta
      abbandonata prima dell''adozione; rejected per una proposta valutata ma mai
      adottata; revoked per una decisione precedentemente accettata e poi annullata
      senza sostituzione; superseded per una decisione sostituita con lineage esplicita;
      deprecated come stato operativo downstream e non come esito terminale della
      proposta.'
    answer_source: owner
    answered_at: '2026-07-17'
