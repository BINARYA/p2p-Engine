impact:
  proposal: PROP-102
  features:
    - versioned append-only proposal decision events
    - one canonical versioned decision-event ledger per proposal
    - deterministic effective-status and authority projection
    - validated decision transition matrix
    - owner-controlled revocation withdrawal supersession and reinstatement
    - source-bound preview and atomic decision mutation
    - legacy single-decision compatibility and forward migration
    - downstream decision-impact diagnostics and remediation actions
  commands:
    - p2p proposal accept
    - p2p proposal reject
    - p2p proposal defer
    - p2p decision record
    - future p2p proposal withdraw
    - future p2p proposal revoke
    - future p2p proposal supersede
    - future p2p proposal reinstate
    - permission-gated MCP proposal decision operations
  files:
    - src/p2p_engine/core/decision.py
    - src/p2p_engine/services/proposal_decisions.py
    - src/p2p_engine/cli_commands/proposal_decisions.py
    - src/p2p_engine/services/lifecycle_authority.py
    - src/p2p_engine/services/decision_context_authority.py
    - src/p2p_engine/services/decision_context_extractors.py
    - src/p2p_engine/services/validation.py
    - src/p2p_engine/services/registry_records.py
    - src/p2p_engine/services/workspace_status.py
    - src/p2p_engine/services/context_packets.py
    - src/p2p_engine/services/next_actions.py
    - src/p2p_engine/services/project_progress.py
    - src/p2p_engine/services/project_assessment.py
    - src/p2p_engine/services/derived_freshness.py
    - src/p2p_engine/services/changes.py
    - src/p2p_engine/services/software_spec_lifecycle.py
    - src/p2p_engine/mcp/handlers/proposals.py
    - src/p2p_engine/mcp/catalog/collaboration.py
    - src/p2p_engine/core/workspace_schema.py
    - src/p2p_engine/services/workspace_migration.py
  governance:
    - final decision revisions remain owner-controlled
    - historical acceptance cannot be erased by a later outcome
    - branch rejection remains distinct from proposal decision rejection
    - revocation changes authority but never proves implementation rollback
    - revocation remains available after impact preview without automatic dependent lifecycle mutation
    - reinstatement requires an identical semantic fingerprint and explicit revocation reference
    - repair and migration cannot invent missing owner evidence
  project_artifacts:
    - proposal.md effective status projection
    - decision.md legacy-compatible current decision view
    - versioned canonical decision-event ledger per proposal
    - registries and project status projections
    - decision-context records and authority
    - vertical coverage and project progress
    - Change Set Work and software-spec impact diagnostics
    - managed next actions and publication state
  dependencies:
    - mutation preview and atomic writer infrastructure
    - workspace schema migration and recovery framework
    - permissions roles and consent receipts
    - decision-context authority and freshness policies
    - relation conflict and vertical evidence semantics
    - stable semantic fingerprinting for reinstatement
  risks:
    - partial migration leaves consumers on incompatible status semantics
    - status vocabulary becomes ambiguous or excessively broad
    - concurrent owner decisions create conflicting event heads
    - revocation is mistaken for completed rollback
    - broken replacement lineage leaves contradictory active decisions
    - future consolidation hides historical reversal
    - ambiguous legacy authority permits an unsafe later revision
