  - id: Q006
    group_id: QG006
    gap: impact_overlap_analysis
    criterion: impact_overlap_analysis
    priority: medium
    state: applied
    question: 'How should PROP-084 relate to PROP-078 project-local install/upgrade
      and PROP-080 release wheel publishing: depend on them, reuse them, or add only
      verification/orchestration around them?'
    rationale: The proposal should orchestrate existing install and release capabilities
      instead of duplicating them.
    answer: PROP-084 depends on adjacent work only at the documentation boundary.
      PROP-080 remains responsible for release wheels and integrity metadata, but
      PROP-084 does not require release metadata to create or validate the runtime
      contract. PROP-078 remains the reference for project-local installation mechanics,
      but PROP-084 does not call those mechanics or manage environments. PROP-084
      owns the minimal runtime contract, project-local setup guide, runtime status,
      validation findings, and contract-aware governed-write gate.
    answer_source: owner
