  questions:
  - id: Q001
    group_id: QG001
    gap: scope_boundaries
    criterion: scope_boundaries
    priority: high
    state: applied
    question: 'What should be the authoritative project runtime contract location
      and schema: a managed .p2p project file, a repository-root bootstrap file, pyproject
      metadata, or a combination with one explicit source of truth?'
    rationale: The runtime contract must be discoverable after clone without making
      Git mandatory or inventing conflicting sources of truth.
    answer: Use a managed .p2p/project/runtime.yml file as the authoritative project
      runtime contract. The schema must be independent from Python packaging because
      P2P Engine may not remain Python-only. Repository-root bootstrap files or wrappers
      may exist only as discoverability/entry-point helpers and must point to or derive
      from the .p2p runtime contract rather than becoming a second source of truth.
    answer_source: owner
