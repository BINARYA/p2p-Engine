  - id: Q003
    group_id: QG003
    gap: alternatives_quality
    criterion: alternatives_quality
    priority: high
    state: applied
    question: Which runtime source metadata should this implementation recognize in
      the contract, and which install mechanisms are outside scope?
    rationale: Source metadata scope determines release publishing dependencies and
      agent guidance without turning PROP-084 into an installer.
    answer: 'This implementation shall not define an installation-source model. The
      runtime contract records only project-local compatibility facts: schema version,
      compatible P2P Engine range, and recommended P2P Engine version. Release tags,
      wheel filenames, SHA-256 digests, source descriptors, arbitrary URLs, arbitrary
      repositories, project-supplied install commands, PyPI resolution, mirrors, repository-local
      wheels, source checkout installs, and editable installs are outside this proposal.
      Unknown extra contract fields that attempt to introduce source or installer
      behavior must not be treated as authorized installation instructions.'
    answer_source: owner
