  - id: Q005
    group_id: QG005
    gap: tradeoff_analysis
    criterion: tradeoff_analysis
    priority: medium
    state: applied
    question: Which project usage contexts must the runtime contract support, and
      which platform-specific or hosted workflows remain outside this proposal?
    rationale: The proposal should stay valid across P2P usage modes while keeping
      the contract focused on project-local version alignment.
    answer: The accepted scope covers the runtime contract across filesystem projects,
      local Git repositories, remote Git clones, copied directories, and extracted
      archives. The same .p2p/project/runtime.yml format applies regardless of how
      the project directory was obtained. Git is not required to inspect the contract,
      and the contract shall not contain mode-specific fields for standalone, local_git,
      or remote_git usage. The feature shall keep the contract schema platform-neutral
      and avoid encoding shell-specific or host-specific paths. Operating-system-specific
      wrappers, Windows installer behavior, managed server orchestration, provider
      automation, package mirroring, shared package caches, source checkout installation,
      editable installation, and broad native wrapper coverage are outside this proposal.
    answer_source: owner
