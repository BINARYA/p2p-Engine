  - id: Q004
    group_id: QG004
    gap: risk_coverage
    criterion: risk_coverage
    priority: high
    state: applied
    question: How should missing, incompatible, invalid, unsupported, and undeclared
      runtime contract states be reported without adding environment mutation?
    rationale: Runtime diagnostics must be explicit without introducing install, upgrade,
      reconcile, or broad blocking behavior in this proposal.
    answer: Runtime handling shall be diagnostic and contract-aware. When P2P Engine
      is missing, the repository exposes runtime.yml and P2P-SETUP.md for a human
      or agent to inspect. When P2P Engine is installed, runtime status and validation
      report compatible, incompatible, invalid_contract, unsupported_contract, missing_contract,
      and legacy_undeclared states. Legacy projects without a marker requiring runtime.yml
      are warning-only. Projects that declare or require a runtime contract must block
      governed writes before mutation when the contract is incompatible, invalid,
      unsupported, or required but missing. The feature shall not perform install,
      upgrade, downgrade, replacement, reconcile, source switching, or environment
      mutation as a side effect.
    answer_source: owner
