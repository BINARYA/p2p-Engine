  - id: Q002
    group_id: QG002
    gap: acceptance_criteria_quality
    criterion: acceptance_criteria_quality
    priority: high
    state: applied
    question: 'What should a fresh clone rely on for runtime version alignment when
      p2p is not installed yet: the runtime contract, documentation, an optional helper,
      or another mechanism?'
    rationale: A mechanism that depends on p2p already being installed does not solve
      version discovery for a fresh clone.
    answer: 'A fresh clone should rely on project-local data: .p2p/project/runtime.yml
      as the source of truth and P2P-SETUP.md as the human and agent-facing guide.
      The runtime contract declares the compatible range and recommended P2P Engine
      version. The setup file renders those facts and points to existing official
      installation guidance. A helper script or wrapper may be designed later, but
      it is not required and must not become a second source of truth.'
    answer_source: owner
