impact:
  proposal: PROP-084
  features:
    - minimal project runtime contract
    - runtime version alignment
    - project-local setup guidance
    - runtime contract validation
    - runtime status diagnostics
    - contract-aware governed-write gate
  commands:
    - p2p runtime status
    - p2p validate
  files:
    - .p2p/project/runtime.yml
    - P2P-SETUP.md
    - docs/INSTALL.md
    - docs/CLI-GUIDE.md
    - docs/AGENT-INTEGRATION.md
  governance:
    - accepted proposal refined by owner to minimal contract-first scope
    - no mandatory bootstrap script
    - no install or reconcile manager in this proposal
    - no release resolver, digest verifier, or source selector in this proposal
    - governed writes are gated only when a declared or required contract cannot be trusted
    - legacy_undeclared projects remain warning-only
  project_artifacts:
    - proposal.md
    - clarifications.md
    - execution-plan.md
    - readiness.yml
  dependencies:
    - PROP-078 remains the owner of installation mechanics and guidance
    - PROP-080 remains the owner of release artifact publication and integrity metadata
  risks:
    - no existing project-level marker may distinguish missing required contract from legacy project
    - older runtimes may ignore runtime.yml
    - write-gate checks could become scattered unless centralized
    - docs drift from contract schema
    - future install automation mistakenly treated as already approved
