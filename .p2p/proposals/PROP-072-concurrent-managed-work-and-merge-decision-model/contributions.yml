contributions:
- id: C001
  type: architectural_principle
  author: davide-via-codex
  relevance_hint: Records owner preferences for unresolved collaboration model alternatives.
  text: 'Owner preference for PROP-072 alternatives: main should contain accepted
    project state only, with draft proposal work kept off main by default; proposal
    branches should use real PROP-XXX identifiers rather than temporary candidate
    IDs, but the system must mitigate concurrent ID collisions through remote fetch/scan
    or another deterministic uniqueness strategy; P2P should manage user-facing remote
    operations such as fetch, pull, push, publish, and review handoff rather than
    emitting instructions that require Matteo or Lorenzo to understand Git; Work selection
    should be required only when multiple Work candidates exist for one Change Set;
    combining candidates should create a new auditable Work or proposal branch derived
    from the source candidates.'
- id: C002
  type: suggestion
  author: davide-via-codex
  relevance_hint: Refines branch naming for proposal ID collision mitigation while
    keeping human-readable PROP IDs.
  text: Proposal branch names can include a stable short hash suffix derived from
    the proposal identity/content/actor, for example p2p/proposal/PROP-073-chiusura-magnetica-lorenzo-a91fd3c4e8b2a7d6.
    This keeps PROP-XXX readable while reducing branch-name collisions across concurrent
    contributors. The hash suffix should be part of the branch name and audit metadata,
    not a replacement for the human-readable proposal ID. The slug should be length-capped
    to keep Git ref paths manageable.
- id: C003
  type: implementation_suggestion
  author: davide-via-codex
  relevance_hint: Defines practical collision recovery for concurrent proposal ID
    allocation.
  text: 'Use a 16-hex-character hash suffix for managed proposal branch names. Concurrent
    PROP-ID allocation should be treated as a recoverable publish-time conflict: after
    fetch/scan allocation, p2p proposal publish attempts to push the managed proposal
    branch using atomic Git push semantics where available. If the remote already
    contains a conflicting PROP-XXX proposal branch or accepted proposal, P2P should
    stop, fetch, allocate the next available PROP ID, rewrite the local proposal branch
    metadata and directory from the losing PROP ID to the new one, create a new branch
    name with a fresh hash suffix, and retry only when the command is explicitly allowed
    to auto-renumber or when the owner confirms. The old local branch should be retired
    or deleted only after the new proposal branch is safely created, to avoid data
    loss.'
- id: C004
  type: constraint
  author: davide-via-codex
  relevance_hint: Makes concurrency resistance a required part of PROP-072 rather
    than a separate optional improvement.
  text: PROP-072 should treat concurrent ID allocation and duplicate proposal detection
    as required engine hardening, not as a later optional improvement. The MVP should
    include duplicate PROP-ID validation, remote-aware proposal ID allocation, publish-time
    collision recheck, safe auto-renumber support, and clear failure modes when ambiguity
    is detected. A separate proposal is only needed later if strict distributed locking
    is required beyond fetch/scan/recheck/renumber.
