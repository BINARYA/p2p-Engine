  - id: Q007
    group_id: QG007
    gap: repository_pilot_exit
    criterion: repository_pilot_exit
    priority: medium
    state: applied
    question: May the repository pilot close a current readiness gap through an explicit
      governed defer or mute outcome when evidence is intentionally unavailable, without
      marking the section complete?
    rationale: The pilot must distinguish convergence of question state from falsely
      claiming definition completeness.
    answer: Confirmed. The repository pilot and the general workflow may reach a converged
      question-state outcome through an explicit governed deferred or muted question
      when evidence is intentionally unavailable or the owner does not want to address
      it now. The transition must record actor, reason, timestamp and provenance and
      remain explicitly reopenable. Deferred may become eligible again according to
      a declared trigger or explicit reopen; muted remains excluded from automatic
      re-ask until explicit owner action. Neither state completes the vertical section,
      resolves the underlying gap, validates an assumption nor increases definition
      or evidence progress. The section remains partial, assumed or blocked as supported
      by canonical definition state, and readiness continues exposing the residual
      gap.
    answer_source: owner
