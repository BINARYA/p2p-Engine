  - id: Q008
    group_id: QG008
    gap: legacy_v1_write_mode
    criterion: legacy_v1_write_mode
    priority: high
    state: applied
    question: While a workspace remains on schema v1 under a v2-capable runtime, should
      P2P allow read, validation, status and migration planning but block only v2-dependent
      governed writes until the explicit v1-to-v2 migration succeeds?
    rationale: Backward-compatible reading and migratability are confirmed, but the
      safe write boundary for an unmigrated v1 workspace must be explicit in the runtime
      compatibility matrix.
    answer: Confirmed. A v2-capable runtime must continue allowing every read and
      governed write on a schema-v1 workspace whose canonical artifact contract and
      semantics remain valid under v1. It must block only operations that depend on
      schema-v2 state or semantics. A blocked operation must perform no partial write
      and must report the current and required schema versions, the reason for the
      gate, and the exact migration status or plan command. After successful v1-to-v2
      migration, the same operation can proceed through its normal authority and preview
      checks.
    answer_source: owner
