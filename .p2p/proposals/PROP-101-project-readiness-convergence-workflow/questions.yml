  - id: Q003
    group_id: QG003
    gap: fallback_question_policy
    criterion: fallback_question_policy
    priority: high
    state: applied
    question: When a required incomplete section has no declared vertical question,
      should the engine use a conservative deterministic fallback and emit an explicit
      diagnostic when safe generation is impossible?
    rationale: Current assumptions and decisions gaps demonstrate that required sections
      can otherwise remain unactionable.
    answer: Confirmed. Question resolution must first use an applicable question declared
      by the active locked vertical. If none exists for a required incomplete section,
      the engine may generate only a conservative deterministic fallback from declarative
      section metadata such as section purpose, missing required fields and completion
      criteria, using a versioned policy and stable identity. The fallback remains
      a question and cannot answer owner input, validate assumptions or complete the
      section. If the available metadata cannot produce a safe actionable question,
      the engine must emit an explicit machine-readable no_safe_question diagnostic
      and must not invent content.
    answer_source: owner
    answered_at: '2026-07-16'
