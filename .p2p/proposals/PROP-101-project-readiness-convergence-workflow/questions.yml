  - id: Q005
    group_id: QG005
    gap: post_apply_freshness
    criterion: post_apply_freshness
    priority: medium
    state: applied
    question: After a successful definition apply, should the engine update direct
      deterministic state, mark downstream nodes stale, and avoid automatically running
      agent-curated or owner-review actions?
    rationale: The side-effect boundary must remain explicit and freshness must not
      imply autonomous publication or curation.
    answer: Confirmed. A successful convergence apply must atomically update only
      the directly involved canonical project-definition and project-question state
      after completing all validation required for the commit. It must then classify
      dependent derived nodes as stale and return their deterministic topological
      rebuild plan. It must not automatically run deterministic refreshes, agent-curated
      stages, publication stages or owner-review actions. Rebuild remains a separate
      explicit operation with its own result and failure reporting.
    answer_source: owner
    answered_at: '2026-07-16'
