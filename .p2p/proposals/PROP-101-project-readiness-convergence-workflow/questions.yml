  - id: Q006
    group_id: QG006
    gap: mcp_write_scope
    criterion: mcp_write_scope
    priority: medium
    state: applied
    question: Should the first slice stabilize service and CLI mutations plus MCP
      read parity, deferring MCP answer/apply tools until they can reuse the final
      permission-gated preview contract?
    rationale: This bounds the initial public write surface and reduces CLI/MCP semantic
      drift.
    answer: Confirmed. Stabilize the core convergence service and CLI mutation contracts
      first. Add MCP read parity only after the structured read payload is stable.
      Defer project-question answer/apply MCP tools to a later gated slice. Any later
      MCP write tool must be an explicit write-safe surface that delegates to the
      same permission check, preview token, source preconditions, stale detection,
      authority rules, atomic transaction and result serialization used by CLI. MCP
      handlers must not implement independent domain, ranking or mutation logic.
    answer_source: owner
