  - id: Q001
    group_id: QG001
    gap: project_question_authority
    criterion: project_question_authority
    priority: high
    state: applied
    question: Should project-question lifecycle state use a dedicated project-scoped
      artifact authoritative for question status and answers, while project definition
      remains authoritative only for applied content?
    rationale: The source-of-truth boundary must be decided before persistence implementation
      to avoid the dual-source failure already fixed for proposal questions.
    answer: Confirmed. Use a dedicated project-scoped question lifecycle artifact
      as the authoritative source for project question status, owner answers and question
      history. Keep project definition state authoritative only for content that has
      passed the separate owner-reviewed preview/apply workflow. Legacy open questions
      in definition state are fallback evidence only when structured project-question
      state is absent.
    answer_source: owner
