  - id: Q002
    group_id: QG002
    gap: workspace_schema_compatibility
    criterion: workspace_schema_compatibility
    priority: high
    state: applied
    question: Should the project-question artifact remain optional and backward-compatible
      in workspace schema v1 unless implementation proves that required layout or
      existing semantics must change?
    rationale: This determines whether the feature needs an additive contract only
      or a tested forward-only v1-to-v2 migration.
    answer: Confirmed with refinement. The feature must remain backward-compatible
      with workspace schema v1 and must define workspace schema v2 as an explicit
      upgrade target. A current runtime must recognize and inspect v1, report compatibility,
      produce a deterministic v1-to-v2 migration plan, and apply that migration only
      through the existing owner-confirmed transactional migration primitives with
      idempotency and recovery. Fresh workspaces may adopt v2 according to the release
      contract. Migration must never be implicit. The exact governed-write capability
      retained while a workspace remains on v1 requires a separate owner decision.
    answer_source: owner
    answered_at: '2026-07-15'
