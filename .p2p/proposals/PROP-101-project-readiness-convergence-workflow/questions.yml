  - id: Q004
    group_id: QG004
    gap: gap_priority_policy
    criterion: gap_priority_policy
    priority: high
    state: applied
    question: Should convergence prioritize blockers and explicit owner decisions
      first, required definition gaps second, dependency-relevant assumptions next,
      and optional evidence curation last?
    rationale: A versioned priority policy is required for stable managed next actions
      and must not let legacy evidence work displace real blockers.
    answer: 'Confirmed. The versioned convergence priority order is: first integrity,
      compatibility and authority blockers plus explicit owner-decision blockers;
      second owner answers already received but not yet applied; third incomplete
      required definition sections; fourth assumptions to validate ordered by dependency
      impact; fifth optional declared-evidence curation; sixth informational legacy
      state. Within the same class, ordering must be deterministic using vertical
      section priority and stable gap or question id. Results must expose the priority
      class, rationale and tie-break inputs rather than hiding them in an opaque aggregate
      score.'
    answer_source: owner
