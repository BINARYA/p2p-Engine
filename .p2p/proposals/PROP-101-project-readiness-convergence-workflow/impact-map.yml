  governance:
    - owner authority for answers decisions assumption validation and apply
    - explicit provided-by versus recorded-by answer provenance
    - explicit answer versus applied-state distinction
    - owner-confirmed six-class gap priority and deterministic tie-breaking
    - one multi-target transaction for definition and question apply
    - exact committed retry without divergent token replay
    - explicit separation between canonical apply and derived rebuild or review
    - MCP writes deferred and constrained to thin canonical-service adapters
    - defer and mute converge question state without changing definition or evidence progress
    - no automatic proposal vertical publication or owner decision
  project_artifacts:
    - project definition state
    - schema-v2 project question lifecycle state
    - workspace schema and migration history
    - managed next actions and audit log
    - project progress projection
    - derived freshness graph
    - decision context source catalog and index
  dependencies:
    - PROP-079
    - PROP-085
    - PROP-089
    - PROP-090
    - PROP-091
    - PROP-095
    - PROP-096
    - PROP-097
    - PROP-100
  risks:
    - competing question definition and decision-context authorities
    - partial definition and question writes
    - unauthorized owner evidence
    - legacy question migration loss
    - legacy-to-v1 planner leakage into v1-to-v2
    - stale vertical lock or preview source
    - ambiguous token replay after response loss
    - unstable pagination and repeated scans
