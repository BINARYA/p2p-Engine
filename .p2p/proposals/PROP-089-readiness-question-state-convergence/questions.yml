  - id: Q002
    group_id: QG001
    gap: owner_questions_resolution
    criterion: owner_questions_resolution
    priority: high
    state: applied
    question: Should unresolved high-priority structured questions be the default
      hard blocker, while medium and low questions become residual follow-up unless
      policy marks them blocking?
    rationale: This controls whether readiness stops being sticky without becoming
      too permissive.
    answer: Yes. Unresolved high-priority structured questions should be the default
      hard blocker. Medium and low unresolved questions should be residual follow-up,
      cautions, or confidence reductions unless a readiness policy explicitly marks
      them blocking. The owner may still accept with explicit override, but readiness
      must continue to report the unresolved state truthfully.
