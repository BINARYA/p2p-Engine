    priority: medium
    state: applied
    question: Should open-questions.md remain readiness evidence only when questions.yml
      exists, while legacy proposals without questions.yml keep markdown fallback
      behavior?
    rationale: This preserves human-readable artifacts and backward compatibility
      while preventing markdown from overriding structured state.
    answer: Yes. When questions.yml exists, open-questions.md should remain evidence
      and human context only. For legacy proposals without questions.yml, keep the
      current markdown fallback behavior until those proposals are migrated or initialized
      with structured questions.
