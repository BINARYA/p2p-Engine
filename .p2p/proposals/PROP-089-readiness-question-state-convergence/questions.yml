    question: Should questions.yml be authoritative for owner-question readiness whenever
      structured question state exists?
    rationale: This is the central design choice for resolving divergence between
      markdown and structured state.
    answer: Yes. When questions.yml exists, it is the authoritative source for owner-question
      readiness. open-questions.md remains narrative evidence and cannot reopen a
      structured question already answered, applied, retired, superseded, muted, deferred,
      or otherwise resolved.
