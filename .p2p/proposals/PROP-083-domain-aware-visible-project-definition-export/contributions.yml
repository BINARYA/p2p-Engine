contributions:
- id: C001
  type: constraint
  author: owner
  relevance_hint: high
  text: 'Output visibility constraint: the human-facing output of P2P Engine must
    not be hidden under a path such as .p2p/outputs/generic. The project definition
    export should create a visible root-level output directory because humans who
    install and use P2P Engine to define their project need to find the generated
    project immediately without knowing P2P internal state layout.'
