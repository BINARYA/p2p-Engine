  - id: Q003
    group_id: QG003
    gap: alternatives_quality
    criterion: alternatives_quality
    priority: high
    state: answered
    question: Should the generic project definition export be the new default for
      every domain, an optional export profile, or a visible mirror of existing internal
      outputs?
    rationale: The proposal needs real alternatives before choosing a default export
      model.
    answer: The generic human-facing project definition export should be the default
      for every domain. Every P2P project should be able to generate outputs/latest/project.md
      as the current comprehensive project definition for humans. Domain-specific
      or tool-specific exports are additional nested export profiles, not the primary
      default.
    answer_source: owner
