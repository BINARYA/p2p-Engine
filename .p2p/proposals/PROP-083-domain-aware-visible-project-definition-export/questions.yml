  - id: Q005
    group_id: QG005
    gap: impact_overlap_analysis
    criterion: impact_overlap_analysis
    priority: high
    state: answered
    question: How should this proposal relate to existing software-spec, spec-export,
      OpenSpec, and Spec Kit behavior so useful software workflows are not broken?
    rationale: Impact and overlap with accepted export proposals must be explicit.
    answer: In the new model, software-specific exports should live under outputs/latest/exports/...
      or a similar nested structure inside the visible project definition export.
      Existing .p2p outputs in this repository may likely be removable if they are
      only legacy/generated artifacts and not required for compatibility, but this
      must be verified during implementation. The proposal should not assume immediate
      deletion without a compatibility check; it should define a migration/compatibility
      path for existing .p2p/outputs behavior and preserve any public CLI/API expectations
      until intentionally changed.
    answer_source: owner
