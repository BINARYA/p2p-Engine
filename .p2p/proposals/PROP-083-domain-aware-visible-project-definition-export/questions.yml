    gap: acceptance_criteria_quality
    criterion: acceptance_criteria_quality
    priority: medium
    state: answered
    question: What concrete files or commands would prove this proposal is implemented
      correctly?
    rationale: Acceptance criteria are currently missing.
    answer: The default export should generate a single Markdown file organized in
      chapters, not many separate default files. A suitable output is outputs/latest/project.md
      containing the complete human-facing project definition. Specialized vertical
      exports, such as software-specific outputs, may generate folders under outputs/latest/exports/<profile-or-vertical>/
      containing whatever files that vertical format requires.
