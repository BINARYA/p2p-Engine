  - id: Q002
    group_id: QG002
    gap: scope_boundaries
    criterion: scope_boundaries
    priority: high
    state: answered
    question: Which existing outputs should remain unchanged for software projects,
      and which outputs should be deprecated, moved, or made profile-specific?
    rationale: Scope boundaries are needed to preserve backward compatibility while
      changing export behavior.
    answer: Existing export behavior should not be broken by changing the conceptual
      role of other export targets. The new visible project definition export should
      use a generic visible structure at the project root, named outputs/ to avoid
      confusion with .p2p/project. The current human-facing project definition should
      live under outputs/latest/, for example outputs/latest/project.md, while prior
      review snapshots should live under outputs/review-001/, outputs/review-002/,
      etc. Software-specific exports such as software-spec, OpenSpec, and Spec Kit
      should become nested specialized export folders under the generic outputs/latest/exports/
      structure when the domain/profile supports them. The model must be generic because
      other vertical domains may also have multiple specialized export formats.
    answer_source: owner
    answered_at: '2026-06-08'
