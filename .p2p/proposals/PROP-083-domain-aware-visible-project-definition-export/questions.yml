  - id: Q004
    group_id: QG004
    gap: tradeoff_analysis
    criterion: tradeoff_analysis
    priority: high
    state: answered
    question: What tradeoff do you prefer between visible root-level outputs that
      are easy for humans to find and hidden .p2p outputs that keep project roots
      cleaner?
    rationale: The visible-output decision changes user ergonomics and repository
      noise.
    answer: Accept the tradeoff of a visible root-level outputs/ directory. Human
      accessibility and inspectability are more important than keeping the repository
      root minimal. The name outputs/ is preferred over project/ because it is clearer
      that this directory contains generated visible outputs and avoids confusion
      with .p2p/project. For the MVP this location does not need to be configurable.
    answer_source: owner
