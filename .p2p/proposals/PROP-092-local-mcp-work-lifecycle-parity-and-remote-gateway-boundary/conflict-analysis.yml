conflicts:
  - type: scope_boundary
    proposals:
      - PROP-092
    reason: Remote multi-user MCP could be confused with local MCP parity unless the Wavekit gateway boundary is explicit.
    suggested_resolution: Keep remote HTTP MCP, OAuth, hosted users, grants, billing, and tenant controls out of P2P Engine core.
  - type: implementation_risk
    proposals:
      - PROP-092
      - PROP-066
    reason: Permission-gated Work MCP tools must not weaken the consent model accepted by PROP-066.
    suggested_resolution: Reuse the consent receipt validation and audit pattern already used for proposal branch MCP tools.
  - type: overlap
    proposals:
      - PROP-092
      - PROP-035
      - PROP-036
      - PROP-039
      - PROP-040
    reason: PROP-092 exposes existing CLI Work lifecycle operations over local MCP; it should not redefine their state transitions.
    suggested_resolution: Treat PROP-092 as adapter parity over existing Work lifecycle services.
