  - id: Q004
    group_id: QG004
    gap: source_resolution
    criterion: source_resolution
    priority: medium
    state: applied
    question: Should installed local packs be resolved from P2P_HOME/verticals, ~/.p2p/verticals,
      or both?
    rationale: This affects local installation layout and future Wavekit cache compatibility.
    answer: Resolve installed local packs from both locations. If P2P_HOME is configured,
      P2P_HOME/verticals has precedence over ~/.p2p/verticals; otherwise use ~/.p2p/verticals
      as the default installed-local directory. Project-local packs under .p2p/project/verticals/
      still have higher precedence than installed-local packs. If both installed-local
      locations contain the same pack id/version, the P2P_HOME source wins. The resolver
      and vertical.lock.yml must record the effective source type and resolved source
      path or package coordinate.
    answer_source: owner
