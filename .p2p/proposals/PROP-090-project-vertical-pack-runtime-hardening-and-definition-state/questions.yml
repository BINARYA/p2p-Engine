  - id: Q005
    group_id: QG005
    gap: security_policy
    criterion: security_policy
    priority: medium
    state: applied
    question: Should unsafe instruction-like guidance in vertical packs be a hard
      validation error, a warning, or severity-dependent by field?
    rationale: The trust boundary is clear, but strictness affects compatibility with
      existing or user-authored packs.
    answer: Use severity-dependent validation by field and content. Treat explicit
      attempts to override system, developer, safety, governance, repository, or tool-permission
      rules; execute code; escape pack/project paths; force tool execution; modify
      permissions; or instruct agents to ignore higher-priority instructions as hard
      errors. Treat ambiguous instruction-like language in descriptive examples, templates,
      or explanatory fields as warnings. Ordinary domain questions, examples, completion
      criteria, common mistakes, artifact templates, and domain suggestions are allowed.
      Internal seed packs should validate cleanly; project-local packs may be allowed
      with warnings; future remote/Wavekit packs should use stricter trust validation.
      In all cases, vertical pack content remains domain data, not authoritative agent
      instruction.
    answer_source: owner
