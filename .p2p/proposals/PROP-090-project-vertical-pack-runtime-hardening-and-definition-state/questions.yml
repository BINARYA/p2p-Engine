  - id: Q002
    group_id: QG002
    gap: scope_boundaries
    criterion: scope_boundaries
    priority: high
    state: applied
    question: Should p2p project next-action --json be included in this proposal,
      or deferred until definition state is stable?
    rationale: Next-action selection is useful for agent orchestration, but implementing
      it too early may overfit before definition-state semantics are proven.
    answer: Defer the full p2p project next-action --json command until definition
      state semantics are stable. In the first production slice, expose enough structured
      data through p2p project context --json, p2p project sections --json, p2p project
      section <id> --json, and p2p project definition --json so the agent can compute
      a best-effort next question. The first slice may include a lightweight next_suggested_action
      field inside definition.yml, but not a full standalone next-action engine. Treat
      the complete next-action engine as a follow-up after definition.yml, section
      status, dependencies, assumptions, and rubric scope are stable.
    answer_source: owner
