    state: applied
    question: Should generic_project be introduced as a non-breaking alias for base_project,
      or omitted from the first implementation?
    rationale: The revision source uses generic_project, while the implemented system
      already uses base_project as the fallback id.
    answer: Omit generic_project from the first implementation. Keep base_project
      as the canonical fallback vertical because it already exists in the implemented
      PROP-085 MVP. Document that generic_project was terminology from the revision
      source and may be reconsidered later as a non-breaking alias only if there is
      a clear usability need. Do not add aliasing until resolver, lockfile, and pack
      identity rules are stable.
