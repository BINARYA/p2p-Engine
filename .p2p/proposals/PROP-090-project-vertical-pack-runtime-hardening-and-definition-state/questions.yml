  - id: Q006
    group_id: QG006
    gap: migration_strategy
    criterion: migration_strategy
    priority: medium
    state: applied
    question: Should vertical.lock.yml be generated retroactively for projects with
      an existing active vertical, or only during future init/select flows?
    rationale: This affects migration behavior for projects created before this hardening
      proposal.
    answer: Generate vertical.lock.yml automatically for new init/select flows. For
      existing projects with active vertical state but no lockfile, do not generate
      it implicitly during validation, readiness, export, or ordinary reads. Instead,
      validation should report an actionable warning and a dedicated explicit repair/migration
      command should generate the lockfile after resolving the active vertical. If
      the active vertical cannot be resolved, the command must fail without writing
      and must not silently fall back to base_project.
    answer_source: owner
