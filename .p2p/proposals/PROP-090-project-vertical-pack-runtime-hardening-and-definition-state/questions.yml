    priority: high
    state: applied
    question: Should definition-state writes be implemented in the first production
      slice, or should the first slice expose read-only state plus structured patch
      output?
    rationale: This decides whether .p2p/project/definition.yml becomes immediately
      writable through CLI/MCP or only inspectable with deferred persistence.
    answer: Implement definition-state writes in the first production slice through
      a narrow structured patch/update contract. Do not expose arbitrary editing.
      The first slice must support durable agent-guided state persistence via supported
      CLI/service write paths, with validation of section_id, field_id, status, assumptions,
      missing fields, provenance/history, and atomic writes. Defer full interactive
      editing, sophisticated next-action computation, complex long-answer merge behavior,
      advanced state migrations, and any broad writer surface.
    answer_source: owner
