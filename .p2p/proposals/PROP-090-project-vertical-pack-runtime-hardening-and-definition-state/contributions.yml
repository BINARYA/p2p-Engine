contributions:
- id: C001
  type: scope_boundary
  author: codex
  relevance_hint: high
  text: 'Scope boundaries for PROP-090.


    In scope:

    - production hardening of the already accepted PROP-085 vertical runtime;

    - canonical multi-file vertical pack schema and compatibility loader for current
    single-file packs;

    - .p2p/project/vertical.lock.yml generation and validation;

    - .p2p/project/definition.yml model, validation, read/update or structured patch
    contract;

    - project-scoped JSON CLI/MCP surfaces needed by agents;

    - init integration limited to vertical/profile/module/rubric setup;

    - rubric generation/regeneration rules that preserve PROP-057 owner choices;

    - validation, safety, version pinning, upgrade diagnostics, and migration semantics;

    - generated agent guidance that uses vertical data progressively.


    Out of scope for the first production slice:

    - Wavekit remote search/install/update/publish;

    - executable vertical plugins;

    - a required top-level p2p vertical namespace;

    - moving project-local packs out of .p2p/project/verticals/;

    - renaming base_project as a breaking change;

    - full project-definition interviews inside p2p init;

    - automatic vertical upgrades or silent fallback after lockfile creation;

    - domain-specific agent skills for each vertical.'
- id: C002
  type: alternative_proposal
  author: codex
  relevance_hint: high
  text: 'Alternatives considered and selected direction.


    Alternative A: Modify PROP-085 directly. Rejected as the primary governance path
    because PROP-085 is already accepted and has an MVP implementation. Rewriting
    it would blur the difference between accepted direction and production hardening.
    PROP-090 is therefore a follow-up proposal linked to PROP-085.


    Alternative B: Create an unrelated new proposal. Rejected because the work is
    clearly the completion and hardening of PROP-085, not a separate product direction.


    Alternative C: Adopt the revision literally with p2p vertical ... and .p2p/verticals/.
    Rejected for the first slice because the repository already exposes p2p project
    vertical ... and stores project-local verticals under .p2p/project/verticals/.
    Keeping these choices reduces migration cost and preserves user-facing compatibility.


    Alternative D: Keep only the single-file vertical.yml model. Rejected because
    production packs need maintainable section specs, profiles, rubrics, artifact
    templates, examples, and trust metadata. The selected direction is a canonical
    multi-file pack with backward compatibility for current single-file packs.


    Alternative E: Make definition state conversational only. Rejected because agent-guided
    project construction must survive across sessions. The selected direction adds
    .p2p/project/definition.yml with structured state and explicit assumptions.


    Alternative F: Allow post-init fallback to base_project if a locked vertical is
    missing. Rejected because it would change project behavior silently. The selected
    direction treats locked missing/mismatched packs as hard errors unless the owner
    runs explicit repair, migration, or fallback.'
- id: C003
  type: architectural_principle
  author: codex
  relevance_hint: high
  text: 'Tradeoff analysis.


    Keeping p2p project vertical ... favors compatibility over a shorter command namespace.
    The cost is slightly more verbose commands; the benefit is avoiding a public-surface
    break and keeping vertical state clearly project-scoped.


    Keeping .p2p/project/verticals/ favors compatibility over the revision source
    path .p2p/verticals/. The cost is a less general-looking path; the benefit is
    alignment with existing project state and validation conventions.


    Keeping base_project favors implementation continuity over the generic_project
    naming used in the revision source. The cost is a possible terminology mismatch;
    the benefit is avoiding a breaking fallback rename. A non-breaking alias can be
    added later if needed.


    Adding vertical.lock.yml increases state complexity but prevents accidental behavior
    drift when packaged, local, or future remote verticals change.


    Adding definition.yml increases persistence and validation responsibility, but
    it is the key difference between one-conversation guidance and durable project
    construction.


    Supporting both single-file and multi-file packs increases loader complexity,
    but it protects the existing MVP and lets production packs evolve without forcing
    a migration cliff.


    Deferring Wavekit keeps the first implementation local and testable. The cost
    is no remote catalog in this slice; the benefit is stabilizing file formats, trust
    rules, lock semantics, and agent contracts before remote distribution.'
- id: C004
  type: risk
  author: codex
  relevance_hint: high
  text: 'Risks and mitigations.


    Risk: vertical domain logic leaks into core services. Mitigation: keep all domain-specific
    sections, questions, rubrics, examples, and artifacts in data packs; core services
    only load, validate, resolve, lock, expose, and update typed state.


    Risk: the proposal becomes too large for one implementation. Mitigation: split
    implementation into local specs and tasks by phases: compatibility audit, multi-file
    loader, lockfile, init/rubric integration, definition state, JSON context, agent
    guidance, custom generator, future Wavekit.


    Risk: definition.yml duplicates proposal governance decisions. Mitigation: definition.yml
    stores project-definition answers, assumptions, section completeness, and open
    project questions; proposal acceptance/rejection/decisions remain P2P governance
    artifacts.


    Risk: agents treat vertical text as instructions. Mitigation: vertical content
    has no instruction authority and validators warn or reject unsafe instruction-like
    content.


    Risk: lockfiles make projects brittle if seed resources move. Mitigation: provide
    explicit repair/migration/fallback commands and actionable diagnostics instead
    of silent fallback.


    Risk: rubric regeneration overwrites owner choices. Mitigation: preserve enabled
    flags by stable criterion id; require confirmation for orphan removal.


    Risk: p2p init becomes too long. Mitigation: init selects vertical/profile/modules
    and rubric scope only; detailed section interviews belong to later agent guidance.


    Risk: custom generated verticals have low quality. Mitigation: mark them as project-local
    scaffolds, validate structure, inherit from base_project, and make refinement
    explicit.'
- id: C005
  type: constraint
  author: codex
  relevance_hint: high
  text: 'Assumptions and constraints.


    Assumptions:

    - PROP-085 remains accepted and its MVP implementation remains the baseline.

    - The owner wants production-grade hardening rather than a second unrelated vertical
    system.

    - Existing public commands and paths should be preserved unless there is a strong
    reason to migrate.

    - base_project is the current fallback pack and should remain valid.

    - Future Wavekit compatibility matters, but remote behavior is not required for
    this proposal to deliver value.

    - Agents need durable state to continue guided project definition across sessions.

    - Project maturity remains governed by .p2p/project/rubrics.yml and enabled flags.


    Constraints:

    - Do not edit .p2p files by hand during implementation; all project state writes
    must be through supported service/CLI/MCP paths.

    - Do not add domain behavior directly to large compatibility files when a service/model
    boundary is appropriate.

    - Keep pack content declarative and non-executable.

    - Keep owner governance decisions outside the agent runtime and outside vertical
    packs.'
- id: C006
  type: suggestion
  author: codex
  relevance_hint: high
  text: 'Owner questions and current resolution state.


    Already resolved from owner discussion and applied to this draft:

    - Keep the project prefix: use p2p project vertical ... as the production namespace.

    - Treat the revision as adaptable, not infallible; fit it to the current code
    and production quality needs.

    - Revise the current single-file vertical model toward a multi-file pack.

    - Add .p2p/project/definition.yml.

    - Create a new follow-up proposal linked to PROP-085 rather than treating the
    work as an unrelated proposal.


    Open questions to review before acceptance:

    - Should definition-state writes be implemented immediately, or should the first
    slice expose read plus structured patch output only?

    - Should p2p project next-action --json be part of this proposal or a follow-up
    after definition state is stable?

    - Should generic_project be introduced as an alias for base_project, or omitted
    to avoid terminology noise?

    - Should installed local packs use P2P_HOME/verticals, ~/.p2p/verticals, or both?

    - How strict should unsafe guidance text validation be in the first implementation:
    warnings only, hard errors, or severity by field?

    - Should vertical.lock.yml be generated only during init/select, or also retroactively
    for projects with an existing active vertical?'
- id: C007
  type: suggestion
  author: codex
  relevance_hint: high
  text: 'Acceptance criteria quality note.


    The proposal acceptance criteria are intended to be verifiable through implementation
    evidence, not prose alone. Evidence should include:

    - unit/service tests for loader normalization, resolver precedence, lockfile behavior,
    and definition-state validation;

    - CLI tests for project vertical JSON commands, init integration, lock inspection,
    and definition-state read/update or patch behavior;

    - MCP tests for parity where public CLI operations have MCP equivalents;

    - validation tests for malformed packs, unsafe paths/content, stale locks, orphaned
    rubrics, and definition-state inconsistency;

    - regression tests proving current p2p project vertical commands and existing
    single-file packs still work;

    - docs describing pack layout, compatibility rules, lockfile semantics, definition.yml
    semantics, agent guidance, and deferred Wavekit behavior;

    - p2p validate with zero errors after implementation.'
- id: C008
  type: architectural_principle
  author: codex
  relevance_hint: high
  text: 'Impact and overlap analysis.


    PROP-085 overlap: direct. PROP-090 is the production hardening and completion
    layer for PROP-085, not a competing vertical system.


    Existing local feature overlap: specs/features/pluggable-project-verticals-and-readiness-orchestration
    implemented the MVP. PROP-090 should produce a new local feature for hardening
    rather than reopening completed MVP tasks.


    PROP-057 overlap: vertical defaults generate rubric candidates, but PROP-057 remains
    the owner-controlled selection flow for enabled/disabled criteria.


    PROP-071 overlap: custom domain definition remains compatible; vertical selection
    gives a richer project skeleton but does not remove custom domain/rubric workflows.


    PROP-082/PROP-089 overlap: readiness and question state should consume definition-state
    and vertical coverage, but proposal readiness question state remains separate
    from project definition state.


    PROP-083 overlap: visible exports may include vertical and definition-state summaries,
    but export behavior should remain additive and profile/domain-aware.


    Code impact: expected changes belong mainly in project vertical core models, ProjectVerticalService,
    project initialization service, project maturity/rubric services, validation service,
    CLI project command modules, MCP project handlers/catalog, agent template generation,
    docs, tests, and possibly visible project export. P2PWorkspace should remain a
    facade; large compatibility files should receive delegation only.


    Governance impact: no proposal acceptance, rejection, merge, or owner decision
    is automated. The proposal defines project setup/state behavior, not governance
    authority.'
