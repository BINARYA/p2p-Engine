contributions:
- id: C001
  type: architectural_principle
  author: codex
  relevance_hint: high
  text: A stable project orchestrator skill should not contain all vertical knowledge.
    It should load structured vertical definitions, inspect project state, identify
    required sections, ask one focused question at a time, update project artifacts,
    verify completeness, and move the project through maturity states.
- id: C002
  type: scope_boundary
  author: codex
  relevance_hint: high
  text: 'Default coverage should remain compact and high-quality: base_project plus
    an MVP of software_product, ai_agent_or_automation, startup_or_business, research_report,
    and board_game_design; broader domains should be registry/plugin or project-local
    packs.'
- id: C003
  type: architectural_principle
  author: codex
  relevance_hint: high
  text: 'Distinguish verticals from modules: a vertical represents a full project
    structure, while modules add cross-cutting concerns such as go_to_market, security_privacy,
    accessibility, crowdfunding, production_feasibility, education, community_building,
    monetization, and risk_management.'
- id: C004
  type: architectural_principle
  author: codex
  relevance_hint: high
  text: 'Vertical knowledge should live in data packages: vertical.yml plus section
    detail packs, rubrics, maturity criteria, blocking questions, examples, artifact
    templates, profiles, and compatible optional modules. The engine should validate
    and execute these packages rather than hardcoding every domain.'
- id: C005
  type: feature_request
  author: codex
  relevance_hint: high
  text: If no suitable vertical exists, the agent should propose a new project-local
    vertical or rubric extension, explain why existing packs do not fit, generate
    starter sections/questions/artifacts, and ask the owner to confirm before using
    it.
- id: C006
  type: constraint
  author: codex
  relevance_hint: high
  text: 'Backward compatibility is required: existing projects without vertical packages
    or custom project readiness state must continue to work with current rubrics and
    maturity assessment, while review guidance can suggest adopting or creating a
    vertical pack.'
- id: C007
  type: feature_request
  author: codex
  relevance_hint: high
  text: The same vertical orchestration flow should be callable during interactive
    init and later through an explicit project review/readiness command, so a project
    can be refined after creation without rerunning initialization.
- id: C008
  type: risk
  author: codex
  relevance_hint: medium
  text: Regulated or high-risk domains should be handled as cautious packs with explicit
    provenance, limitations, review warnings, and owner responsibility rather than
    as authoritative expert systems.
- id: C009
  type: implementation_suggestion
  author: codex
  relevance_hint: high
  text: Primary related proposals to reconcile are PROP-054 Project Readiness and
    Maturity Assessment, PROP-056 Project Definition Maturity Rubrics, PROP-057 Guided
    Rubric Selection During Init, PROP-071 Custom Domain Definition Workflow, PROP-082
    Readiness Assessment Refresh And Review Workflow, and PROP-083 Domain-Aware Visible
    Project Definition Export.
- id: C010
  type: risk
  author: owner
  relevance_hint: high
  text: 'Core tradeoff: without vertical-specific structure P2P Engine risks becoming
    too generic and banal, because it cannot guide project-specific capisaldi, readiness
    questions, and artifacts. The opposite extreme is also risky: trying to create
    every possible vertical is too costly, hard to maintain, and unrealistic for a
    small team. The proposal must therefore support a small set of high-quality defaults
    plus project-local custom verticals that agents can help draft and refine.'
- id: C011
  type: scope_boundary
  author: owner
  relevance_hint: high
  text: 'The proposal should define the minimum base_project structure, not only the
    vertical pack mechanism. At MVP level, base_project should specify the default
    cross-domain project sections/capisaldi that every project starts from before
    vertical-specific extensions: vision, objective, owner/stakeholders, constraints,
    risks, milestones/next actions, decisions/open questions, definition of done/readiness
    criteria, expected artifacts, and project status/maturity. This keeps the default
    project useful even when no specific vertical exists.'
- id: C012
  type: feature_request
  author: owner
  relevance_hint: high
  text: base_project must include a deterministic procedure for generating a custom
    vertical candidate when the requested domain is ambiguous or missing. The procedure
    should ask the agent to infer an initial vertical id/name, propose domain-specific
    sections/capisaldi, minimal readiness rubrics, blocking questions, expected artifacts,
    and confirmation questions, then save the candidate only after owner confirmation.
- id: C013
  type: implementation_suggestion
  author: owner
  relevance_hint: high
  text: "Add two example custom vertical candidates to the proposal as reference fixtures:\
    \ packaging_or_physical_product_design for 'progettare la scatola perfetta' and\
    \ social_impact_program_design for 'progettare attivit\xE0 volte a migliorare\
    \ l'impatto sociale di una banca'. They should demonstrate how base_project becomes\
    \ concrete without hardcoding all possible verticals."
- id: C014
  type: feature_request
  author: owner
  relevance_hint: high
  text: Project proposals should be traceable to vertical sections/capisaldi. The
    project readiness review should produce a vertical skeleton summary and, for each
    vertical point, identify relevant proposals, gaps, risks, and open decisions.
    Individual proposals should also be able to declare which vertical sections they
    touch so the project can show coverage and avoid blind spots.
