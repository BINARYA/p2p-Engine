impact:
  proposal_id: PROP-085
  summary: >
    Adds pluggable project vertical data packs and project readiness review
    orchestration while reusing existing project rubrics and maturity artifacts.
  areas:
    - area: project_initialization
      impact: medium
      notes:
        - p2p init remains deterministic.
        - Initialization state should expose enough information for agents to detect missing capisaldi and questions.
    - area: project_readiness
      impact: high
      notes:
        - Adds p2p project readiness review as the explicit review command.
        - Review should read base_project, core/default packs, and project-local custom packs.
        - Review should summarize vertical section coverage by proposal.
    - area: proposal_traceability
      impact: high
      notes:
        - Proposals should be mappable to vertical sections/capisaldi.
        - Project review should identify covered, partial, missing, and unmapped vertical coverage.
        - Visible project output can include a vertical skeleton summary with relevant proposals per section.
    - area: project_maturity
      impact: medium
      notes:
        - Existing rubrics and maturity are extended, not replaced.
        - Vertical pack rubrics become structured inputs to current assessment.
    - area: agent_instructions
      impact: high
      notes:
        - Agent must prioritize missing initialization, capisaldi, and initial questions.
        - Agent must know how to propose and confirm project-local custom verticals.
    - area: validation
      impact: high
      notes:
        - Vertical packs require schema validation.
        - Invalid or incomplete project-local packs must produce actionable diagnostics.
    - area: packaging
      impact: medium
      notes:
        - Default packs are internal package/project resources in the MVP.
        - Schema should remain compatible with a future registry.
    - area: backward_compatibility
      impact: high
      notes:
        - Projects without vertical packs must keep working with existing rubrics.
        - Missing packs should degrade to base_project and agent guidance, not failure.
