  - id: Q003
    group_id: QG003
    gap: tradeoff_analysis
    criterion: tradeoff_analysis
    priority: high
    state: applied
    question: 'Quali parti del verticale devono essere obbligatorie per la readiness
      iniziale: sezioni, rubriche, domande bloccanti, artefatti, esempi, profili,
      moduli compatibili?'
    rationale: Serve a distinguere un vertical pack minimo ma valido da un pack ricco
      ma opzionale.
    answer: 'Confermata la struttura proposta. Nel MVP sono obbligatori: vertical.yml
      con id, nome, versione, descrizione e base/extends; sezioni/capitoli del progetto;
      rubriche minime di completezza/readiness; domande bloccanti iniziali; artefatti
      attesi o suggeriti. Sono opzionali nel MVP: esempi, profili, moduli compatibili
      e template ricchi di output. Questo mantiene il pack abbastanza robusto da guidare
      l''agente ma non troppo pesante da creare o estendere.'
    answer_source: owner
