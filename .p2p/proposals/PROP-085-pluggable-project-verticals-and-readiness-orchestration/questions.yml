  - id: Q007
    group_id: QG007
    gap: assumptions_clarity
    criterion: assumptions_clarity
    priority: medium
    state: applied
    question: I vertical pack di default devono essere distribuiti dentro il pacchetto
      Python del motore o come risorse installabili/aggiornabili separatamente?
    rationale: "Questa assunzione impatta release, versioning, aggiornamenti e possibilit\xE0\
      \ di sostituzione nel progetto."
    answer: "Per il momento i vertical pack default restano interni al progetto/pacchetto\
      \ come risorse dati versionate e testabili. Il registry esterno \xE8 un'evoluzione\
      \ successiva da valutare: verosimilmente una API REST con un endpoint per elencare\
      \ i vertical pack disponibili e un endpoint per ottenere il dettaglio/versione\
      \ di un pack specifico. Il design MVP deve quindi prevedere l'estendibilit\xE0\
      \ verso registry, ma non implementarlo come requisito della prima slice."
