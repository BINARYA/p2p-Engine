  - id: Q005
    group_id: QG005
    gap: risk_coverage
    criterion: risk_coverage
    priority: high
    state: applied
    question: 'Come deve comportarsi il sistema quando il verticale richiesto non
      esiste: proporre un custom vertical locale, cercare nel registry, degradare
      a base_project, o combinare queste opzioni in ordine?'
    rationale: "\xC8 il punto chiave per evitare hardcoding e mantenere un comportamento\
      \ utile anche su domini nuovi."
    answer: "Confermato l'ordine: cercare prima vertical pack locali del progetto,\
      \ poi core/default disponibili, poi registry/plugin dati se configurato; se\
      \ non trova un verticale adatto, degradare a base_project. In quel caso l'agente\
      \ non deve fermarsi: propone un verticale di default/base e apre una modalit\xE0\
      \ di customizzazione per estrarre dall'utente le informazioni necessarie a costruire\
      \ un nuovo custom vertical locale. Il custom vertical deve includere almeno\
      \ sezioni/capisaldi, rubriche minime, domande bloccanti e artefatti attesi;\
      \ il decisore lo conferma o modifica prima che venga usato per readiness e project\
      \ review."
    answer_source: owner
