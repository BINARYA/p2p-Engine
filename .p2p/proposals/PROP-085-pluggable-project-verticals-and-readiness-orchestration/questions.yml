    question: "Qual \xE8 lo scope MVP esatto: solo base_project + loader/validator\
      \ + un verticale dimostrativo, oppure anche il set MVP completo di cinque verticali?"
    rationale: Serve a evitare che la proposta diventi un catalogo enorme invece di
      una prima architettura production-ready.
    answer: 'MVP: base_project + loader/validator dei vertical pack + project orchestrator
      skill + un verticale dimostrativo completo. Il set di 5 verticali MVP resta
      come obiettivo successivo, non dentro la prima implementazione.'
