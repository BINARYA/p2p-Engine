    gap: alternatives_quality
    criterion: alternatives_quality
    priority: high
    state: applied
    question: Preferiamo modellare i verticali come pacchetti dati puri versionati
      nel progetto/registry, oppure come plugin installabili con codice e metadata?
    rationale: "La scelta influenza sicurezza, validazione, packaging, compatibilit\xE0\
      \ e semplicit\xE0 di contributo."
    answer: "Pacchetti dati puri. Devono essere file di testo, principalmente .md\
      \ e/o .yaml, che contengono le informazioni base del verticale: ossatura del\
      \ progetto, capitoli/sezioni o argomenti da affrontare, peculiarit\xE0 specifiche\
      \ del verticale, rubriche/domande/artefatti utili. L'agente deve leggerli per\
      \ creare l'ossatura iniziale del progetto, proporla e validarla con il decisore\
      \ durante init, oppure modificarla successivamente durante una revisione del\
      \ progetto."
