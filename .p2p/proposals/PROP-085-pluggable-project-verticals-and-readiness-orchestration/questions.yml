  - id: Q006
    group_id: QG006
    gap: acceptance_criteria_quality
    criterion: acceptance_criteria_quality
    priority: medium
    state: applied
    question: 'Quale comando esplicito deve lanciare la revisione successiva del progetto:
      p2p project readiness review, p2p project vertical review, oppure un''estensione
      degli attuali assess/maturity?'
    rationale: Serve a definire una superficie CLI chiara e coerente con le funzioni
      esistenti.
    answer: "Il comando esplicito per la revisione successiva deve essere p2p project\
      \ readiness review. Il fine \xE8 migliorare readiness e contesto del progetto;\
      \ il verticale \xE8 uno strumento usato dalla review, non l'oggetto principale\
      \ del comando. Il comando deve riusare project rubrics/maturity esistenti, leggere\
      \ vertical pack e project-local custom verticals, segnalare capisaldi mancanti,\
      \ produrre domande iniziali o successive, e guidare l'agente sulle priorit\xE0\
      \ di rafforzamento del contesto."
