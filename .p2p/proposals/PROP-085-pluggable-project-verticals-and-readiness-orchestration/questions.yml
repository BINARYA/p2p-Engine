  - id: Q004
    group_id: QG004
    gap: owner_questions_resolution
    criterion: owner_questions_resolution
    priority: high
    state: applied
    question: Durante p2p init, l'agente/CLI deve solo suggerire verticale e profilo
      o deve anche generare subito capisaldi e domande iniziali del progetto?
    rationale: Determina quanto l'init diventa progettuale rispetto a un semplice
      setup tecnico.
    answer: "La CLI p2p init non avvia l'agente. La CLI pu\xF2 fare solo domande iniziali\
      \ deterministiche e salvare lo stato di progetto. Il comportamento proattivo\
      \ spetta all'agente: quando rileva che il progetto \xE8 in stato di inizializzazione,\
      \ che l'init non \xE8 stato fatto, oppure che mancano capisaldi e domande iniziali,\
      \ deve considerare questa attivit\xE0 prioritaria perch\xE9 rafforza il contesto\
      \ e determina la readiness del progetto. L'agente deve proporre l'ossatura dei\
      \ capisaldi e le domande iniziali, salvarle come oggetti del progetto/init quando\
      \ possibile, guidare il decisore una domanda alla volta e tornare sul tema se\
      \ l'utente rimanda. Se il progetto non \xE8 inizializzato, l'agente deve sapere\
      \ come inizializzarlo con la CLI e usare le risposte dell'utente per popolare\
      \ gli oggetti iniziali."
    answer_source: owner
