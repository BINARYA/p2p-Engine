    gap: assumptions_clarity
    criterion: assumptions_clarity
    priority: medium
    state: applied
    question: What assumptions does this proposal rely on?
    rationale: The proposal should be clear about expected maintainer behavior.
    answer: The proposal assumes that a small development dependency such as pytest-cov
      is acceptable, that terminal missing-lines output is enough for the first slice,
      and that maintainers want occasional diagnostic visibility but do not want coverage
      to become the default validation command after every code change.
