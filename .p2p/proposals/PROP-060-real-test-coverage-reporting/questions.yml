    gap: alternatives_quality
    criterion: alternatives_quality
    priority: high
    state: applied
    question: Which alternatives were considered for code coverage reporting?
    rationale: Readiness requires explicit alternatives before acceptance.
    answer: 'Three alternatives were considered: keep no code coverage tooling and
      rely only on existing marker-based test tiers; add an advisory terminal coverage
      diagnostic; or introduce an immediate mandatory coverage threshold. The preferred
      option is the advisory terminal diagnostic because it adds observability without
      turning coverage into a misleading quality gate or replacing PROP-098 test routing.'
    answer_source: owner
