    gap: tradeoff_analysis
    criterion: tradeoff_analysis
    priority: high
    state: applied
    question: What tradeoff does the preferred coverage approach make?
    rationale: The proposal should state why small advisory coverage is preferable
      to broader enforcement.
    answer: The preferred approach trades enforcement for low-cost visibility. It
      gives maintainers a way to inspect unexercised code paths, especially around
      refactors, while avoiding HTML artifacts, CI gates, fail-under thresholds, and
      per-change coverage runs. The cost is that it will not decide which tests to
      run; that responsibility remains with PROP-098.
    answer_source: owner
