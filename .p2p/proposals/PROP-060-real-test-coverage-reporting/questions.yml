  - id: Q003
    group_id: QG003
    gap: risk_coverage
    criterion: risk_coverage
    priority: high
    state: applied
    question: What is the main risk of adding code coverage reporting?
    rationale: Coverage metrics are easy to misuse unless the risk is explicit.
    answer: 'The main risk is that maintainers or agents misread coverage percentage
      as a global quality score or as a routing mechanism for validation. Mitigation:
      document coverage as optional diagnostics only, avoid an initial threshold,
      avoid generated report artifacts, and explicitly route test selection to PROP-098.'
    answer_source: owner
