    gap: impact_overlap_analysis
    criterion: impact_overlap_analysis
    priority: high
    state: applied
    question: How does PROP-060 overlap with existing or new testing proposals?
    rationale: The proposal overlaps with the existing test-tier policy and new routing
      work.
    answer: 'PROP-060 builds on the existing marker-based validation tiers and scripts
      without replacing them. It overlaps most closely with PROP-098, but the boundary
      is explicit: PROP-060 measures which code was exercised by selected tests, while
      PROP-098 decides which tests should be selected for a change. User-facing project
      evidence coverage remains outside both proposals.'
