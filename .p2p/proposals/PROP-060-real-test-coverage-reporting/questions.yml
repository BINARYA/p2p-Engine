    question: What owner decisions close the scope of PROP-060?
    rationale: The owner clarified that coverage is secondary and must stay separate
      from routing.
    answer: The owner decided that code coverage is useful but relatively secondary,
      and that the more important concern is deterministic test selection. Therefore
      PROP-060 remains a small optional diagnostics proposal, while deterministic
