contributions:
- id: C001
  type: alternative
  author: codex
  relevance_hint: high
  text: 'Alternative considered: keep no code coverage tooling and rely only on marker-based
    test tiers. This keeps the toolchain minimal, but it leaves maintainers without
    a measured way to detect unexercised modules or branches before refactors.'
- id: C002
  type: finding
  author: codex
  relevance_hint: high
  text: 'Tradeoff: a terminal-only, advisory coverage report gives useful observability
    with little process cost, but it intentionally does not solve test selection.
    Deterministic routing of which tests to run after a change belongs to PROP-098.'
- id: C003
  type: scope_boundary
  author: codex
  relevance_hint: high
  text: 'Scope boundary: this proposal is internal to P2P Engine software development.
    It does not address evidence coverage for user projects, such as whether a non-software
    design has sufficient requirements, tests, risks, alternatives, and acceptance
    evidence.'
- id: C004
  type: assumption
  author: codex
  relevance_hint: high
  text: 'Assumption: P2P Engine maintainers value occasional visibility into unexercised
    runtime code, but they do not want coverage to become the default per-change validation
    mechanism.'
- id: C005
  type: risk
  author: codex
  relevance_hint: high
  text: 'Risk: maintainers or agents could misread code coverage as a global quality
    score. Mitigation: document coverage as optional diagnostics only, avoid initial
    fail-under gates, and keep validation routing separate from coverage metrics.'
- id: C006
  type: alternative
  author: codex
  relevance_hint: high
  text: 'Alternative considered: introduce coverage as a mandatory CI threshold immediately.
    This creates a clear numeric gate, but it is premature without a baseline and
    risks incentivizing superficial tests that raise percentages without improving
    targeted regression protection.'
- id: C007
  type: scope_boundary
  author: codex
  relevance_hint: high
  text: 'Naming refinement: the accepted scope should be read as Advisory Code Coverage
    Diagnostics. The existing proposal title remains unchanged because the current
    P2P CLI has no supported proposal retitle primitive; the decision reason will
    carry the precise accepted scope.'
