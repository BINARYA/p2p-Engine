- id: C005
  type: implementation_suggestion
  author: codex
  relevance_hint: high
  text: 'CHANGE-065 implementation trace, recorded before commit. The implementation
    was completed as a production-hardening pass for the Agent Integration Registry
    MVP, with local development specs in specs/features/agent-integration-registry-production-hardening/.
    Implemented choices: keep generic as mandatory baseline and non-uninstallable;
    make p2p init default to all supported project-local adapters while narrow --agent
    init still includes generic; keep the registry authoritative with schema_version
    1, baseline_profile: generic, per-adapter status, maturity, template_version,
    capabilities, and file records carrying path, shared, owner, managed, template_id,
    sha256, and drift; explicitly reject active/default/current/preferred/use/switch
    agent state. Runtime behavior is centralized in the agent instruction service,
    with P2PWorkspace kept as facade, atomic registry/file writes, safe relative path
    validation, conservative update/install/uninstall, shared-file ownership checks,
    and force scoped only to the named operation. Health and diagnostics were made
    truthful through file statuses clean/missing/modified/unmanaged/conflicted/stale_template,
    adapter health clean/warning/error, semantic p2p validate checks for .p2p/agent-integrations.yml,
    CLI agent doctor exit behavior, and read-only MCP p2p_agent_doctor. CLI and MCP
    surfaces were aligned for list/show/install/update/uninstall/doctor, and init
    MCP default behavior now matches CLI all-adapter bootstrap. Deliberate non-MVP/follow-up
    choices: generated templates remain in Python source for now rather than package
    data; template staleness detection distinct from user drift, public dry-run, and
    CLI JSON output are deferred into separate local feature candidates. Evidence
    captured before commit: smoke init/list/doctor/validate on a temporary workspace
    passed after registry refresh; full test suite passed with 452 tests.'
