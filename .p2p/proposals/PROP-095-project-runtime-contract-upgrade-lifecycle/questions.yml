  - id: Q007
    group_id: QG007
    gap: release_availability
    criterion: release_availability
    priority: medium
    state: applied
    question: Should runtime contract updates verify that the proposed recommended
      version is actually available as a release, or only validate contract syntax
      and semantics?
    rationale: This fixes the boundary between project runtime policy updates and
      distribution/release metadata handled by PROP-080 or future capabilities.
    answer: 'PROP-095 shall always validate the proposed runtime contract syntactically
      and semantically, including that the recommended version satisfies the declared
      compatible range. The first implementation shall not require network access,
      package resolution, installation, or remote release lookup in order to update
      the contract. When trusted official release metadata is already available locally
      or packaged with P2P Engine, the operation should use it to report a positive
      verified_available result for the proposed recommended version. When no sufficiently
      authoritative metadata is available, the update may proceed with release_availability:
      unverified. The preview and final result shall clearly state that P2P has not
      confirmed that the recommended version is published or installable. unverified
      is a warning, not a contract validation failure. Absence from incomplete, stale,
      or optional local metadata shall not be treated as proof that a release does
      not exist. A blocking verified_unavailable state may be introduced later only
      if P2P gains access to an authoritative and complete release catalog with defined
      freshness semantics. PROP-095 shall not query GitHub, download release metadata,
      resolve wheels, or install anything. PROP-080 metadata may enrich availability
      diagnostics but shall not be a blocking dependency for runtime contract updates.'
    answer_source: owner
    answered_at: '2026-07-12'
