  - id: Q008
    group_id: QG008
    gap: cli_command_surface
    criterion: cli_command_surface
    priority: high
    state: applied
    question: Should the first runtime contract update implementation expose separate
      preview/apply subcommands or a single update command with mode-dependent behavior?
    rationale: This fixes the public command contract and reduces ambiguity around
      read-only preview versus mutating apply operations.
    answer: 'The first implementation shall expose two explicit subcommands: p2p runtime
      contract preview and p2p runtime contract apply. preview is strictly read-only.
      It validates the proposed contract, evaluates authority and current contract
      state, classifies impact, reports planned file changes, and returns a machine-readable
      expected_state_token. It shall never modify project files, consume consent,
      or perform environment mutation. apply is the only mutating command. It requires
      the same proposed requires and recommended values used during preview, the same
      structured reason and optional linked decision, a valid expected_state_token,
      current owner or permission authority, and explicit --confirm. apply shall re-read
      protected project state, revalidate authority and the proposed contract, recompute
      the expected-state token, and abort without mutation if the state or proposed
      values do not match the preview. The token is an optimistic-concurrency and
      proposal-binding mechanism; it does not replace authority or confirmation. The
      first implementation shall not provide a single-command mode that previews and
      applies in one invocation. A future interactive convenience wrapper may be added
      only if it delegates to the same preview and apply services and preserves the
      same security semantics. A no-op preview shall return no_change, require no
      apply operation, consume no consent, and modify no file.'
    answer_source: owner
