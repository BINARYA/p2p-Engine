  - id: Q012
    group_id: QG012
    gap: expected_state_token_semantics
    criterion: expected_state_token_semantics
    priority: high
    state: applied
    question: Should expected-state tokens be deterministic and stateless, or persisted
      and single-use in the first runtime contract update implementation?
    rationale: This fixes whether preview remains purely read-only and whether token
      lifecycle belongs to PROP-095 or to consent/audit capabilities.
    answer: The first implementation shall use a deterministic stateless expected-state
      token. preview shall calculate and return the token without persisting project,
      governance, audit, consent, or token-lifecycle state. apply shall reconstruct
      the same canonical input from current project state and the supplied proposal
      and shall proceed only when the recalculated token matches the supplied token.
      The token is an optimistic-concurrency and proposal-binding mechanism. It is
      not proof of owner or permission authority, explicit confirmation, a consent
      receipt, an audit record, or a secret bearer capability. The versioned token
      input shall bind at least the operation identifier, token-format version, exact
      current runtime-contract content or digest, exact managed setup-guide content,
      absence state, or unmanaged state, relevant required-contract and managed-file
      marker state, normalized proposed requires and recommended values, structured
      reason, any linked decision, impact-classification algorithm version, and calculated
      impact labels. apply shall re-read protected state, revalidate the proposal,
      recalculate impact, recompute the token, verify current authority, and require
      explicit confirmation before mutation. A token mismatch shall fail as stale_preview
      without modifying files. No applicable token shall be returned for an invalid
      proposed contract, an untrusted current contract, an unmanaged setup guide,
      another structural apply blocker, or a no-op update. Tokens shall not be persisted,
      consumed, marked as used, or given a lifecycle in the first implementation.
      Reuse of the same token for identical state and proposal is acceptable because
      authority and confirmation are independently checked during every apply operation.
      Single-use, expiry, actor binding, or persistent operation-intent semantics
      may be added later through the PROP-066 consent model or another explicit governed
      operation lifecycle, but shall not be added implicitly to the expected-state
      token.
