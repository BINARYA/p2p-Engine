  - id: Q016
    group_id: QG016
    gap: post_update_incompatible_runtime
    criterion: post_update_incompatible_runtime
    priority: high
    state: applied
    question: What post-update actions are allowed when applying a new runtime contract
      makes the active runtime incompatible?
    rationale: This prevents follow-up governed writes after the new contract activates
      the write gate against the active runtime.
    answer: When a confirmed runtime contract update causes the active P2P Engine
      runtime to fall outside the new compatible range, apply shall complete only
      the already authorized coordinated contract update. The implementation shall
      prepare and validate all required outputs before activating the new contract.
      The managed P2P-SETUP.md shall be replaced before .p2p/project/runtime.yml,
      and the normative runtime contract shall be replaced last. Any generic governed
      audit mutation that belongs to the same authorized operation must be completed
      before the final runtime-contract replacement or participate in the same coordinated
      write procedure. After the new runtime.yml is in effect, apply shall not perform
      further governed mutations, including registry or index refresh, proposal/contribution/change/work/governance
      writes, synchronization or managed-branch updates, migration or reconciliation,
      audit writes not already included in the coordinated operation, or Git commit/branch/push/pull-request
      automation. The command may perform narrowly scoped read-only verification of
      the exact artifacts it has just written, such as re-reading their bytes or checking
      expected digests. It shall not automatically invoke broad project validation
      or other operations that traverse unrelated governed state after the active
      runtime has become incompatible. The final result shall report that the contract
      update succeeded, the active runtime is now incompatible, subsequent governed
      writes are blocked, no post-update governed mutation was performed, full project
      validation is deferred until a compatible runtime is used, and the recommended
      next action plus P2P-SETUP.md guidance. A general read-only validation command
      may be invoked separately only according to the diagnostic policy defined by
      PROP-084 and is not an automatic side effect of PROP-095 apply.
    answer_source: owner
