  - id: Q014
    group_id: QG014
    gap: managed_setup_guide_drift
    criterion: managed_setup_guide_drift
    priority: medium
    state: applied
    question: Should apply regenerate a managed but drifted P2P-SETUP.md during a
      valid runtime contract update, or block until a separate repair command is run?
    rationale: This fixes the distinction between P2P-owned generated drift and unmanaged
      human documentation, and prevents no-change updates from becoming hidden repair
      operations.
    answer: 'When P2P-SETUP.md contains the stable P2P-managed marker but its generated
      content has drifted from the current runtime contract, PROP-095 shall allow
      a valid runtime contract update to proceed and shall regenerate the managed
      setup guide as part of the same coordinated operation. Preview shall explicitly
      report setup_guide_state: managed_drifted, setup_guide_action: regenerate, drift_repair:
      true, the managed file among planned file changes, and that existing drift will
      be replaced by deterministic content rendered from the proposed runtime contract.
      Managed-guide drift is a repair side effect and shall not by itself add a runtime-contract
      impact label or require a structured reason. Reason requirements continue to
      derive from contract impact labels such as range_tightening, runtime_line_change,
      and current_runtime_excluded. The expected-state token shall bind the exact
      current managed setup-guide content or digest, including its drifted state.
      During apply, the operation shall re-read the guide and verify that the stable
      managed marker is still present, its current content still matches the previewed
      state, and remaining protected project state still matches the expected-state
      token. If the guide changed after preview, apply shall fail as stale_preview
      without mutation. If the managed marker was removed, apply shall fail as unmanaged_setup_guide.
      After success, the result shall report that the runtime contract was updated,
      the managed setup-guide drift was repaired, files changed, and final compatibility
      state. A handled failure shall not leave the runtime contract updated while
      the managed guide remains stale. If requires and recommended are both unchanged
      and the only difference is setup-guide drift, PROP-095 shall report no_change
      plus a drift finding and shall not perform repair-only mutation; repair-only
      belongs to a separate command.'
