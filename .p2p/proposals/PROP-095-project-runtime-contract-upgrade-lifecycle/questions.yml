  - id: Q013
    group_id: QG013
    gap: recommended_only_updates
    criterion: recommended_only_updates
    priority: medium
    state: applied
    question: Should the owner be allowed to update only the recommended runtime version
      while keeping the compatible requires range unchanged?
    rationale: This fixes whether recommended is an independent project guidance field
      or only changes together with the compatibility range.
    answer: 'PROP-095 shall allow the project owner to update recommended without
      changing requires, provided that the proposed recommended version satisfies
      the unchanged compatible range. Such an update shall be classified as recommended_only
      when no other impact label applies. A normal recommended_only update requires
      preview, expected-state protection, owner authority, and explicit confirmation;
      does not require a linked P2P proposal or decision; does not normally require
      a structured reason; updates the runtime contract and regenerates the managed
      P2P-SETUP.md; does not change which installed runtime versions are compatible;
      and does not install or reconcile the recommended runtime. If the proposed recommended
      version does not satisfy requires, the proposal is invalid and no applicable
      token shall be produced. If both requires and recommended are unchanged, the
      operation shall return no_change, require no confirmation or reason, consume
      no consent, and modify no file. Multiple impact labels may still apply. In particular,
      when the active runtime does not satisfy the unchanged proposed range, the update
      shall be classified as both recommended_only and current_runtime_excluded. In
      that case a structured reason remains required, and the result shall report
      that the active runtime will remain incompatible after the update. Release availability
      remains informational. An otherwise valid recommended-only update may proceed
      with release_availability: unverified.'
