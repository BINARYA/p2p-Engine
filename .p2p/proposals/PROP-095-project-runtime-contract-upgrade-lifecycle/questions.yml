  - id: Q006
    group_id: QG006
    gap: confirmation_flow
    criterion: confirmation_flow
    priority: high
    state: applied
    question: Should runtime contract updates require two separate invocations, or
      may interactive users preview and confirm within one process?
    rationale: This determines the command surface and prevents agents or scripts
      from using --confirm to authorize unseen runtime-contract mutations.
    answer: 'Runtime contract updates shall use a logically two-phase workflow. For
      an interactive human terminal, preview and confirmation may occur within the
      same process: the command shows the complete preview, asks for confirmation
      only after the preview is visible, re-reads protected project state, and applies
      only if the state still matches the previewed state. A confirmation flag supplied
      before preview shall not bypass preview display or authorize an unseen mutation.
      For agents, CI, scripts, and any non-interactive execution, preview and application
      shall require separate explicit phases. Preview returns a machine-readable expected-state
      token. Confirmed application requires that token, explicit confirmation, and
      owner authority. The token binds at least the current runtime contract, current
      managed setup-guide content or absence state, managed-file and required-contract
      marker state, proposed requires and recommended values, structured reason, any
      linked decision, and calculated impact labels. --confirm without a valid token
      is rejected in non-interactive mode. A token shall not authorize different proposed
      values and shall fail if protected state changes after preview. No-op updates
      require neither confirmation nor token and do not change files or consume consent.'
    answer_source: owner
    answered_at: '2026-07-12'
