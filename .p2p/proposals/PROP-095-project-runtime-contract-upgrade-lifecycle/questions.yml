  - id: Q004
    group_id: QG004
    gap: impact_classification
    criterion: impact_classification
    priority: medium
    state: applied
    question: Which impact classification labels should be stable public contract
      for runtime contract updates?
    rationale: Labels such as recommended_only, range_widening, range_tightening,
      runtime_generation_change, and current_runtime_excluded affect owner preview
      and future stricter policy hooks.
    answer: The stable initial impact labels shall be recommended_only, range_widening,
      range_tightening, runtime_line_change, and current_runtime_excluded. Multiple
      labels may apply to the same update. recommended_only changes only the recommended
      version while the range is unchanged. range_widening means the supported comparison
      determines that the new range includes all previously compatible versions and
      adds at least one. range_tightening means the new range removes at least one
      previously compatible version. A range shift that both adds and removes compatible
      versions may produce both range_widening and range_tightening. runtime_line_change
      means the normalized major.minor line of the recommended version changes. current_runtime_excluded
      means the runtime executing the command will be incompatible after the update.
      The initial deterministic comparison grammar is limited to ==VERSION and >=LOWER,<UPPER.
    answer_source: owner
    answered_at: '2026-07-12'
