  - id: Q002
    group_id: QG002
    gap: owner_authority
    criterion: owner_authority
    priority: high
    state: applied
    question: Which existing owner, permission, or consent primitive should authorize
      confirmed runtime contract updates?
    rationale: The command requires authority and confirmation; confirmation alone
      cannot prove owner authorization.
    answer: Confirmed runtime contract updates are owner-controlled. For the first
      CLI implementation, authority means the actor resolves to an owner role in the
      supported project permissions policy, plus explicit confirmation. Confirmation
      proves intent, but does not replace authority. During the incompatible-range
      exception, the runtime may read only minimum supported authority state; if owner
      authority cannot be verified safely, the update remains blocked. MCP mutation
      is out of scope for the first implementation. If a future MCP tool is added,
      it must extend the consent operation registry with runtime_contract_update or
      equivalent and use the PROP-066 consent receipt model.
    answer_source: owner
