  questions:
  - id: Q001
    group_id: QG001
    gap: audit_policy
    criterion: audit_policy
    priority: medium
    state: applied
    question: Should confirmed runtime contract updates require a structured reason,
      or should historical audit rely on Git/external workflow until a generic P2P
      audit primitive exists?
    rationale: The proposal should not claim that current files are a full audit,
      but adding a dedicated runtime audit file may be over-scoped.
    answer: 'Confirmed runtime contract updates should support a structured reason.
      The first implementation should require --reason for high-impact changes that
      tighten the range, change runtime line, or exclude the active runtime, and may
      keep it optional for recommended-only and range-widening changes. PROP-095 should
      reuse a generic governed-change audit mechanism if one exists. If no canonical
      audit primitive exists, it should not invent a runtime-specific audit file;
      historical audit remains Git or external workflow. In that case the result must
      report reason_persisted: false and audit_mode: external so the user is not misled
      into thinking the reason was durably recorded by P2P.'
    answer_source: owner
    answered_at: '2026-07-12'
