  - id: Q011
    group_id: QG011
    gap: untrusted_current_contract_preview
    criterion: untrusted_current_contract_preview
    priority: high
    state: applied
    question: Should preview compute an applicable runtime contract transition when
      the current contract state is invalid, unsupported, missing, or legacy undeclared?
    rationale: This separates useful proposal validation from unsafe transition simulation
      when the current runtime contract cannot be trusted.
    answer: 'When the current runtime contract state is invalid_contract, unsupported_contract,
      missing_contract, or legacy_undeclared, p2p runtime contract preview may validate
      and normalize the proposed requires and recommended values, but it shall not
      produce an applicable update preview. The command shall return a diagnostic-only
      result that may include proposed normalized contract values, syntactic and semantic
      validation findings for the proposal, whether recommended satisfies requires,
      whether the active runtime would satisfy the proposed range as a hypothetical
      diagnostic, the current-state blocker, and the separate repair, migration, recovery,
      or adoption workflow required before a contract update can be applied. The command
      shall not produce an applicable expected_state_token, apply_allowed: true, an
      apply command or mutation plan, a complete transition impact classification,
      or any project or environment mutation. Comparative impact labels such as recommended_only,
      range_widening, range_tightening, and runtime_line_change require a valid and
      supported current contract and shall be omitted when the current state is untrusted.
      A hypothetical active-runtime check against the proposed range may be reported
      separately, but shall not be treated as an applicable current_runtime_excluded
      transition label. The result shall identify the required separate workflow:
      invalid_contract means contract repair, unsupported_contract means contract
      schema migration, missing_contract means contract recovery, and legacy_undeclared
      means contract adoption. These workflows remain outside PROP-095. p2p runtime
      contract apply shall remain blocked for all four states.'
