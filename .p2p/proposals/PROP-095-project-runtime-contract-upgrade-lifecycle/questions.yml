  - id: Q009
    group_id: QG009
    gap: preview_authority
    criterion: preview_authority
    priority: high
    state: applied
    question: Should runtime contract preview require owner authority, or remain executable
      as read-only diagnostics for agents and non-owner collaborators?
    rationale: This defines whether preview is an agent-safe diagnostic step or already
      part of the protected mutating authority boundary.
    answer: p2p runtime contract preview shall remain executable as a read-only diagnostic
      operation without requiring project-owner authority. Preview shall validate
      the proposed contract, classify its impact, calculate the expected-state token,
      and report whether the current actor appears able to perform the corresponding
      apply operation. Preview output shall distinguish whether authority is required
      for apply, whether the current actor can be resolved, whether the current actor
      appears authorized, and whether apply would currently be blocked for authority
      reasons. Lack of authority shall not invalidate or prevent the preview, allowing
      agents and non-owner collaborators to prepare a complete change request for
      an authorized owner. Preview shall not consume consent receipts, mutate permission,
      governance, audit, project, or environment state, treat the expected-state token
      as authorization, or expose unnecessary sensitive permission details. p2p runtime
      contract apply shall always perform a fresh and binding authority check and
      shall not rely on the preview authority assessment. The expected-state token
      binds protected project state and the proposed contract update. It does not
      bind or authorize the actor in the first implementation. A token generated during
      an agent or non-owner preview may be passed to an authorized owner, whose authority
      is independently verified during apply.
    answer_source: owner
