  - id: Q010
    group_id: QG010
    gap: unmanaged_setup_guide
    criterion: unmanaged_setup_guide
    priority: high
    state: applied
    question: Should runtime contract apply ever replace an existing unmanaged P2P-SETUP.md,
      or must unmanaged setup guides block the update in the first implementation?
    rationale: This fixes whether PROP-095 may overwrite user-owned documentation
      or must only update managed setup guides derived from the runtime contract.
    answer: When P2P-SETUP.md exists without the stable P2P-managed marker, p2p runtime
      contract apply shall always stop before mutation in the first implementation.
      PROP-095 shall not expose a flag such as --replace-unmanaged-setup-guide and
      shall not overwrite, adopt, merge, rename, or back up a user-owned setup document
      as a side effect of a runtime contract update. Preview shall remain read-only
      and shall report that the proposed runtime contract is syntactically and semantically
      valid when applicable, that P2P-SETUP.md is present and unmanaged, that apply
      is blocked by unmanaged_setup_guide, and that no project file has been or can
      be modified through the current operation. A preview containing this blocker
      shall not produce an expected-state token that can authorize apply. Owner authority,
      explicit confirmation, and a valid token shall not override this restriction.
      The runtime contract shall not be updated independently while an unmanaged setup
      guide prevents the corresponding managed guide update. Adopting, replacing,
      backing up, or otherwise converting an unmanaged P2P-SETUP.md into a P2P-managed
      artifact is a separate capability and is outside PROP-095.
    answer_source: owner
