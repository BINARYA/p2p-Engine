  - id: Q015
    group_id: QG015
    gap: partially_overlapping_ranges
    criterion: partially_overlapping_ranges
    priority: medium
    state: applied
    question: How should runtime contract updates classify partially overlapping or
      disjoint compatible ranges?
    rationale: This fixes deterministic impact classification for range shifts without
      introducing unnecessary labels.
    answer: PROP-095 shall classify runtime-range changes according to the set of
      versions accepted by the current and proposed ranges, rather than textual differences
      between expressions. Add range_widening when the proposed range accepts at least
      one version not accepted by the current range. Add range_tightening when the
      current range accepts at least one version not accepted by the proposed range.
      Both labels shall therefore apply when ranges partially overlap but neither
      is a subset of the other, for example current >=0.2.0,<0.4 and proposed >=0.3.0,<0.5.
      The same two labels shall apply to disjoint ranges, because the proposed range
      both removes previously compatible versions and introduces newly compatible
      versions. Preview output should separately report whether ranges overlap. No
      additional stable range_shift impact label is required in the first implementation.
      A change classified with both range_widening and range_tightening shall require
      a structured reason because range_tightening is present. recommended_only shall
      apply only when the compatible range is unchanged and only the recommended version
      changes. Other independent labels, including runtime_line_change and current_runtime_excluded,
      may be added to the same update when their respective conditions hold. Range
      comparison shall use the normalized supported range grammar and the same PEP
      440-compatible version semantics used to validate the runtime contract.
    answer_source: owner
