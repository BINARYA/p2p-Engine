  - id: Q005
    group_id: QG005
    gap: governance_policy
    criterion: governance_policy
    priority: high
    state: applied
    question: Should high-impact runtime contract updates require a linked P2P proposal
      or decision, or is owner-authorized command execution sufficient?
    rationale: This determines whether PROP-095 remains an autonomous runtime-contract
      lifecycle or becomes coupled to proposal/decision governance for runtime-line
      changes and tightening.
    answer: Runtime contract updates are owner-controlled governed operations, but
      the first implementation shall not require a linked P2P proposal or decision.
      Owner authority, explicit confirmation, stale-preview protection, and a structured
      reason are sufficient for execution. A reason is mandatory for range tightening,
      runtime-line changes, and updates that exclude the active runtime. The command
      may optionally link an existing P2P decision for traceability, but it shall
      not create one automatically or block execution solely because no decision is
      linked. A future project policy may require an accepted decision for selected
      project-level impacts, especially runtime-line changes and range tightening.
      current_runtime_excluded alone shall not trigger that policy because it also
      describes the local execution environment rather than only the project contract.
    answer_source: owner
