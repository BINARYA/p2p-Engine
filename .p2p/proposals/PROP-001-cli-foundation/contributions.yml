contributions:
  - id: C001
    type: objective
    author: bootstrap
    relevance_hint: high
    text: >
      Create a minimal Git-native CLI that automates the manually bootstrapped
      `.p2p/` structure and enables future proposals to be created through
      P2P Engine itself.

  - id: C002
    type: architectural_principle
    author: bootstrap
    relevance_hint: blocking
    text: >
      The first version must be platform-agnostic and must not depend on
      GitHub. Git can be used for local versioning and auditability.

  - id: C003
    type: constraint
    author: bootstrap
    relevance_hint: high
    text: >
      The MVP should not call AI providers directly. It should generate
      structured prompts that can be used manually with any AI assistant.

  - id: C004
    type: implementation_suggestion
    author: bootstrap
    relevance_hint: medium
    text: >
      Use Python with Typer for the initial CLI, Pydantic for validation,
      PyYAML for structured data, and Rich for terminal output.

  - id: C005
    type: scope_boundary
    author: bootstrap
    relevance_hint: high
    text: >
      Web app, users, billing, MCP, direct AI adapters, and full external
      exporters are explicitly out of scope for the first implementation.

