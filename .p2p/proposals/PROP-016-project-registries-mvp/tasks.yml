tasks:
  - id: T001
    title: "Define registry folder and generated-file rules"
    status: pending
    domain: design
    description: "Define `.p2p/registries/` as a generated, versioned index layer and document that source artifacts remain primary."
    acceptance:
      - "Registry location is documented."
      - "Generated-file overwrite policy is explicit."
      - "Primary source artifacts are listed."

  - id: T002
    title: "Define minimum schemas for typed registries"
    status: pending
    domain: design
    description: "Specify compact YAML records for proposals, decisions, changes, choices, relations and artifacts."
    acceptance:
      - "`proposals.yml` fields are defined."
      - "`changes.yml` fields are defined."
      - "`relations.yml` fields are defined."
      - "Decision, choice and artifact fields have a first MVP shape."

  - id: T003
    title: "Implement `p2p registry refresh`"
    status: pending
    domain: software
    description: "Generate `.p2p/registries/` from existing P2P source artifacts."
    acceptance:
      - "Command creates all MVP registry files."
      - "Output is deterministic."
      - "Command does not perform Git writes."
      - "Generated registries include proposals and existing Change Sets."

  - id: T004
    title: "Implement registry status and show commands"
    status: pending
    domain: software
    description: "Provide readable terminal views for registry health and selected registry contents."
    acceptance:
      - "`p2p registry status` reports existing and missing registries."
      - "`p2p registry show proposals` lists proposal IDs, titles and statuses."
      - "`p2p registry show changes` lists Change Set IDs, titles and statuses."

  - id: T005
    title: "Connect registries to future project refresh and AI context"
    status: pending
    domain: architecture
    description: "Document how registries will support project refresh, proposal intake, overlap analysis, conflict checks and future exporters."
    acceptance:
      - "Integration points are documented."
      - "The MVP does not require all downstream commands to depend on registries immediately."

  - id: T006
    title: "Add tests and README documentation"
    status: pending
    domain: quality
    description: "Cover registry refresh/status/show behavior and explain the workflow in README."
    acceptance:
      - "CLI tests cover registry creation and basic display."
      - "README documents registry commands."
      - "Generated-file policy is visible to users."
