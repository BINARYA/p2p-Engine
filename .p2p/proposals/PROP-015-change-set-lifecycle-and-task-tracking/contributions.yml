contributions:
- id: C001
  type: architectural_principle
  author: local
  relevance_hint: high
  text: 'Il lifecycle del Change Set deve essere separato dallo status della proposal:
    la proposal decide, il Change Set realizza.'
- id: C002
  type: constraint
  author: local
  relevance_hint: high
  text: Le transizioni devono essere validate per evitare che un Change Set passi
    direttamente da proposed a completed.
