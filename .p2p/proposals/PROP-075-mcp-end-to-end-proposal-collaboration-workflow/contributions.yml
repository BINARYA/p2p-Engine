contributions:
- id: C001
  type: alternative_proposal
  author: local
  relevance_hint: Defines the safe consent path for end-to-end MCP collaboration.
  text: 'Consent alternatives to evaluate: A) expose p2p_consent_grant via MCP, easiest
    but unsafe without strong authentication; B) expose p2p_consent_request via MCP
    and require owner CLI/UI approval, safest MVP; C) allow policy-based auto-consent
    for low-risk operations, useful later but requires careful role policy; D) external
    IAM/API server, robust but outside local MVP. Recommended direction: B first,
    with CLI owner approval and audit metadata.'
- id: C002
  type: alternative_proposal
  author: local
  relevance_hint: Addresses the observed branch chaining failure mode.
  text: 'Branch-base alternatives to evaluate: A) keep using current branch as base,
    flexible but caused branch chaining in real use; B) default to main and require
    --from-current to override, safer for agents; C) require base_branch explicitly
    in MCP calls, safest but more verbose; D) infer from remote profile default branch
    after fetch, best cloud behavior later. Recommended direction: CLI may keep current-branch
    default with warnings, but MCP should require base_branch or default to configured
    base/main and refuse proposal-branch chaining unless explicitly requested.'
