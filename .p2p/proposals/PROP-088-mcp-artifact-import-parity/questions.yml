    question: Should the MVP scope include only impact and exploration import parity,
      deferring a generic artifact import primitive?
    rationale: This is the main scope boundary that determines implementation risk
      and acceptance readiness.
    answer: 'No. Do not limit the MVP to only impact and exploration. The MVP should
      provide MCP parity for all existing controlled CLI proposal-artifact import
      primitives with fixed targets and validation: exploration imports, impact imports,
      clarification imports, synthesis/proposal imports, plan imports, and tasks imports.
      Generic arbitrary artifact import remains deferred; total parity here means
      parity with known CLI import services, not an unmanaged write primitive.'
