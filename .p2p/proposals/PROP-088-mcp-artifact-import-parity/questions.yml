    question: Should clarification import parity be included in PROP-088 if it can
      reuse the existing clarify import service without broadening the scope?
    rationale: Clarifications were part of the observed artifact gap, but impact/exploration
      parity is the narrowest MVP.
    answer: Yes. Include clarification import parity in PROP-088 because the CLI already
      exposes clarify import through the existing import_artifact service, clarifications.md
      is part of the artifact/readiness model, and exposing the same controlled service
      through MCP completes parity without introducing a generic arbitrary artifact
      importer.
