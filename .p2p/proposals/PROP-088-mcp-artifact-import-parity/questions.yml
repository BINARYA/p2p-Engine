  - id: Q003
    group_id: QG001
    gap: owner_questions_resolution
    criterion: owner_questions_resolution
    priority: medium
    state: applied
    question: Should MCP artifact import tools accept source paths, direct content
      payloads, or both?
    rationale: The input shape affects MCP client ergonomics, validation, and filesystem
      assumptions.
    answer: Both. MCP artifact import tools should accept source paths and direct
      content payloads. Source paths preserve parity with the current CLI import services
      and support directory-based imports; direct payloads cover real MCP client workflows
      where generated content is already available in the tool call and should not
      require an extra filesystem handoff. The tools must still use explicit artifact
      kinds, validation, allowlists, and structured result metadata rather than becoming
      a generic unmanaged write primitive.
    answer_source: owner
