conflicts:
  - type: compatibility_tension
    proposals:
      - PROP-047
      - PROP-093
    reason: "Existing guided init behavior defaults to broad adapter generation, while PROP-093 reduces noise when the current agent is detectable. A strict conservative default would break cross-agent usability for undetected clients."
    suggested_resolution: "Use adaptive initialization: always install generic, add the detected current adapter when reliable, and fallback to all with a concise file-footprint warning when detection is unavailable. Existing projects keep their installed adapters until the owner runs safe lifecycle commands."
  - type: policy_tension
    proposals:
      - PROP-086
      - PROP-093
    reason: "Agent orchestration should remain proactive, but meaningful persistent writes still need preview when the owner request is ambiguous or not artifact-specific."
    suggested_resolution: "Keep proactive analysis and P2P proposal creation available, but require action previews for persistent writes unless the owner explicitly requested the exact operation and artifact."
  - type: scope_tension
    proposals:
      - PROP-093
      - PROP-094
    reason: "PROP-093 must route software-spec requests correctly without making software specs or file names such as tech-stack.md, substrate.md, or phase0.md generic core P2P concepts."
    suggested_resolution: "Keep specs out of the core primitive list. Route software-spec requests to PROP-094 and other explicit vertical primitives or import/export/catalog contracts."
  - type: topology_tension
    proposals:
      - PROP-085
      - PROP-093
    reason: "Decision-root hardening may be misread as support for sibling repositories or a preferred repository topology."
    suggested_resolution: "Document decision root as a core operational concept independent from current working directory and repository layout. Do not recommend sibling repositories as product direction."
