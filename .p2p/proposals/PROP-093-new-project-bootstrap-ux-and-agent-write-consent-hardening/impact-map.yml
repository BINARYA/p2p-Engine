impact:
  proposal: PROP-093
  summary: "Harden core P2P agent write boundaries and proposal authoring flow so persistent project memory is classified, previewed, and written through supported primitives."
  scope_decision: "Core proposal with a semantic core, operational core, bootstrap UX scope, and opportunistic hygiene scope. Covers agent persistence, canonical proposal authoring, logical artifact status, owner-friendly proposal rendering, explicit decision root, adaptive agent bootstrap, integration lifecycle visibility, MCP/root hardening, and non-destructive hygiene. Excludes sibling repository product direction and software-specific spec lifecycle."
  affected_areas:
    - area: "Semantic core"
      impact: "Clarifies canonical write surfaces, persistent write classes, generated/imported/exported/stable artifact boundaries, proposal authoring flow, logical artifact status, and owner-facing full proposal views."
    - area: "Operational core"
      impact: "Makes the P2P decision root explicit through CLI --root, MCP configuration, generated hints, and agent instructions so agents operate against the intended governed workspace."
    - area: "Agent policy and generated instructions"
      impact: "Adds write classes, action-preview rules, direct .p2p edit boundaries, stable-documentation caveats, and a compact request-routing playbook."
    - area: "Proposal authoring"
      impact: "Clarifies structured inputs versus generated/imported narrative artifacts and prevents scaffolded markdown from looking like the normal manual write surface."
    - area: "Contributions and questions"
      impact: "Aligns write-safe primitives with narrative concepts shown by proposal artifacts using additive schema changes or explicit import paths."
    - area: "Artifact status and owner view"
      impact: "Exposes deterministic logical artifact status and full proposal rendering so owners and agents do not infer completeness from directory listings."
    - area: "Bootstrap UX"
      impact: "Uses adaptive adapter selection: generic baseline plus detected current agent when reliable, with fallback all when detection is unavailable, and documents list/install/update/doctor/refresh/uninstall lifecycle commands."
    - area: "Repository hygiene"
      impact: "Adds non-destructive .gitignore protection and grouped init summaries without making hygiene block the semantic or operational core."
    - area: "Documentation and tests"
      impact: "Updates docs and tests for write boundaries, generated artifact handling, proposal flow, artifact status, decision-root language, adaptive bootstrap, compatibility, and safe integration lifecycle."
  related_proposals:
    - id: "PROP-094"
      relation: "Software-specific spec lifecycle. PROP-093 routes software-spec requests to explicit vertical primitives instead of making specs a generic core P2P primitive."
    - id: "PROP-088"
      relation: "MCP artifact import parity supports write-safe import rather than direct .p2p edits."
    - id: "PROP-089"
      relation: "Structured question state is an example of canonical P2P state replacing stale markdown owner-question ambiguity."
    - id: "PROP-085"
      relation: "Vertical runtime hardening benefits from clear core decision-root and artifact boundaries."
  risks:
    - "Scope can grow if semantic core, operational root hardening, bootstrap UX, and hygiene are delivered as one indistinct pass."
    - "Agent detection can be wrong or unavailable; fallback all preserves compatibility but keeps some file footprint noise."
    - "Safe uninstall can be risky if it deletes shared files or human-edited drift."
    - "Existing users may have manually edited proposal markdown and need legacy rendering rather than destructive migration."
    - "Artifact catalog state can become stale if physical writes and logical status diverge."
    - "Documentation must avoid implying that sibling repositories are recommended."
    - "Core language must avoid treating software specs as a generic P2P primitive."
