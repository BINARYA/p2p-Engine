impact:
  proposal: PROP-097
  areas:
    - runtime_contract_service
    - runtime_cli
    - project_manifest_marker
    - managed_setup_guide
    - validation_warning_resolution
  behavior:
    - Enables legacy_undeclared projects to create their first runtime contract through a supported command.
    - Converts runtime status from legacy_undeclared to compatible when the adopted contract matches the active runtime.
    - Keeps adoption separate from runtime installation, update, and missing-contract recovery.
  out_of_scope:
    - package_installation
    - network_release_lookup
    - unmanaged_setup_guide_replacement
    - mcp_mutation_parity
