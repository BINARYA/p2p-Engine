contributions:
- id: C001
  type: alternative_proposal
  author: local
  relevance_hint: Captures implementation alternatives for runtime bootstrap robustness.
  text: 'Alternatives to evaluate: A) documentation-only recovery, cheapest but still
    leaves cloud agents blocked; B) repo-local bootstrap script or doctor command,
    pragmatic and provider-neutral; C) package p2p as a committed tool wrapper or
    uv/pipx bootstrap, better cloud ergonomics but more packaging work; D) rely only
    on MCP, insufficient because many environments start with no MCP server configured.
    Recommended direction: B first, plus docs and generated AGENTS fallback text;
    later add packaging improvements.'
