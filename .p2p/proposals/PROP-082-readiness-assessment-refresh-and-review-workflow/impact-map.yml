impact:
  proposal: PROP-082
  features:
    - proposal readiness review
    - proposal question memory
    - proactive agent guidance
    - artifact-aware answer application
    - stepped readiness-driven assertiveness
    - readiness recalculation
  commands:
    - p2p proposal readiness init
    - p2p proposal readiness refresh
    - p2p proposal readiness review
    - p2p proposal questions init
    - p2p proposal questions add
    - p2p proposal questions answer
    - p2p proposal questions apply
    - p2p proposal questions next
  files:
    - proposal.md
    - findings.md
    - alternatives.md
    - open-questions.md
    - risks.md
    - assumptions.md
    - suggested-scope.md
    - impact-map.yml
    - readiness.yml
    - questions.yml
  governance:
    - owner remains responsible for accept/reject/defer/merge decisions
    - owner override remains separate from computed readiness
    - agent may recommend and prepare artifact updates but must not decide
  project_artifacts:
    - agent instructions
    - Codex skill guidance
    - MCP tool descriptions
    - CLI guide
    - local feature specs
  dependencies:
    - proposal question service
    - readiness service
    - proposal artifact import/update commands
    - validation service
  risks:
    - passive agents if skill guidance is too weak
    - stale readiness if recalculation does not inspect updated artifacts
    - over-aggressive questioning if stepped policy is not respected
