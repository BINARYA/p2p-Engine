    gap: readiness_recalculation
    criterion: readiness_recalculation
    priority: high
    state: applied
    question: 'Which command should perform evidence-aware recalculation after answers
      are applied: refresh, assess, review, or a new dedicated primitive?'
    rationale: Low readiness must trigger recalculation and continued interviewing.
    answer: Use a dedicated evidence-aware reassessment path rather than overloading
      conservative refresh. refresh may synchronize stored evidence, but assess/review
      should recompute criteria, failed gates, missing items, confidence, acceptance
      cautions, and next actions from current artifacts after answers are applied.
