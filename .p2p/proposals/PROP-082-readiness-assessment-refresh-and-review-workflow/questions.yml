    gap: stepped_assertiveness
    criterion: stepped_assertiveness
    priority: medium
    state: applied
    question: What readiness bands should the agent use to switch from aggressive
      interviewing to residual confirmation?
    rationale: Pedantry is readiness-driven rather than a standalone score.
    answer: 'Use stepped readiness-driven assertiveness rather than a separate pedantry
      score: weak/blocked readiness means aggressive interviewing and no acceptance
      recommendation; partial readiness means focused follow-up on high-impact gaps;
      near-ready means residual confirmation only; deferred/muted areas are skipped
      unless the owner asks to revisit or increase readiness.'
