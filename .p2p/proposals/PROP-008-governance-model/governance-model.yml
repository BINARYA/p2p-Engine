governance_models:
  - id: owner_decides
    description: Project owner or maintainer decides.
    recommended_for:
      - bootstrap
      - small_team
      - fast_iteration

  - id: open_consensus
    description: Proposal accepted when there are no unresolved blocking objections or when maintainer confirms consensus.
    recommended_for:
      - community
      - open_discussion
      - non_exclusive_decisions

  - id: exclusive_vote
    description: Mutually exclusive alternatives are resolved by a recorded single-winner vote.
    recommended_for:
      - architecture_choice
      - governance_choice
      - mutually_exclusive_alternatives

default_for_bootstrap: owner_decides

git_integration:
  audit_layer: true
  permission_enforcement: false
  future_controls:
    - branch_protection
    - codeowners
    - required_reviews
    - signed_commits
    - team_permissions

