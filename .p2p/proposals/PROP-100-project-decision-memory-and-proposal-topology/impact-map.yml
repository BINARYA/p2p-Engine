  governance:
    - Preserves governed artifacts as source of truth according to domain role.
    - Excludes registries, decision maps, generated narratives, prompts, publications and caches from semantic extraction.
    - Keeps owner-controlled decisions and controlled apply outside derived retrieval.
    - Separates canonicality, authority, activation, confidence and completeness.
    - Treats readiness and artifact state as evidence quality, not decision authority.
    - Requires CLI and MCP parity and compatibility for non-proposal targets.
    - Treats PROP-100 as one umbrella specification delivered through independently gated slices.
  project_artifacts:
    - proposal.md and decision.md
    - decisions-map.yml
    - relations.yml
    - related-proposals.yml
    - impact-map.yml
    - conflict-analysis.yml
    - choices and choice links
    - conflicts.yml
    - Change Set source and relation files
    - Work manifests
    - vertical coverage and project definition
    - decision-precedents.yml
    - readiness.yml
    - artifact-state.yml
    - questions.yml
    - contributions.yml
  dependencies:
    - PROP-012 impact map and conflict memory
    - PROP-016 project registries
    - PROP-017 proposal intake and context analysis
    - PROP-023 next-action recommender
    - PROP-024 choice blocking and discovery
    - PROP-025 controlled intake apply workflow
    - PROP-044 MCP server MVP
    - PROP-055 token budget and context discipline
    - PROP-086 artifact-aware readiness
    - PROP-088 MCP artifact import parity
    - PROP-089 readiness question state convergence
    - PROP-096 readiness evidence quality
    - PROP-099 project output lifecycle
  risks:
    - Accidental second source of truth or projection feedback loop.
    - Stale snapshot retained by a memoized service.
    - Parser loss or silent malformed-frontmatter fallback.
    - Incomplete decision lifecycle or false global applicability.
    - Duplicate or divergent Change Set relation evidence.
    - Heuristic relations treated as authoritative topology.
    - Cycles or fan-out causing unstable retrieval.
    - Repeated scans causing context performance regressions.
    - Non-deterministic freshness caused by generated_at.
    - CLI/MCP or non-proposal target compatibility drift.
