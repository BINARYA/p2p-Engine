contributions:
- id: C001
  type: finding
  author: codex
  relevance_hint: high
  text: La genealogia funzionale corretta e PROP-017 per intake/context analysis piu
    PROP-025 per controlled intake apply. PROP-100 deve fornire il substrato di memoria
    e topologia che questi workflow consumano, non sostituirli.
- id: C002
  type: constraint
  author: codex
  relevance_hint: high
  text: La memoria canonica non deve essere una sintesi narrativa libera. Il primo
    MVP deve estrarre solo dati dichiarati o strutturabili in modo verificabile, con
    provenance e source hash.
- id: C003
  type: risk
  author: codex
  relevance_hint: high
  text: 'Rischio: se la memoria canonica viene aggiornata da testo libero di proposal
    accepted senza stabilire prima quali parti siano interpretabili strutturalmente,
    agenti diversi potrebbero produrre memoria derivata diversa o incoerente.'
- id: C004
  type: implementation_suggestion
  author: codex
  relevance_hint: high
  text: 'Suggerimento MVP: introdurre operazioni equivalenti a p2p memory rebuild,
    p2p memory validate e p2p memory context, con registri rebuildable per decisions,
    principles, constraints, capabilities, proposal topology e build manifest.'
- id: C005
  type: assumption
  author: codex
  relevance_hint: high
  text: 'Assunzione: stati diversi alimentano livelli diversi. Draft e in review entrano
    nella topologia esplorativa; accepted aggiorna la memoria canonica; rejected,
    deferred, superseded e revoked restano consultabili come storico, genealogia o
    contesto, ma non diventano vincoli attivi.'
- id: C006
  type: scope_boundary
  author: codex
  relevance_hint: high
  text: 'Supersession note: C002-C005 are historical and must be interpreted through
    the revised scope. PROP-100 no longer proposes canonical project memory or p2p
    memory commands; it proposes a derived, non-canonical decision context model with
    optional disposable cache.'
- id: C007
  type: architectural_principle
  author: codex
  relevance_hint: high
  text: 'Architecture boundary: PROP-100 is decision-ready as an umbrella direction,
    not implementation-ready as one feature. Implementation must be split into dependent
    features starting with the derived domain model and initial extractors.'
- id: C008
  type: finding
  author: codex
  relevance_hint: medium
  text: 'Technical review: comments.yml has no public CLI write primitive in the current
    engine; record review guidance as governed contributions and imported artifacts
    instead of editing comments.yml manually.'
- id: C009
  type: architectural_principle
  author: codex
  relevance_hint: high
  text: 'Refinement: the first extracted feature must include a bounded extraction
    session/source snapshot with shared source discovery, source hashes, deterministic
    ordering and extractor diagnostics, so decision context does not repeat current
    global-scan behavior.'
- id: C010
  type: constraint
  author: codex
  relevance_hint: high
  text: 'Refinement: the authority matrix must distinguish accepted decisions, decided
    project choices, proposal-local votes, draft/deferred/rejected proposals, owner-confirmed
    artifact state, agent-proposed artifacts, structured question state and heuristic
    vertical matches.'
- id: C011
  type: implementation_suggestion
  author: codex
  relevance_hint: high
  text: 'Refinement: context packets, intake, proposal prompts, next actions, registries/projections
    and MCP handlers should migrate through the decision context service with compatibility
    adapters instead of reading raw registries as semantic truth.'
- id: C012
  type: implementation_suggestion
  author: codex
  relevance_hint: high
  text: 'Refinement: verification must add a golden decision-context corpus covering
    accepted, draft, deferred, rejected, related, conflicting, choice-linked, artifact-state
    and vertical-mapped proposals, plus CLI/MCP schema parity tests.'
- id: C013
  type: architectural_principle
  author: codex
  relevance_hint: high
  text: 'The refined repository feature establishes the final architecture invariants:
    versioned source catalog and exclusions, request-scoped captured-byte snapshots,
    complete decision lifecycle, typed topology, deterministic applicability and retrieval,
    structural performance gates, semantic freshness, compatibility boundaries and
    no persistent cache under PROP-100. Proposal artifacts were realigned through
    supported P2P import primitives; detailed numeric policies and implementation
    tasks remain in specs/features/prop-100-decision-context-index/.'
