    priority: high
    state: applied
    question: La prima implementazione deve salvare interaction_style come default
      di progetto, come default per agente, o come entrambi con precedenza esplicita?
    rationale: Questa scelta determina schema, CLI, MCP e generazione delle istruzioni
      agente.
    answer: Default di progetto. La prima implementazione deve salvare un solo interaction_style
      a livello progetto; per-agent e session override restano estensioni future,
      non incluse nella prima slice.
