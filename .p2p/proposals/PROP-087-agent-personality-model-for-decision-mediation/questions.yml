    gap: preset_surface
    criterion: preset_surface
    priority: medium
    state: applied
    question: Vuoi esporre solo i due slider numerici o anche 2-3 preset nominati
      come default_mediator, plain_non_technical e technical_operator?
    rationale: I preset semplificano la scelta owner-facing, ma aggiungono un layer
      di traduzione da mantenere.
    answer: Preferisco non usare preset nominati nella prima implementazione. I preset
      diventano difficili da mantenere se il modello cresce da due scale a tre, quattro
      o cinque dimensioni. La configurazione deve restare basata su scale esplicite
      e indipendenti; le etichette possono al massimo essere descrizioni UI non persistite
      come fonte di verita.
