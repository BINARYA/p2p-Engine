contributions:
- id: C001
  type: alternative_proposal
  author: codex
  relevance_hint: high
  text: 'Alternative A - Project-level interaction style, recommended first slice.
    Store one default interaction_style for the project and inject it into generated
    agent instructions. Pros: simple, deterministic, good backward compatibility,
    easy validation, clear owner control. Cons: less flexible when different agents
    or tasks need different tones; session-specific adjustment still requires a future
    override.'
- id: C002
  type: alternative_proposal
  author: codex
  relevance_hint: high
  text: 'Alternative B - Per-agent style defaults. Store style per agent profile,
    for example codex, claude, generic. Pros: different agent surfaces can match their
    expected usage; useful when one agent is technical and another is mediator-oriented.
    Cons: more configuration paths, more generated instruction variants, higher risk
    of inconsistent owner experience.'
- id: C003
  type: alternative_proposal
  author: codex
  relevance_hint: medium
  text: 'Alternative C - Runtime or session override. Let the owner set temporary
    technical_verbosity and formality for a specific conversation or command. Pros:
    maximum flexibility and useful for debugging or demos. Cons: harder to persist/audit,
    weak for remote MCP unless exposed as explicit tool state, and can make agent
    behavior unpredictable across sessions.'
- id: C004
  type: constraint
  author: codex
  relevance_hint: high
  text: 'Operational constraint: personality must affect presentation only. It must
    not change proposal acceptance, owner authority, permission gates, validation
    results, readiness scores, or the facts the agent reports. Technical verbosity
    0 must hide engine jargon from the owner-facing wording, not suppress real operations
    or audit evidence.'
- id: C005
  type: implementation_suggestion
  author: codex
  relevance_hint: high
  text: 'Implementation suggestion: model scales as validated integers, then render
    them into instruction text through a small mapping table. Example technical_verbosity
    0 means project outcomes only; 1 means minimal operational terms; 2 means light
    engine vocabulary when useful; 3 means commands and artifacts summarized; 4 means
    commands and files usually named; 5 means detailed command-by-command trace. Formality
    0 means very informal; 1 casual; 2 direct and human; 3 professional; 4 formal;
    5 detached/legalistic.'
- id: C006
  type: risk
  author: codex
  relevance_hint: high
  text: 'Risk: overfitting tone controls into agent prompts could create brittle behavior.
    Mitigation: keep the persisted model small, numeric, validated, and renderer-owned;
    avoid long free-form persona descriptions as source of truth. Risk: users may
    expect technical_verbosity 0 to hide all technical work. Mitigation: distinguish
    owner-facing language from audit/diagnostic evidence.'
- id: C007
  type: architectural_principle
  author: codex
  relevance_hint: high
  text: 'Recommendation: choose Alternative A for the first implementation, with schema
    designed for later Alternative B and C. Start with one project-level default style
    because it gives immediate value to generated agent instructions and keeps the
    owner experience stable. Add per-agent override only after the default model is
    proven. Add session override only when MCP/CLI can expose it explicitly and auditably.'
- id: C008
  type: constraint
  author: codex
  relevance_hint: high
  text: 'Owner clarification: first implementation scope is project-level default
    interaction_style only. Per-agent defaults and runtime/session overrides should
    be treated as future extension points, not first-slice requirements.'
- id: C009
  type: constraint
  author: codex
  relevance_hint: high
  text: 'Owner clarification: default interaction style is technical_verbosity=2 and
    formality=2. This is the normal mediator tone: project-first, limited technical
    terms only when useful, direct and human.'
- id: C010
  type: constraint
  author: codex
  relevance_hint: high
  text: 'Owner clarification: named style presets should not be part of the persisted
    first-slice model. They do not scale when the model gains additional dimensions.
    Persist explicit independent scales as the source of truth; any labels should
    be non-authoritative UI/help text only.'
- id: C011
  type: feature_request
  author: codex
  relevance_hint: high
  text: 'Potential extension: add an assertiveness/strictness scale, informally described
    by the owner as pedanteria. Meaning: how strongly the agent pushes for unresolved
    gaps, order, evidence, and follow-up before moving on. Candidate range: 0 = current
    standard/passive enough to proceed when owner wants; 5 = highly persistent and
    exacting, keeps challenging until artifacts, questions, and rationale are well
    ordered. This should be evaluated as a third independent numeric scale, not encoded
    through style presets.'
- id: C012
  type: constraint
  author: codex
  relevance_hint: high
  text: 'Owner decision: assertiveness/pedanteria is in scope for the first implementation
    as a third independent 0..5 scale. It controls persistence on gaps and order,
    not technical vocabulary or social formality. Persist it as assertiveness in configuration;
    use pedanteria only as informal discussion language if needed.'
- id: C013
  type: constraint
  author: codex
  relevance_hint: high
  text: 'Owner decision: default interaction_style is technical_verbosity=2, formality=2,
    assertiveness=0. The first implementation must provide public CLI commands to
    read and update these values; agents must not update the configuration by editing
    .p2p files directly.'
- id: C014
  type: implementation_suggestion
  author: codex
  relevance_hint: high
  text: 'Implementation direction: expose interaction style through explicit MCP tools
    with clear read-only/write-safe descriptions, and update generated agent instructions
    plus project/local skills so agents know to inspect and update style only through
    CLI or MCP primitives.'
- id: C015
  type: constraint
  author: codex
  relevance_hint: high
  text: 'Owner decision: CLI/MCP namespace should be project interaction-style. Rationale:
    interaction style is a shared project property, so every agent or mediator addressing
    the decision owner should use the same project-level defaults unless a future
    proposal adds explicit overrides.'
