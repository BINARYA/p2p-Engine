contributions:
- id: C001
  type: implementation_suggestion
  author: local
  relevance_hint: Defines the concrete user-facing flow and recovery behavior for
    ergonomic init.
  text: 'Suggested CLI shape: keep current p2p init defaults for local projects, then
    add cloud ergonomics with options such as p2p init "Scatola Perfetta" --repository
    cloud --provider github --remote origin --remote-url git@github.com:ORG/scatola-perfetta.git
    --owner matteo. If --repository cloud is set without --remote-url, init should
    still succeed but mark the remote profile incomplete and print the exact follow-up
    command. If a Git repository already has the named remote, P2P should reuse it
    when the URL matches, warn clearly when it differs, and never silently overwrite
    Git configuration. A later explicit command may attach or repair the Git remote,
    but the MVP should focus on P2P profile metadata and validation guidance.'
- id: C002
  type: constraint
  author: local
  relevance_hint: Keeps the proposal aligned with the Core/CLI/MCP boundary and avoids
    accidental provider automation.
  text: 'Important boundary: ergonomic init must not hide provider-side security.
    P2P can record provider, remote name, URL, and readiness status, but GitHub/GitLab
    repository creation, SSH credentials, token scopes, branch protection, and main-branch
    permissions remain provider concerns unless a future adapter proposal explicitly
    adds those capabilities. Error messages should distinguish P2P profile problems
    from Git remote problems and provider authentication problems.'
- id: C003
  type: risk
  author: local
  relevance_hint: Refines ergonomic remote initialization with a real user-observed
    failure mode.
  text: 'New dogfooding finding from a cloud Codex test: init accepted --repository
    remote even though help documents only local/cloud, and a project can have Git
    origin configured while the P2P remote profile remains local. This creates split-brain
    state between Git and P2P. PROP-073 should explicitly cover repository-mode validation/aliases,
    auto-detection of existing Git remotes during init/status, and recovery guidance
    that tells users whether to run p2p project remote configure, git remote add,
    or both.'
