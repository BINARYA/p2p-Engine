impact:
  proposal: PROP-099
  summary: >
    Introduces a human project publication pipeline that turns the deterministic
    complete project export into a curated, validated, PDF-rendered publication
    artifact while keeping .p2p as the governed source of truth.
  impact_type: publication_pipeline
  execution_domains:
    - documentation
    - p2p_governance
    - software
    - testing
  affected_areas:
    - area: visible project outputs
      impact: >
        Keeps the complete export available while adding curated Markdown and
        neutral PDF publication artifacts.
    - area: project export workflow
      impact: >
        Treats p2p project export as the deterministic complete export stage,
        not the final publication-quality document.
    - area: agent skills
      impact: >
        Adds an installable p2p-project-curator skill that performs bounded
        semantic curation without mutating .p2p state.
    - area: publication validation
      impact: >
        Adds deterministic checks for heading structure, placeholders,
        traceability, status vocabulary, source-of-truth warning, and PDF-ready
        Markdown.
    - area: PDF rendering
      impact: >
        Adds a neutral presentation-only renderer that consumes validated
        curated Markdown and must not rewrite project facts.
    - area: software spec lifecycle
      impact: >
        Preserves the separation between human project publication and
        P2P-native software specs or downstream OpenSpec/Spec Kit exports.
  commands:
    - command: p2p project export
      impact: Remains the complete deterministic export producer.
    - command: future p2p project publish prepare
      impact: Candidate later orchestration step for freezing inputs and profile.
    - command: future p2p project publish validate
      impact: Candidate deterministic publication contract validator.
    - command: future p2p project publish render
      impact: Candidate neutral PDF rendering command.
    - command: future p2p project publish status
      impact: Candidate summary of publication freshness, artifacts, and checks.
  files:
    - path: outputs/latest/project.md
      impact: Remains the complete export during the first slice.
    - path: outputs/latest/project.curated.md
      impact: New curated owner-review candidate in the first slice.
    - path: outputs/latest/project.pdf
      impact: New neutral PDF rendered from validated curated Markdown.
    - path: outputs/latest/project.full.md
      impact: Later convention for preserving the complete export if project.md becomes curated.
    - path: outputs/latest/project.appendix.md
      impact: Later optional traceability/detail appendix.
    - path: outputs/latest/publication-manifest.yml
      impact: Later optional publication metadata and quality-check summary.
    - path: outputs/latest/render-report.yml
      impact: Later optional renderer diagnostics.
    - path: .codex/skills/p2p-project-curator/SKILL.md
      impact: Candidate repository-local skill location for Codex discovery.
  dependencies:
    - proposal: PROP-083
      relationship: follows
      reason: PROP-083 introduced visible project definition export; PROP-099 turns that complete export into readable publication output.
    - proposal: PROP-090
      relationship: consumes_context_from
      reason: Active vertical, vertical sections, rubrics, and definition state guide publication structure.
    - proposal: PROP-094
      relationship: separates_from
      reason: Human project publication must not replace governed software specification lifecycle or downstream exports.
    - proposal: PROP-098
      relationship: later_validation_candidate
      reason: Implementation may later use test impact routing to validate only relevant publication, skill, renderer, and docs tests.
  overlaps:
    - proposal: PROP-083
      overlap: Both concern project outputs.
      boundary: PROP-083 creates complete visible export; PROP-099 adds curation, validation, and publication rendering.
    - proposal: PROP-094
      overlap: Both discuss generated documents.
      boundary: PROP-094 governs software implementation specs; PROP-099 governs human-readable project publication.
  governance:
    - area: source_of_truth
      impact: .p2p remains the governed source of truth; outputs are derived artifacts.
    - area: owner_review
      impact: First slice requires manual owner review before promotion from curated candidate to primary human document.
    - area: agent_authority
      impact: Curator may synthesize and reorganize, but must not decide governance outcomes or implementation status.
  compatibility:
    existing_outputs_latest_project_md: Must remain the complete export during the first slice.
    existing_outputs_review_snapshots: Must not be deleted or reinterpreted by the first slice.
    existing_project_export_command: Must remain compatible.
    existing_spec_export_lifecycle: Must remain separate and unaffected.
  risks:
    - risk: PDF rendering makes weak content look final.
      mitigation: Render only curated Markdown that passes publication validation.
    - risk: Generated outputs become a parallel source of truth.
      mitigation: Add explicit source-of-truth warning and derived-output metadata.
    - risk: Curation loses important evidence.
      mitigation: Preserve traceability and optional appendices.
    - risk: Curator creates software-shaped documents for non-software projects.
      mitigation: Derive structure from active vertical and project definition.
    - risk: Renderer modifies project facts.
      mitigation: Keep renderer presentation-only and validate Markdown before rendering.
  regression_tests:
    - Complete project export still writes outputs/latest/project.md.
    - Curator skill produces project.curated.md without direct .p2p mutation.
    - Publication validator detects multiple H1 headings.
    - Publication validator detects placeholder text in the main body.
    - Publication validator requires source-of-truth warning and traceability.
    - PDF renderer refuses unvalidated or invalid curated Markdown.
    - PDF renderer does not rewrite curated Markdown content.
    - Software spec export tests remain unaffected.
