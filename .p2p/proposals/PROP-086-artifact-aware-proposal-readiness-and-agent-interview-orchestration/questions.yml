    gap: risk_coverage
    criterion: risk_coverage
    priority: medium
    state: applied
    question: Il profilo artifact-aware deve essere opt-in nella prima fase o diventare
      subito il default per tutte le nuove proposte?
    rationale: "Il rollout incide sul rumore di readiness e sulla compatibilit\xE0\
      \ con proposte gi\xE0 esistenti."
    answer: "Il profilo artifact-aware deve diventare il default per tutte le nuove\
      \ proposte. Per le proposte vecchie il sistema deve accorgersi dell'assenza\
      \ dello stato artifact-aware e segnalarla come gap o migrazione consigliata,\
      \ ma senza generare errori, senza bloccare la proposta e senza forzare completamento\
      \ manuale retroattivo. L'obiettivo \xE8 coprire progressivamente tutte le nuove\
      \ proposte senza imporre una review di tutto il lavoro gi\xE0 fatto."
