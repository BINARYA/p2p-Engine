  - id: Q003
    group_id: QG003
    gap: scope_boundaries
    criterion: scope_boundaries
    priority: high
    state: applied
    question: Quali artefatti di proposta devono essere required by default e quali
      devono essere solo required when applicable?
    rationale: "Questa scelta definisce il confine tra qualit\xE0 utile e burocrazia\
      \ per proposte semplici."
    answer: "Scegliamo la strategia graduata per rischio. Sempre required: proposal.md,\
      \ readiness.yml e open-questions.md. Required when applicable: clarifications.md,\
      \ findings.md, exploration.md e impact-map.yml. Per proposte cross-cutting,\
      \ governance-related, architetturali, con impatti su compatibilit\xE0, CLI,\
      \ MCP, storage, policy o workflow principali, findings.md e impact-map.yml diventano\
      \ auto-required. clarifications.md diventa required quando il proprietario risponde,\
      \ corregge, restringe o cambia un assunto. exploration.md diventa required quando\
      \ ci sono pi\xF9 alternative credibili o incertezza alta."
    answer_source: owner
