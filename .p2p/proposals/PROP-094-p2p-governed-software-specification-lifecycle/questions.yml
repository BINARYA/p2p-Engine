    question: Where should preliminary specs live before they become durable outputs?
    rationale: Determines whether agents should create standalone files or keep preliminary
      material inside P2P/chat until export.
    answer: Preliminary specs should stay in chat or P2P exploration/proposal material.
      A durable file should be created only as a generated export, stable documentation,
      or explicit owner-requested artifact.
