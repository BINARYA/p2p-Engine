    priority: high
    state: applied
    question: Should readiness be a hard precondition for every spec artifact?
    rationale: Determines how strict the lifecycle should be for exploration versus
      implementation-oriented specs and exports.
    answer: No. Readiness is advisory for exploratory spec discussion and provisional
      outlines, but implementation-oriented specs and downstream exports should require
      accepted direction, resolved blocking choices, and a relevant Change Set.
