claims:
- id: CLM-001
  statement: P2P Engine is a local, Git-native, file-backed system for preserving
    project intent as versioned, auditable memory.
  evidence_ids:
  - EVD-5FBE72A1F7A2F80C772A
  - EVD-7BF4E21E96944F6B264E
  vertical_sections:
  - vision
  - objective
  - system_objective
- id: CLM-002
  statement: Humans retain decision authority while agents work through bounded instructions,
    permissions and explicit write surfaces.
  evidence_ids:
  - EVD-7BF4E21E96944F6B264E
  - EVD-0630A42A1F82B7E220AE
  - EVD-C716DBB630382A84CE59
  - EVD-11F8C8B6D354D3DAF331
  vertical_sections:
  - stakeholders
  - users_and_actors
  - decisions
- id: CLM-003
  statement: The project workflow turns rough intent into structured exploration,
    proposals, decisions, executable change descriptions, specifications and downstream
    handoffs.
  evidence_ids:
  - EVD-7BF4E21E96944F6B264E
  - EVD-823F886CDC0A0A36D8FD
  - EVD-33E747D2B47EB1CD2E68
  - EVD-CCDDF0FD790DF0335DB3
  - EVD-F60D8032D038D54675BC
  - EVD-65A11493C7A3AD530970
  - EVD-E511FFD069508CF2DCDC
  - EVD-DB8D9334743166332F31
  vertical_sections:
  - workflows_use_cases
  - data_model
  - milestones
- id: CLM-004
  statement: Canonical Markdown and YAML records are complemented by rebuildable registries,
    vertical project memory, decision context and next actions.
  evidence_ids:
  - EVD-7BF4E21E96944F6B264E
  - EVD-11A5C23A64F8345B40E2
  - EVD-BD39CD78A1292CB221EA
  - EVD-194FE6E139A0FBDF2D1F
  - EVD-D655107525EB7D6023B7
  vertical_sections:
  - data_model
  - artifacts
  - workflows_use_cases
- id: CLM-005
  statement: The CLI is the primary local interface, while a local MCP server and
    generated adapter instructions give agents bounded access to the same domain services.
  evidence_ids:
  - EVD-7BF4E21E96944F6B264E
  - EVD-0630A42A1F82B7E220AE
  - EVD-A2BB0E050008B433B4BD
  - EVD-61222BF3101F6991D5A8
  - EVD-57763767DD6502906CB6
  - EVD-11F8C8B6D354D3DAF331
  vertical_sections:
  - integrations_dependencies
  - users_and_actors
  - workflows_use_cases
- id: CLM-006
  statement: A pluggable project vertical defines the questions and required sections
    used to evaluate project completeness without promoting heuristic matches to authority.
  evidence_ids:
  - EVD-7BF4E21E96944F6B264E
  - EVD-2F437B678D880D80942B
  - EVD-D150B664B5278C304397
  - EVD-84266F27FDCDD9F8C17A
  - EVD-9E97E18F54363D4E3D3B
  - EVD-BF4205BE15BE0C9ED69C
  - EVD-56CE973C2B6162E8D9F8
  vertical_sections:
  - system_objective
  - data_model
  - definition_of_done
- id: CLM-007
  statement: Runtime compatibility and workspace schema compatibility are independent
    contracts, with explicit forward migration, preservation of unknown material and
    recovery-aware writes.
  evidence_ids:
  - EVD-7BF4E21E96944F6B264E
  - EVD-8195D8592DFB3309ECAB
  - EVD-68BF476509C6C75C549E
  - EVD-9E97E18F54363D4E3D3B
  vertical_sections:
  - integrations_dependencies
  - constraints_nfrs
  - acceptance_validation
- id: CLM-008
  statement: Software specifications are governed derivatives of project decisions
    and may be exported for downstream implementation without becoming the project
    source.
  evidence_ids:
  - EVD-7BF4E21E96944F6B264E
  - EVD-B6D3BC6D8CDB636B1F45
  - EVD-C3FCFC6E96A9A2A48DCA
  vertical_sections:
  - artifacts
  - workflows_use_cases
  - mvp_scope
  - acceptance_validation
- id: CLM-009
  statement: Human publication is a derived editorial stage whose validation, rendering
    and owner review remain separate.
  evidence_ids:
  - EVD-7BF4E21E96944F6B264E
  - EVD-384C59E459F2E25F20FD
  vertical_sections:
  - artifacts
  - workflows_use_cases
  - risks_alternatives_decisions
- id: CLM-010
  statement: The local product excludes hosted multi-tenant operation, autonomous
    owner decisions and unrestricted provider mutations.
  evidence_ids:
  - EVD-5FBE72A1F7A2F80C772A
  - EVD-7BF4E21E96944F6B264E
  - EVD-61222BF3101F6991D5A8
  - EVD-11F8C8B6D354D3DAF331
  vertical_sections:
  - scope
  - mvp_scope
  - risks
- id: CLM-011
  statement: Quality expectations include deterministic no-write reads, bounded retrieval,
    provenance, freshness, atomic multi-file changes and focused plus full validation.
  evidence_ids:
  - EVD-7BF4E21E96944F6B264E
  - EVD-0C9D6842981A576B36DC
  - EVD-9E97E18F54363D4E3D3B
  - EVD-68BF476509C6C75C549E
  - EVD-D655107525EB7D6023B7
  vertical_sections:
  - constraints_nfrs
  - acceptance_validation
  - definition_of_done
- id: CLM-012
  statement: The operating model depends on writable local storage, Git history, a
    compatible Python runtime and an accountable owner; stale derivatives, concurrent
    drift and semantic overreach remain material risks.
  evidence_ids:
  - EVD-7BF4E21E96944F6B264E
  - EVD-1BADB3FFA582D435DFEA
  - EVD-194FE6E139A0FBDF2D1F
  - EVD-56CE973C2B6162E8D9F8
  - EVD-71252B2A0C876FB44B2E
  vertical_sections:
  - assumptions
  - risks
  - risks_alternatives_decisions
- id: CLM-013
  statement: Success means a project can be initialized, inspected, migrated and advanced
    through supported interfaces without manual repair of governed state.
  evidence_ids:
  - EVD-7BF4E21E96944F6B264E
  - EVD-0C9D6842981A576B36DC
  - EVD-8195D8592DFB3309ECAB
  - EVD-84266F27FDCDD9F8C17A
  vertical_sections:
  - objective
  - definition_of_done
  - acceptance_validation
