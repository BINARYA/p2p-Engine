name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_BIN: pytest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development environment
        run: python -m pip install ".[dev]"

      - name: Validate environment and generated contracts
        run: |
          python -m pip check
          python scripts/generate-wavekit-transition-fixtures.py --check
          python scripts/check-source-boundary.py
          python scripts/check-doc-links.py

      - name: Run staged static checks
        run: ./scripts/check-static.sh

      - name: Run public contracts
        run: ./scripts/test-public.sh -q

      - name: Run the full suite
        run: ./scripts/test-full.sh -q

  uv-wheel:
    name: Build immutable uv candidate
    needs: source
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up build Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build one reproducible candidate set
        run: |
          python -m pip install build==1.5.0
          source_epoch="$(git show -s --format=%ct HEAD)"
          SOURCE_DATE_EPOCH="$source_epoch" ./scripts/build-release-candidate.sh

      - name: Fetch and verify the immutable 0.5.0 lifecycle baseline
        run: |
          mkdir previous-artifact
          curl --fail --location --retry 3 --retry-all-errors \
            --output previous-artifact/p2p_engine-0.5.0-py3-none-any.whl \
            https://github.com/BINARYA/p2p-Engine/releases/download/v0.5.0/p2p_engine-0.5.0-py3-none-any.whl
          printf '%s  %s\n' \
            99c43fa51ba78a01dfdc153c9821d5f2bf6890156a03447eeeb159ee894a6768 \
            previous-artifact/p2p_engine-0.5.0-py3-none-any.whl \
            | sha256sum --check -

      - name: Upload the immutable candidate wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2p-engine-uv-candidate-${{ github.sha }}
          path: dist/p2p_engine-*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

      - name: Upload the verified lifecycle baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2p-engine-uv-previous-0.5.0-${{ github.sha }}
          path: previous-artifact/p2p_engine-0.5.0-py3-none-any.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  uv-installed:
    name: uv / ${{ matrix.target }}
    needs: uv-wheel
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
          - target: macos-x86_64
            os: macos-15-intel
          - target: windows-x86_64
            os: windows-2025
          - target: macos-arm64
            os: macos-14
    steps:
      - name: Check out qualification harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download the same candidate wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p2p-engine-uv-candidate-${{ github.sha }}
          path: uv-artifact

      - name: Download the verified lifecycle baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p2p-engine-uv-previous-0.5.0-${{ github.sha }}
          path: previous-artifact

      - name: Set up harness Python only
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: false

      - name: Resolve the one downloaded wheel
        id: wheel
        shell: python
        run: |
          import os
          from pathlib import Path
          wheels = list(Path("uv-artifact").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one candidate wheel, found {len(wheels)}")
          previous = list(Path("previous-artifact").glob("*.whl"))
          if len(previous) != 1:
              raise SystemExit(f"expected one previous wheel, found {len(previous)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"path={wheels[0].resolve()}\n")
              stream.write(f"previous={previous[0].resolve()}\n")

      - name: Qualify managed-Python uv installation
        env:
          P2P_UV_TEST_TMPDIR: ${{ runner.temp }}
        run: >-
          python scripts/test-uv-installed.py
          --uv uv
          --python 3.12
          --previous-wheel "${{ steps.wheel.outputs.previous }}"
          --wheel "${{ steps.wheel.outputs.path }}"
