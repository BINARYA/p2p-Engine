name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_BIN: pytest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development environment
        run: python -m pip install ".[dev]"

      - name: Validate environment and generated contracts
        run: |
          python -m pip check
          python scripts/generate-wavekit-transition-fixtures.py --check
          python scripts/check-source-boundary.py
          python scripts/check-doc-links.py

      - name: Run staged static checks
        run: ./scripts/check-static.sh

      - name: Run public contracts
        run: ./scripts/test-public.sh -q

      - name: Run the full suite
        run: ./scripts/test-full.sh -q
