name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  candidate:
    name: Verify tagged candidate
    permissions:
      contents: read
    uses: ./.github/workflows/release-candidate.yml
    with:
      ref: ${{ github.sha }}

  attest:
    name: Attest exact candidate artifacts
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Download the exact verified candidate artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p2p-engine-release-candidate-${{ github.sha }}
          path: dist

      - name: Recheck exact artifact identities
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          cd dist
          sha256sum --check SHA256SUMS

      - name: Generate GitHub build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/p2p_engine-*.whl
            dist/p2p_engine-*.tar.gz
            dist/SHA256SUMS

  publish:
    name: Create immutable GitHub release
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out the exact tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the attested candidate artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p2p-engine-release-candidate-${{ github.sha }}
          path: dist

      - name: Verify tag, final metadata and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/verify-release-metadata.py --tag "$RELEASE_TAG"
          cd dist
          sha256sum --check SHA256SUMS

      - name: Publish exact artifacts once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/publish-release.sh \
            --tag "$RELEASE_TAG" \
            --dist dist \
            --notes "docs/releases/${RELEASE_TAG#v}.md"
