name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-matrix:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      PYTEST_BIN: pytest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run public contract tests
        run: ./scripts/test-public.sh -q

      - name: Run full tests
        run: ./scripts/test-full.sh -q

  build-release:
    name: Build and publish release artifacts
    needs: test-matrix
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project with development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check tag matches package version
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"Tag/version mismatch: tag {tag!r}, pyproject version {version!r}; expected {expected!r}")
          print(f"Release version verified: {version}")
          PY

      - name: Run release contract tests
        run: pytest -q tests/test_version_consistency.py tests/test_release_artifacts.py

      - name: Validate a fresh current-schema workspace
        run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "${smoke_root}"' EXIT
          p2p init "Release Smoke" \
            --owner release-ci \
            --agent generic \
            --root "${smoke_root}"
          p2p runtime status --root "${smoke_root}"
          p2p workspace schema status --root "${smoke_root}"
          p2p registry refresh --root "${smoke_root}"
          p2p validate --root "${smoke_root}"

      - name: Build source and wheel distributions
        run: python -m build

      - name: Verify distribution artifacts
        run: python scripts/verify-release-artifacts.py

      - name: Create release notes
        run: |
          cat > release-notes.md <<EOF
          P2P Engine ${GITHUB_REF_NAME}

          Install the project-local wheel:

          \`\`\`bash
          .venv/bin/python -m pip install \\
            https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/p2p_engine-${GITHUB_REF_NAME#v}-py3-none-any.whl
          \`\`\`
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz \
              --repo "${GITHUB_REPOSITORY}" \
              --title "P2P Engine ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
