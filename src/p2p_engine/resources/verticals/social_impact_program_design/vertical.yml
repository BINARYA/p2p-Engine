vertical:
  schema_version: 1
  id: social_impact_program_design
  name: Social Impact Program Design
  version: 1.0.0
  description: Design social impact initiatives that are measurable, governed, credible,
    and connected to stakeholder needs.
  extends: base_project
  questions:
  - id: beneficiary_main
    section_id: beneficiary_communities
    priority: high
    question: Which community or population should benefit?
    rationale: Social impact must name beneficiaries.
  - id: impact_area_main
    section_id: impact_areas
    priority: high
    question: Is the desired impact about financial inclusion, education, credit access,
      territory, environment, work, or another area?
    rationale: Impact areas guide program design.
  - id: measurement_main
    section_id: measurement_reporting
    priority: high
    question: How will real impact be measured and how will social-washing be avoided?
    rationale: Credibility depends on evidence and governance.
  artifacts:
  - id: social_impact_strategy_brief
    title: Social Impact Strategy Brief
    section_ids:
    - social_impact_vision
    - impact_areas
    - program_roadmap
    required: true
  - id: theory_of_change
    title: Theory Of Change
    section_ids:
    - theory_of_change
    - beneficiary_communities
    required: true
  - id: outcome_metric_framework
    title: Outcome Metric Framework
    section_ids:
    - measurement_reporting
    - governance_accountability
    required: true
  profiles:
  - bank_program
  - community_partnership
  - financial_education
  modules:
  - stakeholder_alignment
  - risk_management
  - responsible_communication
  examples:
  - progettare attivita volte a migliorare l'impatto sociale di una banca
