vertical:
  schema_version: 2
  id: software_project
  name: Software Project
  version: 2.0.0
  description: Software project vertical for governed software specification lifecycle.
  extends: binarya/base_project@2.0.0
  questions:
  - id: software_objective_main
    section_id: system_objective
    priority: high
    question: What product or system objective should the software spec support?
    rationale: Software specs need a clear objective before implementation details
      are useful.
  - id: software_scope_main
    section_id: mvp_scope
    priority: high
    question: What is in the MVP and what is out of scope?
    rationale: Scope boundaries prevent generated specs from inventing work.
  - id: software_validation_main
    section_id: acceptance_validation
    priority: high
    question: Which acceptance criteria and validation checks prove the implementation
      works?
    rationale: Implementation specs need testable acceptance.
  - id: software_decision_main
    section_id: risks_alternatives_decisions
    priority: high
    question: Which owner decisions or unresolved alternatives block implementation?
    rationale: Owner-controlled choices must remain explicit.
  artifacts:
  - id: software_spec_readiness_review
    title: Software Spec Readiness Review
    section_ids:
    - system_objective
    - mvp_scope
    - acceptance_validation
    - risks_alternatives_decisions
    required: true
  - id: implementation_spec
    title: Implementation Software Spec
    section_ids:
    - workflows_use_cases
    - data_model
    - integrations_dependencies
    - constraints_nfrs
    required: true
  - id: validation_plan
    title: Validation Plan
    section_ids:
    - acceptance_validation
    - constraints_nfrs
    required: true
  profiles: []
  modules:
  - software_spec_lifecycle
  - implementation_planning
  - validation_strategy
  examples: []
