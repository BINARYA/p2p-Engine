vertical:
  schema_version: 1
  id: software_project
  name: Software Project
  version: 1.0.0
  description: Software project vertical for governed software specification lifecycle.
  extends: base_project
  sections:
    - id: system_objective
      title: System Objective
      purpose: Product or system objective and measurable outcome.
      required: true
      priority: 110
      fields:
        - id: objective
          label: Product or system objective
          required: true
          question: What product or system outcome should this software deliver?
        - id: success_signal
          label: Success signal
          required: true
          question: What observable signal proves the software achieved the objective?
      completion_policy:
        allow_assumed_completion: false
        required_fields: [objective, success_signal]
    - id: users_and_actors
      title: Users And Actors
      purpose: Intended users, actors, operators, and stakeholders.
      required: true
      priority: 120
      fields:
        - id: primary_users
          label: Primary users
          required: true
          question: Who are the primary users or actors?
        - id: operator_roles
          label: Operator roles
          required: false
          question: Which operators, maintainers, or external systems interact with it?
      completion_policy:
        allow_assumed_completion: false
        required_fields: [primary_users]
    - id: mvp_scope
      title: Scope And MVP Boundaries
      purpose: MVP scope, non-goals, and release boundaries.
      required: true
      priority: 130
      fields:
        - id: in_scope
          label: In scope
          required: true
          question: What is included in the first useful software scope?
        - id: out_of_scope
          label: Out of scope
          required: true
          question: What is explicitly excluded?
      completion_policy:
        allow_assumed_completion: false
        required_fields: [in_scope, out_of_scope]
    - id: workflows_use_cases
      title: Workflows And Use Cases
      purpose: Core workflows, use cases, and user journeys.
      required: true
      priority: 140
      fields:
        - id: core_workflows
          label: Core workflows
          required: true
          question: Which workflows must the software support?
      completion_policy:
        allow_assumed_completion: false
        required_fields: [core_workflows]
    - id: data_model
      title: Domain Concepts And Data Model
      purpose: Domain entities, data model, and state transitions.
      required: true
      priority: 150
      fields:
        - id: domain_entities
          label: Domain entities
          required: true
          question: Which domain concepts and data entities matter?
        - id: state_lifecycle
          label: State lifecycle
          required: false
          question: Which statuses or lifecycle transitions are important?
      completion_policy:
        allow_assumed_completion: false
        required_fields: [domain_entities]
    - id: integrations_dependencies
      title: Integrations And Dependencies
      purpose: External systems, APIs, services, tools, and runtime dependencies.
      required: true
      priority: 160
      fields:
        - id: external_integrations
          label: External integrations
          required: true
          question: Which external systems or APIs does the software depend on?
      completion_policy:
        allow_assumed_completion: false
        required_fields: [external_integrations]
    - id: constraints_nfrs
      title: Constraints And Non-Functional Requirements
      purpose: Constraints, performance, reliability, privacy, security, and operating assumptions.
      required: true
      priority: 170
      fields:
        - id: constraints
          label: Constraints
          required: true
          question: Which technical, operational, or policy constraints apply?
        - id: non_functional_requirements
          label: Non-functional requirements
          required: true
          question: Which reliability, performance, privacy, or security properties matter?
      completion_policy:
        allow_assumed_completion: false
        required_fields: [constraints, non_functional_requirements]
    - id: acceptance_validation
      title: Acceptance And Validation Strategy
      purpose: Acceptance criteria, tests, rollout validation, and quality gates.
      required: true
      priority: 180
      fields:
        - id: acceptance_criteria
          label: Acceptance criteria
          required: true
          question: What proves the software behavior is accepted?
        - id: validation_strategy
          label: Validation strategy
          required: true
          question: Which tests or checks will validate the implementation?
      completion_policy:
        allow_assumed_completion: false
        required_fields: [acceptance_criteria, validation_strategy]
    - id: risks_alternatives_decisions
      title: Risks Alternatives And Owner Decisions
      purpose: Unresolved risks, alternatives, tradeoffs, and owner-controlled decisions.
      required: true
      priority: 190
      fields:
        - id: risks
          label: Risks
          required: true
          question: Which implementation or product risks remain?
        - id: alternatives
          label: Alternatives
          required: false
          question: Which alternatives were considered?
        - id: owner_decisions
          label: Owner decisions
          required: true
          question: Which decisions must the owner make or has the owner made?
      completion_policy:
        allow_assumed_completion: false
        required_fields: [risks, owner_decisions]
  rubrics:
    - id: software_objective_clarity
      title: Software Objective Clarity
      section_id: system_objective
      required: true
      keywords: [objective, product, system, outcome]
    - id: software_user_actor_coverage
      title: Software User And Actor Coverage
      section_id: users_and_actors
      required: true
      keywords: [user, actor, operator, stakeholder]
    - id: software_scope_boundaries
      title: Software Scope Boundaries
      section_id: mvp_scope
      required: true
      keywords: [scope, mvp, non-goal, boundary]
    - id: software_workflow_coverage
      title: Software Workflow Coverage
      section_id: workflows_use_cases
      required: true
      keywords: [workflow, use case, journey]
    - id: software_data_model_coverage
      title: Software Data Model Coverage
      section_id: data_model
      required: true
      keywords: [data, entity, model, status]
    - id: software_integration_coverage
      title: Software Integration Coverage
      section_id: integrations_dependencies
      required: true
      keywords: [integration, dependency, api]
    - id: software_constraints_nfr_coverage
      title: Software Constraints And NFR Coverage
      section_id: constraints_nfrs
      required: true
      keywords: [constraint, reliability, performance, security, privacy]
    - id: software_acceptance_validation
      title: Software Acceptance And Validation
      section_id: acceptance_validation
      required: true
      keywords: [acceptance, validation, test]
    - id: software_decision_risk_coverage
      title: Software Decisions And Risks
      section_id: risks_alternatives_decisions
      required: true
      keywords: [risk, alternative, decision, tradeoff]
  questions:
    - id: software_objective_main
      section_id: system_objective
      priority: high
      question: What product or system objective should the software spec support?
      rationale: Software specs need a clear objective before implementation details are useful.
    - id: software_scope_main
      section_id: mvp_scope
      priority: high
      question: What is in the MVP and what is out of scope?
      rationale: Scope boundaries prevent generated specs from inventing work.
    - id: software_validation_main
      section_id: acceptance_validation
      priority: high
      question: Which acceptance criteria and validation checks prove the implementation works?
      rationale: Implementation specs need testable acceptance.
    - id: software_decision_main
      section_id: risks_alternatives_decisions
      priority: high
      question: Which owner decisions or unresolved alternatives block implementation?
      rationale: Owner-controlled choices must remain explicit.
  artifacts:
    - id: software_spec_readiness_review
      title: Software Spec Readiness Review
      section_ids: [system_objective, mvp_scope, acceptance_validation, risks_alternatives_decisions]
      required: true
    - id: implementation_spec
      title: Implementation Software Spec
      section_ids: [workflows_use_cases, data_model, integrations_dependencies, constraints_nfrs]
      required: true
    - id: validation_plan
      title: Validation Plan
      section_ids: [acceptance_validation, constraints_nfrs]
      required: true
  profiles: []
  modules: [software_spec_lifecycle, implementation_planning, validation_strategy]
  examples: []
