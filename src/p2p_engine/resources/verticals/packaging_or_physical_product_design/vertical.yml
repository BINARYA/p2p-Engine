vertical:
  schema_version: 1
  id: packaging_or_physical_product_design
  name: Packaging Or Physical Product Design
  version: 1.0.0
  description: Design a box or packaging solution from concept to manufacturable specification.
  extends: base_project
  questions:
  - id: contained_product_main
    section_id: contained_product
    priority: high
    question: What must the box contain?
    rationale: The packaging cannot be designed without product constraints.
  - id: perfect_tradeoff_main
    section_id: success_definition
    priority: high
    question: Does perfect mean beautiful, resistant, cheap, sustainable, memorable,
      or a weighted combination?
    rationale: Packaging design is tradeoff-heavy.
  - id: context_main
    section_id: protection_logistics
    priority: high
    question: Is the main context shipping, retail shelf, gift, luxury, e-commerce,
      or reuse?
    rationale: Context changes structure and materials.
  artifacts:
  - id: packaging_brief
    title: Packaging Brief
    section_ids:
    - contained_product
    - success_definition
    - user_experience
    required: true
  - id: requirement_matrix
    title: Requirement Matrix
    section_ids:
    - structure_materials
    - protection_logistics
    - production_cost
    required: true
  - id: prototype_test_checklist
    title: Prototype Test Checklist
    section_ids:
    - prototype_testing
    required: true
  profiles:
  - shipping_ready
  - retail_ready
  - sustainable_packaging
  modules:
  - production_feasibility
  - sustainability
  - brand_positioning
  examples:
  - progettare la scatola perfetta
